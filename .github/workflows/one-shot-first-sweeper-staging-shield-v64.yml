name: One-shot first sweeper staging shield v64

on:
  push:
    branches: [new-player-glb-overhaul]
    paths:
      - '.github/workflows/one-shot-first-sweeper-staging-shield-v64.yml'

permissions:
  contents: write

jobs:
  patch-level:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-player-glb-overhaul
          fetch-depth: 0

      - name: Build physical first-sweeper staging shield
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          old="const FIRST_SWEEPER_GATE_Z=-10.62,FIRST_SWEEPER_GATE_HALF_X=1.74,FIRST_SWEEPER_GATE_CLOSED_Y=.62,FIRST_SWEEPER_GATE_OPEN_Y=2.82,FIRST_SWEEPER_GATE_HALF_Y=.11;const firstSweeperGateL="
          new="const FIRST_SWEEPER_GATE_Z=-10.62,FIRST_SWEEPER_GATE_HALF_X=1.74,FIRST_SWEEPER_GATE_CLOSED_Y=.62,FIRST_SWEEPER_GATE_OPEN_Y=2.82,FIRST_SWEEPER_GATE_HALF_Y=.11,FIRST_SWEEPER_STAGING_Z_MIN=-12.42,FIRST_SWEEPER_STAGING_Z_MAX=-10.72,FIRST_SWEEPER_STAGING_HALF_X=1.74;function makeFirstSweeperShieldRail(x){const rail=new THREE.Mesh(new THREE.CapsuleGeometry(.16,1.38,4,8),mat(0xffd84d));rail.position.set(x,.42,(FIRST_SWEEPER_STAGING_Z_MIN+FIRST_SWEEPER_STAGING_Z_MAX)*.5);rail.rotation.x=Math.PI/2;rail.castShadow=rail.receiveShadow=true;rail.material.emissive=new THREE.Color(0xa95a00);rail.material.emissiveIntensity=.72;scene.add(rail);return rail}const firstSweeperShieldL=makeFirstSweeperShieldRail(-FIRST_SWEEPER_STAGING_HALF_X-.10),firstSweeperShieldR=makeFirstSweeperShieldRail(FIRST_SWEEPER_STAGING_HALF_X+.10);const firstSweeperGateL="
          if old not in s: raise SystemExit('first sweeper gate anchor missing')
          s=s.replace(old,new,1)

          old="function inSecondPitFunnel(x,z,r=0){return z>SECOND_PIT_FUNNEL_Z_MIN&&z<SECOND_PIT_FUNNEL_Z_MAX&&Math.abs(x)>SECOND_PIT_FUNNEL_HALF_X-r}"
          new="function inFirstSweeperStagingRail(x,z,r=0){return z>FIRST_SWEEPER_STAGING_Z_MIN&&z<FIRST_SWEEPER_STAGING_Z_MAX&&Math.abs(x)>FIRST_SWEEPER_STAGING_HALF_X-r}function inSecondPitFunnel(x,z,r=0){return z>SECOND_PIT_FUNNEL_Z_MIN&&z<SECOND_PIT_FUNNEL_Z_MAX&&Math.abs(x)>SECOND_PIT_FUNNEL_HALF_X-r}"
          if old not in s: raise SystemExit('collision helper anchor missing')
          s=s.replace(old,new,1)

          old="if(liftSafetyGateBlocks(x,z,.4))return true;if(inSecondPitFunnel(x,z,.4))return true;"
          new="if(liftSafetyGateBlocks(x,z,.4))return true;if(inFirstSweeperStagingRail(x,z,.4))return true;if(inSecondPitFunnel(x,z,.4))return true;"
          if old not in s: raise SystemExit('player shield collision anchor missing')
          s=s.replace(old,new,1)

          old="if(liftSafetyGateBlocks(x,z,r))return true;if(inSecondPitFunnel(x,z,r))return true;"
          new="if(liftSafetyGateBlocks(x,z,r))return true;if(inFirstSweeperStagingRail(x,z,r))return true;if(inSecondPitFunnel(x,z,r))return true;"
          if old not in s: raise SystemExit('brainrot shield collision anchor missing')
          s=s.replace(old,new,1)

          old="const firstSweeperCarryLane=carry&&!firstSweeperCleared&&p.z>FIRST_SWEEPER_GATE_Z-.12"
          new="const firstSweeperStagingSafe=carry&&!firstSweeperCleared&&p.z>FIRST_SWEEPER_STAGING_Z_MIN&&p.z<FIRST_SWEEPER_GATE_Z-.08&&bp.z>FIRST_SWEEPER_STAGING_Z_MIN-.28&&bp.z<FIRST_SWEEPER_GATE_Z-.08&&Math.abs(p.x)<FIRST_SWEEPER_STAGING_HALF_X&&Math.abs(bp.x)<FIRST_SWEEPER_STAGING_HALF_X+.18,firstSweeperCarryLane=carry&&!firstSweeperCleared&&p.z>FIRST_SWEEPER_GATE_Z-.12"
          if old not in s: raise SystemExit('first sweeper carry lane anchor missing')
          s=s.replace(old,new,1)

          old="if(Math.abs(w)>.001&&(i!==0||(!firstSweeperCarryLane&&firstSweeperPostGateGrace<=0))&&(i!==1||(!secondSweeperCarryLane&&secondSweeperPostGateGrace<=0)))sweeperHit(s,w,from,to);"
          new="if(Math.abs(w)>.001&&(i!==0||(!firstSweeperStagingSafe&&!firstSweeperCarryLane&&firstSweeperPostGateGrace<=0))&&(i!==1||(!secondSweeperCarryLane&&secondSweeperPostGateGrace<=0)))sweeperHit(s,w,from,to);"
          if old not in s: raise SystemExit('sweeper hit gate anchor missing')
          s=s.replace(old,new,1)

          old="if(firstSweeperCarryLane&&!win&&failTimer<=0){sweeperEntryPad.material.emissive.setHex(0x149343);"
          new="const firstSweeperShieldPulse=.5+.5*Math.sin(t*11);[firstSweeperShieldL,firstSweeperShieldR].forEach(o=>o.material.emissiveIntensity=firstSweeperStagingSafe?1.25+.55*firstSweeperShieldPulse:.72);if(firstSweeperStagingSafe&&!win&&failTimer<=0){sweeperEntryPad.material.emissive.setHex(0x149343);sweeperEntryPad.material.emissiveIntensity=1.55;state.textContent='SWEEPER · ЗАЩИТНЫЙ КАРМАН · ЖДИ ЗЕЛЁНЫЕ ВОРОТА'}if(firstSweeperCarryLane&&!win&&failTimer<=0){sweeperEntryPad.material.emissive.setHex(0x149343);"
          if old not in s: raise SystemExit('staging shield feedback anchor missing')
          s=s.replace(old,new,1)

          old='full 3D lift route v62 · modeled static hazards'
          new='full 3D lift route v64 · shielded sweeper staging'
          if old not in s: raise SystemExit('runtime marker missing')
          s=s.replace(old,new,1)
          p.write_text(s)

          Path('scripts/first-sweeper-staging-shield-check.mjs').write_text("""import fs from 'node:fs';\nconst s=fs.readFileSync('index.html','utf8');\nfor(const needle of ['FIRST_SWEEPER_STAGING_Z_MIN=-12.42','FIRST_SWEEPER_STAGING_Z_MAX=-10.72','FIRST_SWEEPER_STAGING_HALF_X=1.74','makeFirstSweeperShieldRail','inFirstSweeperStagingRail','firstSweeperStagingSafe','!firstSweeperStagingSafe&&!firstSweeperCarryLane','ЗАЩИТНЫЙ КАРМАН','shielded sweeper staging']){if(!s.includes(needle))throw new Error('missing '+needle)}\nconst zMin=-12.42,zMax=-10.72,gateZ=-10.62,halfX=1.74,playerR=.4,brainR=.38,sweeperZ=-9,sweeperRadius=4.15;\nif(zMax>=gateZ)throw new Error('shield must remain behind timing gate');\nif(zMax-zMin<1.5)throw new Error('staging shield too short for carry pair');\nif(halfX-playerR<1.3)throw new Error('player staging corridor too narrow');\nif(halfX-brainR<1.3)throw new Error('brainrot staging corridor too narrow');\nif(Math.abs(zMin-sweeperZ)>=sweeperRadius)throw new Error('staging no longer overlaps sweeper hazard reach; shielding invariant stale');\nconsole.log('first sweeper staging shield: PASS',{length:zMax-zMin,playerClear:halfX-playerR,brainClear:halfX-brainR,gateGap:gateZ-zMax});\n""")
          PY

      - name: Verify gameplay syntax and shield invariants
        run: |
          node scripts/first-sweeper-staging-shield-check.mjs
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          module=s.split('<script type="module">',1)[1].split('</script>',1)[0]
          Path('/tmp/game-module.mjs').write_text(module)
          PY
          node --check /tmp/game-module.mjs
          node --check scripts/first-sweeper-staging-shield-check.mjs
          git diff --check

      - name: Commit gameplay change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html scripts/first-sweeper-staging-shield-check.mjs
          git commit -m 'Shield first sweeper staging pocket'
          git push origin HEAD:new-player-glb-overhaul
