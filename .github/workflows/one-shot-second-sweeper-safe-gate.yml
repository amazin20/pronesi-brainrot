name: One-shot second sweeper safe timing gate

on:
  push:
    branches: [new-player-glb-overhaul]
    paths:
      - '.github/workflows/one-shot-second-sweeper-safe-gate.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-player-glb-overhaul
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch second sweeper timing gate gameplay
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='const secondGateOpen=secondSafe||secondSweeperCleared||secondSweeperGateCrossing||secondGateSensor'
          new='const secondGateOpen=secondSafe||secondSweeperCleared||secondSweeperGateCrossing'
          if old not in s:
              raise SystemExit('expected unsafe second gate expression not found')
          s=s.replace(old,new,1)
          s=s.replace('full 3D lift route v45 · first sweeper safe gate','full 3D lift route v46 · second sweeper safe gate',1)
          p.write_text(s)
          PY
      - name: Verify second safe-phase gate invariants and runtime syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          assert 'const secondGateOpen=secondSafe||secondSweeperCleared||secondSweeperGateCrossing' in s
          assert 'secondSafe||secondSweeperCleared||secondSweeperGateCrossing||secondGateSensor' not in s
          def gate_open(phase,crossing=False,cleared=False):
              safe=phase=='safe'
              return safe or cleared or crossing
          assert not gate_open('warning')
          assert not gate_open('burst')
          assert gate_open('safe')
          assert gate_open('warning',cleared=True)
          assert gate_open('burst',crossing=True)
          m=re.search(r'<script type="module">(.*)</script>',s,re.S)
          assert m
          Path('/tmp/runtime.mjs').write_text(m.group(1))
          print('second-sweeper-safe-gate invariants: PASS')
          PY
          node --check /tmp/runtime.mjs
      - name: Commit gameplay fix
        run: |
          git config user.name "amazin20"
          git config user.email "138931938+amazin20@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Keep second sweeper gate closed during active burst"
          git push origin HEAD:new-player-glb-overhaul
