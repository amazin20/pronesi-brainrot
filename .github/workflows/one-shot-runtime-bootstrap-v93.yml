name: One-shot runtime bootstrap v93

on:
  push:
    branches: [new-player-glb-overhaul]
    paths:
      - '.github/workflows/one-shot-runtime-bootstrap-v93.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-player-glb-overhaul
          fetch-depth: 0
      - name: Patch real runtime bootstrap blocker
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="const secondPitStageVisuals=[secondPitStagePad,secondPitStageL,secondPitStageR,secondPitStageTop];secondPitStageVisuals.forEach(o=>{o.material.emissive=new THREE.Color(0x087fa8);o.material.emissiveIntensity=.72});"
          new="const RUNTIME_BOOTSTRAP_V93=true;const secondPitStageVisuals=[secondPitStagePad,secondPitStageL,secondPitStageR,secondPitStageTop];secondPitStageVisuals.forEach(o=>o.traverse(n=>{if(!n.isMesh||!n.material)return;n.material.emissive=n.material.emissive||new THREE.Color(0x087fa8);n.material.emissiveIntensity=Math.max(n.material.emissiveIntensity||0,.72)}));"
          if old not in s:
              raise SystemExit('expected v92 stage-visual material block not found')
          s=s.replace(old,new,1)
          s=s.replace('full 3D lift route v92 · modeled lift ceiling exit assembly','full 3D lift route v93 · runtime bootstrap recovered',1)
          p.write_text(s)
          PY
      - name: Verify v93 runtime invariants
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          assert 'const RUNTIME_BOOTSTRAP_V93=true' in s
          assert "secondPitStageVisuals.forEach(o=>o.traverse" in s
          assert "secondPitStageVisuals.forEach(o=>{o.material.emissive" not in s
          assert 'full 3D lift route v93 · runtime bootstrap recovered' in s
          print('runtime-bootstrap-v93-check: PASS')
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          scripts=re.findall(r'<script type="module">(.*?)</script>',s,re.S)
          if len(scripts)!=1: raise SystemExit(f'expected 1 module script, got {len(scripts)}')
          Path('/tmp/game-v93.mjs').write_text(scripts[0])
          PY
          node --check /tmp/game-v93.mjs
          node scripts/lift-route-continuity-check.mjs
          git diff --check
      - name: Commit gameplay runtime fix
        shell: bash
        run: |
          git config user.name 'amazin20'
          git config user.email '138931938+amazin20@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix v93 browser runtime bootstrap blocker'
          git push origin HEAD:new-player-glb-overhaul
