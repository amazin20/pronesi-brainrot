name: One-shot first sweeper entry model v87

on:
  push:
    branches: [new-player-glb-overhaul]
    paths:
      - '.github/workflows/one-shot-first-sweeper-entry-model-v87.yml'

permissions:
  contents: write

jobs:
  patch-level:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-player-glb-overhaul
          fetch-depth: 0

      - name: Model first sweeper entry and timing gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          old='clean build · new GLB only · full 3D lift route v86 · modeled lift gate posts'
          new='clean build · new GLB only · full 3D lift route v87 · modeled first sweeper entry gate'
          if old not in s: raise SystemExit('runtime marker missing')
          s=s.replace(old,new,1)

          old="const sweeperEntryPad=box(0,.035,-11.72,3.7,.07,2.62,0xffd84d);sweeperEntryPad.material.emissive=new THREE.Color(0xa95a00);sweeperEntryPad.material.emissiveIntensity=.7;const sweeperEntryL=box(-1.78,.7,-10.42,.16,1.4,.16,0xffd84d),sweeperEntryR=box(1.78,.7,-10.42,.16,1.4,.16,0xffd84d),sweeperEntryTop=box(0,1.37,-10.42,3.7,.16,.16,0xffd84d);[sweeperEntryL,sweeperEntryR,sweeperEntryTop].forEach(o=>{o.material.emissive=new THREE.Color(0xa95a00);o.material.emissiveIntensity=.75});"
          new="const sweeperEntryPad=box(0,.035,-11.72,3.7,.07,2.62,0xffd84d);sweeperEntryPad.material.emissive=new THREE.Color(0xa95a00);sweeperEntryPad.material.emissiveIntensity=.7;const FIRST_SWEEPER_ENTRY_MODEL_V87=true;function makeFirstSweeperEntryPost(side){const post=new THREE.Mesh(new THREE.CapsuleGeometry(.10,1.20,4,8),mat(0xffd84d));post.name='FirstSweeperEntryPostV87';post.position.set(side*1.78,.70,-10.42);post.castShadow=post.receiveShadow=true;post.material.emissive=new THREE.Color(0xa95a00);post.material.emissiveIntensity=.75;const foot=new THREE.Mesh(new THREE.CylinderGeometry(.20,.27,.18,10),mat(0x4a3813));foot.name='FirstSweeperEntryFootV87';foot.position.y=-.61;foot.castShadow=foot.receiveShadow=true;post.add(foot);[-.30,.30].forEach((y,i)=>{const collar=new THREE.Mesh(new THREE.TorusGeometry(.15,.035,6,10),mat(0xfff4c2));collar.name='FirstSweeperEntryCollarV87';collar.rotation.x=Math.PI/2;collar.position.y=y;collar.castShadow=true;collar.material.emissive=new THREE.Color(i?0xffd84d:0xffb12b);collar.material.emissiveIntensity=.72;post.add(collar)});scene.add(post);return post}const sweeperEntryL=makeFirstSweeperEntryPost(-1),sweeperEntryR=makeFirstSweeperEntryPost(1);const sweeperEntryTop=new THREE.Mesh(new THREE.CapsuleGeometry(.10,3.50,4,8),mat(0xffd84d));sweeperEntryTop.name='FirstSweeperEntryTopV87';sweeperEntryTop.rotation.z=Math.PI/2;sweeperEntryTop.position.set(0,1.37,-10.42);sweeperEntryTop.castShadow=sweeperEntryTop.receiveShadow=true;sweeperEntryTop.material.emissive=new THREE.Color(0xa95a00);sweeperEntryTop.material.emissiveIntensity=.75;[-1.18,0,1.18].forEach((x,i)=>{const beacon=new THREE.Mesh(new THREE.TorusGeometry(.12,.03,6,10),mat(0xfff4c2));beacon.name='FirstSweeperEntryBeaconV87';beacon.rotation.y=Math.PI/2;beacon.position.set(0,x,0);beacon.castShadow=true;beacon.material.emissive=new THREE.Color(i===1?0xffffff:0xffb12b);beacon.material.emissiveIntensity=.82;sweeperEntryTop.add(beacon)});scene.add(sweeperEntryTop);"
          if old not in s: raise SystemExit('first sweeper entry box arch anchor missing')
          s=s.replace(old,new,1)

          old="const firstSweeperShieldL=makeFirstSweeperShieldRail(-FIRST_SWEEPER_STAGING_HALF_X-.10),firstSweeperShieldR=makeFirstSweeperShieldRail(FIRST_SWEEPER_STAGING_HALF_X+.10);const firstSweeperGateL=box(-1.88,.88,FIRST_SWEEPER_GATE_Z,.16,1.76,.16,0xffb12b),firstSweeperGateR=box(1.88,.88,FIRST_SWEEPER_GATE_Z,.16,1.76,.16,0xffb12b),firstSweeperGate=box(0,FIRST_SWEEPER_GATE_CLOSED_Y,FIRST_SWEEPER_GATE_Z,FIRST_SWEEPER_GATE_HALF_X*2,.22,.22,0xff315d);[firstSweeperGateL,firstSweeperGateR,firstSweeperGate].forEach(o=>{o.material.emissive=new THREE.Color(o===firstSweeperGate?0xa20d38:0xb86a00);o.material.emissiveIntensity=.9});"
          new="const firstSweeperShieldL=makeFirstSweeperShieldRail(-FIRST_SWEEPER_STAGING_HALF_X-.10),firstSweeperShieldR=makeFirstSweeperShieldRail(FIRST_SWEEPER_STAGING_HALF_X+.10);function makeFirstSweeperGatePost(side){const post=new THREE.Mesh(new THREE.CapsuleGeometry(.12,1.52,5,10),mat(0xffb12b));post.name='FirstSweeperGatePostV87';post.position.set(side*1.88,.88,FIRST_SWEEPER_GATE_Z);post.castShadow=post.receiveShadow=true;post.material.emissive=new THREE.Color(0xb86a00);post.material.emissiveIntensity=.9;const foot=new THREE.Mesh(new THREE.CylinderGeometry(.22,.29,.18,10),mat(0x4b3410));foot.name='FirstSweeperGateFootV87';foot.position.y=-.79;foot.castShadow=foot.receiveShadow=true;post.add(foot);const collar=new THREE.Mesh(new THREE.TorusGeometry(.17,.04,6,12),mat(0xfff0b0));collar.name='FirstSweeperGateCollarV87';collar.rotation.x=Math.PI/2;collar.position.y=.48;collar.castShadow=true;post.add(collar);scene.add(post);return post}const firstSweeperGateL=makeFirstSweeperGatePost(-1),firstSweeperGateR=makeFirstSweeperGatePost(1);const firstSweeperGate=new THREE.Mesh(new THREE.CapsuleGeometry(.11,FIRST_SWEEPER_GATE_HALF_X*2-.22,4,8),mat(0xff315d));firstSweeperGate.name='FirstSweeperGateBarV87';firstSweeperGate.rotation.z=Math.PI/2;firstSweeperGate.position.set(0,FIRST_SWEEPER_GATE_CLOSED_Y,FIRST_SWEEPER_GATE_Z);firstSweeperGate.castShadow=firstSweeperGate.receiveShadow=true;firstSweeperGate.material.emissive=new THREE.Color(0xa20d38);firstSweeperGate.material.emissiveIntensity=.9;[-1.24,0,1.24].forEach((x,i)=>{const ring=new THREE.Mesh(new THREE.TorusGeometry(.14,.032,6,10),mat(0xffffff));ring.name='FirstSweeperGateBarRingV87';ring.rotation.y=Math.PI/2;ring.position.set(0,x,0);ring.castShadow=true;ring.material.emissive=new THREE.Color(i===1?0xffffff:0xff315d);ring.material.emissiveIntensity=.82;firstSweeperGate.add(ring)});scene.add(firstSweeperGate);"
          if old not in s: raise SystemExit('first sweeper gate box anchor missing')
          s=s.replace(old,new,1)

          p.write_text(s)

          Path('scripts/first-sweeper-entry-model-v87-check.mjs').write_text("""import fs from 'node:fs';\nconst s=fs.readFileSync('index.html','utf8');\nconst must=[\n  'full 3D lift route v87 · modeled first sweeper entry gate',\n  'FIRST_SWEEPER_ENTRY_MODEL_V87=true',\n  \"FirstSweeperEntryPostV87\",\n  \"FirstSweeperEntryTopV87\",\n  \"FirstSweeperEntryBeaconV87\",\n  \"FirstSweeperGatePostV87\",\n  \"FirstSweeperGateBarV87\",\n  \"FirstSweeperGateBarRingV87\",\n  'FIRST_SWEEPER_GATE_Z=-10.62',\n  'FIRST_SWEEPER_GATE_HALF_X=1.74',\n  'FIRST_SWEEPER_GATE_CLOSED_Y=.62',\n  'FIRST_SWEEPER_GATE_OPEN_Y=2.82',\n  'function firstSweeperTimingGateBlocks',\n  'gateOpen=recover||cleared||firstSweeperGateCrossing'\n];\nfor(const x of must) if(!s.includes(x)) throw new Error('missing '+x);\nfor(const x of ['sweeperEntryL=box(','sweeperEntryR=box(','sweeperEntryTop=box(','firstSweeperGateL=box(','firstSweeperGateR=box(','firstSweeperGate=box(']) if(s.includes(x)) throw new Error('legacy primitive remains '+x);\nconst closed=.62-.11, open=2.82-.11, playerTop=2.12, brainTop=1.68;\nif(!(closed<brainTop&&closed<playerTop)) throw new Error('closed gate no longer blocks both bodies');\nif(!(open>playerTop&&open>brainTop)) throw new Error('open gate no longer clears both bodies');\nconsole.log('first sweeper entry model v87: PASS',{closedBottom:closed,openBottom:open,playerTop,brainTop});\n""")
          PY

      - name: Verify gameplay syntax and v87 invariants
        run: |
          node scripts/first-sweeper-entry-model-v87-check.mjs
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          module=s.split('<script type="module">',1)[1].split('</script>',1)[0]
          Path('/tmp/game-module.mjs').write_text(module)
          PY
          node --check /tmp/game-module.mjs
          node --check scripts/first-sweeper-entry-model-v87-check.mjs
          git diff --check

      - name: Commit gameplay change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html scripts/first-sweeper-entry-model-v87-check.mjs
          git commit -m 'Model first sweeper entry gate v87'
          git push origin HEAD:new-player-glb-overhaul
