name: One-shot second pit approach modeled v84
on:
  push:
    branches: [new-player-glb-overhaul]
    paths: ['.github/workflows/one-shot-second-pit-approach-modeled-v84.yml']
permissions:
  contents: write
jobs:
  patch-level:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-player-glb-overhaul
          fetch-depth: 0
      - name: Verify expected parent
        run: |
          test "$(git rev-parse HEAD)" = "c1653614a6c939f8590c55fc75d8f538e013d251" || { echo "Branch moved; refusing stale patch"; exit 1; }
      - name: Model second-pit approach guardrails v84
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="const secondPitApproachPad=box(0,.026,(SECOND_PIT_APPROACH_Z_MIN+SECOND_PIT_APPROACH_Z_MAX)*.5,SECOND_PIT_APPROACH_HALF_X*2,.052,SECOND_PIT_APPROACH_Z_MAX-SECOND_PIT_APPROACH_Z_MIN,0x49ff79),secondPitApproachL=box(-SECOND_PIT_APPROACH_HALF_X-.11,.38,(SECOND_PIT_APPROACH_Z_MIN+SECOND_PIT_APPROACH_Z_MAX)*.5,.18,.76,SECOND_PIT_APPROACH_Z_MAX-SECOND_PIT_APPROACH_Z_MIN,0x49ff79),secondPitApproachR=box(SECOND_PIT_APPROACH_HALF_X+.11,.38,(SECOND_PIT_APPROACH_Z_MIN+SECOND_PIT_APPROACH_Z_MAX)*.5,.18,.76,SECOND_PIT_APPROACH_Z_MAX-SECOND_PIT_APPROACH_Z_MIN,0x49ff79);[secondPitApproachPad,secondPitApproachL,secondPitApproachR].forEach(o=>{o.material.emissive=new THREE.Color(0x159b43);o.material.emissiveIntensity=.58});"
          new="const SECOND_PIT_APPROACH_MODEL_V84=true;const secondPitApproachPad=box(0,.026,(SECOND_PIT_APPROACH_Z_MIN+SECOND_PIT_APPROACH_Z_MAX)*.5,SECOND_PIT_APPROACH_HALF_X*2,.052,SECOND_PIT_APPROACH_Z_MAX-SECOND_PIT_APPROACH_Z_MIN,0x49ff79);secondPitApproachPad.material.emissive=new THREE.Color(0x159b43);secondPitApproachPad.material.emissiveIntensity=.58;function makeSecondPitApproachGuard(side){const g=new THREE.Group();g.name='SecondPitApproachGuardV84';g.position.set(side*(SECOND_PIT_APPROACH_HALF_X+.11),0,(SECOND_PIT_APPROACH_Z_MIN+SECOND_PIT_APPROACH_Z_MAX)*.5);const railMat=mat(0x49ff79),dark=mat(0x14352d),accent=mat(0xdffff0);const rail=new THREE.Mesh(new THREE.CapsuleGeometry(.10,1.36,4,8),railMat);rail.name='SecondPitApproachRailV84';rail.rotation.x=Math.PI/2;rail.position.y=.42;rail.castShadow=rail.receiveShadow=true;rail.material.emissive=new THREE.Color(0x159b43);rail.material.emissiveIntensity=.58;g.add(rail);[-.60,0,.60].forEach((z,i)=>{const post=new THREE.Mesh(new THREE.CylinderGeometry(.075,.105,.74,8),dark);post.name='SecondPitApproachPostV84';post.position.set(0,.35,z);post.castShadow=post.receiveShadow=true;g.add(post);const beacon=new THREE.Mesh(new THREE.TorusGeometry(.11,.028,6,10),accent);beacon.name='SecondPitApproachBeaconV84';beacon.rotation.x=Math.PI/2;beacon.position.set(0,.76,z);beacon.castShadow=true;beacon.material.emissive=new THREE.Color(i===1?0xffffff:0x49ff79);beacon.material.emissiveIntensity=.72;g.add(beacon)});scene.add(g);return g}const secondPitApproachL=makeSecondPitApproachGuard(-1),secondPitApproachR=makeSecondPitApproachGuard(1);"
          if old not in s: raise SystemExit('expected v83 second-pit approach block not found')
          s=s.replace(old,new,1)
          oldtick="[secondPitApproachPad,secondPitApproachL,secondPitApproachR].forEach(o=>o.material.emissiveIntensity=secondPitApproachActive?1.05+.45*secondPitApproachPulse:.58);"
          newtick="secondPitApproachPad.material.emissiveIntensity=secondPitApproachActive?1.05+.45*secondPitApproachPulse:.58;[secondPitApproachL,secondPitApproachR].forEach(g=>{const rail=g.children.find(c=>c.name==='SecondPitApproachRailV84');if(rail)rail.material.emissiveIntensity=secondPitApproachActive?1.05+.45*secondPitApproachPulse:.58;g.children.filter(c=>c.name==='SecondPitApproachBeaconV84').forEach(b=>b.material.emissiveIntensity=secondPitApproachActive?1.15+.35*secondPitApproachPulse:.72)});"
          if oldtick not in s: raise SystemExit('expected second-pit approach pulse block not found')
          s=s.replace(oldtick,newtick,1)
          s=s.replace('full 3D lift route v83 · modeled sweeper recovery','full 3D lift route v84 · modeled second-pit approach',1)
          p.write_text(s)
          PY
      - name: Run real static checks
        run: |
          grep -q "SECOND_PIT_APPROACH_MODEL_V84=true" index.html
          grep -q "SecondPitApproachGuardV84" index.html
          grep -q "SecondPitApproachRailV84" index.html
          grep -q "SecondPitApproachBeaconV84" index.html
          grep -q "function inSecondPitApproachRail(x,z,r=0){return z>SECOND_PIT_APPROACH_Z_MIN&&z<SECOND_PIT_APPROACH_Z_MAX&&Math.abs(x)>SECOND_PIT_APPROACH_HALF_X-r}" index.html
          ! grep -q "secondPitApproachL=box" index.html
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          a=s.index('<script type="module">')+len('<script type="module">')
          b=s.index('</script></body></html>',a)
          Path('/tmp/game.mjs').write_text(s[a:b])
          PY
          node --check /tmp/game.mjs
          git diff --check
      - name: Commit gameplay change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Model second pit approach guardrails v84"
          git push origin HEAD:new-player-glb-overhaul
