        run: |
          python3 -c "from pathlib import Path; s=Path('index.html').read_text(); assert 'full 3D lift route v27 · phased final puncher gauntlet' in s; [(_ for _ in ()).throw(AssertionError(x)) if x not in s else None for x in ['warn-left','punch-left','warn-right','punch-right','safe-exit','Math.sin(Math.PI*stageU)','if(!attacking||Math.abs(vx)<.35']]"
