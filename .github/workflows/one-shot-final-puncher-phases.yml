name: Final Puncher Phases
on:
  push:
    branches: [new-player-glb-overhaul]
    paths:
      - '.github/workflows/one-shot-final-puncher-phases.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-player-glb-overhaul
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply phased final gauntlet gameplay patch
        run: python3 -c "import base64;exec(base64.b64decode(''))"
      - name: Verify phased gauntlet runtime
        run: |
          python3 -c "from pathlib import Path; s=Path('index.html').read_text(); assert 'full 3D lift route v27 · phased final puncher gauntlet' in s; [(_ for _ in ()).throw(AssertionError(x)) if x not in s else None for x in ['warning=active&&cycle<.85','attack=active&&cycle>=.85&&cycle<2.35','Math.sin((cycle-.85)/1.5*Math.PI)','if(!attack||hitLock>0']]"
          python3 -c "from pathlib import Path; import re; s=Path('index.html').read_text(); m=re.search(r'<script type=\"module\">(.*)</script>',s,re.S); assert m; Path('/tmp/runtime.mjs').write_text(m.group(1))"
          node --check /tmp/runtime.mjs
      - name: Commit gameplay change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Phase final puncher gauntlet attacks'
          git push origin HEAD:new-player-glb-overhaul
