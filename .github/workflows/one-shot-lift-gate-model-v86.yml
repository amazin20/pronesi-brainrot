name: One-shot lift gate model v86

on:
  push:
    branches: [new-player-glb-overhaul]
    paths: [.github/workflows/one-shot-lift-gate-model-v86.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-player-glb-overhaul
          fetch-depth: 0
      - name: Patch modeled lift gate posts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="const liftGatePostL=box(-LIFT_GATE_HALF_X,.92,LIFT_GATE_Z,.16,1.84,.16,0xffb12b),liftGatePostR=box(LIFT_GATE_HALF_X,.92,LIFT_GATE_Z,.16,1.84,.16,0xffb12b),liftSafetyGate=box(0,LIFT_GATE_CLOSED_Y,LIFT_GATE_Z,LIFT_GATE_HALF_X*2,.22,.22,0xff315d),liftGatePad=box(0,.025,LIFT_GATE_Z-.38,LIFT_GATE_HALF_X*2+.2,.05,.62,0xffb12b);"
          new="const LIFT_GATE_MODEL_V86=true;function makeLiftGatePost(side){const post=new THREE.Mesh(new THREE.CapsuleGeometry(.12,1.56,5,10),mat(0xffb12b));post.name='LiftGatePostV86';post.position.set(side*LIFT_GATE_HALF_X,.92,LIFT_GATE_Z);post.castShadow=post.receiveShadow=true;post.material.emissive=new THREE.Color(0xb86a00);post.material.emissiveIntensity=.82;const foot=new THREE.Mesh(new THREE.CylinderGeometry(.22,.29,.18,10),mat(0x4b3410));foot.name='LiftGateFootV86';foot.position.y=-.83;foot.castShadow=foot.receiveShadow=true;post.add(foot);[-.42,.42].forEach((y,i)=>{const collar=new THREE.Mesh(new THREE.TorusGeometry(.17,.04,6,12),mat(0xfff0b0));collar.name='LiftGateCollarV86';collar.rotation.x=Math.PI/2;collar.position.y=y;collar.castShadow=true;collar.material.emissive=new THREE.Color(i?0xffd84d:0xffb12b);collar.material.emissiveIntensity=.72;post.add(collar)});const beacon=new THREE.Mesh(new THREE.OctahedronGeometry(.12,0),mat(0xffffff));beacon.name='LiftGateBeaconV86';beacon.position.y=.91;beacon.castShadow=true;beacon.material.emissive=new THREE.Color(0xffb12b);beacon.material.emissiveIntensity=1.0;post.add(beacon);scene.add(post);return post}const liftGatePostL=makeLiftGatePost(-1),liftGatePostR=makeLiftGatePost(1),liftSafetyGate=box(0,LIFT_GATE_CLOSED_Y,LIFT_GATE_Z,LIFT_GATE_HALF_X*2,.22,.22,0xff315d),liftGatePad=box(0,.025,LIFT_GATE_Z-.38,LIFT_GATE_HALF_X*2+.2,.05,.62,0xffb12b);"
          if old not in s:
              raise SystemExit('expected v85 primitive lift gate posts not found')
          s=s.replace(old,new,1)
          s=s.replace('full 3D lift route v85 · modeled second-pit stage gate','full 3D lift route v86 · modeled lift gate posts',1)
          p.write_text(s)
          PY
      - name: Verify v86 lift gate geometry invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          required=['LIFT_GATE_MODEL_V86=true','LiftGatePostV86','LiftGateFootV86','LiftGateCollarV86','LiftGateBeaconV86','LIFT_GATE_Z=PITS[0][0]-.22','LIFT_GATE_HALF_X=1.9','liftSafetyGate=box(0,LIFT_GATE_CLOSED_Y,LIFT_GATE_Z,LIFT_GATE_HALF_X*2,.22,.22,0xff315d)','liftSafetyGateBlocks(x,z']
          missing=[x for x in required if x not in s]
          assert not missing, missing
          forbidden=['liftGatePostL=box(-LIFT_GATE_HALF_X,.92,LIFT_GATE_Z,.16,1.84,.16,0xffb12b)','liftGatePostR=box(LIFT_GATE_HALF_X,.92,LIFT_GATE_Z,.16,1.84,.16,0xffb12b)']
          assert not [x for x in forbidden if x in s]
          print('v86 modeled lift gate post invariants OK')
          PY
      - name: Browser module syntax check
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(); a=s.index('<script type="module">')+len('<script type="module">'); b=s.index('</script>',a); Path('/tmp/module.mjs').write_text(s[a:b])
          PY
          node --check /tmp/module.mjs
      - name: Current lift gameplay checks
        run: |
          node scripts/first-lift-route-lock-check.mjs
          node scripts/lift-carry-crossing-hold-check.mjs
          node scripts/lift-carry-window-check.mjs
          node scripts/lift-route-continuity-check.mjs
      - name: Diff check and commit
        run: |
          git diff --check
          git config user.name 'amazin20'
          git config user.email '138931938+amazin20@users.noreply.github.com'
          git add index.html
          git commit -m 'Model lift gate posts v86'
          git push origin HEAD:new-player-glb-overhaul
