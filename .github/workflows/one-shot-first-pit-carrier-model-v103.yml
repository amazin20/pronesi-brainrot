name: One-shot first pit carrier model v103

on:
  push:
    branches: [new-player-glb-overhaul]
    paths:
      - .github/workflows/one-shot-first-pit-carrier-model-v103.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-player-glb-overhaul
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Replace first pit carrier visual with modeled assembly
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          src = p.read_text()
          old = "const PIT_PLATFORM_TOP=.08,PIT_PLATFORM_HALF_X=1.45,PIT_PLATFORM_HALF_Z=.38;const pitPlatform=box(0,-.04,-4.2,PIT_PLATFORM_HALF_X*2,.24,PIT_PLATFORM_HALF_Z*2,0xffd84d);pitPlatform.material.emissive=new THREE.Color(0xa95a00);pitPlatform.material.emissiveIntensity=.72;const pitPlatformStripe=box(0,.095,-4.2,2.25,.035,.58,0xffffff);pitPlatformStripe.material.emissive=new THREE.Color(0xffb62b);pitPlatformStripe.material.emissiveIntensity=1.1;"
          new = "const PIT_PLATFORM_TOP=.08,PIT_PLATFORM_HALF_X=1.45,PIT_PLATFORM_HALF_Z=.38,FIRST_PIT_CARRIER_MODEL_V103=true;const pitPlatform=box(0,-.04,-4.2,PIT_PLATFORM_HALF_X*2,.24,PIT_PLATFORM_HALF_Z*2,0xffd84d);pitPlatform.name='FirstPitCarrierCollisionDeckV103';pitPlatform.material.transparent=true;pitPlatform.material.opacity=.055;pitPlatform.material.depthWrite=false;pitPlatform.material.emissive=new THREE.Color(0xa95a00);pitPlatform.material.emissiveIntensity=.32;const firstPitCarrierAccent=mat(0xffd84d),firstPitCarrierDark=mat(0x242b49),firstPitCarrierWhite=mat(0xffffff);[-.24,.24].forEach(z=>{const pontoon=new THREE.Mesh(new THREE.CapsuleGeometry(.17,2.18,4,10),firstPitCarrierAccent);pontoon.name='FirstPitCarrierPontoonV103';pontoon.rotation.z=Math.PI/2;pontoon.position.set(0,.01,z);pontoon.scale.z=.92;pontoon.castShadow=pontoon.receiveShadow=true;pitPlatform.add(pontoon)});[-1.08,1.08].forEach((x,i)=>{const pod=new THREE.Mesh(new THREE.CylinderGeometry(.16,.20,.30,10),firstPitCarrierDark);pod.name='FirstPitCarrierThrusterPodV103';pod.rotation.z=Math.PI/2;pod.position.set(x,-.04,0);pod.castShadow=pod.receiveShadow=true;pitPlatform.add(pod);const ring=new THREE.Mesh(new THREE.TorusGeometry(.22,.05,7,14),firstPitCarrierAccent);ring.name='FirstPitCarrierThrusterRingV103';ring.rotation.y=Math.PI/2;ring.position.set(x,-.04,0);ring.castShadow=true;ring.material.emissive=new THREE.Color(0xa95a00);ring.material.emissiveIntensity=.9;pitPlatform.add(ring);const hub=new THREE.Mesh(new THREE.OctahedronGeometry(.09,0),firstPitCarrierWhite);hub.name='FirstPitCarrierHubV103';hub.position.set(x,.07,0);hub.castShadow=true;hub.material.emissive=new THREE.Color(i?0xffd84d:0xffffff);hub.material.emissiveIntensity=.78;pitPlatform.add(hub)});[-.29,.29].forEach(z=>{const rail=new THREE.Mesh(new THREE.CapsuleGeometry(.045,2.48,4,8),firstPitCarrierWhite);rail.name='FirstPitCarrierRailV103';rail.rotation.z=Math.PI/2;rail.position.set(0,.17,z);rail.castShadow=true;pitPlatform.add(rail)});[-.72,0,.72].forEach((x,i)=>{const brace=new THREE.Mesh(new THREE.CylinderGeometry(.045,.065,.48,8),firstPitCarrierDark);brace.name='FirstPitCarrierBraceV103';brace.rotation.x=Math.PI/2;brace.position.set(x,.02,0);brace.castShadow=brace.receiveShadow=true;pitPlatform.add(brace);const beacon=new THREE.Mesh(new THREE.TorusGeometry(.095,.024,6,10),firstPitCarrierWhite);beacon.name='FirstPitCarrierBeaconV103';beacon.rotation.x=Math.PI/2;beacon.position.set(x,.12,0);beacon.castShadow=true;beacon.material.emissive=new THREE.Color(i===1?0xffffff:0xffb62b);beacon.material.emissiveIntensity=.9;pitPlatform.add(beacon)});const pitPlatformStripe=new THREE.Mesh(new THREE.CapsuleGeometry(.045,2.12,4,8),mat(0xffffff));pitPlatformStripe.name='FirstPitCarrierStripeV103';pitPlatformStripe.rotation.z=Math.PI/2;pitPlatformStripe.position.set(0,.11,-4.2);pitPlatformStripe.castShadow=pitPlatformStripe.receiveShadow=true;pitPlatformStripe.material.emissive=new THREE.Color(0xffb62b);pitPlatformStripe.material.emissiveIntensity=1.1;scene.add(pitPlatformStripe);"
          if old not in src:
              raise SystemExit('old first-pit carrier snippet not found; refusing blind overwrite')
          src = src.replace(old, new, 1)
          src = src.replace('full 3D route v102 · modeled group runtime safety','full 3D route v103 · modeled first pit carrier',1)
          p.write_text(src)

          q = Path('scripts/first-pit-carrier-continuity-check.mjs')
          qa = q.read_text()
          qa = qa.replace("must('const PIT_PLATFORM_TOP=.08,PIT_PLATFORM_HALF_X=1.45,PIT_PLATFORM_HALF_Z=.38');\nmust('const pitPlatform=box(0,-.04,-4.2,PIT_PLATFORM_HALF_X*2,.24,PIT_PLATFORM_HALF_Z*2,0xffd84d)');", "must('const PIT_PLATFORM_TOP=.08,PIT_PLATFORM_HALF_X=1.45,PIT_PLATFORM_HALF_Z=.38,FIRST_PIT_CARRIER_MODEL_V103=true');\nmust(\"pitPlatform.name='FirstPitCarrierCollisionDeckV103'\");\nmust(\"pontoon.name='FirstPitCarrierPontoonV103'\");\nmust(\"ring.name='FirstPitCarrierThrusterRingV103'\");\nmust(\"rail.name='FirstPitCarrierRailV103'\");\nmust(\"pitPlatformStripe.name='FirstPitCarrierStripeV103'\");")
          qa = qa.replace("const visualTop = -.04 + .24 / 2;", "if (!src.includes('pitPlatform.material.opacity=.055')) fail('collision deck is no longer visually de-emphasized behind modeled carrier');\nif (src.includes('const pitPlatformStripe=box(')) fail('legacy box stripe returned');\nconst visualTop = -.04 + .24 / 2;")
          q.write_text(qa)
          PY

      - name: Verify browser module parses
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src = Path('index.html').read_text()
          start = src.index('<script type="module">') + len('<script type="module">')
          end = src.rindex('</script>')
          Path('/tmp/brainrot-module.mjs').write_text(src[start:end])
          PY
          node --check /tmp/brainrot-module.mjs

      - name: Verify first pit carrier continuity
        run: node scripts/first-pit-carrier-continuity-check.mjs

      - name: Verify key downstream route checks
        run: |
          set -euo pipefail
          node scripts/lift-route-continuity-check.mjs
          node scripts/first-sweeper-cycle-check.mjs
          node scripts/second-pit-route-continuity-v70-check.mjs
          node scripts/final-finish-charge-check.mjs

      - name: Commit gameplay change
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'amazin20'
          git config user.email '138931938+amazin20@users.noreply.github.com'
          git add index.html scripts/first-pit-carrier-continuity-check.mjs
          git commit -m 'Level: model first pit carrier v103'
          git push origin HEAD:new-player-glb-overhaul
