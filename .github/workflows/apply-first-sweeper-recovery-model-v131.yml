name: Apply First Sweeper Recovery Model v131

on:
  push:
    branches: [new-player-glb-overhaul]
    paths:
      - .github/workflows/apply-first-sweeper-recovery-model-v131.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-player-glb-overhaul
          fetch-depth: 0
      - name: Refuse stale/non-linear apply
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin new-player-glb-overhaul
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/new-player-glb-overhaul)"
      - name: Model first sweeper recovery deck v131
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          if 'FIRST_SWEEPER_RECOVERY_PAD_MODEL_V131=true' in s:
              raise SystemExit('v131 already present')
          old="const FIRST_SWEEPER_RECOVERY_MODEL_V83=true;const firstSweeperRecoveryPad=box(0,.03,(FIRST_SWEEPER_RECOVERY_Z_MIN+FIRST_SWEEPER_RECOVERY_Z_MAX)*.5,FIRST_SWEEPER_RECOVERY_HALF_X*2,.06,FIRST_SWEEPER_RECOVERY_Z_MAX-FIRST_SWEEPER_RECOVERY_Z_MIN,0x49ff79);firstSweeperRecoveryPad.material.emissive=new THREE.Color(0x159b43);firstSweeperRecoveryPad.material.emissiveIntensity=.5;function makeFirstSweeperRecoveryGuard(side){"
          if old not in s:
              raise SystemExit('first sweeper recovery anchor missing')
          new="""const FIRST_SWEEPER_RECOVERY_MODEL_V83=true,FIRST_SWEEPER_RECOVERY_PAD_MODEL_V131=true;const firstSweeperRecoveryPad=box(0,.03,(FIRST_SWEEPER_RECOVERY_Z_MIN+FIRST_SWEEPER_RECOVERY_Z_MAX)*.5,FIRST_SWEEPER_RECOVERY_HALF_X*2,.06,FIRST_SWEEPER_RECOVERY_Z_MAX-FIRST_SWEEPER_RECOVERY_Z_MIN,0x49ff79);firstSweeperRecoveryPad.name='FirstSweeperRecoveryLegacyCollisionCarrierV131';firstSweeperRecoveryPad.material.transparent=true;firstSweeperRecoveryPad.material.opacity=.04;firstSweeperRecoveryPad.material.depthWrite=false;firstSweeperRecoveryPad.material.emissive=new THREE.Color(0x159b43);firstSweeperRecoveryPad.material.emissiveIntensity=.5;const firstRecoveryGreenV131=mat(0x49ff79),firstRecoveryDarkV131=mat(0x14352d),firstRecoveryWhiteV131=mat(0xeaffef),firstRecoveryCyanV131=mat(0x44e7ff),firstRecoveryAmberV131=mat(0xffd84d);firstRecoveryGreenV131.metalness=.30;firstRecoveryGreenV131.roughness=.27;firstRecoveryDarkV131.metalness=.48;firstRecoveryDarkV131.roughness=.30;const firstRecoverySlatGeoV131=new THREE.BoxGeometry(.50,.068,.62),firstRecoveryRailGeoV131=new THREE.CapsuleGeometry(.04,.60,4,8),firstRecoveryBumperGeoV131=new THREE.CylinderGeometry(.10,.15,.32,8),firstRecoveryRingGeoV131=new THREE.TorusGeometry(.115,.028,6,10),firstRecoveryBraceGeoV131=new THREE.CylinderGeometry(.045,.065,.58,8);[-1.72,-1.15,-.58,0,.58,1.15,1.72].forEach((x,i)=>{const slat=new THREE.Mesh(firstRecoverySlatGeoV131,i===3?firstRecoveryWhiteV131:firstRecoveryGreenV131);slat.name='FirstSweeperRecoverySlatV131';slat.position.set(x,.075,0);slat.castShadow=slat.receiveShadow=true;slat.material.emissive=new THREE.Color(i===3?0xffffff:0x159b43);slat.material.emissiveIntensity=i===3?.90:.50;firstSweeperRecoveryPad.add(slat)});[-.31,.31].forEach((z,i)=>{const rail=new THREE.Mesh(firstRecoveryRailGeoV131,firstRecoveryWhiteV131);rail.name='FirstSweeperRecoveryEdgeRailV131';rail.rotation.z=Math.PI/2;rail.scale.y=7.7;rail.position.set(0,.17,z);rail.castShadow=rail.receiveShadow=true;rail.material.emissive=new THREE.Color(i?0x44e7ff:0x49ff79);rail.material.emissiveIntensity=.70;firstSweeperRecoveryPad.add(rail)});[-1.92,1.92].forEach((x,i)=>{const bumper=new THREE.Mesh(firstRecoveryBumperGeoV131,firstRecoveryDarkV131);bumper.name='FirstSweeperRecoveryBumperV131';bumper.rotation.z=Math.PI/2;bumper.position.set(x,.10,0);bumper.castShadow=bumper.receiveShadow=true;firstSweeperRecoveryPad.add(bumper);const beacon=new THREE.Mesh(firstRecoveryRingGeoV131,i?firstRecoveryCyanV131:firstRecoveryGreenV131);beacon.name='FirstSweeperRecoveryBeaconRingV131';beacon.rotation.y=Math.PI/2;beacon.position.set(x,.145,0);beacon.castShadow=true;beacon.material.emissive=new THREE.Color(i?0x44e7ff:0x49ff79);beacon.material.emissiveIntensity=1.02;firstSweeperRecoveryPad.add(beacon)});[-1.18,0,1.18].forEach((x,i)=>{const brace=new THREE.Mesh(firstRecoveryBraceGeoV131,firstRecoveryDarkV131);brace.name='FirstSweeperRecoveryCrossBraceV131';brace.rotation.x=Math.PI/2;brace.position.set(x,.025,0);brace.castShadow=brace.receiveShadow=true;firstSweeperRecoveryPad.add(brace);const ring=new THREE.Mesh(firstRecoveryRingGeoV131,i===1?firstRecoveryAmberV131:firstRecoveryWhiteV131);ring.name='FirstSweeperRecoveryGuideRingV131';ring.rotation.x=Math.PI/2;ring.position.set(x,.12,0);ring.castShadow=true;ring.material.emissive=new THREE.Color(i===1?0xffb12b:0x49ff79);ring.material.emissiveIntensity=i===1?1.08:.80;firstSweeperRecoveryPad.add(ring)});function makeFirstSweeperRecoveryGuard(side){"""
          s=s.replace(old,new,1)
          p.write_text(s)
      - name: Verify first sweeper recovery v131 and preserved gameplay
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          required=[
            'FIRST_SWEEPER_RECOVERY_PAD_MODEL_V131=true',
            'FirstSweeperRecoveryLegacyCollisionCarrierV131',
            'FirstSweeperRecoverySlatV131',
            'FirstSweeperRecoveryEdgeRailV131',
            'FirstSweeperRecoveryBumperV131',
            'FirstSweeperRecoveryBeaconRingV131',
            'FirstSweeperRecoveryCrossBraceV131',
            'FirstSweeperRecoveryGuideRingV131',
            'FIRST_SWEEPER_RECOVERY_Z_MIN=-7.72',
            'FIRST_SWEEPER_RECOVERY_Z_MAX=-6.92',
            'FIRST_SWEEPER_RECOVERY_HALF_X=2.05',
            'FIRST_SWEEPER_RECOVERY_DAMP=11.5',
            "firstSweeperRecoveryActive=firstSweeperCleared&&p.z>FIRST_SWEEPER_RECOVERY_Z_MIN",
            "FirstSweeperRecoveryRailV83",
            "FirstSweeperRecoveryBeaconV83"
          ]
          for token in required:
              assert token in s, token
          assert s.count('FIRST_SWEEPER_RECOVERY_PAD_MODEL_V131=true') == 1
          assert s.count("'FirstSweeperRecoveryLegacyCollisionCarrierV131'") == 1
          assert 'firstSweeperRecoveryPad=box(0,.03,(FIRST_SWEEPER_RECOVERY_Z_MIN+FIRST_SWEEPER_RECOVERY_Z_MAX)*.5,FIRST_SWEEPER_RECOVERY_HALF_X*2,.06,FIRST_SWEEPER_RECOVERY_Z_MAX-FIRST_SWEEPER_RECOVERY_Z_MIN,0x49ff79)' in s
          print('First sweeper recovery pad v131 contract: SUCCESS')
          PY
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          m=re.search(r'<script type="module">(.*?)</script>',s,re.S)
          assert m, 'module script not found'
          Path('/tmp/brainrot-module.mjs').write_text(m.group(1))
          PY
          node --check /tmp/brainrot-module.mjs
          node scripts/final-puncher-physics-contract-v65.mjs
          node scripts/final-finish-residual-momentum-check.mjs
          node scripts/final-finish-soft-hold-check.mjs
          node scripts/final-finish-charge-check.mjs
      - name: Commit real level change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "openai-level-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && { echo 'No gameplay change produced'; exit 1; }
          git commit -m "Level: model first sweeper recovery deck v131"
          git push origin HEAD:new-player-glb-overhaul
