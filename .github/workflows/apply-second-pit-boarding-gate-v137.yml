name: Apply Second Pit Boarding Gate v137

on:
  push:
    branches: [new-player-glb-overhaul]
    paths:
      - .github/workflows/apply-second-pit-boarding-gate-v137.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-player-glb-overhaul
          fetch-depth: 0
      - name: Refuse stale/non-linear apply
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin new-player-glb-overhaul
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/new-player-glb-overhaul)"
          test "$(git rev-parse HEAD^)" = "e8448ba69e0cd3b84bde9be4faba9c6386e83164"
      - name: Model second pit boarding gate v137
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          if 'SECOND_PIT_BOARDING_GATE_MODEL_V137=true' in s:
              raise SystemExit('v137 already present')
          anchor='const SECOND_PIT_BOARD_BRIDGE_MODEL_V107=true;'
          if s.count(anchor) != 1:
              raise SystemExit(f'v137 boarding anchor count={s.count(anchor)}')
          model="""const SECOND_PIT_BOARDING_GATE_MODEL_V137=true;const secondPitBoardingGateV137=new THREE.Group();secondPitBoardingGateV137.name='SecondPitBoardingGateV137';secondPitBoardingGateV137.position.set(0,0,4.90);scene.add(secondPitBoardingGateV137);const boardingGateGreenV137=mat(0x49ff79),boardingGateCyanV137=mat(0x44e7ff),boardingGateWhiteV137=mat(0xf4fff8),boardingGateDarkV137=mat(0x12342d),boardingGateAmberV137=mat(0xffd84d);boardingGateGreenV137.metalness=.32;boardingGateGreenV137.roughness=.25;boardingGateCyanV137.metalness=.34;boardingGateCyanV137.roughness=.24;boardingGateDarkV137.metalness=.52;boardingGateDarkV137.roughness=.29;const boardingPostGeoV137=new THREE.CylinderGeometry(.11,.16,1.34,10),boardingFootGeoV137=new THREE.CylinderGeometry(.22,.30,.18,10),boardingRingGeoV137=new THREE.TorusGeometry(.16,.038,7,12),boardingBeamGeoV137=new THREE.BoxGeometry(2.82,.18,.20),boardingChevronGeoV137=new THREE.BoxGeometry(.48,.045,.16);[-1.43,1.43].forEach((x,i)=>{const foot=new THREE.Mesh(boardingFootGeoV137,boardingGateDarkV137);foot.name='SecondPitBoardingGateFootV137';foot.position.set(x,.09,0);foot.castShadow=foot.receiveShadow=true;secondPitBoardingGateV137.add(foot);const post=new THREE.Mesh(boardingPostGeoV137,i?boardingGateCyanV137:boardingGateGreenV137);post.name='SecondPitBoardingGatePostV137';post.position.set(x,.74,0);post.castShadow=post.receiveShadow=true;post.material.emissive=new THREE.Color(i?0x087fa8:0x159b43);post.material.emissiveIntensity=.44;secondPitBoardingGateV137.add(post);[.34,.76,1.16].forEach((y,k)=>{const ring=new THREE.Mesh(boardingRingGeoV137,k===1?boardingGateWhiteV137:(i?boardingGateCyanV137:boardingGateGreenV137));ring.name='SecondPitBoardingGateRingV137';ring.rotation.x=Math.PI/2;ring.position.set(x,y,0);ring.castShadow=true;ring.material.emissive=new THREE.Color(k===1?0xffffff:(i?0x44e7ff:0x49ff79));ring.material.emissiveIntensity=k===1?.92:.72;secondPitBoardingGateV137.add(ring)})});const boardingBeamV137=new THREE.Mesh(boardingBeamGeoV137,boardingGateDarkV137);boardingBeamV137.name='SecondPitBoardingGateBeamV137';boardingBeamV137.position.set(0,1.42,0);boardingBeamV137.castShadow=boardingBeamV137.receiveShadow=true;secondPitBoardingGateV137.add(boardingBeamV137);[-.92,-.46,0,.46,.92].forEach((x,i)=>{const lamp=new THREE.Mesh(new THREE.OctahedronGeometry(.085,0),i===2?boardingGateAmberV137:boardingGateWhiteV137);lamp.name='SecondPitBoardingGateLampV137';lamp.position.set(x,1.43,.13);lamp.castShadow=true;lamp.material.emissive=new THREE.Color(i===2?0xffb12b:(i<2?0x49ff79:0x44e7ff));lamp.material.emissiveIntensity=i===2?1.18:.96;secondPitBoardingGateV137.add(lamp)});[-.54,-.18,.18,.54].forEach((z,i)=>{const chevron=new THREE.Mesh(boardingChevronGeoV137,i<2?boardingGateGreenV137:boardingGateCyanV137);chevron.name='SecondPitBoardingChevronV137';chevron.position.set((i%2?-.34:.34),.07,z);chevron.rotation.y=(i%2?-1:1)*.48;chevron.castShadow=chevron.receiveShadow=true;chevron.material.emissive=new THREE.Color(i<2?0x49ff79:0x44e7ff);chevron.material.emissiveIntensity=.68;secondPitBoardingGateV137.add(chevron)});const boardingCenterRingV137=new THREE.Mesh(new THREE.TorusGeometry(.21,.045,8,14),boardingGateAmberV137);boardingCenterRingV137.name='SecondPitBoardingCenterRingV137';boardingCenterRingV137.rotation.x=Math.PI/2;boardingCenterRingV137.position.set(0,.12,0);boardingCenterRingV137.castShadow=true;boardingCenterRingV137.material.emissive=new THREE.Color(0xffb12b);boardingCenterRingV137.material.emissiveIntensity=1.10;secondPitBoardingGateV137.add(boardingCenterRingV137);"""
          s=s.replace(anchor,model+anchor,1)
          tick_anchor='secondPitApproachPad.material.emissiveIntensity=secondPitApproachActive?.30:.18;'
          if s.count(tick_anchor) != 1:
              raise SystemExit(f'v137 tick anchor count={s.count(tick_anchor)}')
          tick="""const secondPitBoardingGateActiveV137=secondSweeperCleared&&p.z>4.50&&p.z<5.14,secondPitBoardingGatePulseV137=.5+.5*Math.sin(t*8.4);secondPitBoardingGateV137.children.forEach(n=>{if(!n.isMesh||!n.material?.emissive)return;const lamp=n.name==='SecondPitBoardingGateLampV137',ring=n.name==='SecondPitBoardingGateRingV137'||n.name==='SecondPitBoardingCenterRingV137',chevron=n.name==='SecondPitBoardingChevronV137';n.material.emissiveIntensity=secondPitBoardingGateActiveV137?(lamp?1.25+.45*secondPitBoardingGatePulseV137:(ring?1.02+.34*secondPitBoardingGatePulseV137:(chevron?.88+.28*secondPitBoardingGatePulseV137:.58+.16*secondPitBoardingGatePulseV137))):(lamp?.96:(ring?.72:(chevron?.68:.44))) });"""
          s=s.replace(tick_anchor,tick_anchor+tick,1)
          p.write_text(s)
      - name: Verify v137 boarding zone and preserved gameplay
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          required=[
            'SECOND_PIT_BOARDING_GATE_MODEL_V137=true',
            'SecondPitBoardingGateV137',
            'SecondPitBoardingGateFootV137',
            'SecondPitBoardingGatePostV137',
            'SecondPitBoardingGateRingV137',
            'SecondPitBoardingGateBeamV137',
            'SecondPitBoardingGateLampV137',
            'SecondPitBoardingChevronV137',
            'SecondPitBoardingCenterRingV137',
            'SECOND_PIT_BOARD_BRIDGE_MODEL_V107=true',
            'SECOND_PIT_STAGE_PAD_MODEL_V109=true',
            'SECOND_PIT_APPROACH_PAD_MODEL_V110=true',
            'SECOND_PIT_BOARD_BRIDGE_Z=5.055',
            'SECOND_PIT_BOARD_X=.16',
            'SECOND_PIT_BOARD_SPEED=2.6',
            'secondPitBoardingGateActiveV137=secondSweeperCleared&&p.z>4.50&&p.z<5.14'
          ]
          for token in required:
              assert token in s, token
          assert s.count('SECOND_PIT_BOARDING_GATE_MODEL_V137=true') == 1
          assert s.count("'SecondPitBoardingGateV137'") == 1
          assert 'secondPitBoardingGateV137.position.set(0,0,4.90)' in s
          print('Second pit boarding gate v137 contract: SUCCESS')
          PY
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          m=re.search(r'<script type="module">(.*?)</script>',s,re.S)
          assert m, 'module script not found'
          Path('/tmp/brainrot-module.mjs').write_text(m.group(1))
          PY
          node --check /tmp/brainrot-module.mjs
          for f in scripts/second-pit-carry-window-check.mjs scripts/second-pit-platform-motion-v71-check.mjs scripts/second-pit-route-continuity-v70-check.mjs scripts/final-puncher-physics-contract-v65.mjs scripts/final-finish-residual-momentum-check.mjs scripts/final-finish-soft-hold-check.mjs scripts/final-finish-charge-check.mjs; do
            if [ -f "$f" ]; then node "$f"; else echo "SKIP missing $f"; fi
          done
      - name: Commit real level change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "openai-level-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && { echo 'No gameplay change produced'; exit 1; }
          git commit -m "Level: model second pit boarding gate v137"
          git push origin HEAD:new-player-glb-overhaul
