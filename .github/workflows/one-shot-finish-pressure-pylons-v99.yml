name: one-shot finish pressure pylons v99
on:
  push:
    branches: [new-player-glb-overhaul]
    paths: ['.github/workflows/one-shot-finish-pressure-pylons-v99.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-player-glb-overhaul
          fetch-depth: 0
      - name: Patch real finish pressure pylons
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="const playerLamp=cyl(-1.15,.58,10.55,.28,1.05,0xffc84d),brainLamp=cyl(1.15,.58,10.55,.28,1.05,0x46b9ff);[playerLamp,brainLamp].forEach(l=>{l.material.emissive=new THREE.Color(l.material.color);l.material.emissiveIntensity=.55});"
          new="const FINAL_PRESSURE_PYLON_MODEL_V99=true;function makeFinishPressurePylon(x,c,label){const g=new THREE.Group();g.name=label+'FinishPressurePylonV99';g.position.set(x,0,10.55);const dark=mat(0x162039),accent=mat(c),white=mat(0xf5fbff);const base=new THREE.Mesh(new THREE.CylinderGeometry(.34,.42,.18,12),dark);base.name=label+'PylonBaseV99';base.position.y=.09;base.castShadow=base.receiveShadow=true;g.add(base);const core=new THREE.Mesh(new THREE.CapsuleGeometry(.15,.66,5,10),accent);core.name=label+'PylonCoreV99';core.position.y=.58;core.castShadow=core.receiveShadow=true;core.material.emissive=new THREE.Color(c);core.material.emissiveIntensity=.55;g.add(core);[.31,.72].forEach((y,i)=>{const ring=new THREE.Mesh(new THREE.TorusGeometry(.21,.045,7,14),white);ring.name=label+'PylonRingV99';ring.rotation.x=Math.PI/2;ring.position.y=y;ring.castShadow=true;ring.material.emissive=new THREE.Color(c);ring.material.emissiveIntensity=i?.82:.58;g.add(ring)});const crown=new THREE.Mesh(new THREE.OctahedronGeometry(.16,0),white);crown.name=label+'PylonCrownV99';crown.position.y=1.08;crown.castShadow=true;crown.material.emissive=new THREE.Color(c);crown.material.emissiveIntensity=1.05;g.add(crown);g.material=core.material;scene.add(g);return g}const playerLamp=makeFinishPressurePylon(-1.15,0xffc84d,'Player'),brainLamp=makeFinishPressurePylon(1.15,0x46b9ff,'Brainrot');"
          if old not in s: raise SystemExit('target pressure lamp block not found')
          s=s.replace(old,new,1)
          s=s.replace('full 3D route v98 · modeled pressure stations','full 3D route v99 · modeled pressure pylons',1)
          p.write_text(s)
          PY
      - name: v99 gameplay invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          req=['FINAL_PRESSURE_PYLON_MODEL_V99=true','FinishPressurePylonV99','PylonBaseV99','PylonCoreV99','PylonRingV99','PylonCrownV99',"g.material=core.material","setLamp(playerLamp,playerPressureStable","setLamp(brainLamp,brainPressureStable"]
          for x in req:
            assert x in s, x
          assert 'playerLamp=cyl(' not in s
          assert 'brainLamp=cyl(' not in s
          print('v99 finish pressure pylon invariants: PASS')
          PY
      - name: Browser module syntax check
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text()
          m=re.search(r'<script type="module">(.*)</script>',s,re.S)
          assert m
          body=m.group(1)
          body=re.sub(r"^import .*?;",'',body,count=2,flags=re.M)
          Path('/tmp/game-module.mjs').write_text(body)
          PY
          node --check /tmp/game-module.mjs
      - name: Existing finish gameplay contract
        run: node scripts/final-finish-charge-check.mjs
      - name: Diff check
        run: git diff --check
      - name: Commit gameplay change
        run: |
          git config user.name 'amazin20'
          git config user.email '138931938+amazin20@users.noreply.github.com'
          git add index.html
          git commit -m 'Model finish pressure pylons v99'
          git push origin HEAD:new-player-glb-overhaul
