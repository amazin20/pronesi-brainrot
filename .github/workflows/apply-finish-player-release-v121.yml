name: Apply Finish Player Release v121

on:
  push:
    branches: [new-player-glb-overhaul]
    paths:
      - .github/workflows/apply-finish-player-release-v121.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-player-glb-overhaul
          fetch-depth: 0
      - name: Refuse stale/non-linear apply
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin new-player-glb-overhaul
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/new-player-glb-overhaul)"
      - name: Add physical post-finish player release v121
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          if 'FINISH_PLAYER_RELEASE_V121=true' in s:
              raise SystemExit('v121 already present')

          refs_anchor="const FINISH_VICTORY_STATE_V120=true,FINISH_VICTORY_CAMERA_TIME=2.6,FINISH_VICTORY_ORBIT_RADIUS=4.45;"
          if refs_anchor not in s:
              raise SystemExit('v120 victory anchor missing')
          refs="const FINISH_PLAYER_RELEASE_V121=true,FINISH_PLAYER_RELEASE_TIME=.95;const finishPlayerReleaseTarget=new THREE.Vector3(-1.15,0,11.62);"
          s=s.replace(refs_anchor,refs_anchor+refs,1)

          state_anchor="finalGauntletCleared=false,finalRecoveryTimer=0,finishCharge=0,finishBrainrotDock=0,finishVictoryTime=0;"
          if state_anchor not in s:
              raise SystemExit('v120 runtime state anchor missing')
          s=s.replace(state_anchor,"finalGauntletCleared=false,finalRecoveryTimer=0,finishCharge=0,finishBrainrotDock=0,finishVictoryTime=0,finishPlayerRelease=0;",1)

          reset_anchor="finalGauntletCleared=false;finalRecoveryTimer=0;finishCharge=0;finishBrainrotDock=0;finishVictoryTime=0;if(br){br.scale.setScalar(1);br.rotation.x=0;br.rotation.z=0}"
          if reset_anchor not in s:
              raise SystemExit('v120 reset anchor missing')
          s=s.replace(reset_anchor,"finalGauntletCleared=false;finalRecoveryTimer=0;finishCharge=0;finishBrainrotDock=0;finishVictoryTime=0;finishPlayerRelease=0;if(br){br.scale.setScalar(1);br.rotation.x=0;br.rotation.z=0}",1)

          gate_anchor="const chargeGateTarget=win?FINAL_CHARGE_GATE_OPEN_Y:FINAL_CHARGE_GATE_CLOSED_Y,chargeGateStep=4.8*dt;"
          if gate_anchor not in s:
              raise SystemExit('v120 charge gate target anchor missing')
          gate_runtime="const finishGateCanSeal=win&&finishPlayerRelease>=1&&p.z>FINAL_CHARGE_GATE_Z+.46;const chargeGateTarget=win&&!finishGateCanSeal?FINAL_CHARGE_GATE_OPEN_Y:FINAL_CHARGE_GATE_CLOSED_Y,chargeGateStep=4.8*dt;"
          s=s.replace(gate_anchor,gate_runtime,1)

          victory_text="done.textContent=victoryDone?'ДОСТАВЛЕНО! 🧠✨':'ФИКСИРУЕМ БРЕЙНРОТ…';state.textContent=victoryDone?'МАРШРУТ ЗАВЕРШЁН · БРЕЙНРОТ ЗАФИКСИРОВАН':'ФИНИШ · ФИКСАЦИЯ ДОСТАВКИ';"
          if victory_text not in s:
              raise SystemExit('v120 victory status anchor missing')
          release_runtime="""if(victoryDone){finishPlayerRelease=Math.min(1,finishPlayerRelease+dt/FINISH_PLAYER_RELEASE_TIME);const releaseAlpha=1-Math.exp(-6.5*dt);p.lerp(finishPlayerReleaseTarget,releaseAlpha);p.y=0;vy=0;on=true;playerMomentumX=0;playerMomentumZ=0;const releaseYaw=Math.atan2(-p.x,10.20-p.z),releaseYawDelta=((releaseYaw-yaw+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI;yaw+=releaseYawDelta*Math.min(1,dt*5.5);if(finishPlayerRelease>=1){p.copy(finishPlayerReleaseTarget);pr.position.copy(p);pr.rotation.y=yaw}}const releaseComplete=victoryDone&&finishPlayerRelease>=1&&p.z>FINAL_CHARGE_GATE_Z+.46;done.textContent=!victoryDone?'ФИКСИРУЕМ БРЕЙНРОТ…':(releaseComplete?'ДОСТАВЛЕНО! 🧠✨':'ВЫХОД ИЗ ШЛЮЗА…');state.textContent=!victoryDone?'ФИНИШ · ФИКСАЦИЯ ДОСТАВКИ':(releaseComplete?'МАРШРУТ ЗАВЕРШЁН · ШЛЮЗ ЗАКРЫВАЕТСЯ':'ФИНИШ · БЕЗОПАСНЫЙ ВЫХОД ИГРОКА');"""
          s=s.replace(victory_text,release_runtime,1)

          p.write_text(s)
      - name: Verify v121 release runtime and preserved finish physics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          required=[
            "FINISH_PLAYER_RELEASE_V121=true",
            "FINISH_PLAYER_RELEASE_TIME=.95",
            "finishPlayerReleaseTarget=new THREE.Vector3(-1.15,0,11.62)",
            "finishPlayerRelease=0",
            "finishPlayerRelease=Math.min(1,finishPlayerRelease+dt/FINISH_PLAYER_RELEASE_TIME)",
            "finishGateCanSeal=win&&finishPlayerRelease>=1&&p.z>FINAL_CHARGE_GATE_Z+.46",
            "win&&!finishGateCanSeal?FINAL_CHARGE_GATE_OPEN_Y:FINAL_CHARGE_GATE_CLOSED_Y",
            "p.lerp(finishPlayerReleaseTarget,releaseAlpha)",
            "playerMomentumX=0;playerMomentumZ=0",
            "ФИНИШ · БЕЗОПАСНЫЙ ВЫХОД ИГРОКА",
            "МАРШРУТ ЗАВЕРШЁН · ШЛЮЗ ЗАКРЫВАЕТСЯ",
            "FINISH_VICTORY_STATE_V120=true",
            "FINISH_BRAINROT_DOCK_V119=true",
            "FINAL_FINISH_CHARGE=.55"
          ]
          for token in required:
            assert token in s, token
          assert s.count('FINISH_PLAYER_RELEASE_V121=true')==1
          assert s.count('finishGateCanSeal=')==1
          print('Finish Player Release v121 contract: SUCCESS')
          PY
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          m=re.search(r'<script type="module">(.*?)</script>',s,re.S)
          assert m, 'module script not found'
          Path('/tmp/brainrot-module.mjs').write_text(m.group(1))
          PY
          node --check /tmp/brainrot-module.mjs
          node scripts/final-puncher-physics-contract-v65.mjs
          node scripts/final-finish-residual-momentum-check.mjs
          node scripts/final-finish-soft-hold-check.mjs
          node scripts/final-finish-charge-check.mjs
      - name: Commit real level change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "openai-level-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && { echo 'No gameplay change produced'; exit 1; }
          git commit -m "Level: add finish player release v121"
          git push origin HEAD:new-player-glb-overhaul
