name: Final puncher containment rails v54
on:
  push:
    branches: [new-player-glb-overhaul]
    paths: ['.github/workflows/final-puncher-timing-gate-v54.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-player-glb-overhaul
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extend real physical final-gauntlet rails
        run: |
          python3 -c "import base64;exec(base64.b64decode(''))"
      - name: Verify gameplay collision corridor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          assert 'full 3D lift route v54 · final puncher containment rails' in s
          assert 'FINAL_GAUNTLET_APPROACH_Z_MAX=8.92' in s
          assert 'inFinalGauntletApproachRail' in s
          assert 'if(inFinalGauntletApproachRail(x,z,.4))return true' in s
          assert 'if(inFinalGauntletApproachRail(x,z,r))return true' in s
          print('final puncher physical containment corridor: PASS')
          PY
      - name: Syntax check exact browser module
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          a=s.index('<script type="module">')+len('<script type="module">')
          b=s.index('</script>',a)
          Path('/tmp/runtime.mjs').write_text(s[a:b])
          PY
          node --check /tmp/runtime.mjs
      - name: Commit gameplay change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 1
          git commit -m "Extend physical rails through final puncher gauntlet"
          git push origin HEAD:new-player-glb-overhaul
