name: Final puncher timing gate v54
on:
  push:
    branches: [new-player-glb-overhaul]
    paths: ['.github/workflows/final-puncher-timing-gate-v54.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-player-glb-overhaul
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply real gameplay patch
        run: |
          python3 -c "import base64;exec(base64.b64decode(''))"
      - name: Verify timing gate gameplay invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          checks=[
            'full 3D lift route v54 · final puncher timing gate',
            'FINAL_GAUNTLET_GATE_Z=7.34',
            'finalGauntletTimingGateBlocks',
            'finalGauntletGateCrossing',
            "state.textContent='ФИНАЛ · ЖДИ ЗЕЛЁНЫЕ ВОРОТА'",
            "state.textContent='ФИНАЛ · ВОРОТА ЗАЩЁЛКНУТЫ · НЕ ОСТАНАВЛИВАЙСЯ'",
            'const active=checkpoint&&!finalGauntletCleared&&!finalGauntletGateCrossing'
          ]
          for c in checks:
              assert c in s, c
          assert s.count('finalGauntletTimingGateBlocks(x,z,.4)') == 1
          assert s.count('finalGauntletTimingGateBlocks(x,z,r,LIFT_GATE_BRAIN_TOP)') == 1
          print('final puncher timing gate invariants: PASS')
          PY
      - name: Syntax check exact browser module
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          a=s.index('<script type="module">')+len('<script type="module">')
          b=s.index('</script>',a)
          Path('/tmp/runtime.mjs').write_text(s[a:b])
          PY
          node --check /tmp/runtime.mjs
      - name: Commit gameplay change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 1
          git commit -m "Add timed safety gate to final puncher gauntlet"
          git push origin HEAD:new-player-glb-overhaul
