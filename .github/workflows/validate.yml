name: Validate overhaul game

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static, geometry and physics regression
        run: npm run check
      - name: Start local game server
        run: |
          python3 -m http.server 8080 > /tmp/pronesi-server.log 2>&1 &
          echo $! > /tmp/pronesi-server.pid
          sleep 1
      - name: Browser behavior QA
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          mkdir -p qa-artifacts
          COMMON="--headless=new --no-sandbox --disable-dev-shm-usage --enable-webgl --ignore-gpu-blocklist --use-angle=swiftshader"
          "$CHROME" $COMMON --virtual-time-budget=12000 --window-size=1440,900 --dump-dom "http://127.0.0.1:8080/?qa=1" > qa-artifacts/qa-dom-desktop.html
          grep -q 'data-qa="pass"' qa-artifacts/qa-dom-desktop.html
          "$CHROME" $COMMON --virtual-time-budget=6000 --window-size=1440,900 --screenshot=qa-artifacts/game-desktop.png "http://127.0.0.1:8080/?qa=1"
          "$CHROME" $COMMON --virtual-time-budget=12000 --window-size=430,932 --dump-dom "http://127.0.0.1:8080/?qa=1&mobile=1" > qa-artifacts/qa-dom-mobile.html
          grep -q 'data-qa="pass"' qa-artifacts/qa-dom-mobile.html
          "$CHROME" $COMMON --virtual-time-budget=6000 --window-size=430,932 --screenshot=qa-artifacts/game-mobile.png "http://127.0.0.1:8080/?qa=1&mobile=1"
          "$CHROME" $COMMON --virtual-time-budget=10000 --window-size=1440,900 --dump-dom "http://127.0.0.1:8080/?freshqa=1" > qa-artifacts/fresh-demo-dom.html
          grep -q 'data-fresh-qa="pass"' qa-artifacts/fresh-demo-dom.html
          "$CHROME" $COMMON --virtual-time-budget=6000 --window-size=1440,900 --screenshot=qa-artifacts/fresh-demo-desktop.png "http://127.0.0.1:8080/?freshqa=1"
      - name: Upload browser QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: overhaul-browser-qa
          path: qa-artifacts/
          if-no-files-found: warn
