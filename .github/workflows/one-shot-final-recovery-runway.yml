name: One-shot charged finish portal
on:
  push:
    branches: [new-player-glb-overhaul]
    paths: ['.github/workflows/one-shot-final-recovery-runway.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-player-glb-overhaul
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch charged finish portal gameplay
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('full 3D lift route v28 · final recovery runway','full 3D lift route v29 · charged finish portal',1)
          old="const FINAL_RECOVERY_Z_MIN=8.92,FINAL_RECOVERY_Z_MAX=9.62,FINAL_RECOVERY_GRACE=.72;"
          new=old+"const FINAL_FINISH_CHARGE=.55;"
          assert old in s
          s=s.replace(old,new,1)
          anchor="const finish=box(0,.1,10,7.35,.2,1.9,0x49ff79);"
          insert="const finishChargePad=box(0,.17,10.46,4.8,.055,.52,0xffffff);finishChargePad.material.emissive=new THREE.Color(0x49ff79);finishChargePad.material.emissiveIntensity=.18;"+anchor
          assert anchor in s
          s=s.replace(anchor,insert,1)
          old_state="finalGauntletCleared=false,finalRecoveryTimer=0;"
          new_state="finalGauntletCleared=false,finalRecoveryTimer=0,finishCharge=0;"
          assert old_state in s
          s=s.replace(old_state,new_state,1)
          old_reset="checkpointBrainrotLatched=false;finalGauntletCleared=false;finalRecoveryTimer=0;"
          new_reset="checkpointBrainrotLatched=false;finalGauntletCleared=false;finalRecoveryTimer=0;finishCharge=0;"
          assert old_reset in s
          s=s.replace(old_reset,new_reset,1)
          old_finish="const bothInFinish=playerInFinish&&brainrotInFinish;finish.material.emissiveIntensity=bothInFinish?1.7:((playerInFinish||brainrotInFinish)?0.75:0.35);finishArchTop.material.color.setHex(bothInFinish?0x49ff79:0xffffff);if(!win&&bothInFinish){win=true;carry=false;done.classList.add('on');state.textContent='ДОСТАВЛЕН'}else if(!win&&failTimer<=0&&brainrotInFinish&&!playerInFinish)state.textContent='ИГРОК: НЕ ДОШЁЛ';else if(!win&&failTimer<=0&&playerInFinish&&!brainrotInFinish)state.textContent='БРЕЙНРОТ: НЕ ДОШЁЛ';"
          new_finish="const bothInFinish=playerInFinish&&brainrotInFinish;finishCharge=bothInFinish?Math.min(FINAL_FINISH_CHARGE,finishCharge+dt):Math.max(0,finishCharge-dt*2.4);const finishProgress=finishCharge/FINAL_FINISH_CHARGE,finishCharging=bothInFinish&&finishProgress<1;finish.material.emissiveIntensity=.35+finishProgress*1.35+(playerInFinish||brainrotInFinish?.28:0);finishChargePad.scale.x=.18+.82*finishProgress;finishChargePad.material.emissiveIntensity=.18+finishProgress*2.1;finishChargePad.material.color.setHex(finishProgress>=1?0x49ff79:(finishCharging?0xfff36a:0xffffff));finishArchTop.material.color.setHex(finishProgress>=1?0x49ff79:(finishCharging?0xfff36a:0xffffff));finishArchTop.material.emissive.setHex(finishCharging?0xffa928:(finishProgress>=1?0x19b24e:0x000000));finishArchTop.material.emissiveIntensity=finishCharging?.7+1.0*(.5+.5*Math.sin(t*18)):(finishProgress>=1?1.25:0);if(!win&&finishProgress>=1){win=true;carry=false;done.classList.add('on');state.textContent='ДОСТАВЛЕН'}else if(!win&&finishCharging&&failTimer<=0)state.textContent='ФИНИШ · УДЕРЖИ '+Math.ceil((FINAL_FINISH_CHARGE-finishCharge)*10)/10+'с';else if(!win&&failTimer<=0&&brainrotInFinish&&!playerInFinish)state.textContent='ИГРОК: НЕ ДОШЁЛ';else if(!win&&failTimer<=0&&playerInFinish&&!brainrotInFinish)state.textContent='БРЕЙНРОТ: НЕ ДОШЁЛ';"
          assert old_finish in s
          s=s.replace(old_finish,new_finish,1)
          p.write_text(s)
          PY
      - name: Verify runtime syntax and finish invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          checks=[
            'full 3D lift route v29 · charged finish portal',
            'FINAL_FINISH_CHARGE=.55',
            'finishChargePad=box(',
            'finishCharge=bothInFinish?',
            'finishProgress=finishCharge/FINAL_FINISH_CHARGE',
            "state.textContent='ФИНИШ · УДЕРЖИ '",
            'if(!win&&finishProgress>=1)'
          ]
          for x in checks: assert x in s, x
          start=s.index('<script type="module">')+len('<script type="module">')
          end=s.index('</script>',start)
          Path('/tmp/game.mjs').write_text(s[start:end])
          print('charged finish portal invariants PASS')
          PY
          node --check /tmp/game.mjs
      - name: Commit gameplay change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Require stable charge inside finish portal'
          git push origin HEAD:new-player-glb-overhaul
