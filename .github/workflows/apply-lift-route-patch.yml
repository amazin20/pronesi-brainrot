name: Apply lift route gameplay patch

on:
  push:
    branches: [new-player-glb-overhaul]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-player-glb-overhaul
          fetch-depth: 1
      - name: Patch real lift approach gameplay
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          repl={
            'full 3D lift sweep v10':'full 3D lift route v11',
            'LIFT_HALF_X=1.45,LIFT_HALF_Z=.48':'LIFT_HALF_X=1.65,LIFT_HALF_Z=.62',
            "const blocks=[[-2.2,-16],[2.1,-11],[-2.1,-6],[2.1,-1],[-2.1,4]]":"const blocks=[[-3.05,-16],[3.05,-11],[-2.1,-6],[2.1,-1],[-2.1,4]]",
            "const cylinders=[[2,-18],[-2,-13],[2,-8],[-2,-3],[2,2]]":"const cylinders=[[3.15,-18],[-3.15,-13],[2,-8],[-2,-3],[2,2]]"
          }
          for old,new in repl.items():
            if old not in s: raise SystemExit(f'missing expected source: {old}')
            s=s.replace(old,new,1)
          marker="[-1,1].forEach(s=>{const rail=box(s*2.05,1.1,LIFT_Z,.16,2.7,.16,0x6bf5ff);rail.material.emissive=new THREE.Color(0x168faa);rail.material.emissiveIntensity=.9});"
          if marker not in s: raise SystemExit('lift rail marker missing')
          add=marker+"const liftApproach=box(0,.035,LIFT_Z-1.18,3.25,.07,.72,0x45f4ff),liftExit=box(0,.035,LIFT_Z+1.18,3.25,.07,.72,0x49ff79);[liftApproach,liftExit].forEach((o,i)=>{o.material.emissive=new THREE.Color(i?0x19b24e:0x0e98bd);o.material.emissiveIntensity=1.05});"
          s=s.replace(marker,add,1)
          p.write_text(s)
          PY
          git rm .github/workflows/apply-lift-route-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Open lift approach and widen boarding platform"
          git push origin HEAD:new-player-glb-overhaul
