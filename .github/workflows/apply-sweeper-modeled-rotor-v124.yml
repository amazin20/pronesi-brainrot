name: Apply Sweeper Modeled Rotor v124

on:
  push:
    branches: [new-player-glb-overhaul]
    paths:
      - .github/workflows/apply-sweeper-modeled-rotor-v124.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-player-glb-overhaul
          fetch-depth: 0
      - name: Refuse stale/non-linear apply
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin new-player-glb-overhaul
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/new-player-glb-overhaul)"
      - name: Replace temporary sweeper visuals with modeled rotor assemblies v124
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          if 'SWEEPER_VISUAL_MODEL_V124=true' in s:
              raise SystemExit('v124 already present')
          anchor='const FIRST_SWEEPER_TRIGGER_Z=-12.45'
          if anchor not in s:
              raise SystemExit('sweeper gameplay anchor missing')
          modeled="""const SWEEPER_VISUAL_MODEL_V124=true;const sweeperVisuals=[];function upgradeSweeperRotorV124(sweep,i){const legacy=sweep.children.slice();legacy.forEach(o=>{if(!o.isMesh||!o.material)return;o.name='SweeperLegacyCollisionCarrierV124';o.material.transparent=true;o.material.opacity=.035;o.material.depthWrite=false});const accent=mat(i?0x44e7ff:0xffb12b),danger=mat(0xff315d),dark=mat(0x171d38),white=mat(0xf5fbff);accent.metalness=.34;accent.roughness=.24;danger.metalness=.28;danger.roughness=.27;dark.metalness=.46;dark.roughness=.30;const rotor=new THREE.Group();rotor.name=i?'SecondSweeperRotorAssemblyV124':'FirstSweeperRotorAssemblyV124';const hubShell=new THREE.Mesh(new THREE.CylinderGeometry(.47,.58,.72,12),dark);hubShell.name='SweeperRotorHubShellV124';hubShell.rotation.x=Math.PI/2;hubShell.castShadow=hubShell.receiveShadow=true;rotor.add(hubShell);const hubRing=new THREE.Mesh(new THREE.TorusGeometry(.58,.09,7,16),accent);hubRing.name='SweeperRotorHubRingV124';hubRing.rotation.x=Math.PI/2;hubRing.castShadow=true;hubRing.material.emissive=new THREE.Color(i?0x087fa8:0xa95a00);hubRing.material.emissiveIntensity=.86;rotor.add(hubRing);[-2.65,-1.75,-.88,0,.88,1.75,2.65].forEach((x,k)=>{if(k!==3){const beam=new THREE.Mesh(new THREE.BoxGeometry(.72,.18,.24),k%2?dark:danger);beam.name='SweeperRotorArmPanelV124';beam.position.set(x,0,0);beam.castShadow=beam.receiveShadow=true;beam.material.emissive=new THREE.Color(k%2?0x12172f:0xa20d38);beam.material.emissiveIntensity=k%2?.18:.62;rotor.add(beam)}const brace=new THREE.Mesh(new THREE.CylinderGeometry(.045,.065,.52,6),white);brace.name='SweeperRotorArmBraceV124';brace.rotation.x=Math.PI/2;brace.position.set(x,.02,0);brace.castShadow=brace.receiveShadow=true;rotor.add(brace)});[-3.22,3.22].forEach((x,k)=>{const cage=new THREE.Mesh(new THREE.CylinderGeometry(.35,.42,.62,10),dark);cage.name='SweeperImpactPodV124';cage.rotation.z=Math.PI/2;cage.position.set(x,0,0);cage.castShadow=cage.receiveShadow=true;rotor.add(cage);const bumper=new THREE.Mesh(new THREE.TorusGeometry(.42,.10,7,14),k?accent:danger);bumper.name='SweeperImpactBumperRingV124';bumper.rotation.y=Math.PI/2;bumper.position.set(x,0,0);bumper.castShadow=true;bumper.material.emissive=new THREE.Color(k?(i?0x44e7ff:0xffb12b):0xff315d);bumper.material.emissiveIntensity=1.05;rotor.add(bumper);const cap=new THREE.Mesh(new THREE.OctahedronGeometry(.18,0),white);cap.name='SweeperImpactBeaconV124';cap.position.set(x,.38,0);cap.castShadow=true;cap.material.emissive=new THREE.Color(k?(i?0x44e7ff:0xffb12b):0xff315d);cap.material.emissiveIntensity=1.0;rotor.add(cap)});[-1.72,1.72].forEach((x,k)=>{const ring=new THREE.Mesh(new THREE.TorusGeometry(.13,.032,6,10),white);ring.name='SweeperArmTimingRingV124';ring.rotation.y=Math.PI/2;ring.position.set(x,.18,0);ring.castShadow=true;ring.material.emissive=new THREE.Color(k?0x49ff79:(i?0x44e7ff:0xffb12b));ring.material.emissiveIntensity=.82;rotor.add(ring)});sweep.add(rotor);sweeperVisuals.push(rotor);return rotor}const firstSweeperRotorV124=upgradeSweeperRotorV124(sweeps[0],0),secondSweeperRotorV124=upgradeSweeperRotorV124(sweeps[1],1);"""
          s=s.replace(anchor,modeled+anchor,1)
          p.write_text(s)
      - name: Verify v124 modeled sweepers and preserved gameplay
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          required=[
            'SWEEPER_VISUAL_MODEL_V124=true',
            'FirstSweeperRotorAssemblyV124',
            'SecondSweeperRotorAssemblyV124',
            'SweeperRotorHubShellV124',
            'SweeperRotorHubRingV124',
            'SweeperRotorArmPanelV124',
            'SweeperRotorArmBraceV124',
            'SweeperImpactPodV124',
            'SweeperImpactBumperRingV124',
            'SweeperImpactBeaconV124',
            'SweeperArmTimingRingV124',
            "o.material.opacity=.035",
            'SWEEPER_ARC_STEP=.06',
            'SWEEPER_RADIUS=4.15',
            'FIRST_SWEEPER_BURST_SPEED=-2.65',
            'SECOND_SWEEPER_SPEED=2.45',
            'sweeperHit(s,w,from,to)'
          ]
          for token in required:
              assert token in s, token
          assert s.count('SWEEPER_VISUAL_MODEL_V124=true') == 1
          assert s.count('upgradeSweeperRotorV124(sweeps[0],0)') == 1
          assert s.count('upgradeSweeperRotorV124(sweeps[1],1)') == 1
          print('Sweeper modeled rotor v124 contract: SUCCESS')
          PY
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          m=re.search(r'<script type="module">(.*?)</script>',s,re.S)
          assert m, 'module script not found'
          Path('/tmp/brainrot-module.mjs').write_text(m.group(1))
          PY
          node --check /tmp/brainrot-module.mjs
          node scripts/final-puncher-physics-contract-v65.mjs
          node scripts/final-finish-residual-momentum-check.mjs
          node scripts/final-finish-soft-hold-check.mjs
          node scripts/final-finish-charge-check.mjs
      - name: Commit real level change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "openai-level-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && { echo 'No gameplay change produced'; exit 1; }
          git commit -m "Level: model sweeper rotor assemblies v124"
          git push origin HEAD:new-player-glb-overhaul
