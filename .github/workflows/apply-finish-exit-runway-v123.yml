name: Apply Finish Exit Runway v123

on:
  push:
    branches: [new-player-glb-overhaul]
    paths:
      - .github/workflows/apply-finish-exit-runway-v123.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-player-glb-overhaul
          fetch-depth: 0
      - name: Refuse stale/non-linear apply
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin new-player-glb-overhaul
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/new-player-glb-overhaul)"
      - name: Add modeled post-finish exit runway v123
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          if 'FINISH_EXIT_RUNWAY_MODEL_V123=true' in s:
              raise SystemExit('v123 already present')
          anchor="[-.62,0,.62].forEach((x,i)=>{const ring=new THREE.Mesh(new THREE.TorusGeometry(.105,.026,6,10),finishSafeWhite);ring.name='FinishSafeBayGuideRingV122';ring.rotation.x=Math.PI/2;ring.position.set(x,.12,.20);ring.castShadow=true;ring.material.emissive=new THREE.Color(i===1?0xffffff:0x49ff79);ring.material.emissiveIntensity=i===1?.92:.72;finishSafeBay.add(ring)});"
          if anchor not in s:
              raise SystemExit('v122 safe bay anchor missing')
          runway="""const FINISH_EXIT_RUNWAY_MODEL_V123=true,FINISH_EXIT_RUNWAY_Z_MIN=12.34,FINISH_EXIT_RUNWAY_Z_MAX=12.96,FINISH_EXIT_RUNWAY_HALF_X=1.18;const finishExitRunway=box(-1.15,.026,(FINISH_EXIT_RUNWAY_Z_MIN+FINISH_EXIT_RUNWAY_Z_MAX)*.5,FINISH_EXIT_RUNWAY_HALF_X*2,.052,FINISH_EXIT_RUNWAY_Z_MAX-FINISH_EXIT_RUNWAY_Z_MIN,0x44e7ff);finishExitRunway.name='FinishExitRunwayCollisionPadV123';finishExitRunway.material.transparent=true;finishExitRunway.material.opacity=.035;finishExitRunway.material.depthWrite=false;finishExitRunway.material.emissive=new THREE.Color(0x087fa8);finishExitRunway.material.emissiveIntensity=.12;const finishExitCyan=mat(0x44e7ff),finishExitDark=mat(0x17273f),finishExitWhite=mat(0xf1fdff),finishExitGreen=mat(0x49ff79);finishExitCyan.metalness=.32;finishExitCyan.roughness=.25;[-.90,-.60,-.30,0,.30,.60,.90].forEach((x,i)=>{const slat=new THREE.Mesh(new THREE.BoxGeometry(.24,.065,.50),i===3?finishExitWhite:finishExitCyan);slat.name='FinishExitRunwaySlatV123';slat.position.set(x,.068,0);slat.castShadow=slat.receiveShadow=true;slat.material.emissive=new THREE.Color(i===3?0xffffff:0x087fa8);slat.material.emissiveIntensity=i===3?.90:.46;finishExitRunway.add(slat)});[-1,1].forEach((side,i)=>{const rail=new THREE.Mesh(new THREE.CapsuleGeometry(.035,.48,4,8),finishExitWhite);rail.name='FinishExitRunwayEdgeRailV123';rail.rotation.x=Math.PI/2;rail.position.set(side*1.02,.16,0);rail.castShadow=rail.receiveShadow=true;rail.material.emissive=new THREE.Color(i?0x49ff79:0x44e7ff);rail.material.emissiveIntensity=.68;finishExitRunway.add(rail);const bumper=new THREE.Mesh(new THREE.CylinderGeometry(.09,.13,.28,8),finishExitDark);bumper.name='FinishExitRunwayBumperV123';bumper.rotation.z=Math.PI/2;bumper.position.set(side*1.08,.09,.18);bumper.castShadow=bumper.receiveShadow=true;finishExitRunway.add(bumper);const beacon=new THREE.Mesh(new THREE.TorusGeometry(.12,.03,6,10),i?finishExitGreen:finishExitWhite);beacon.name='FinishExitRunwayBeaconV123';beacon.rotation.y=Math.PI/2;beacon.position.set(side*1.08,.13,.18);beacon.castShadow=true;beacon.material.emissive=new THREE.Color(i?0x49ff79:0x44e7ff);beacon.material.emissiveIntensity=.95;finishExitRunway.add(beacon)});[-.66,0,.66].forEach((x,i)=>{const ring=new THREE.Mesh(new THREE.TorusGeometry(.10,.025,6,10),finishExitWhite);ring.name='FinishExitRunwayGuideRingV123';ring.rotation.x=Math.PI/2;ring.position.set(x,.11,.05);ring.castShadow=true;ring.material.emissive=new THREE.Color(i===1?0xffffff:0x44e7ff);ring.material.emissiveIntensity=i===1?.95:.72;finishExitRunway.add(ring)});"""
          s=s.replace(anchor,anchor+runway,1)
          p.write_text(s)
      - name: Verify v123 modeled exit runway and preserved gameplay
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          required=[
            "FINISH_EXIT_RUNWAY_MODEL_V123=true",
            "FINISH_EXIT_RUNWAY_Z_MIN=12.34",
            "FINISH_EXIT_RUNWAY_Z_MAX=12.96",
            "FinishExitRunwayCollisionPadV123",
            "FinishExitRunwaySlatV123",
            "FinishExitRunwayEdgeRailV123",
            "FinishExitRunwayBumperV123",
            "FinishExitRunwayBeaconV123",
            "FinishExitRunwayGuideRingV123",
            "finishExitRunway.material.opacity=.035",
            "finishPlayerReleaseTarget=new THREE.Vector3(-1.15,0,11.62)",
            "FINISH_SAFE_BAY_MODEL_V122=true",
            "FINAL_FINISH_CHARGE=.55"
          ]
          for token in required:
            assert token in s, token
          assert s.count('FINISH_EXIT_RUNWAY_MODEL_V123=true')==1
          assert s.count("FinishExitRunwayCollisionPadV123")==1
          print('Finish Exit Runway v123 contract: SUCCESS')
          PY
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          m=re.search(r'<script type="module">(.*?)</script>',s,re.S)
          assert m, 'module script not found'
          Path('/tmp/brainrot-module.mjs').write_text(m.group(1))
          PY
          node --check /tmp/brainrot-module.mjs
          node scripts/final-puncher-physics-contract-v65.mjs
          node scripts/final-finish-residual-momentum-check.mjs
          node scripts/final-finish-soft-hold-check.mjs
          node scripts/final-finish-charge-check.mjs
      - name: Commit real level change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "openai-level-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && { echo 'No gameplay change produced'; exit 1; }
          git commit -m "Level: model finish exit runway v123"
          git push origin HEAD:new-player-glb-overhaul
