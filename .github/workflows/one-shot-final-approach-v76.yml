name: One-shot Final Approach V76

on:
  push:
    branches: [new-player-glb-overhaul]
    paths:
      - '.github/workflows/one-shot-final-approach-v76.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-final-approach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-player-glb-overhaul
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch final gauntlet approach to modeled guards v76
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="const FINAL_GAUNTLET_APPROACH_Z_MIN=6.72,FINAL_GAUNTLET_APPROACH_Z_MAX=8.92,FINAL_GAUNTLET_APPROACH_HALF_X=1.55;const finalGauntletApproachPad=box(0,.03,(FINAL_GAUNTLET_APPROACH_Z_MIN+FINAL_GAUNTLET_APPROACH_Z_MAX)*.5,FINAL_GAUNTLET_APPROACH_HALF_X*2,.06,FINAL_GAUNTLET_APPROACH_Z_MAX-FINAL_GAUNTLET_APPROACH_Z_MIN,0xffd84d),finalGauntletApproachL=box(-FINAL_GAUNTLET_APPROACH_HALF_X-.11,.46,(FINAL_GAUNTLET_APPROACH_Z_MIN+FINAL_GAUNTLET_APPROACH_Z_MAX)*.5,.18,.92,FINAL_GAUNTLET_APPROACH_Z_MAX-FINAL_GAUNTLET_APPROACH_Z_MIN,0xffd84d),finalGauntletApproachR=box(FINAL_GAUNTLET_APPROACH_HALF_X+.11,.46,(FINAL_GAUNTLET_APPROACH_Z_MIN+FINAL_GAUNTLET_APPROACH_Z_MAX)*.5,.18,.92,FINAL_GAUNTLET_APPROACH_Z_MAX-FINAL_GAUNTLET_APPROACH_Z_MIN,0xffd84d);[finalGauntletApproachPad,finalGauntletApproachL,finalGauntletApproachR].forEach(o=>{o.material.emissive=new THREE.Color(0xa95a00);o.material.emissiveIntensity=.78});"
          new="const FINAL_GAUNTLET_APPROACH_Z_MIN=6.72,FINAL_GAUNTLET_APPROACH_Z_MAX=8.92,FINAL_GAUNTLET_APPROACH_HALF_X=1.55,FINAL_GAUNTLET_APPROACH_MODEL_V76=true;const finalGauntletApproachPad=box(0,.03,(FINAL_GAUNTLET_APPROACH_Z_MIN+FINAL_GAUNTLET_APPROACH_Z_MAX)*.5,FINAL_GAUNTLET_APPROACH_HALF_X*2,.06,FINAL_GAUNTLET_APPROACH_Z_MAX-FINAL_GAUNTLET_APPROACH_Z_MIN,0xffd84d);finalGauntletApproachPad.material.emissive=new THREE.Color(0xa95a00);finalGauntletApproachPad.material.emissiveIntensity=.78;function makeFinalGauntletApproachGuard(side){const g=new THREE.Group();g.name='FinalGauntletApproachGuardV76';g.position.set(side*(FINAL_GAUNTLET_APPROACH_HALF_X+.11),0,(FINAL_GAUNTLET_APPROACH_Z_MIN+FINAL_GAUNTLET_APPROACH_Z_MAX)*.5);const railMat=mat(0xffd84d),dark=mat(0x4b3515),white=mat(0xfff4c2);const rail=new THREE.Mesh(new THREE.CapsuleGeometry(.09,2.02,4,8),railMat);rail.name='FinalGauntletApproachRailV76';rail.rotation.x=Math.PI/2;rail.position.y=.46;rail.castShadow=rail.receiveShadow=true;rail.material.emissive=new THREE.Color(0xa95a00);rail.material.emissiveIntensity=.78;g.add(rail);[-.92,0,.92].forEach((z,i)=>{const post=new THREE.Mesh(new THREE.CylinderGeometry(.07,.10,.82,8),dark);post.name='FinalGauntletApproachPostV76';post.position.set(0,.39,z);post.castShadow=post.receiveShadow=true;g.add(post);const beacon=new THREE.Mesh(new THREE.TorusGeometry(.11,.028,6,10),white);beacon.name='FinalGauntletApproachBeaconV76';beacon.rotation.x=Math.PI/2;beacon.position.set(0,.82,z);beacon.castShadow=true;beacon.material.emissive=new THREE.Color(i===1?0xff557c:0xffb12b);beacon.material.emissiveIntensity=.9;g.add(beacon)});scene.add(g);return g}const finalGauntletApproachL=makeFinalGauntletApproachGuard(-1),finalGauntletApproachR=makeFinalGauntletApproachGuard(1);"
          if 'FINAL_GAUNTLET_APPROACH_MODEL_V76=true' in s:
              print('v76 already present')
              raise SystemExit(0)
          if old not in s:
              raise SystemExit('expected v75 final approach block not found')
          s=s.replace(old,new,1)
          s=s.replace('full 3D lift route v75 · modeled checkpoint gate','full 3D lift route v76 · modeled final approach',1)
          p.write_text(s)
          PY
      - name: Validate modeled approach invariants
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('index.html','utf8');
          const must=[
            'FINAL_GAUNTLET_APPROACH_MODEL_V76=true',
            "FinalGauntletApproachGuardV76",
            "FinalGauntletApproachRailV76",
            "FinalGauntletApproachPostV76",
            "FinalGauntletApproachBeaconV76",
            'function inFinalGauntletApproachRail(x,z,r=0)',
            'inFinalGauntletApproachRail(x,z,.4)',
            'inFinalGauntletApproachRail(x,z,r)'
          ];
          for(const token of must) if(!s.includes(token)) throw new Error('missing '+token);
          if(s.includes('finalGauntletApproachL=box(')||s.includes('finalGauntletApproachR=box(')) throw new Error('legacy box approach rail remains');
          console.log('FINAL_GAUNTLET_APPROACH_MODEL_V76 PASS');
          NODE
      - name: Syntax check browser module
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          a=s.index('<script type="module">')+len('<script type="module">')
          b=s.index('</script>',a)
          Path('/tmp/runtime-v76.mjs').write_text(s[a:b])
          PY
          node --check /tmp/runtime-v76.mjs
      - name: Run existing route contracts
        run: |
          node scripts/second-pit-route-continuity-v70.mjs
          node scripts/second-pit-platform-motion-v71.mjs
          node scripts/final-mid-pocket-v67-check.mjs
          node scripts/final-puncher-physics-contract-v65.mjs
      - name: Commit gameplay patch
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No gameplay diff to commit'
            exit 0
          fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Model final gauntlet approach guards v76'
          git push origin HEAD:new-player-glb-overhaul
