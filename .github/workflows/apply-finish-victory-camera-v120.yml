name: Apply Finish Victory Camera v120

on:
  push:
    branches: [new-player-glb-overhaul]
    paths:
      - .github/workflows/apply-finish-victory-camera-v120.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-player-glb-overhaul
          fetch-depth: 0
      - name: Refuse stale/non-linear apply
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin new-player-glb-overhaul
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/new-player-glb-overhaul)"
      - name: Add real post-finish victory state and camera v120
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          if 'FINISH_VICTORY_STATE_V120=true' in s:
              raise SystemExit('v120 already present')
          refs_anchor="const FINISH_BRAINROT_DOCK_V119=true,FINISH_BRAINROT_DOCK_TIME=.72;const finishBrainrotDockTarget=new THREE.Vector3(0,.34,10.20);"
          if refs_anchor not in s:
              raise SystemExit('v119 dock anchor missing')
          refs="const FINISH_VICTORY_STATE_V120=true,FINISH_VICTORY_CAMERA_TIME=2.6,FINISH_VICTORY_ORBIT_RADIUS=4.45;"
          s=s.replace(refs_anchor,refs_anchor+refs,1)
          state_anchor="finalGauntletCleared=false,finalRecoveryTimer=0,finishCharge=0,finishBrainrotDock=0;"
          if state_anchor not in s:
              raise SystemExit('v119 state anchor missing')
          s=s.replace(state_anchor,"finalGauntletCleared=false,finalRecoveryTimer=0,finishCharge=0,finishBrainrotDock=0,finishVictoryTime=0;",1)
          reset_anchor="finalGauntletCleared=false;finalRecoveryTimer=0;finishCharge=0;finishBrainrotDock=0;if(br){br.scale.setScalar(1);br.rotation.x=0;br.rotation.z=0}"
          if reset_anchor not in s:
              raise SystemExit('v119 reset anchor missing')
          s=s.replace(reset_anchor,"finalGauntletCleared=false;finalRecoveryTimer=0;finishCharge=0;finishBrainrotDock=0;finishVictoryTime=0;if(br){br.scale.setScalar(1);br.rotation.x=0;br.rotation.z=0}",1)
          dock_end="if(finishBrainrotDock>=1){bp.copy(finishBrainrotDockTarget);br.position.copy(bp);br.rotation.x=0;br.rotation.z=0;br.scale.setScalar(.88)}}"
          if dock_end not in s:
              raise SystemExit('v119 docking runtime anchor missing')
          victory_runtime="""finishVictoryTime+=dt;const victoryPulse=.5+.5*Math.sin(t*8.5),victoryDone=finishBrainrotDock>=1;finishDeliveryBeacons.forEach((beacon,i)=>{const wave=.5+.5*Math.sin(t*7.5-i*.75);beacon.material.color.setHex(0x49ff79);beacon.material.emissive.setHex(0x19b24e);beacon.material.emissiveIntensity=1.15+(victoryDone?.75:.35)*wave;beacon.scale.setScalar(1.02+(victoryDone?.12:.05)*wave)});[finishArchTop,finishArchL,finishArchR].forEach(o=>setEmissiveIntensityDeep(o,1.0+.75*victoryPulse));[finishRailL,finishRailR].forEach(o=>setEmissiveIntensityDeep(o,.82+.45*victoryPulse));[playerLamp,brainLamp].forEach(o=>{o.scale.y=1.02+.08*victoryPulse;setEmissiveIntensityDeep(o,1.1+.65*victoryPulse)});finalChargeGate.children.forEach(o=>{if(o.name==='FinalDeliveryGatePanelV116'||o.name==='FinalDeliveryGateHingeHaloV116'||o.name==='FinalDeliveryGateLockCoreV116')setEmissiveIntensityDeep(o,1.15+.8*victoryPulse)});done.textContent=victoryDone?'ДОСТАВЛЕНО! 🧠✨':'ФИКСИРУЕМ БРЕЙНРОТ…';state.textContent=victoryDone?'МАРШРУТ ЗАВЕРШЁН · БРЕЙНРОТ ЗАФИКСИРОВАН':'ФИНИШ · ФИКСАЦИЯ ДОСТАВКИ';"""
          s=s.replace(dock_end,dock_end+victory_runtime,1)
          camera_anchor="let f=new THREE.Vector3(Math.sin(yaw),0,Math.cos(yaw));cg.set(p.x,p.y+4,p.z).addScaledVector(f,-6.2);cam.position.lerp(cg,1-Math.exp(-5.5*dt));lg.set(p.x,p.y+1,p.z).addScaledVector(f,1.2);cam.lookAt(lg);ren.render(scene,cam)"
          if camera_anchor not in s:
              raise SystemExit('camera anchor missing')
          camera_runtime="""let f=new THREE.Vector3(Math.sin(yaw),0,Math.cos(yaw));if(win){const victoryU=Math.min(1,finishVictoryTime/FINISH_VICTORY_CAMERA_TIME),orbit=-.72+victoryU*1.18,orbitRadius=FINISH_VICTORY_ORBIT_RADIUS-.65*victoryU;cg.set(Math.sin(orbit)*orbitRadius,2.55+Math.sin(victoryU*Math.PI)*.55,10.20+Math.cos(orbit)*orbitRadius*.58);cam.position.lerp(cg,1-Math.exp(-3.8*dt));lg.set(0,.78,10.20);cam.lookAt(lg)}else{cg.set(p.x,p.y+4,p.z).addScaledVector(f,-6.2);cam.position.lerp(cg,1-Math.exp(-5.5*dt));lg.set(p.x,p.y+1,p.z).addScaledVector(f,1.2);cam.lookAt(lg)}ren.render(scene,cam)"""
          s=s.replace(camera_anchor,camera_runtime,1)
          p.write_text(s)
      - name: Verify v120 victory runtime and preserved finish physics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          required=[
            "FINISH_VICTORY_STATE_V120=true",
            "FINISH_VICTORY_CAMERA_TIME=2.6",
            "FINISH_VICTORY_ORBIT_RADIUS=4.45",
            "finishVictoryTime=0",
            "finishVictoryTime+=dt",
            "МАРШРУТ ЗАВЕРШЁН · БРЕЙНРОТ ЗАФИКСИРОВАН",
            "if(win){const victoryU=Math.min(1,finishVictoryTime/FINISH_VICTORY_CAMERA_TIME)",
            "cam.lookAt(lg)}else{cg.set(p.x,p.y+4,p.z)",
            "FINISH_BRAINROT_DOCK_V119=true",
            "FINAL_FINISH_CHARGE=.55"
          ]
          for token in required:
            assert token in s, token
          assert s.count('FINISH_VICTORY_STATE_V120=true')==1
          print('Finish Victory State v120 contract: SUCCESS')
          PY
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          m=re.search(r'<script type="module">(.*?)</script>',s,re.S)
          assert m, 'module script not found'
          Path('/tmp/brainrot-module.mjs').write_text(m.group(1))
          PY
          node --check /tmp/brainrot-module.mjs
          node scripts/final-puncher-physics-contract-v65.mjs
          node scripts/final-finish-residual-momentum-check.mjs
          node scripts/final-finish-soft-hold-check.mjs
          node scripts/final-finish-charge-check.mjs
      - name: Commit real level change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "openai-level-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && { echo 'No gameplay change produced'; exit 1; }
          git commit -m "Level: add finish victory runtime v120"
          git push origin HEAD:new-player-glb-overhaul
