name: One-shot Final Recovery Modeled V77 Retry

on:
  push:
    branches: [new-player-glb-overhaul]
    paths: ['.github/workflows/one-shot-final-recovery-modeled-v77-retry.yml']

permissions:
  contents: write

jobs:
  patch-check-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-player-glb-overhaul
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch final recovery v77
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          old="const finalRecoveryPad=box(0,.035,(FINAL_RECOVERY_Z_MIN+FINAL_RECOVERY_Z_MAX)*.5,5.8,.07,FINAL_RECOVERY_Z_MAX-FINAL_RECOVERY_Z_MIN,0x49ff79),finalRecoveryL=box(-2.72,.42,(FINAL_RECOVERY_Z_MIN+FINAL_RECOVERY_Z_MAX)*.5,.12,.84,FINAL_RECOVERY_Z_MAX-FINAL_RECOVERY_Z_MIN,0x49ff79),finalRecoveryR=box(2.72,.42,(FINAL_RECOVERY_Z_MIN+FINAL_RECOVERY_Z_MAX)*.5,.12,.84,FINAL_RECOVERY_Z_MAX-FINAL_RECOVERY_Z_MIN,0x49ff79);[finalRecoveryPad,finalRecoveryL,finalRecoveryR].forEach(o=>{o.material.emissive=new THREE.Color(0x159b43);o.material.emissiveIntensity=.72});"
          new="const FINAL_RECOVERY_MODEL_V77=true;const finalRecoveryPad=box(0,.035,(FINAL_RECOVERY_Z_MIN+FINAL_RECOVERY_Z_MAX)*.5,5.8,.07,FINAL_RECOVERY_Z_MAX-FINAL_RECOVERY_Z_MIN,0x49ff79);finalRecoveryPad.material.emissive=new THREE.Color(0x159b43);finalRecoveryPad.material.emissiveIntensity=.72;function makeFinalRecoveryGuard(side){const g=new THREE.Group();g.name='FinalRecoveryGuardV77';g.position.set(side*(FINAL_RECOVERY_HALF_X+.14),0,(FINAL_RECOVERY_Z_MIN+FINAL_RECOVERY_Z_MAX)*.5);const railMat=mat(0x49ff79),dark=mat(0x173a32),white=mat(0xeaffef);const rail=new THREE.Mesh(new THREE.CapsuleGeometry(.10,.52,4,8),railMat);rail.name='FinalRecoveryRailV77';rail.rotation.x=Math.PI/2;rail.position.y=.44;rail.castShadow=rail.receiveShadow=true;rail.material.emissive=new THREE.Color(0x159b43);rail.material.emissiveIntensity=.72;g.add(rail);[-.26,.26].forEach((z,i)=>{const post=new THREE.Mesh(new THREE.CylinderGeometry(.075,.105,.78,8),dark);post.name='FinalRecoveryPostV77';post.position.set(0,.37,z);post.castShadow=post.receiveShadow=true;g.add(post);const collar=new THREE.Mesh(new THREE.TorusGeometry(.115,.029,6,10),white);collar.name='FinalRecoveryBeaconV77';collar.rotation.x=Math.PI/2;collar.position.set(0,.79,z);collar.castShadow=true;collar.material.emissive=new THREE.Color(i?0x49ff79:0x8affc5);collar.material.emissiveIntensity=.85;g.add(collar)});scene.add(g);return g}const finalRecoveryL=makeFinalRecoveryGuard(-1),finalRecoveryR=makeFinalRecoveryGuard(1);"
          if old not in s: raise SystemExit('expected final recovery boxes not found')
          s=s.replace(old,new,1)
          s=s.replace('full 3D lift route v76 · modeled final approach','full 3D lift route v77 · modeled final recovery',1)
          p.write_text(s)
          PY
      - name: Verify modeled recovery and preserved gameplay constants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          for x in ['FINAL_RECOVERY_MODEL_V77=true',"FinalRecoveryGuardV77","FinalRecoveryRailV77","FinalRecoveryPostV77","FinalRecoveryBeaconV77",'FINAL_RECOVERY_Z_MIN=8.92','FINAL_RECOVERY_Z_MAX=9.62','FINAL_RECOVERY_HALF_X=2.58','FINAL_RECOVERY_GRACE=.72','function inFinalMidSafeRail','i===1&&midSafe']:
            if x not in s: raise SystemExit('missing '+x)
          if 'finalRecoveryL=box(-2.72,.42' in s: raise SystemExit('stale box recovery rail remains')
          print('FINAL_RECOVERY_MODELED_V77: PASS')
          PY
      - name: Browser module syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(); a=s.index('<script type="module">')+len('<script type="module">'); b=s.index('</script>',a); Path('/tmp/runtime.mjs').write_text(s[a:b])
          PY
          node --check /tmp/runtime.mjs
      - name: Relevant physics and finish contracts
        run: |
          node scripts/final-puncher-physics-contract-v65.mjs
          node scripts/final-finish-charge-check.mjs
          node scripts/final-finish-residual-momentum-check.mjs
          node scripts/final-finish-soft-hold-check.mjs
      - name: Diff whitespace check
        run: git diff --check
      - name: Commit gameplay geometry
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Model final recovery guardrails v77'
          git push origin HEAD:new-player-glb-overhaul
