name: Apply First Sweeper To Pit Connector v132

on:
  push:
    branches: [new-player-glb-overhaul]
    paths:
      - .github/workflows/apply-first-sweeper-to-pit-connector-v132.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-player-glb-overhaul
          fetch-depth: 0
      - name: Refuse stale/non-linear apply
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin new-player-glb-overhaul
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/new-player-glb-overhaul)"
      - name: Model first sweeper to pit connector v132
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          if 'FIRST_SWEEPER_TO_PIT_CONNECTOR_MODEL_V132=true' in s:
              raise SystemExit('v132 already present')
          old="const firstSweeperRecoveryL=makeFirstSweeperRecoveryGuard(-1),firstSweeperRecoveryR=makeFirstSweeperRecoveryGuard(1);const SECOND_SWEEPER_STAGING_PAD_MODEL_V129=true;"
          if old not in s:
              raise SystemExit('v132 anchor missing')
          new="""const firstSweeperRecoveryL=makeFirstSweeperRecoveryGuard(-1),firstSweeperRecoveryR=makeFirstSweeperRecoveryGuard(1);const FIRST_SWEEPER_TO_PIT_CONNECTOR_MODEL_V132=true,FIRST_SWEEPER_TO_PIT_Z_MIN=-6.88,FIRST_SWEEPER_TO_PIT_Z_MAX=-4.92,FIRST_SWEEPER_TO_PIT_HALF_X=1.72;const firstSweeperToPitCarrierV132=box(0,.024,(FIRST_SWEEPER_TO_PIT_Z_MIN+FIRST_SWEEPER_TO_PIT_Z_MAX)*.5,FIRST_SWEEPER_TO_PIT_HALF_X*2,.048,FIRST_SWEEPER_TO_PIT_Z_MAX-FIRST_SWEEPER_TO_PIT_Z_MIN,0x49ff79);firstSweeperToPitCarrierV132.name='FirstSweeperToPitLegacyCollisionCarrierV132';firstSweeperToPitCarrierV132.material.transparent=true;firstSweeperToPitCarrierV132.material.opacity=.03;firstSweeperToPitCarrierV132.material.depthWrite=false;firstSweeperToPitCarrierV132.material.emissive=new THREE.Color(0x159b43);firstSweeperToPitCarrierV132.material.emissiveIntensity=.12;const firstPitConnectorGreenV132=mat(0x49ff79),firstPitConnectorDarkV132=mat(0x142c28),firstPitConnectorWhiteV132=mat(0xf1fff6),firstPitConnectorAmberV132=mat(0xffd84d),firstPitConnectorCyanV132=mat(0x44e7ff);firstPitConnectorGreenV132.metalness=.30;firstPitConnectorGreenV132.roughness=.27;firstPitConnectorDarkV132.metalness=.48;firstPitConnectorDarkV132.roughness=.30;const firstPitConnectorSlatGeoV132=new THREE.BoxGeometry(2.92,.065,.20),firstPitConnectorRailGeoV132=new THREE.CapsuleGeometry(.04,1.68,4,8),firstPitConnectorRingGeoV132=new THREE.TorusGeometry(.11,.027,6,10),firstPitConnectorBraceGeoV132=new THREE.CylinderGeometry(.045,.065,2.84,8),firstPitConnectorBumperGeoV132=new THREE.CylinderGeometry(.10,.15,.30,8);[-.80,-.53,-.27,0,.27,.53,.80].forEach((z,i)=>{const slat=new THREE.Mesh(firstPitConnectorSlatGeoV132,i===3?firstPitConnectorWhiteV132:firstPitConnectorGreenV132);slat.name='FirstSweeperToPitSlatV132';slat.position.set(0,.070,z);slat.castShadow=slat.receiveShadow=true;slat.material.emissive=new THREE.Color(i===3?0xffffff:0x159b43);slat.material.emissiveIntensity=i===3?.88:.46;firstSweeperToPitCarrierV132.add(slat)});[-1.46,1.46].forEach((x,i)=>{const rail=new THREE.Mesh(firstPitConnectorRailGeoV132,firstPitConnectorWhiteV132);rail.name='FirstSweeperToPitEdgeRailV132';rail.rotation.x=Math.PI/2;rail.position.set(x,.17,0);rail.castShadow=rail.receiveShadow=true;rail.material.emissive=new THREE.Color(i?0x44e7ff:0x49ff79);rail.material.emissiveIntensity=.68;firstSweeperToPitCarrierV132.add(rail);const bumper=new THREE.Mesh(firstPitConnectorBumperGeoV132,firstPitConnectorDarkV132);bumper.name='FirstSweeperToPitBumperV132';bumper.rotation.z=Math.PI/2;bumper.position.set(x,.09,.74);bumper.castShadow=bumper.receiveShadow=true;firstSweeperToPitCarrierV132.add(bumper);const beacon=new THREE.Mesh(firstPitConnectorRingGeoV132,i?firstPitConnectorCyanV132:firstPitConnectorGreenV132);beacon.name='FirstSweeperToPitBeaconV132';beacon.rotation.y=Math.PI/2;beacon.position.set(x,.14,.74);beacon.castShadow=true;beacon.material.emissive=new THREE.Color(i?0x44e7ff:0x49ff79);beacon.material.emissiveIntensity=1.02;firstSweeperToPitCarrierV132.add(beacon)});[-.92,0,.92].forEach((x,i)=>{const brace=new THREE.Mesh(firstPitConnectorBraceGeoV132,firstPitConnectorDarkV132);brace.name='FirstSweeperToPitCrossBraceV132';brace.rotation.z=Math.PI/2;brace.position.set(x,.026,0);brace.scale.x=.58;brace.castShadow=brace.receiveShadow=true;firstSweeperToPitCarrierV132.add(brace);const ring=new THREE.Mesh(firstPitConnectorRingGeoV132,i===1?firstPitConnectorAmberV132:firstPitConnectorWhiteV132);ring.name='FirstSweeperToPitGuideRingV132';ring.rotation.x=Math.PI/2;ring.position.set(x,.12,.38);ring.castShadow=true;ring.material.emissive=new THREE.Color(i===1?0xffb12b:0x49ff79);ring.material.emissiveIntensity=i===1?1.08:.78;firstSweeperToPitCarrierV132.add(ring)});const firstPitLipV132=new THREE.Mesh(new THREE.CapsuleGeometry(.055,2.90,4,8),firstPitConnectorAmberV132);firstPitLipV132.name='FirstSweeperToPitWarningLipV132';firstPitLipV132.rotation.z=Math.PI/2;firstPitLipV132.position.set(0,.13,FIRST_SWEEPER_TO_PIT_Z_MAX-(FIRST_SWEEPER_TO_PIT_Z_MIN+FIRST_SWEEPER_TO_PIT_Z_MAX)*.5);firstPitLipV132.castShadow=firstPitLipV132.receiveShadow=true;firstPitLipV132.material.emissive=new THREE.Color(0xffb12b);firstPitLipV132.material.emissiveIntensity=.95;firstSweeperToPitCarrierV132.add(firstPitLipV132);const SECOND_SWEEPER_STAGING_PAD_MODEL_V129=true;"""
          s=s.replace(old,new,1)
          p.write_text(s)
      - name: Verify connector v132 and preserved pit geometry
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          required=[
            'FIRST_SWEEPER_TO_PIT_CONNECTOR_MODEL_V132=true',
            'FIRST_SWEEPER_TO_PIT_Z_MIN=-6.88',
            'FIRST_SWEEPER_TO_PIT_Z_MAX=-4.92',
            'FirstSweeperToPitLegacyCollisionCarrierV132',
            'FirstSweeperToPitSlatV132',
            'FirstSweeperToPitEdgeRailV132',
            'FirstSweeperToPitBumperV132',
            'FirstSweeperToPitBeaconV132',
            'FirstSweeperToPitCrossBraceV132',
            'FirstSweeperToPitGuideRingV132',
            'FirstSweeperToPitWarningLipV132',
            "PITS=[[-15.2,-13.55],[-4.85,-3.55],[5.05,5.82]]",
            'PIT_PLATFORM_HALF_X=1.45',
            "FirstPitCarrierCollisionDeckV103",
            'FIRST_SWEEPER_RECOVERY_Z_MAX=-6.92',
            'SECOND_SWEEPER_STAGING_Z_MIN=-1.82'
          ]
          for token in required:
              assert token in s, token
          assert s.count('FIRST_SWEEPER_TO_PIT_CONNECTOR_MODEL_V132=true') == 1
          assert s.count("'FirstSweeperToPitLegacyCollisionCarrierV132'") == 1
          assert 'FIRST_SWEEPER_TO_PIT_Z_MAX=-4.92' in s
          assert '[-4.85,-3.55]' in s
          print('First sweeper to pit connector v132 contract: SUCCESS')
          PY
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          m=re.search(r'<script type="module">(.*?)</script>',s,re.S)
          assert m, 'module script not found'
          Path('/tmp/brainrot-module.mjs').write_text(m.group(1))
          PY
          node --check /tmp/brainrot-module.mjs
          node scripts/final-puncher-physics-contract-v65.mjs
          node scripts/final-finish-residual-momentum-check.mjs
          node scripts/final-finish-soft-hold-check.mjs
          node scripts/final-finish-charge-check.mjs
      - name: Commit real level change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "openai-level-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && { echo 'No gameplay change produced'; exit 1; }
          git commit -m "Level: model first sweeper to pit connector v132"
          git push origin HEAD:new-player-glb-overhaul
