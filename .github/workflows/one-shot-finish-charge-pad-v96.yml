name: One-shot finish charge pad v96
on:
  push:
    branches: [new-player-glb-overhaul]
    paths: ['.github/workflows/one-shot-finish-charge-pad-v96.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-player-glb-overhaul
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch modeled finish charge indicator
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          s=s.replace('full 3D route v95 · modeled final charge gate','full 3D route v96 · modeled finish charge indicator',1)
          old="const finishChargePad=box(0,.17,10.46,4.8,.055,.52,0xffffff);finishChargePad.material.emissive=new THREE.Color(0x49ff79);finishChargePad.material.emissiveIntensity=.18;"
          new="const FINISH_CHARGE_INDICATOR_MODEL_V96=true;function makeFinishChargeIndicator(){const g=new THREE.Group();g.name='FinishChargeIndicatorV96';g.position.set(0,.17,10.46);const core=new THREE.Mesh(new THREE.CapsuleGeometry(.10,4.42,4,8),mat(0xffffff));core.name='FinishChargeCoreV96';core.rotation.z=Math.PI/2;core.castShadow=core.receiveShadow=true;core.material.emissive=new THREE.Color(0x49ff79);core.material.emissiveIntensity=.18;g.add(core);[-2.10,2.10].forEach(x=>{const cap=new THREE.Mesh(new THREE.CylinderGeometry(.16,.20,.12,10),mat(0x173a32));cap.name='FinishChargeEndCapV96';cap.rotation.z=Math.PI/2;cap.position.x=x;cap.castShadow=cap.receiveShadow=true;g.add(cap);const ring=new THREE.Mesh(new THREE.TorusGeometry(.18,.035,6,12),mat(0xeaffef));ring.name='FinishChargeRingV96';ring.rotation.y=Math.PI/2;ring.position.x=x;ring.castShadow=true;ring.material.emissive=new THREE.Color(0x49ff79);ring.material.emissiveIntensity=.74;g.add(ring)});[-1.35,0,1.35].forEach((x,i)=>{const node=new THREE.Mesh(new THREE.TorusGeometry(.12,.026,6,10),mat(0xffffff));node.name='FinishChargeNodeV96';node.rotation.y=Math.PI/2;node.position.set(x,.01,0);node.castShadow=true;node.material.emissive=new THREE.Color(i===1?0xffffff:0x49ff79);node.material.emissiveIntensity=.72;g.add(node)});g.material=core.material;scene.add(g);return g}const finishChargePad=makeFinishChargeIndicator();"
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Verify runtime syntax and v96 invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          for x in ['FINISH_CHARGE_INDICATOR_MODEL_V96=true','FinishChargeIndicatorV96','FinishChargeCoreV96','FinishChargeEndCapV96','FinishChargeRingV96','FinishChargeNodeV96','finishChargePad=makeFinishChargeIndicator()','finishChargePad.scale.x=.18+.82*finishProgress']:
              assert x in s,x
          assert "finishChargePad=box(0,.17,10.46,4.8,.055,.52,0xffffff)" not in s
          start=s.index('<script type="module">')+len('<script type="module">'); end=s.index('</script>',start)
          Path('/tmp/game.mjs').write_text(s[start:end])
          print('v96 finish charge modeled indicator invariants PASS')
          PY
          node --check /tmp/game.mjs
          node scripts/final-finish-charge-check.mjs
          git diff --check
      - name: Commit gameplay change and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Model finish charge progress indicator v96'
          git push origin HEAD:new-player-glb-overhaul
          rm .github/workflows/one-shot-finish-charge-pad-v96.yml
          git add -u .github/workflows/one-shot-finish-charge-pad-v96.yml
          git commit -m 'Remove v96 one-shot patch workflow'
          git push origin HEAD:new-player-glb-overhaul
