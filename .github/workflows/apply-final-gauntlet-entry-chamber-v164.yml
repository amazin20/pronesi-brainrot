name: Apply final gauntlet entry chamber v164

on:
  push:
    branches: [new-player-glb-overhaul]
    paths:
      - .github/workflows/apply-final-gauntlet-entry-chamber-v164.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-player-glb-overhaul
          fetch-depth: 0

      - name: Refuse stale or non-linear apply
        run: |
          set -euo pipefail
          git fetch origin new-player-glb-overhaul
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/new-player-glb-overhaul)"
          test "$(git rev-parse HEAD^)" = "6fbdff24b9cceb3d61a307d19991366c88c19790"

      - name: Build final gauntlet entry chamber v164
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='FINAL_GAUNTLET_ENTRY_CHAMBER_MODEL_V164=true'
          if marker in s: raise SystemExit('v164 already present')
          anchor='const FINAL_GAUNTLET_STAGING_GATE_MODEL_V141=true'
          if s.count(anchor)!=1: raise SystemExit(f'model anchor count={s.count(anchor)}')
          model=r'''const FINAL_GAUNTLET_ENTRY_CHAMBER_MODEL_V164=true,FINAL_GAUNTLET_ENTRY_Z_MIN=6.72,FINAL_GAUNTLET_ENTRY_Z_MAX=7.52,FINAL_GAUNTLET_ENTRY_Z=(FINAL_GAUNTLET_ENTRY_Z_MIN+FINAL_GAUNTLET_ENTRY_Z_MAX)*.5;const finalGauntletEntryV164=new THREE.Group();finalGauntletEntryV164.name='FinalGauntletEntryChamberAssemblyV164';finalGauntletEntryV164.position.set(0,0,FINAL_GAUNTLET_ENTRY_Z);scene.add(finalGauntletEntryV164);const fgeDarkV164=mat(0x101827),fgeSteelV164=mat(0xe8f7ff),fgeAmberV164=mat(0xffb12b),fgePinkV164=mat(0xff557c),fgeGreenV164=mat(0x49ff79);fgeDarkV164.metalness=.72;fgeDarkV164.roughness=.22;fgeSteelV164.metalness=.55;fgeSteelV164.roughness=.18;const fgeLenV164=FINAL_GAUNTLET_ENTRY_Z_MAX-FINAL_GAUNTLET_ENTRY_Z_MIN;const fgeDeckV164=new THREE.Mesh(new THREE.BoxGeometry(3.56,.10,fgeLenV164),fgeDarkV164);fgeDeckV164.name='FinalGauntletEntryDeckV164';fgeDeckV164.position.y=.05;fgeDeckV164.castShadow=fgeDeckV164.receiveShadow=true;finalGauntletEntryV164.add(fgeDeckV164);[-1.36,-.90,-.45,0,.45,.90,1.36].forEach((x,i)=>{const slat=new THREE.Mesh(new THREE.BoxGeometry(.34,.07,fgeLenV164-.06),i===3?fgeSteelV164:(i<3?fgeGreenV164:fgePinkV164));slat.name='FinalGauntletEntryDeckSlatV164';slat.position.set(x,.12,0);slat.castShadow=slat.receiveShadow=true;slat.material.emissive=new THREE.Color(i===3?0x42667d:(i<3?0x159b43:0xa20d38));slat.material.emissiveIntensity=i===3?.30:.45;finalGauntletEntryV164.add(slat)});const finalGauntletEntryArmsV164=[],finalGauntletEntryRollersV164=[],finalGauntletEntryLampsV164=[];[-.28,.28].forEach((z,zi)=>[-1,1].forEach((side,si)=>{const tower=new THREE.Mesh(new THREE.BoxGeometry(.34,1.88,.40),fgeDarkV164);tower.name='FinalGauntletEntryServoTowerV164';tower.position.set(side*1.82,.95,z);tower.castShadow=tower.receiveShadow=true;finalGauntletEntryV164.add(tower);[.32,.86,1.40].forEach((y,k)=>{const collar=new THREE.Mesh(new THREE.TorusGeometry(.17,.038,7,14),k===1?fgeSteelV164:(si?fgePinkV164:fgeAmberV164));collar.name='FinalGauntletEntryTowerCollarV164';collar.rotation.x=Math.PI/2;collar.position.set(side*1.82,y,z);collar.castShadow=true;collar.material.emissive=new THREE.Color(k===1?0x42667d:(si?0xa20d38:0xa95a00));collar.material.emissiveIntensity=.72;finalGauntletEntryV164.add(collar)});const pivot=new THREE.Group();pivot.name='FinalGauntletEntryGuidePivotV164';pivot.position.set(side*1.57,.63,z);pivot.userData.side=side;pivot.userData.phase=zi;const arm=new THREE.Mesh(new THREE.BoxGeometry(.92,.16,.22),zi?fgePinkV164:fgeSteelV164);arm.name='FinalGauntletEntryGuideArmV164';arm.position.set(-side*.43,0,0);arm.castShadow=arm.receiveShadow=true;arm.material.emissive=new THREE.Color(zi?0xa20d38:0x42667d);arm.material.emissiveIntensity=.46;pivot.add(arm);[-.64,-.28].forEach((lx,k)=>{const roller=new THREE.Mesh(new THREE.CylinderGeometry(.11,.11,.22,10),k?fgeAmberV164:(si?fgePinkV164:fgeGreenV164));roller.name='FinalGauntletEntryGuideRollerV164';roller.rotation.z=Math.PI/2;roller.position.set(side*lx,-.01,0);roller.castShadow=roller.receiveShadow=true;roller.material.emissive=new THREE.Color(k?0xa95a00:(si?0xa20d38:0x159b43));roller.material.emissiveIntensity=.78;pivot.add(roller);finalGauntletEntryRollersV164.push(roller)});finalGauntletEntryV164.add(pivot);finalGauntletEntryArmsV164.push(pivot)}));const fgeHeaderV164=new THREE.Mesh(new THREE.BoxGeometry(3.92,.22,.36),fgeDarkV164);fgeHeaderV164.name='FinalGauntletEntryHeaderV164';fgeHeaderV164.position.set(0,2.00,.10);fgeHeaderV164.castShadow=fgeHeaderV164.receiveShadow=true;finalGauntletEntryV164.add(fgeHeaderV164);[-1.24,-.62,0,.62,1.24].forEach((x,i)=>{const lamp=new THREE.Mesh(new THREE.OctahedronGeometry(.095,0),i===2?fgeAmberV164:fgeSteelV164);lamp.name='FinalGauntletEntryStatusLampV164';lamp.position.set(x,2.01,.31);lamp.userData.stage=.10+i*.20;lamp.castShadow=true;lamp.material.emissive=new THREE.Color(i===2?0xa95a00:(i<2?0x159b43:0xa20d38));lamp.material.emissiveIntensity=.86;finalGauntletEntryV164.add(lamp);finalGauntletEntryLampsV164.push(lamp)});const fgeRingV164=new THREE.Mesh(new THREE.TorusGeometry(.34,.058,8,18),fgeAmberV164);fgeRingV164.name='FinalGauntletEntryTimingRingV164';fgeRingV164.rotation.x=Math.PI/2;fgeRingV164.position.set(0,.20,.02);fgeRingV164.castShadow=true;fgeRingV164.material.emissive=new THREE.Color(0xa95a00);fgeRingV164.material.emissiveIntensity=.92;finalGauntletEntryV164.add(fgeRingV164);[-1,1].forEach((side,si)=>{const jawPivot=new THREE.Group();jawPivot.name='FinalGauntletEntryJawPivotV164';jawPivot.position.set(side*1.47,.80,fgeLenV164*.42);jawPivot.userData.side=side;const jaw=new THREE.Mesh(new THREE.BoxGeometry(.86,.18,.28),si?fgePinkV164:fgeAmberV164);jaw.name='FinalGauntletEntryJawV164';jaw.position.set(-side*.39,0,0);jaw.castShadow=jaw.receiveShadow=true;jaw.material.emissive=new THREE.Color(si?0xa20d38:0xa95a00);jaw.material.emissiveIntensity=.60;jawPivot.add(jaw);finalGauntletEntryV164.add(jawPivot);finalGauntletEntryArmsV164.push(jawPivot)});'''
          s=s.replace(anchor,model+anchor,1)
          runtime_anchor='const finalStageActiveV141='
          if s.count(runtime_anchor)!=1: raise SystemExit(f'runtime anchor count={s.count(runtime_anchor)}')
          runtime=r'''const finalEntryActiveV164=p.z>FINAL_GAUNTLET_ENTRY_Z_MIN-.10&&p.z<FINAL_GAUNTLET_ENTRY_Z_MAX+.12,finalEntryProgressV164=Math.max(0,Math.min(1,(p.z-FINAL_GAUNTLET_ENTRY_Z_MIN)/(FINAL_GAUNTLET_ENTRY_Z_MAX-FINAL_GAUNTLET_ENTRY_Z_MIN))),finalEntryPulseV164=.5+.5*Math.sin(t*12.6);finalGauntletEntryArmsV164.forEach((n,i)=>{const side=n.userData.side||1,phase=n.userData.phase||0;n.rotation.z=side*((phase?-.06:.06)+(finalEntryActiveV164?(.15-.11*finalEntryProgressV164):.03));n.children.forEach(c=>{if(c.isMesh&&c.material?.emissive)c.material.emissiveIntensity=finalEntryActiveV164?.62+.42*finalEntryPulseV164:.44})});finalGauntletEntryRollersV164.forEach((n,i)=>{n.rotation.x+=dt*(finalEntryActiveV164?8.2:1.0)*(i%2?-1:1);n.material.emissiveIntensity=finalEntryActiveV164?.80+.34*finalEntryPulseV164:.52});finalGauntletEntryLampsV164.forEach(n=>{const reached=finalEntryProgressV164>=n.userData.stage;n.material.color.setHex(reached?0x49ff79:0xe8f7ff);n.material.emissive.setHex(reached?0x159b43:0x42667d);n.material.emissiveIntensity=finalEntryActiveV164?(reached?1.16+.52*finalEntryPulseV164:.50):.64});fgeRingV164.rotation.z+=dt*(finalEntryActiveV164?3.4:.28);fgeRingV164.scale.setScalar(.94+.10*(finalEntryActiveV164?finalEntryPulseV164:.2));fgeRingV164.material.color.setHex(finalEntryProgressV164>.72?0xff557c:(finalEntryProgressV164>.38?0xffb12b:0x49ff79));fgeRingV164.material.emissive.setHex(finalEntryProgressV164>.72?0xa20d38:(finalEntryProgressV164>.38?0xa95a00:0x159b43));fgeRingV164.material.emissiveIntensity=finalEntryActiveV164?.84+.56*finalEntryPulseV164:.58;'''
          s=s.replace(runtime_anchor,runtime+runtime_anchor,1)
          p.write_text(s)
          PY

      - name: Verify v164 and preserved final puncher physics
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          required=['FINAL_GAUNTLET_ENTRY_CHAMBER_MODEL_V164=true','FINAL_GAUNTLET_ENTRY_Z_MIN=6.72','FINAL_GAUNTLET_ENTRY_Z_MAX=7.52','FinalGauntletEntryChamberAssemblyV164','FinalGauntletEntryServoTowerV164','FinalGauntletEntryGuideArmV164','FinalGauntletEntryGuideRollerV164','FinalGauntletEntryHeaderV164','FinalGauntletEntryStatusLampV164','FinalGauntletEntryTimingRingV164','FinalGauntletEntryJawV164','FINAL_GAUNTLET_STAGING_GATE_MODEL_V141=true','FINAL_GAUNTLET_Z1=7.55']
          for token in required: assert token in s, token
          assert s.count('FINAL_GAUNTLET_ENTRY_CHAMBER_MODEL_V164=true')==1
          print('Final gauntlet entry chamber v164 contract: SUCCESS')
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text();m=re.search(r'<script type="module">(.*?)</script>',s,re.S);assert m
          Path('/tmp/brainrot-module.mjs').write_text(m.group(1))
          PY
          node --check /tmp/brainrot-module.mjs
          for f in scripts/final-puncher-physics-contract-v65.mjs scripts/final-finish-residual-momentum-check.mjs scripts/final-finish-soft-hold-check.mjs scripts/final-finish-charge-check.mjs; do
            if [ -f "$f" ]; then node "$f"; else echo "SKIP missing $f"; fi
          done

      - name: Guard linear head before commit
        run: |
          set -euo pipefail
          git fetch origin new-player-glb-overhaul
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/new-player-glb-overhaul)"

      - name: Commit real gameplay change
        run: |
          set -euo pipefail
          git config user.name "openai-level-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && { echo 'No gameplay change produced'; exit 1; }
          git commit -m "Level: mechanical final gauntlet entry chamber v164"
          git push origin HEAD:new-player-glb-overhaul
