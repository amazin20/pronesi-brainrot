name: One-shot Finish Structure Modeled V79 Retry

on:
  push:
    branches: [new-player-glb-overhaul]
    paths: ['.github/workflows/one-shot-finish-structure-modeled-v79.yml']

permissions:
  contents: write

jobs:
  patch-check-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-player-glb-overhaul
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Model finish structure v79
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          old="const finishRailL=box(-3.78,.62,10,.28,1.24,2.25,0x172451),finishRailR=box(3.78,.62,10,.28,1.24,2.25,0x172451);[finishRailL,finishRailR].forEach(r=>{r.material.metalness=.25;r.material.roughness=.32});const finishArchL=box(-3.25,1.55,10.62,.22,2.8,.22,0xffffff),finishArchR=box(3.25,1.55,10.62,.22,2.8,.22,0xffffff),finishArchTop=box(0,2.85,10.62,6.7,.22,.22,0xffffff);"
          new="const FINISH_STRUCTURE_MODEL_V79=true;function makeFinishSideGuard(side){const g=new THREE.Group();g.name='FinishSideGuardV79';g.position.set(side*3.78,0,10);const railMat=mat(0x26365f),dark=mat(0x11182f),accent=mat(0x49ff79);const rail=new THREE.Mesh(new THREE.CapsuleGeometry(.14,1.95,4,8),railMat);rail.name='FinishSideRailV79';rail.rotation.x=Math.PI/2;rail.position.y=.62;rail.castShadow=rail.receiveShadow=true;rail.material.metalness=.28;rail.material.roughness=.30;g.add(rail);[-.82,.82].forEach(z=>{const post=new THREE.Mesh(new THREE.CylinderGeometry(.12,.17,1.08,10),dark);post.name='FinishSidePostV79';post.position.set(0,.52,z);post.castShadow=post.receiveShadow=true;g.add(post);const ring=new THREE.Mesh(new THREE.TorusGeometry(.17,.045,6,12),accent);ring.name='FinishSideBeaconV79';ring.rotation.x=Math.PI/2;ring.position.set(0,1.06,z);ring.castShadow=true;ring.material.emissive=new THREE.Color(0x49ff79);ring.material.emissiveIntensity=.72;g.add(ring)});scene.add(g);return g}const finishRailL=makeFinishSideGuard(-1),finishRailR=makeFinishSideGuard(1);function makeFinishArchPost(side){const post=new THREE.Mesh(new THREE.CapsuleGeometry(.13,2.52,5,10),mat(0xf3fbff));post.name='FinishArchPostV79';post.position.set(side*3.25,1.55,10.62);post.castShadow=post.receiveShadow=true;post.material.metalness=.18;post.material.roughness=.28;[-.72,.72].forEach(y=>{const collar=new THREE.Mesh(new THREE.TorusGeometry(.19,.045,6,12),mat(0x49ff79));collar.name='FinishArchCollarV79';collar.rotation.x=Math.PI/2;collar.position.y=y;collar.castShadow=true;collar.material.emissive=new THREE.Color(0x19b24e);collar.material.emissiveIntensity=.62;post.add(collar)});scene.add(post);return post}const finishArchL=makeFinishArchPost(-1),finishArchR=makeFinishArchPost(1);const finishArchTop=new THREE.Mesh(new THREE.CapsuleGeometry(.13,6.44,5,10),mat(0xffffff));finishArchTop.name='FinishArchTopV79';finishArchTop.rotation.z=Math.PI/2;finishArchTop.position.set(0,2.85,10.62);finishArchTop.castShadow=finishArchTop.receiveShadow=true;[-2.35,0,2.35].forEach(x=>{const beacon=new THREE.Mesh(new THREE.TorusGeometry(.16,.04,6,12),mat(0xffffff));beacon.name='FinishArchBeaconV79';beacon.rotation.y=Math.PI/2;beacon.position.set(0,x,0);beacon.castShadow=true;finishArchTop.add(beacon)});scene.add(finishArchTop);"
          if old not in s: raise SystemExit('expected primitive finish structure not found')
          s=s.replace(old,new,1)
          s=s.replace('full 3D lift route v78 · modeled finish funnel','full 3D lift route v79 · modeled finish structure',1)
          p.write_text(s)
          PY
      - name: Verify modeled structure and finish physics envelope
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          required=['FINISH_STRUCTURE_MODEL_V79=true','FinishSideGuardV79','FinishSideRailV79','FinishSidePostV79','FinishSideBeaconV79','FinishArchPostV79','FinishArchCollarV79','FinishArchTopV79','FinishArchBeaconV79','FINISH_Z_MIN=8.82','FINISH_X=3.5','if(z>FINISH_Z_MIN&&Math.abs(x)>FINISH_X)return true','if(z>FINISH_Z_MIN&&Math.abs(x)>FINISH_X-r)return true','const finish=box(0,.1,10,7.35,.2,1.9,0x49ff79)','const FINISH_FINISH_CHARGE=.55' if False else 'const FINAL_FINISH_CHARGE=.55']
          for x in required:
            if x not in s: raise SystemExit('missing '+x)
          for x in ['finishRailL=box(-3.78,.62,10','finishArchL=box(-3.25,1.55,10.62']:
            if x in s: raise SystemExit('stale primitive remains: '+x)
          print('FINISH_STRUCTURE_MODELED_V79: PASS')
          PY
      - name: Browser module syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(); a=s.index('<script type="module">')+len('<script type="module">'); b=s.index('</script>',a); Path('/tmp/runtime.mjs').write_text(s[a:b])
          PY
          node --check /tmp/runtime.mjs
      - name: Diff whitespace check
        run: git diff --check
      - name: Commit gameplay geometry
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Model final finish structure v79'
          git push origin HEAD:new-player-glb-overhaul
