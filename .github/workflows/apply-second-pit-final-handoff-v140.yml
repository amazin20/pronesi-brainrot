name: Apply Second Pit Final Handoff v140

on:
  push:
    branches: [new-player-glb-overhaul]
    paths:
      - .github/workflows/apply-second-pit-final-handoff-v140.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-player-glb-overhaul
          fetch-depth: 0
      - name: Refuse stale/non-linear apply
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin new-player-glb-overhaul
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/new-player-glb-overhaul)"
          test "$(git rev-parse HEAD^)" = "a33311f4abb86b0dccfd9e6c85d5a735e8e9b425"
      - name: Model second pit to final handoff v140
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          if 'SECOND_PIT_FINAL_HANDOFF_MODEL_V140=true' in s:
              raise SystemExit('v140 already present')
          anchor='const FINAL_GAUNTLET_APPROACH_Z_MIN=6.72'
          if s.count(anchor) != 1:
              raise SystemExit(f'v140 anchor count={s.count(anchor)}')
          model="""const SECOND_PIT_FINAL_HANDOFF_MODEL_V140=true,SECOND_PIT_FINAL_HANDOFF_Z_MIN=6.16,SECOND_PIT_FINAL_HANDOFF_Z_MAX=6.70,SECOND_PIT_FINAL_HANDOFF_Z=(SECOND_PIT_FINAL_HANDOFF_Z_MIN+SECOND_PIT_FINAL_HANDOFF_Z_MAX)*.5;const secondPitFinalHandoffV140=new THREE.Group();secondPitFinalHandoffV140.name='SecondPitFinalHandoffAssemblyV140';secondPitFinalHandoffV140.position.set(0,0,SECOND_PIT_FINAL_HANDOFF_Z);scene.add(secondPitFinalHandoffV140);const handoffGreenV140=mat(0x49ff79),handoffAmberV140=mat(0xffd84d),handoffDarkV140=mat(0x183735),handoffWhiteV140=mat(0xf4fff7);handoffGreenV140.metalness=.30;handoffGreenV140.roughness=.27;handoffAmberV140.metalness=.26;handoffAmberV140.roughness=.28;handoffDarkV140.metalness=.52;handoffDarkV140.roughness=.31;[-.23,-.115,0,.115,.23].forEach((z,i)=>{const slat=new THREE.Mesh(new THREE.BoxGeometry(2.92,.065,.085),i===2?handoffWhiteV140:(i<2?handoffGreenV140:handoffAmberV140));slat.name='SecondPitFinalHandoffSlatV140';slat.position.set(0,.065,z);slat.castShadow=slat.receiveShadow=true;slat.material.emissive=new THREE.Color(i===2?0xffffff:(i<2?0x159b43:0xa95a00));slat.material.emissiveIntensity=i===2?.82:.46;secondPitFinalHandoffV140.add(slat)});[-1.34,1.34].forEach((x,i)=>{const rail=new THREE.Mesh(new THREE.CapsuleGeometry(.04,.46,4,8),handoffWhiteV140);rail.name='SecondPitFinalHandoffEdgeRailV140';rail.rotation.x=Math.PI/2;rail.position.set(x,.18,0);rail.castShadow=rail.receiveShadow=true;rail.material.emissive=new THREE.Color(i?0xffb12b:0x49ff79);rail.material.emissiveIntensity=.72;secondPitFinalHandoffV140.add(rail);const post=new THREE.Mesh(new THREE.CylinderGeometry(.075,.11,.64,8),handoffDarkV140);post.name='SecondPitFinalHandoffPostV140';post.position.set(x,.32,.19);post.castShadow=post.receiveShadow=true;secondPitFinalHandoffV140.add(post);const beacon=new THREE.Mesh(new THREE.TorusGeometry(.13,.03,6,10),i?handoffAmberV140:handoffGreenV140);beacon.name='SecondPitFinalHandoffBeaconV140';beacon.rotation.x=Math.PI/2;beacon.position.set(x,.64,.19);beacon.castShadow=true;beacon.material.emissive=new THREE.Color(i?0xffb12b:0x49ff79);beacon.material.emissiveIntensity=.94;secondPitFinalHandoffV140.add(beacon)});[-.78,0,.78].forEach((x,i)=>{const brace=new THREE.Mesh(new THREE.CylinderGeometry(.04,.055,.48,8),handoffDarkV140);brace.name='SecondPitFinalHandoffBraceV140';brace.rotation.x=Math.PI/2;brace.position.set(x,.02,0);brace.castShadow=brace.receiveShadow=true;secondPitFinalHandoffV140.add(brace);const ring=new THREE.Mesh(new THREE.TorusGeometry(.095,.024,6,10),i===1?handoffWhiteV140:(i===0?handoffGreenV140:handoffAmberV140));ring.name='SecondPitFinalHandoffGuideRingV140';ring.rotation.x=Math.PI/2;ring.position.set(x,.13,0);ring.castShadow=true;ring.material.emissive=new THREE.Color(i===1?0xffffff:(i===0?0x49ff79:0xffb12b));ring.material.emissiveIntensity=i===1?1.0:.78;secondPitFinalHandoffV140.add(ring)});const handoffBeamV140=new THREE.Mesh(new THREE.CapsuleGeometry(.055,2.70,4,8),handoffDarkV140);handoffBeamV140.name='SecondPitFinalHandoffTimingBeamV140';handoffBeamV140.rotation.z=Math.PI/2;handoffBeamV140.position.set(0,.84,.19);handoffBeamV140.castShadow=handoffBeamV140.receiveShadow=true;secondPitFinalHandoffV140.add(handoffBeamV140);const handoffTimingLampV140=new THREE.Mesh(new THREE.OctahedronGeometry(.10,0),handoffWhiteV140);handoffTimingLampV140.name='SecondPitFinalHandoffTimingLampV140';handoffTimingLampV140.position.set(0,.84,.19);handoffTimingLampV140.castShadow=true;handoffTimingLampV140.material.emissive=new THREE.Color(0xffd84d);handoffTimingLampV140.material.emissiveIntensity=1.0;secondPitFinalHandoffV140.add(handoffTimingLampV140);"""
          s=s.replace(anchor,model+anchor,1)
          tick_anchor='secondPitExitBridgeMechV139.children.forEach(n=>{if(!n.isMesh||!n.material?.emissive)return;if(n.name===\'SecondPitExitBridgeRibV139\'||n.name===\'SecondPitExitBridgeReleaseGuideV139\')n.material.emissiveIntensity=exitBridgeCaptureV139?.72+.48*exitBridgeReleaseProgressV139+.22*exitBridgeReleasePulseV139:(n.name===\'SecondPitExitBridgeReleaseGuideV139\'?.76:.46)});'
          if s.count(tick_anchor) != 1:
              raise SystemExit(f'v140 tick anchor count={s.count(tick_anchor)}')
          tick="""const handoffActiveV140=p.z>SECOND_PIT_FINAL_HANDOFF_Z_MIN-.18&&p.z<SECOND_PIT_FINAL_HANDOFF_Z_MAX+.22,handoffProgressV140=Math.max(0,Math.min(1,(p.z-SECOND_PIT_FINAL_HANDOFF_Z_MIN)/(SECOND_PIT_FINAL_HANDOFF_Z_MAX-SECOND_PIT_FINAL_HANDOFF_Z_MIN))),handoffPulseV140=.5+.5*Math.sin(t*10.5);secondPitFinalHandoffV140.children.forEach(n=>{if(!n.isMesh||!n.material?.emissive)return;if(n.name==='SecondPitFinalHandoffSlatV140'||n.name==='SecondPitFinalHandoffGuideRingV140')n.material.emissiveIntensity=handoffActiveV140?.62+.58*handoffProgressV140+.18*handoffPulseV140:(n.name==='SecondPitFinalHandoffGuideRingV140'?.78:.46)});handoffTimingLampV140.material.emissive.setHex(handoffProgressV140>.72?0xff557c:0xffd84d);handoffTimingLampV140.material.emissiveIntensity=handoffActiveV140?1.05+.75*handoffPulseV140:.72;handoffBeamV140.material.emissive=handoffBeamV140.material.emissive||new THREE.Color(0xa95a00);handoffBeamV140.material.emissiveIntensity=handoffActiveV140?.34+.62*handoffProgressV140:.12;"""
          s=s.replace(tick_anchor,tick_anchor+tick,1)
          p.write_text(s)
      - name: Verify v140 handoff and preserved gameplay
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          required=['SECOND_PIT_FINAL_HANDOFF_MODEL_V140=true','SECOND_PIT_FINAL_HANDOFF_Z_MIN=6.16','SECOND_PIT_FINAL_HANDOFF_Z_MAX=6.70','SecondPitFinalHandoffAssemblyV140','SecondPitFinalHandoffSlatV140','SecondPitFinalHandoffEdgeRailV140','SecondPitFinalHandoffPostV140','SecondPitFinalHandoffBeaconV140','SecondPitFinalHandoffBraceV140','SecondPitFinalHandoffGuideRingV140','SecondPitFinalHandoffTimingBeamV140','SecondPitFinalHandoffTimingLampV140','FINAL_GAUNTLET_APPROACH_Z_MIN=6.72','SECOND_PIT_EXIT_RELEASE_Z=6.02','SECOND_PIT_EXIT_LANDING_MODEL_V108=true','FINAL_GAUNTLET_APPROACH_PAD_MODEL_V111=true']
          for token in required: assert token in s, token
          assert s.count('SECOND_PIT_FINAL_HANDOFF_MODEL_V140=true') == 1
          assert s.count("'SecondPitFinalHandoffAssemblyV140'") == 1
          print('Second pit to final handoff v140 contract: SUCCESS')
          PY
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text();m=re.search(r'<script type="module">(.*?)</script>',s,re.S);assert m
          Path('/tmp/brainrot-module.mjs').write_text(m.group(1))
          PY
          node --check /tmp/brainrot-module.mjs
          for f in scripts/second-pit-carry-window-check.mjs scripts/second-pit-platform-motion-v71-check.mjs scripts/second-pit-route-continuity-v70-check.mjs scripts/second-pit-boarding-hold-check.mjs scripts/final-puncher-physics-contract-v65.mjs scripts/final-finish-residual-momentum-check.mjs scripts/final-finish-soft-hold-check.mjs scripts/final-finish-charge-check.mjs; do
            if [ -f "$f" ]; then node "$f"; else echo "SKIP missing $f"; fi
          done
      - name: Commit real level change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "openai-level-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && { echo 'No gameplay change produced'; exit 1; }
          git commit -m "Level: model second pit to final handoff v140"
          git push origin HEAD:new-player-glb-overhaul
