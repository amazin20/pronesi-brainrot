name: One-shot lift gate physical sync
on:
  push:
    branches: [new-player-glb-overhaul]
    paths: ['.github/workflows/one-shot-lift-gate-physical-sync.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-player-glb-overhaul
          fetch-depth: 0
      - name: Patch synchronized gate collision and anti-crush
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="const FINISH_Z_MIN=8.82,FINISH_X=3.5;function liftSafetyGateBlocks(x,z,r=.4){return !liftSafetyOpen&&Math.abs(z-LIFT_GATE_Z)<.19+r*.35&&Math.abs(x)<LIFT_GATE_HALF_X+r}"
          new="const FINISH_Z_MIN=8.82,FINISH_X=3.5,LIFT_GATE_BAR_HALF_Y=.11,LIFT_GATE_PLAYER_TOP=2.12,LIFT_GATE_BRAIN_TOP=1.68;function liftSafetyGateBlocks(x,z,r=.4,top=LIFT_GATE_PLAYER_TOP){const overlapsXZ=Math.abs(z-LIFT_GATE_Z)<.19+r*.35&&Math.abs(x)<LIFT_GATE_HALF_X+r,barBottom=liftSafetyGate.position.y-LIFT_GATE_BAR_HALF_Y;return overlapsXZ&&barBottom<top}"
          assert old in s, 'gate collision function not found'
          s=s.replace(old,new,1)
          old2="const docked=Math.abs(newY-LIFT_BASE_Y)<.015;liftSafetyOpen=docked||holdForCarry||p.z>LIFT_GATE_Z+.22;const gateTarget=liftSafetyOpen?LIFT_GATE_OPEN_Y:LIFT_GATE_CLOSED_Y,gateStep=4.8*dt;"
          new2="const docked=Math.abs(newY-LIFT_BASE_Y)<.015,playerInGateSensor=Math.abs(p.z-LIFT_GATE_Z)<.56&&Math.abs(p.x)<LIFT_GATE_HALF_X+.45&&p.y<.55,brainInGateSensor=Math.abs(bp.z-LIFT_GATE_Z)<.56&&Math.abs(bp.x)<LIFT_GATE_HALF_X+.45&&bp.y<1.15;liftSafetyOpen=docked||holdForCarry||p.z>LIFT_GATE_Z+.22||playerInGateSensor||brainInGateSensor;const gateTarget=liftSafetyOpen?LIFT_GATE_OPEN_Y:LIFT_GATE_CLOSED_Y,gateStep=4.8*dt;"
          assert old2 in s, 'gate state line not found'
          s=s.replace(old2,new2,1)
          old3="if(gateClosed&&!win&&failTimer<=0&&Math.abs(p.z-LIFT_GATE_Z)<1.15)state.textContent='ЛИФТ В ПУТИ · ЖДИ ЗЕЛЁНЫЕ ВОРОТА';"
          new3="if((playerInGateSensor||brainInGateSensor)&&!docked&&!win&&failTimer<=0)state.textContent='ВОРОТА · ДАТЧИК БЕЗОПАСНОСТИ';else if(gateClosed&&!win&&failTimer<=0&&Math.abs(p.z-LIFT_GATE_Z)<1.15)state.textContent='ЛИФТ В ПУТИ · ЖДИ ЗЕЛЁНЫЕ ВОРОТА';"
          assert old3 in s, 'gate status line not found'
          s=s.replace(old3,new3,1)
          s=s.replace('full 3D lift route v32 · guarded lift boarding','full 3D lift route v33 · physical safety gate sync',1)
          p.write_text(s)
          PY
      - name: Verify runtime syntax and gate invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          assert 'barBottom=liftSafetyGate.position.y-LIFT_GATE_BAR_HALF_Y' in s
          assert 'playerInGateSensor' in s and 'brainInGateSensor' in s
          assert "ВОРОТА · ДАТЧИК БЕЗОПАСНОСТИ" in s
          m=re.search(r'<script type="module">(.*?)</script>',s,re.S)
          assert m
          Path('/tmp/runtime.mjs').write_text(m.group(1))
          PY
          node --check /tmp/runtime.mjs
      - name: Commit gameplay patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Synchronize lift safety gate collision with 3D motion'
          git push origin HEAD:new-player-glb-overhaul
