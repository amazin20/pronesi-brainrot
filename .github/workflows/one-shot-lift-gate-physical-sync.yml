name: One-shot lift carry deck clearance
on:
  push:
    branches: [new-player-glb-overhaul]
    paths: ['.github/workflows/one-shot-lift-gate-physical-sync.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-player-glb-overhaul
          fetch-depth: 0
      - name: Patch full-span carry deck and gate clearance
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          assert 'LIFT_HALF_Z=.62' in s, 'current lift half-Z constant not found'
          assert 'LIFT_DOCK_DEPTH=.34' in s, 'current lift dock depth not found'
          assert 'LIFT_GATE_OPEN_Y=2.72' in s, 'current gate open height not found'
          s=s.replace('LIFT_HALF_Z=.62','LIFT_HALF_Z=.94',1)
          s=s.replace('LIFT_DOCK_DEPTH=.34','LIFT_DOCK_DEPTH=.46',1)
          s=s.replace('LIFT_GATE_OPEN_Y=2.72','LIFT_GATE_OPEN_Y=3.46',1)
          s=s.replace('full 3D lift route v33 · physical safety gate sync','full 3D lift route v34 · carry-safe full-span lift deck',1)
          p.write_text(s)
          PY
      - name: Verify gameplay geometry and runtime syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          def num(name):
            m=re.search(rf'{name}=(-?(?:\d+(?:\.\d*)?|\.\d+))',s)
            assert m, f'{name} missing'
            return float(m.group(1))
          pit_a,pit_b=-15.2,-13.55
          lift_z=(pit_a+pit_b)*.5
          half_z=num('LIFT_HALF_Z')
          dock_depth=num('LIFT_DOCK_DEPTH')
          gate_open=num('LIFT_GATE_OPEN_Y')
          bar_half=num('LIFT_GATE_BAR_HALF_Y')
          carry_top=num('LIFT_CARRY_CLEARANCE')
          assert lift_z-half_z <= pit_a-.05, (lift_z-half_z,pit_a)
          assert lift_z+half_z >= pit_b+.05, (lift_z+half_z,pit_b)
          assert dock_depth >= .44
          assert gate_open-bar_half > carry_top+.6, (gate_open-bar_half,carry_top)
          assert 'full 3D lift route v34 · carry-safe full-span lift deck' in s
          m=re.search(r'<script type="module">(.*?)</script>',s,re.S)
          assert m
          Path('/tmp/runtime.mjs').write_text(m.group(1))
          print({'deckMinZ':round(lift_z-half_z,3),'deckMaxZ':round(lift_z+half_z,3),'pit':(pit_a,pit_b),'gateClearance':round(gate_open-bar_half-carry_top,3)})
          PY
          node --check /tmp/runtime.mjs
          node scripts/lift-route-continuity-check.mjs
      - name: Commit gameplay patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Widen lift carry deck and raise gate clearance'
          git push origin HEAD:new-player-glb-overhaul
