name: One-shot final charge docking gate v58 fixed
on:
  push:
    branches: [new-player-glb-overhaul]
    paths: ['.github/workflows/one-shot-final-charge-docking-gate-v58-fixed.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-player-glb-overhaul
          fetch-depth: 0
      - name: Patch real finish docking gate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          reps=[
          ("full 3D lift route v57 · physical finish charge cradle","full 3D lift route v58 · physical finish docking gate"),
          ("const FINAL_GAUNTLET_Z1=7.55,FINAL_GAUNTLET_Z2=8.38,FINAL_GAUNTLET_HOME_X=3.42,FINAL_GAUNTLET_IN_X=.92,FINAL_GAUNTLET_HALF_X=.68,FINAL_GAUNTLET_HALF_Z=.34,FINAL_GAUNTLET_CLEAR_Z=8.92,FINAL_GAUNTLET_SPEED=2.35;const FINAL_RECOVERY_Z_MIN=8.92,FINAL_RECOVERY_Z_MAX=9.62,FINAL_RECOVERY_HALF_X=2.58,FINAL_RECOVERY_GRACE=.72;const FINAL_FINISH_FUNNEL_Z_MIN=9.54,FINAL_FINISH_FUNNEL_Z_MAX=10.58,FINAL_FINISH_FUNNEL_HALF_X=2.42,FINAL_FINISH_FUNNEL_DAMP=10.5,FINAL_FINISH_FUNNEL_PULL=1.75;const FINAL_CHARGE_CRADLE_Z_MIN=10.30,FINAL_CHARGE_CRADLE_Z_MAX=11.06,FINAL_CHARGE_CRADLE_HALF_X=1.72,FINAL_CHARGE_CRADLE_DAMP=15.5,FINAL_CHARGE_CRADLE_PULL=2.65;const FINAL_FINISH_CHARGE=.55,FINAL_FINISH_HOLD_Z=10.12,FINAL_FINISH_HOLD_STRENGTH=5.8,FINAL_FINISH_HOLD_MIN=.34,FINAL_FINISH_PLAYER_MAX_PULL=1.35,FINAL_FINISH_BRAIN_MAX_ACCEL=11.5;",
           "const FINAL_GAUNTLET_Z1=7.55,FINAL_GAUNTLET_Z2=8.38,FINAL_GAUNTLET_HOME_X=3.42,FINAL_GAUNTLET_IN_X=.92,FINAL_GAUNTLET_HALF_X=.68,FINAL_GAUNTLET_HALF_Z=.34,FINAL_GAUNTLET_CLEAR_Z=8.92,FINAL_GAUNTLET_SPEED=2.35;const FINAL_RECOVERY_Z_MIN=8.92,FINAL_RECOVERY_Z_MAX=9.62,FINAL_RECOVERY_HALF_X=2.58,FINAL_RECOVERY_GRACE=.72;const FINAL_FINISH_FUNNEL_Z_MIN=9.54,FINAL_FINISH_FUNNEL_Z_MAX=10.58,FINAL_FINISH_FUNNEL_HALF_X=2.42,FINAL_FINISH_FUNNEL_DAMP=10.5,FINAL_FINISH_FUNNEL_PULL=1.75;const FINAL_CHARGE_CRADLE_Z_MIN=10.30,FINAL_CHARGE_CRADLE_Z_MAX=11.06,FINAL_CHARGE_CRADLE_HALF_X=1.72,FINAL_CHARGE_CRADLE_DAMP=15.5,FINAL_CHARGE_CRADLE_PULL=2.65,FINAL_CHARGE_GATE_Z=10.88,FINAL_CHARGE_GATE_HALF_X=1.72,FINAL_CHARGE_GATE_CLOSED_Y=.62,FINAL_CHARGE_GATE_OPEN_Y=2.55;const FINAL_FINISH_CHARGE=.55,FINAL_FINISH_HOLD_Z=10.12,FINAL_FINISH_HOLD_STRENGTH=5.8,FINAL_FINISH_HOLD_MIN=.34,FINAL_FINISH_PLAYER_MAX_PULL=1.35,FINAL_FINISH_BRAIN_MAX_ACCEL=11.5;"),
          ("[finalChargeCradlePad,finalChargeCradleL,finalChargeCradleR].forEach(o=>{o.material.emissive=new THREE.Color(0xc99700);o.material.emissiveIntensity=.82});const finishChargePad=box(0,.17,10.46,4.8,.055,.52,0xffffff);",
           "[finalChargeCradlePad,finalChargeCradleL,finalChargeCradleR].forEach(o=>{o.material.emissive=new THREE.Color(0xc99700);o.material.emissiveIntensity=.82});const finalChargeGateL=box(-FINAL_CHARGE_GATE_HALF_X-.11,.88,FINAL_CHARGE_GATE_Z,.18,1.76,.18,0xffef6a),finalChargeGateR=box(FINAL_CHARGE_GATE_HALF_X+.11,.88,FINAL_CHARGE_GATE_Z,.18,1.76,.18,0xffef6a),finalChargeGate=box(0,FINAL_CHARGE_GATE_CLOSED_Y,FINAL_CHARGE_GATE_Z,FINAL_CHARGE_GATE_HALF_X*2,.22,.22,0xffd23f);[finalChargeGateL,finalChargeGateR,finalChargeGate].forEach(o=>{o.material.emissive=new THREE.Color(0xc99700);o.material.emissiveIntensity=.9});const finishChargePad=box(0,.17,10.46,4.8,.055,.52,0xffffff);"),
          ("function inFinalChargeCradleRail(x,z,r=0){return z>FINAL_CHARGE_CRADLE_Z_MIN&&z<FINAL_CHARGE_CRADLE_Z_MAX&&Math.abs(x)>FINAL_CHARGE_CRADLE_HALF_X-r}function blocked(x,z){",
           "function inFinalChargeCradleRail(x,z,r=0){return z>FINAL_CHARGE_CRADLE_Z_MIN&&z<FINAL_CHARGE_CRADLE_Z_MAX&&Math.abs(x)>FINAL_CHARGE_CRADLE_HALF_X-r}function finalChargeGateBlocks(x,z,r=.4,top=LIFT_GATE_PLAYER_TOP){const overlaps=Math.abs(z-FINAL_CHARGE_GATE_Z)<.18+r*.35&&Math.abs(x)<FINAL_CHARGE_GATE_HALF_X+r,barBottom=finalChargeGate.position.y-.11;return overlaps&&barBottom<top}function blocked(x,z){"),
          ("if(inFinalChargeCradleRail(x,z,.4))return true;if(z>FINISH_Z_MIN", "if(inFinalChargeCradleRail(x,z,.4))return true;if(finalChargeGateBlocks(x,z,.4,LIFT_GATE_PLAYER_TOP))return true;if(z>FINISH_Z_MIN"),
          ("if(inFinalChargeCradleRail(x,z,r))return true;if(z>FINISH_Z_MIN", "if(inFinalChargeCradleRail(x,z,r))return true;if(finalChargeGateBlocks(x,z,r,LIFT_GATE_BRAIN_TOP))return true;if(z>FINISH_Z_MIN"),
          ("const playerInFinish=p.z>FINAL_RECOVERY_Z_MAX&&Math.abs(p.x)<FINISH_X,brainrotInFinish=bp.z>FINAL_RECOVERY_Z_MAX&&Math.abs(bp.x)<FINISH_X-.1;",
           "const playerInFinish=p.z>FINAL_CHARGE_CRADLE_Z_MIN-.02&&p.z<FINAL_CHARGE_GATE_Z-.14&&Math.abs(p.x)<FINAL_CHARGE_CRADLE_HALF_X-.18,brainrotInFinish=bp.z>FINAL_CHARGE_CRADLE_Z_MIN-.02&&bp.z<FINAL_CHARGE_GATE_Z-.14&&Math.abs(bp.x)<FINAL_CHARGE_CRADLE_HALF_X-.18;"),
          ("finishArchTop.material.emissiveIntensity=finishCharging?.7+1.0*(.5+.5*Math.sin(t*18)):(finishProgress>=1?1.25:0);if(!win&&finishProgress>=1){",
           "finishArchTop.material.emissiveIntensity=finishCharging?.7+1.0*(.5+.5*Math.sin(t*18)):(finishProgress>=1?1.25:0);const chargeGateTarget=win?FINAL_CHARGE_GATE_OPEN_Y:FINAL_CHARGE_GATE_CLOSED_Y,chargeGateStep=4.8*dt;finalChargeGate.position.y+=Math.max(-chargeGateStep,Math.min(chargeGateStep,chargeGateTarget-finalChargeGate.position.y));const chargeGateColor=finishProgress>=1?0x49ff79:(finishCharging?0xfff36a:0xffd23f);[finalChargeGateL,finalChargeGateR,finalChargeGate].forEach(o=>{o.material.color.setHex(chargeGateColor);o.material.emissive.setHex(finishProgress>=1?0x19b24e:0xc99700);o.material.emissiveIntensity=finishCharging?1.25+.65*(.5+.5*Math.sin(t*16)):.9});if(!win&&finishProgress>=1){")
          ]
          for a,b in reps:
              if a not in s:
                  raise SystemExit('missing patch anchor: '+a[:120])
              s=s.replace(a,b,1)
          p.write_text(s)
          PY
      - name: Validate runtime and finish gate invariants
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          required=['full 3D lift route v58 · physical finish docking gate','FINAL_CHARGE_GATE_Z=10.88','finalChargeGateBlocks','finalChargeGate=box(0,FINAL_CHARGE_GATE_CLOSED_Y','p.z>FINAL_CHARGE_CRADLE_Z_MIN-.02','bp.z>FINAL_CHARGE_CRADLE_Z_MIN-.02','chargeGateTarget=win?FINAL_CHARGE_GATE_OPEN_Y:FINAL_CHARGE_GATE_CLOSED_Y']
          for x in required: assert x in s, x
          assert 'const playerInFinish=p.z>FINAL_RECOVERY_Z_MAX' not in s
          print('finish docking gate invariants PASS')
          PY
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(); mod=s.split('<script type="module">',1)[1].split('</script>',1)[0]; Path('/tmp/runtime.mjs').write_text(mod)
          PY
          node --check /tmp/runtime.mjs
          node scripts/final-finish-charge-check.mjs
          node scripts/final-finish-residual-momentum-check.mjs
      - name: Commit gameplay change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add physical final charge docking gate'
          git push origin HEAD:new-player-glb-overhaul
