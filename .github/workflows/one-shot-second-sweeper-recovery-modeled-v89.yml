name: One-shot second sweeper recovery modeled v89

on:
  push:
    branches: [new-player-glb-overhaul]
    paths:
      - '.github/workflows/one-shot-second-sweeper-recovery-modeled-v89.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-player-glb-overhaul
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch real 3D recovery assembly
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="""const secondSweeperRecoveryPad=box(0,.03,(SECOND_SWEEPER_RECOVERY_Z_MIN+SECOND_SWEEPER_RECOVERY_Z_MAX)*.5,SECOND_SWEEPER_RECOVERY_HALF_X*2,.06,SECOND_SWEEPER_RECOVERY_Z_MAX-SECOND_SWEEPER_RECOVERY_Z_MIN,0x49ff79);function makeSecondSweeperRecoveryRail(x){const g=new THREE.Group();g.position.set(x,0,(SECOND_SWEEPER_RECOVERY_Z_MIN+SECOND_SWEEPER_RECOVERY_Z_MAX)*.5);const rail=new THREE.Mesh(new THREE.CapsuleGeometry(.14,.34,4,8),mat(0x49ff79));rail.position.y=.34;rail.rotation.x=Math.PI/2;rail.castShadow=rail.receiveShadow=true;rail.material.emissive=new THREE.Color(0x159b43);rail.material.emissiveIntensity=.5;g.add(rail);[-.16,.16].forEach(z=>{const post=new THREE.Mesh(new THREE.CylinderGeometry(.12,.15,.58,10),mat(0x2b375b));post.position.set(0,.29,z);post.castShadow=post.receiveShadow=true;g.add(post)});scene.add(g);return g}const secondSweeperRecoveryL=makeSecondSweeperRecoveryRail(-SECOND_SWEEPER_RECOVERY_HALF_X-.10),secondSweeperRecoveryR=makeSecondSweeperRecoveryRail(SECOND_SWEEPER_RECOVERY_HALF_X+.10);secondSweeperRecoveryPad.material.emissive=new THREE.Color(0x159b43);secondSweeperRecoveryPad.material.emissiveIntensity=.5;"""
          new="""const SECOND_SWEEPER_RECOVERY_MODEL_V89=true;const secondSweeperRecoveryPad=box(0,.03,(SECOND_SWEEPER_RECOVERY_Z_MIN+SECOND_SWEEPER_RECOVERY_Z_MAX)*.5,SECOND_SWEEPER_RECOVERY_HALF_X*2,.06,SECOND_SWEEPER_RECOVERY_Z_MAX-SECOND_SWEEPER_RECOVERY_Z_MIN,0x49ff79);function makeSecondSweeperRecoveryGuard(side){const g=new THREE.Group();g.name='SecondSweeperRecoveryGuardV89';g.position.set(side*(SECOND_SWEEPER_RECOVERY_HALF_X+.10),0,(SECOND_SWEEPER_RECOVERY_Z_MIN+SECOND_SWEEPER_RECOVERY_Z_MAX)*.5);const railMat=mat(0x49ff79),dark=mat(0x173a32),accent=mat(0xeaffef);const rail=new THREE.Mesh(new THREE.CapsuleGeometry(.095,.31,4,8),railMat);rail.name='SecondSweeperRecoveryRailV89';rail.position.y=.40;rail.rotation.x=Math.PI/2;rail.castShadow=rail.receiveShadow=true;rail.material.emissive=new THREE.Color(0x159b43);rail.material.emissiveIntensity=.5;g.add(rail);[-.14,.14].forEach((z,i)=>{const post=new THREE.Mesh(new THREE.CylinderGeometry(.07,.10,.70,8),dark);post.name='SecondSweeperRecoveryPostV89';post.position.set(0,.35,z);post.castShadow=post.receiveShadow=true;g.add(post);const collar=new THREE.Mesh(new THREE.TorusGeometry(.105,.027,6,10),accent);collar.name='SecondSweeperRecoveryBeaconV89';collar.rotation.x=Math.PI/2;collar.position.set(0,.75,z);collar.castShadow=true;collar.material.emissive=new THREE.Color(i?0x49ff79:0x8affc5);collar.material.emissiveIntensity=.76;g.add(collar)});const cap=new THREE.Mesh(new THREE.OctahedronGeometry(.09,0),accent);cap.name='SecondSweeperRecoveryCapV89';cap.position.set(0,.88,0);cap.castShadow=true;cap.material.emissive=new THREE.Color(0x49ff79);cap.material.emissiveIntensity=.82;g.add(cap);scene.add(g);return g}const secondSweeperRecoveryL=makeSecondSweeperRecoveryGuard(-1),secondSweeperRecoveryR=makeSecondSweeperRecoveryGuard(1);secondSweeperRecoveryPad.material.emissive=new THREE.Color(0x159b43);secondSweeperRecoveryPad.material.emissiveIntensity=.5;"""
          if old not in s:
              raise SystemExit('expected v88 recovery source not found; refusing to overwrite newer work')
          s=s.replace(old,new,1)
          s=s.replace('full 3D lift route v88 · modeled second sweeper gate','full 3D lift route v89 · modeled second sweeper recovery',1)
          p.write_text(s)
          PY
      - name: Verify v89 geometry and preserved gameplay envelope
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          required=[
            'SECOND_SWEEPER_RECOVERY_MODEL_V89=true',
            "SecondSweeperRecoveryGuardV89",
            "SecondSweeperRecoveryRailV89",
            "SecondSweeperRecoveryPostV89",
            "SecondSweeperRecoveryBeaconV89",
            "SecondSweeperRecoveryCapV89",
            'SECOND_SWEEPER_RECOVERY_Z_MIN=3.18',
            'SECOND_SWEEPER_RECOVERY_Z_MAX=3.55',
            'SECOND_SWEEPER_RECOVERY_HALF_X=1.9',
            'SECOND_SWEEPER_RECOVERY_DAMP=11.0',
          ]
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('missing invariants: '+repr(missing))
          forbidden=['function makeSecondSweeperRecoveryRail(x)']
          present=[x for x in forbidden if x in s]
          if present: raise SystemExit('stale recovery primitive found: '+repr(present))
          print('v89 modeled recovery geometry + gameplay envelope invariants: OK')
          PY
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          a=s.index('<script type="module">')+len('<script type="module">')
          b=s.index('</script>',a)
          Path('/tmp/game.mjs').write_text(s[a:b])
          PY
          node --check /tmp/game.mjs
          git diff --check
      - name: Commit real level change
        shell: bash
        run: |
          git config user.name 'amazin20'
          git config user.email '138931938+amazin20@users.noreply.github.com'
          git add index.html
          git commit -m 'Model second sweeper recovery pocket v89'
          git push origin HEAD:new-player-glb-overhaul
