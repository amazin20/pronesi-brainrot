name: One-shot second sweeper modeled gate v88
on:
  push:
    branches: [new-player-glb-overhaul]
    paths: ['.github/workflows/one-shot-second-sweeper-model-v88.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-player-glb-overhaul
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch second sweeper gate to modeled assembly
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          s=s.replace('full 3D lift route v87 · modeled first sweeper entry gate','full 3D lift route v88 · modeled second sweeper gate',1)
          old="secondSweeperGateL=box(-1.88,.88,SECOND_SWEEPER_GATE_Z,.16,1.76,.16,0xffb12b),secondSweeperGateR=box(1.88,.88,SECOND_SWEEPER_GATE_Z,.16,1.76,.16,0xffb12b),secondSweeperGate=box(0,SECOND_SWEEPER_GATE_CLOSED_Y,SECOND_SWEEPER_GATE_Z,SECOND_SWEEPER_GATE_HALF_X*2,.22,.22,0xff315d);function makeSecondSweeperShieldRail"
          new="SECOND_SWEEPER_GATE_MODEL_V88=true;function makeSecondSweeperGatePost(side){const post=new THREE.Mesh(new THREE.CapsuleGeometry(.12,1.52,5,10),mat(0xffb12b));post.name='SecondSweeperGatePostV88';post.position.set(side*1.88,.88,SECOND_SWEEPER_GATE_Z);post.castShadow=post.receiveShadow=true;post.material.emissive=new THREE.Color(0xb86a00);post.material.emissiveIntensity=.9;const foot=new THREE.Mesh(new THREE.CylinderGeometry(.22,.29,.18,10),mat(0x4b3410));foot.name='SecondSweeperGateFootV88';foot.position.y=-.79;foot.castShadow=foot.receiveShadow=true;post.add(foot);[-.42,.42].forEach((y,i)=>{const collar=new THREE.Mesh(new THREE.TorusGeometry(.17,.04,6,12),mat(0xfff0b0));collar.name='SecondSweeperGateCollarV88';collar.rotation.x=Math.PI/2;collar.position.y=y;collar.castShadow=true;collar.material.emissive=new THREE.Color(i?0xffd84d:0xffb12b);collar.material.emissiveIntensity=.72;post.add(collar)});const beacon=new THREE.Mesh(new THREE.OctahedronGeometry(.11,0),mat(0xffffff));beacon.name='SecondSweeperGateBeaconV88';beacon.position.y=.89;beacon.castShadow=true;beacon.material.emissive=new THREE.Color(0xffb12b);beacon.material.emissiveIntensity=1.0;post.add(beacon);scene.add(post);return post}const secondSweeperGateL=makeSecondSweeperGatePost(-1),secondSweeperGateR=makeSecondSweeperGatePost(1);const secondSweeperGate=new THREE.Mesh(new THREE.CapsuleGeometry(.11,SECOND_SWEEPER_GATE_HALF_X*2-.22,4,8),mat(0xff315d));secondSweeperGate.name='SecondSweeperGateBarV88';secondSweeperGate.rotation.z=Math.PI/2;secondSweeperGate.position.set(0,SECOND_SWEEPER_GATE_CLOSED_Y,SECOND_SWEEPER_GATE_Z);secondSweeperGate.castShadow=secondSweeperGate.receiveShadow=true;secondSweeperGate.material.emissive=new THREE.Color(0xa20d38);secondSweeperGate.material.emissiveIntensity=.9;[-1.22,0,1.22].forEach((x,i)=>{const ring=new THREE.Mesh(new THREE.TorusGeometry(.14,.032,6,10),mat(0xffffff));ring.name='SecondSweeperGateBarRingV88';ring.rotation.y=Math.PI/2;ring.position.set(0,x,0);ring.castShadow=true;ring.material.emissive=new THREE.Color(i===1?0xffffff:0xff315d);ring.material.emissiveIntensity=.82;secondSweeperGate.add(ring)});scene.add(secondSweeperGate);function makeSecondSweeperShieldRail"
          assert old in s, 'current second sweeper primitive gate anchor missing'
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Verify modeled gate and runtime syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          required=[
            'full 3D lift route v88 · modeled second sweeper gate',
            'SECOND_SWEEPER_GATE_MODEL_V88=true',
            "SecondSweeperGatePostV88",
            "SecondSweeperGateFootV88",
            "SecondSweeperGateCollarV88",
            "SecondSweeperGateBeaconV88",
            "SecondSweeperGateBarV88",
            "SecondSweeperGateBarRingV88",
            'secondSweeperTimingGateBlocks(x,z,r=.4,top=LIFT_GATE_PLAYER_TOP)',
            'SECOND_SWEEPER_GATE_Z=-.48',
            'SECOND_SWEEPER_GATE_HALF_X=1.72',
            'SECOND_SWEEPER_GATE_CLOSED_Y=.62',
            'SECOND_SWEEPER_GATE_OPEN_Y=2.82'
          ]
          for x in required: assert x in s,x
          assert "secondSweeperGateL=box(" not in s
          assert "secondSweeperGateR=box(" not in s
          assert "secondSweeperGate=box(" not in s
          assert "secondSweeperGate.position.y+=Math.max(-secondGateStep" in s
          start=s.index('<script type="module">')+len('<script type="module">'); end=s.index('</script>',start)
          Path('/tmp/game.mjs').write_text(s[start:end])
          print('second sweeper modeled gate v88 invariants PASS')
          PY
          node --check /tmp/game.mjs
          git diff --check
      - name: Commit gameplay change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Model second sweeper timing gate v88'
          git push origin HEAD:new-player-glb-overhaul
