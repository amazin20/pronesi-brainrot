name: One Shot Second Pit Carrier v72

on:
  push:
    branches: [new-player-glb-overhaul]

permissions:
  contents: write

jobs:
  patch-second-pit-carriers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-player-glb-overhaul
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Model second-pit carriers
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          if 'SECOND_PIT_CARRIER_MODEL_V72' not in s:
              start=s.index('const secondPitPlatforms=[[-SECOND_PLATFORM_BASE_X')
              end=s.index('const secondPitStagePad=', start)
              repl="""const SECOND_PIT_CARRIER_MODEL_V72=true;function makeSecondPitCarrier(x,c,i){const deck=box(x,-.04,SECOND_PIT_Z,SECOND_PLATFORM_HALF_X*2,.18,SECOND_PLATFORM_HALF_Z*2,c);deck.name='SecondPitCarrierDeckV72';deck.material.emissive=new THREE.Color(c);deck.material.emissiveIntensity=.58;const dark=mat(0x20253f),accent=mat(c);[-.22,.22].forEach(z=>{const pontoon=new THREE.Mesh(new THREE.CapsuleGeometry(.16,1.42,4,8),accent);pontoon.name='SecondPitCarrierPontoonV72';pontoon.rotation.z=Math.PI/2;pontoon.position.set(0,-.06,z);pontoon.scale.z=.82;pontoon.castShadow=pontoon.receiveShadow=true;deck.add(pontoon)});[-.78,.78].forEach(px=>{const hub=new THREE.Mesh(new THREE.CylinderGeometry(.13,.13,.34,10),dark);hub.name='SecondPitCarrierHubV72';hub.rotation.z=Math.PI/2;hub.position.set(px,-.02,0);hub.castShadow=hub.receiveShadow=true;deck.add(hub);const ring=new THREE.Mesh(new THREE.TorusGeometry(.19,.045,6,12),accent);ring.name='SecondPitCarrierThrusterRingV72';ring.rotation.y=Math.PI/2;ring.position.set(px,-.02,0);ring.castShadow=true;deck.add(ring)});const railMat=mat(0xffffff);[-.27,.27].forEach(z=>{const rail=new THREE.Mesh(new THREE.CylinderGeometry(.035,.035,1.5,8),railMat);rail.name='SecondPitCarrierRailV72';rail.rotation.z=Math.PI/2;rail.position.set(0,.16,z);rail.castShadow=true;deck.add(rail)});const stripe=box(x,.085,SECOND_PIT_Z,1.5,.035,.5,0xffffff);stripe.material.emissive=new THREE.Color(i?0x44e7ff:0xff5fc7);stripe.material.emissiveIntensity=1.15;return{mesh:deck,stripe,side:i?1:-1,lastX:x}}const secondPitPlatforms=[[-SECOND_PLATFORM_BASE_X,0xff5fc7],[SECOND_PLATFORM_BASE_X,0x44e7ff]].map(([x,c],i)=>makeSecondPitCarrier(x,c,i));"""
              s=s[:start]+repl+s[end:]
              s=s.replace('full 3D lift route v69 · physical second sweeper shield and recovery','full 3D lift route v72 · modeled second-pit carrier assemblies')
              p.write_text(s)

          q=Path('scripts/second-pit-carrier-model-v72-check.mjs')
          if not q.exists():
              q.write_text("""import fs from 'node:fs';\nconst src=fs.readFileSync(process.argv[2]||'index.html','utf8');\nconst required=['SECOND_PIT_CARRIER_MODEL_V72','SecondPitCarrierDeckV72','SecondPitCarrierPontoonV72','SecondPitCarrierHubV72','SecondPitCarrierThrusterRingV72','SecondPitCarrierRailV72','makeSecondPitCarrier(x,c,i)'];\nfor(const token of required)if(!src.includes(token))throw new Error(`Missing modeled carrier token: ${token}`);\nif(!src.includes('const secondPitPlatforms=[[-SECOND_PLATFORM_BASE_X')||!src.includes('SECOND_PLATFORM_BASE_X,0x44e7ff'))throw new Error('Mirrored second-pit carriers missing');\nif(!src.includes('platform.mesh.position.x=newX')||!src.includes('playerRideVX=dx*invDt')||!src.includes('brainRideVX=dx*invDt'))throw new Error('Carrier motion/rider transfer contract changed');\nconsole.log('SECOND PIT CARRIER MODEL V72: PASS');\n""")
          PY

      - name: Run exact checks
        run: |
          set -euo pipefail
          node scripts/second-pit-platform-motion-v71-check.mjs
          node scripts/second-pit-carrier-model-v72-check.mjs
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          a=s.index('<script type="module">')+len('<script type="module">')
          b=s.index('</script>',a)
          Path('/tmp/runtime-v72.mjs').write_text(s[a:b])
          PY
          node --check /tmp/runtime-v72.mjs
          git diff --check

      - name: Commit real gameplay change
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'v72 already present; nothing to commit'
            exit 0
          fi
          git config user.name 'amazin20'
          git config user.email '138931938+amazin20@users.noreply.github.com'
          git add index.html scripts/second-pit-carrier-model-v72-check.mjs
          git commit -m 'Model second-pit moving carriers as 3D assemblies v72'
          git push origin HEAD:new-player-glb-overhaul
