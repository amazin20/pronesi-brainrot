name: One-shot Final Side Towers V82

on:
  push:
    branches: [new-player-glb-overhaul]
    paths: ['.github/workflows/one-shot-final-side-towers-v82.yml']

permissions:
  contents: write

jobs:
  patch-check-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-player-glb-overhaul
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch final side towers v82
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          old="const finalGateL=box(-3.35,1.12,7.96,.18,2.2,1.95,0x2a315f),finalGateR=box(3.35,1.12,7.96,.18,2.2,1.95,0x2a315f);[finalGateL,finalGateR].forEach(o=>{o.material.metalness=.25;o.material.roughness=.32});"
          new="const FINAL_SIDE_TOWER_MODEL_V82=true;function makeFinalSideTower(side){const g=new THREE.Group();g.name='FinalSideTowerV82';g.position.set(side*3.35,0,7.96);const shell=mat(0x2a315f),dark=mat(0x12172f),accent=mat(side<0?0xffb12b:0xff557c);const spine=new THREE.Mesh(new THREE.CapsuleGeometry(.16,1.72,5,10),shell);spine.name='FinalSideTowerSpineV82';spine.position.y=1.10;spine.castShadow=spine.receiveShadow=true;spine.material.metalness=.28;spine.material.roughness=.30;g.add(spine);[-.72,0,.72].forEach((z,i)=>{const foot=new THREE.Mesh(new THREE.CylinderGeometry(.20,.28,.20,10),dark);foot.name='FinalSideTowerFootV82';foot.position.set(0,.10,z);foot.castShadow=foot.receiveShadow=true;g.add(foot);const brace=new THREE.Mesh(new THREE.CylinderGeometry(.07,.09,1.62,8),shell);brace.name='FinalSideTowerBraceV82';brace.position.set(0,.82,z);brace.castShadow=brace.receiveShadow=true;g.add(brace);const ring=new THREE.Mesh(new THREE.TorusGeometry(.18,.045,6,12),accent);ring.name='FinalSideTowerBeaconV82';ring.rotation.x=Math.PI/2;ring.position.set(0,1.62,z);ring.castShadow=true;ring.material.emissive=new THREE.Color(side<0?0xff8b12:0xff315d);ring.material.emissiveIntensity=i===1?1.0:.72;g.add(ring)});const crown=new THREE.Mesh(new THREE.CapsuleGeometry(.11,1.55,4,8),shell);crown.name='FinalSideTowerCrownV82';crown.rotation.x=Math.PI/2;crown.position.set(0,2.08,0);crown.castShadow=crown.receiveShadow=true;g.add(crown);scene.add(g);return g}const finalGateL=makeFinalSideTower(-1),finalGateR=makeFinalSideTower(1);"
          if old not in s: raise SystemExit('expected finalGate box walls not found')
          s=s.replace(old,new,1)
          s=s.replace('full 3D lift route v81 · modeled mid-safe pocket','full 3D lift route v82 · modeled final side towers',1)
          p.write_text(s)
          PY
      - name: Verify modeled towers and preserved gameplay envelope
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          required=['FINAL_SIDE_TOWER_MODEL_V82=true','FinalSideTowerV82','FinalSideTowerSpineV82','FinalSideTowerFootV82','FinalSideTowerBraceV82','FinalSideTowerBeaconV82','FinalSideTowerCrownV82','FINAL_GAUNTLET_HOME_X=3.42','FINAL_GAUNTLET_IN_X=.92','FINAL_GAUNTLET_HALF_X=.68','FINAL_GAUNTLET_CLEAR_Z=8.92','function updateFinalGauntlet']
          for x in required:
            if x not in s: raise SystemExit('missing '+x)
          if 'finalGateL=box(' in s or 'finalGateR=box(' in s: raise SystemExit('stale finalGate box walls remain')
          print('FINAL_SIDE_TOWERS_V82: PASS')
          PY
      - name: Browser module syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(); a=s.index('<script type="module">')+len('<script type="module">'); b=s.index('</script>',a); Path('/tmp/runtime.mjs').write_text(s[a:b])
          PY
          node --check /tmp/runtime.mjs
      - name: Final puncher physics contract
        run: node scripts/final-puncher-physics-contract-v65.mjs
      - name: Diff whitespace check
        run: git diff --check
      - name: Commit gameplay geometry
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Model final gauntlet side towers v82'
          git push origin HEAD:new-player-glb-overhaul
