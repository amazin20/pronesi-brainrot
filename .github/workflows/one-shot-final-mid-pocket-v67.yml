name: one-shot final midpoint pocket v67
on:
  push:
    branches: [new-player-glb-overhaul]
    paths: ['.github/workflows/one-shot-final-mid-pocket-v67.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-player-glb-overhaul
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch real level
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('full 3D lift route v66 · modeled final punchers','full 3D lift route v67 · carry-safe final midpoint')
          old="const FINAL_GAUNTLET_Z1=7.55,FINAL_GAUNTLET_Z2=8.38,FINAL_GAUNTLET_HOME_X=3.42,FINAL_GAUNTLET_IN_X=.92,FINAL_GAUNTLET_HALF_X=.68,FINAL_GAUNTLET_HALF_Z=.34,FINAL_GAUNTLET_CLEAR_Z=8.92,FINAL_GAUNTLET_SPEED=2.35;"
          new=old+"const FINAL_MID_SAFE_Z_MIN=7.88,FINAL_MID_SAFE_Z_MAX=8.18,FINAL_MID_SAFE_HALF_X=1.52,FINAL_MID_SAFE_DAMP=14.0;"
          assert old in s
          s=s.replace(old,new,1)
          old2="[finalGauntletPad1,finalGauntletPad2].forEach(o=>{o.material.emissive=new THREE.Color(o.material.color);o.material.emissiveIntensity=.62});"
          new2=old2+"const finalMidSafePad=box(0,.032,(FINAL_MID_SAFE_Z_MIN+FINAL_MID_SAFE_Z_MAX)*.5,FINAL_MID_SAFE_HALF_X*2,.064,FINAL_MID_SAFE_Z_MAX-FINAL_MID_SAFE_Z_MIN,0x49ff79),finalMidSafeL=box(-FINAL_MID_SAFE_HALF_X-.10,.40,(FINAL_MID_SAFE_Z_MIN+FINAL_MID_SAFE_Z_MAX)*.5,.16,.80,FINAL_MID_SAFE_Z_MAX-FINAL_MID_SAFE_Z_MIN,0x49ff79),finalMidSafeR=box(FINAL_MID_SAFE_HALF_X+.10,.40,(FINAL_MID_SAFE_Z_MIN+FINAL_MID_SAFE_Z_MAX)*.5,.16,.80,FINAL_MID_SAFE_Z_MAX-FINAL_MID_SAFE_Z_MIN,0x49ff79);[finalMidSafePad,finalMidSafeL,finalMidSafeR].forEach(o=>{o.material.emissive=new THREE.Color(0x159b43);o.material.emissiveIntensity=.62});"
          assert old2 in s
          s=s.replace(old2,new2,1)
          old3="function inFinalGauntletApproachRail(x,z,r=0){return z>FINAL_GAUNTLET_APPROACH_Z_MIN&&z<FINAL_GAUNTLET_APPROACH_Z_MAX&&Math.abs(x)>FINAL_GAUNTLET_APPROACH_HALF_X-r}"
          new3=old3+"function inFinalMidSafeRail(x,z,r=0){return z>FINAL_MID_SAFE_Z_MIN&&z<FINAL_MID_SAFE_Z_MAX&&Math.abs(x)>FINAL_MID_SAFE_HALF_X-r}"
          assert old3 in s
          s=s.replace(old3,new3,1)
          s=s.replace("if(inFinalGauntletApproachRail(x,z,.4))return true;","if(inFinalGauntletApproachRail(x,z,.4))return true;if(inFinalMidSafeRail(x,z,.4))return true;",1)
          s=s.replace("if(inFinalGauntletApproachRail(x,z,r))return true;","if(inFinalGauntletApproachRail(x,z,r))return true;if(inFinalMidSafeRail(x,z,r))return true;",1)
          old4="const active=checkpoint&&!finalGauntletCleared&&!win&&failTimer<=0,pulse=.5+.5*Math.sin(t*10);finalPunchers.forEach((h,i)=>{"
          new4="const active=checkpoint&&!finalGauntletCleared&&!win&&failTimer<=0,pulse=.5+.5*Math.sin(t*10),midSafe=active&&carry&&p.z>FINAL_MID_SAFE_Z_MIN&&p.z<FINAL_MID_SAFE_Z_MAX&&bp.z>FINAL_MID_SAFE_Z_MIN-.18&&bp.z<FINAL_MID_SAFE_Z_MAX+.18&&Math.abs(p.x)<FINAL_MID_SAFE_HALF_X&&Math.abs(bp.x)<FINAL_MID_SAFE_HALF_X+.18;finalPunchers.forEach((h,i)=>{"
          assert old4 in s
          s=s.replace(old4,new4,1)
          old5="function hitBody(x,z,r,isBrain){if(!attack||hitLock>0||Math.abs(z-h.z)>FINAL_GAUNTLET_HALF_Z+r||x<minX-r||x>maxX+r)return false;"
          new5="function hitBody(x,z,r,isBrain){if(i===1&&midSafe)return false;if(!attack||hitLock>0||Math.abs(z-h.z)>FINAL_GAUNTLET_HALF_Z+r||x<minX-r||x>maxX+r)return false;"
          assert old5 in s
          s=s.replace(old5,new5,1)
          old6="finalGauntletPad2.material.emissiveIntensity=finalGauntletCleared?1.15:(active?.65+.7*(1-pulse):.35)}"
          new6="finalGauntletPad2.material.emissiveIntensity=finalGauntletCleared?1.15:(active?.65+.7*(1-pulse):.35);const midPulse=.5+.5*Math.sin(t*14);[finalMidSafePad,finalMidSafeL,finalMidSafeR].forEach(o=>o.material.emissiveIntensity=midSafe?1.35+.55*midPulse:.62);if(midSafe){playerMomentumX*=Math.exp(-FINAL_MID_SAFE_DAMP*dt);playerMomentumZ*=Math.exp(-FINAL_MID_SAFE_DAMP*dt);if(!win&&failTimer<=0)state.textContent='ФИНАЛ · БЕЗОПАСНЫЙ КАРМАН · ЖДИ ВТОРОЙ УДАР'}}"
          assert old6 in s
          s=s.replace(old6,new6,1)
          p.write_text(s)
          PY
          cat > scripts/final-mid-pocket-v67-check.mjs <<'JS'
          import fs from 'node:fs';
          const s=fs.readFileSync('index.html','utf8');
          const must=[
            'full 3D lift route v67 · carry-safe final midpoint',
            'FINAL_MID_SAFE_Z_MIN=7.88',
            'FINAL_MID_SAFE_Z_MAX=8.18',
            'function inFinalMidSafeRail',
            'i===1&&midSafe',
            "ФИНАЛ · БЕЗОПАСНЫЙ КАРМАН · ЖДИ ВТОРОЙ УДАР"
          ];
          for(const x of must) if(!s.includes(x)) throw new Error('missing '+x);
          const min=7.88,max=8.18,z1=7.55,z2=8.38;
          if(!(min>z1 && max<z2 && max-min>=.299)) throw new Error('unsafe midpoint placement');
          console.log('PASS final midpoint pocket v67', {depth:(max-min).toFixed(2), between:[z1,z2]});
          JS
      - name: Run real checks
        run: |
          node --check scripts/final-mid-pocket-v67-check.mjs
          node scripts/final-mid-pocket-v67-check.mjs
          node scripts/final-puncher-physics-contract-v65.mjs
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          js=s.split('<script type="module">',1)[1].split('</script>',1)[0]
          Path('/tmp/runtime-v67.mjs').write_text(js)
          PY
          node --check /tmp/runtime-v67.mjs
          git diff --check
      - name: Commit and push gameplay
        run: |
          git config user.name amazin20
          git config user.email 138931938+amazin20@users.noreply.github.com
          git add index.html scripts/final-mid-pocket-v67-check.mjs
          git commit -m 'Add carry-safe final midpoint pocket v67'
          git push origin HEAD:new-player-glb-overhaul
