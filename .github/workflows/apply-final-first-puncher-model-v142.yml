name: Apply First Final Puncher Model v142

on:
  push:
    branches: [new-player-glb-overhaul]
    paths:
      - .github/workflows/apply-final-first-puncher-model-v142.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-player-glb-overhaul
          fetch-depth: 0
      - name: Refuse stale/non-linear apply
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin new-player-glb-overhaul
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/new-player-glb-overhaul)"
          test "$(git rev-parse HEAD^)" = "6410c350d1b7451e1ef0c2ed482728efe5f4a94e"
      - name: Model first final puncher v142
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          if 'FINAL_FIRST_PUNCHER_MODEL_V142=true' in s:
              raise SystemExit('v142 already present')
          anchor='const FINAL_SIDE_TOWER_MODEL_V82=true;'
          if s.count(anchor) != 1:
              raise SystemExit(f'v142 model anchor count={s.count(anchor)}')
          model="""const FINAL_FIRST_PUNCHER_MODEL_V142=true;function modelFirstFinalPuncherV142(h){[h.mesh,h.cap].forEach(root=>root.traverse(o=>{if(!o.isMesh||!o.material)return;o.name=o===h.mesh?'FirstFinalPuncherLegacyCollisionCarrierV142':'FirstFinalPuncherLegacyPartV142';o.material.transparent=true;o.material.opacity=.025;o.material.depthWrite=false}));const g=new THREE.Group();g.name='FirstFinalPuncherMechanicalAssemblyV142';g.position.set(h.mesh.position.x,.62,h.z);const amber=mat(0xffb12b),dark=mat(0x1b203d),steel=mat(0xeef5ff),red=mat(0xff315d),cyan=mat(0x44e7ff);amber.metalness=.42;amber.roughness=.24;dark.metalness=.62;dark.roughness=.25;steel.metalness=.48;steel.roughness=.22;red.metalness=.34;red.roughness=.25;const shell=new THREE.Mesh(new THREE.BoxGeometry(1.12,.68,.62),dark);shell.name='FirstFinalPuncherArmoredHousingV142';shell.castShadow=shell.receiveShadow=true;g.add(shell);[-.36,.36].forEach((x,i)=>{const panel=new THREE.Mesh(new THREE.BoxGeometry(.30,.76,.68),i?amber:steel);panel.name='FirstFinalPuncherArmorPanelV142';panel.position.x=x;panel.castShadow=panel.receiveShadow=true;panel.material.emissive=new THREE.Color(i?0xa95a00:0x5f7d96);panel.material.emissiveIntensity=i?.46:.18;g.add(panel)});const ram=new THREE.Mesh(new THREE.CylinderGeometry(.18,.22,1.48,12),steel);ram.name='FirstFinalPuncherHydraulicRamV142';ram.rotation.z=Math.PI/2;ram.position.x=-h.side*.12;ram.castShadow=ram.receiveShadow=true;g.add(ram);[-.42,.42].forEach((z,i)=>{const rail=new THREE.Mesh(new THREE.CapsuleGeometry(.055,1.16,4,8),dark);rail.name='FirstFinalPuncherGuideRailV142';rail.rotation.z=Math.PI/2;rail.position.set(0,i?.25:-.25,z*.58);rail.castShadow=rail.receiveShadow=true;g.add(rail)});[-.36,0,.36].forEach((x,i)=>{const collar=new THREE.Mesh(new THREE.TorusGeometry(.24,.055,7,14),i===1?red:amber);collar.name='FirstFinalPuncherHydraulicCollarV142';collar.rotation.y=Math.PI/2;collar.position.x=x;collar.castShadow=true;collar.material.emissive=new THREE.Color(i===1?0xa20d38:0xa95a00);collar.material.emissiveIntensity=i===1?.80:.58;g.add(collar)});const headX=-h.side*(FINAL_GAUNTLET_HALF_X+.12);const head=new THREE.Mesh(new THREE.CylinderGeometry(.50,.58,.28,12),dark);head.name='FirstFinalPuncherStrikeHeadV142';head.rotation.z=Math.PI/2;head.position.x=headX;head.castShadow=head.receiveShadow=true;g.add(head);const bumper=new THREE.Mesh(new THREE.TorusGeometry(.50,.105,8,18),red);bumper.name='FirstFinalPuncherImpactBumperV142';bumper.rotation.y=Math.PI/2;bumper.position.x=headX-h.side*.15;bumper.castShadow=true;bumper.material.emissive=new THREE.Color(0xa20d38);bumper.material.emissiveIntensity=1.0;g.add(bumper);const face=new THREE.Mesh(new THREE.CylinderGeometry(.37,.42,.10,12),amber);face.name='FirstFinalPuncherImpactFaceV142';face.rotation.z=Math.PI/2;face.position.x=headX-h.side*.18;face.castShadow=face.receiveShadow=true;face.material.emissive=new THREE.Color(0xa95a00);face.material.emissiveIntensity=.76;g.add(face);const lamps=[];[-.26,.26].forEach((z,i)=>{const lamp=new THREE.Mesh(new THREE.OctahedronGeometry(.10,0),i?cyan:amber);lamp.name='FirstFinalPuncherWarningLampV142';lamp.position.set(.04,.42,z);lamp.castShadow=true;lamp.material.emissive=new THREE.Color(i?0x087fa8:0xa95a00);lamp.material.emissiveIntensity=1.0;g.add(lamp);lamps.push(lamp)});[-.34,.34].forEach(z=>{const brace=new THREE.Mesh(new THREE.BoxGeometry(.82,.10,.10),steel);brace.name='FirstFinalPuncherHousingBraceV142';brace.position.set(0,-.36,z);brace.rotation.z=h.side*.08;brace.castShadow=brace.receiveShadow=true;g.add(brace)});scene.add(g);h.puncherVisualV142=g;h.puncherLampsV142=lamps;h.puncherImpactBumperV142=bumper;h.puncherImpactFaceV142=face;return g}modelFirstFinalPuncherV142(finalPunchers[0]);"""
          s=s.replace(anchor,model+anchor,1)
          tick_anchor='h.cap.position.x=newX-h.side*(FINAL_GAUNTLET_HALF_X+.12);'
          if s.count(tick_anchor) != 1:
              raise SystemExit(f'v142 tick anchor count={s.count(tick_anchor)}')
          tick="""if(h.puncherVisualV142){h.puncherVisualV142.position.x=newX;const puncherPulseV142=.5+.5*Math.sin(t*(warning?20:11));h.puncherLampsV142.forEach((lamp,k)=>{lamp.material.emissive.setHex(finalGauntletCleared?0x19b24e:(attack?0xa20d38:(warning?(k?0xffffff:0xff8b12):(k?0x087fa8:0xa95a00))));lamp.material.color.setHex(finalGauntletCleared?0x49ff79:(attack?0xff315d:(warning?(k?0xffffff:0xffb12b):(k?0x44e7ff:0xffb12b))));lamp.material.emissiveIntensity=finalGauntletCleared?1.15:(attack?1.45+.45*puncherPulseV142:(warning?1.15+.75*puncherPulseV142:1.0))});h.puncherImpactBumperV142.material.emissive.setHex(finalGauntletCleared?0x19b24e:(attack?0xa20d38:0xa95a00));h.puncherImpactBumperV142.material.color.setHex(finalGauntletCleared?0x49ff79:(attack?0xff315d:0xffb12b));h.puncherImpactBumperV142.material.emissiveIntensity=finalGauntletCleared?1.10:(attack?1.35+.45*puncherPulseV142:.90);h.puncherImpactFaceV142.material.emissive.setHex(finalGauntletCleared?0x19b24e:(attack?0xa95a00:0xa95a00));h.puncherImpactFaceV142.material.color.setHex(finalGauntletCleared?0x49ff79:(attack?0xffd84d:0xffb12b));h.puncherImpactFaceV142.material.emissiveIntensity=finalGauntletCleared?1.0:(attack?1.15+.30*puncherPulseV142:.76);}"""
          s=s.replace(tick_anchor,tick_anchor+tick,1)
          p.write_text(s)
      - name: Verify v142 puncher model and preserved physics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          required=['FINAL_FIRST_PUNCHER_MODEL_V142=true','FirstFinalPuncherMechanicalAssemblyV142','FirstFinalPuncherLegacyCollisionCarrierV142','FirstFinalPuncherArmoredHousingV142','FirstFinalPuncherHydraulicRamV142','FirstFinalPuncherHydraulicCollarV142','FirstFinalPuncherStrikeHeadV142','FirstFinalPuncherImpactBumperV142','FirstFinalPuncherImpactFaceV142','FirstFinalPuncherWarningLampV142','FINAL_GAUNTLET_Z1=7.55','FINAL_GAUNTLET_IN_X=.92','FINAL_GAUNTLET_HALF_X=.68','FINAL_GAUNTLET_SPEED=2.35']
          for token in required: assert token in s, token
          assert s.count('FINAL_FIRST_PUNCHER_MODEL_V142=true') == 1
          assert s.count("modelFirstFinalPuncherV142(finalPunchers[0])") == 1
          assert 'modelFirstFinalPuncherV142(finalPunchers[1])' not in s
          print('First final puncher mechanical model v142 contract: SUCCESS')
          PY
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text();m=re.search(r'<script type="module">(.*?)</script>',s,re.S);assert m
          Path('/tmp/brainrot-module.mjs').write_text(m.group(1))
          PY
          node --check /tmp/brainrot-module.mjs
          for f in scripts/final-puncher-physics-contract-v65.mjs scripts/final-finish-residual-momentum-check.mjs scripts/final-finish-soft-hold-check.mjs scripts/final-finish-charge-check.mjs scripts/second-pit-route-continuity-v70-check.mjs; do
            if [ -f "$f" ]; then node "$f"; else echo "SKIP missing $f"; fi
          done
      - name: Commit real level change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "openai-level-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && { echo 'No gameplay change produced'; exit 1; }
          git commit -m "Level: model first final puncher v142"
          git push origin HEAD:new-player-glb-overhaul
