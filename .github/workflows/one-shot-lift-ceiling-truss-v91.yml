name: One-shot lift ceiling truss v91
on:
  push:
    branches: [new-player-glb-overhaul]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-player-glb-overhaul
          fetch-depth: 2
      - name: Guard expected parent
        shell: bash
        run: |
          set -euo pipefail
          parent=$(git rev-parse HEAD^)
          test "$parent" = "1985ef486e21e13fa8adef54bd9cbec7ccd3b1c8"
      - name: Replace lift ceiling box with modeled truss
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="const liftCeiling=box(0,LIFT_CEILING_BOTTOM+.16,LIFT_Z,3.7,.32,1.35,0xff5e7d);liftCeiling.material.emissive=new THREE.Color(0xa71838);liftCeiling.material.emissiveIntensity=.55;const liftCeilingTopStripe=box(0,LIFT_CEILING_TOP+.025,LIFT_Z,2.8,.04,1.02,0x49ff79);liftCeilingTopStripe.material.emissive=new THREE.Color(0x19b24e);liftCeilingTopStripe.material.emissiveIntensity=1.05;"
          new="const LIFT_CEILING_MODEL_V91=true;const liftCeiling=new THREE.Mesh(new THREE.CapsuleGeometry(.14,3.38,4,8),mat(0xff5e7d));liftCeiling.name='LiftCeilingMainTrussV91';liftCeiling.rotation.z=Math.PI/2;liftCeiling.position.set(0,LIFT_CEILING_BOTTOM+.16,LIFT_Z);liftCeiling.castShadow=liftCeiling.receiveShadow=true;liftCeiling.material.emissive=new THREE.Color(0xa71838);liftCeiling.material.emissiveIntensity=.55;scene.add(liftCeiling);const liftCeilingDark=mat(0x3c1830),liftCeilingAccent=mat(0xffd6df);[-1.55,1.55].forEach((x,i)=>{const rail=new THREE.Mesh(new THREE.CapsuleGeometry(.085,1.10,4,8),liftCeilingDark);rail.name='LiftCeilingDepthRailV91';rail.rotation.x=Math.PI/2;rail.position.set(x,0,0);rail.castShadow=rail.receiveShadow=true;liftCeiling.add(rail);[-.48,.48].forEach(z=>{const node=new THREE.Mesh(new THREE.TorusGeometry(.15,.035,6,10),liftCeilingAccent);node.name='LiftCeilingNodeV91';node.rotation.x=Math.PI/2;node.position.set(x,0,z);node.castShadow=true;node.material.emissive=new THREE.Color(i?0xff557c:0xffb12b);node.material.emissiveIntensity=.78;liftCeiling.add(node)})});[-1.05,0,1.05].forEach((x,i)=>{const collar=new THREE.Mesh(new THREE.TorusGeometry(.18,.042,6,12),liftCeilingAccent);collar.name='LiftCeilingCollarV91';collar.rotation.y=Math.PI/2;collar.position.set(x,0,0);collar.castShadow=true;collar.material.emissive=new THREE.Color(i===1?0x49ff79:0xff5e7d);collar.material.emissiveIntensity=.82;liftCeiling.add(collar)});const liftCeilingTopStripe=box(0,LIFT_CEILING_TOP+.025,LIFT_Z,2.8,.04,1.02,0x49ff79);liftCeilingTopStripe.material.emissive=new THREE.Color(0x19b24e);liftCeilingTopStripe.material.emissiveIntensity=1.05;"
          if s.count(old)!=1:
              raise SystemExit(f'expected one liftCeiling box block, found {s.count(old)}')
          if 'LIFT_CEILING_MODEL_V91' in s:
              raise SystemExit('v91 marker already present')
          s=s.replace(old,new,1)
          s=s.replace('full 3D lift route v90 · modeled lift shaft supports','full 3D lift route v91 · modeled overhead lift truss',1)
          p.write_text(s)
          PY
      - name: Validate gameplay module and v91 invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          start=s.index('<script type="module">')+len('<script type="module">')
          end=s.index('</script>', start)
          Path('/tmp/game.mjs').write_text(s[start:end])
          must=[
            'const LIFT_CEILING_MODEL_V91=true',
            "name='LiftCeilingMainTrussV91'",
            "name='LiftCeilingDepthRailV91'",
            "name='LiftCeilingNodeV91'",
            "name='LiftCeilingCollarV91'",
            'LIFT_CEILING_BOTTOM=3.5',
            'LIFT_CEILING_TOP=3.82',
            'LIFT_CEILING_HALF_X=1.85',
            'LIFT_CEILING_HALF_Z=.675',
            'function underLiftCeiling',
            'function liftCeilingSideBlocked',
            'function segmentHitsLiftExpanded'
          ]
          for x in must:
            assert x in s, x
          assert 'const liftCeiling=box(0,LIFT_CEILING_BOTTOM+.16,LIFT_Z,3.7,.32,1.35,0xff5e7d)' not in s
          print('v91 modeled lift-ceiling + preserved collision envelope invariants: OK')
          PY
          node --check /tmp/game.mjs
          git diff --check
      - name: Commit gameplay change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Model lift ceiling overhead truss v91"
          git push origin HEAD:new-player-glb-overhaul
