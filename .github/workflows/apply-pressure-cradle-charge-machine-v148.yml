name: Apply Pressure Cradle Charge Machine v148

on:
  push:
    branches: [new-player-glb-overhaul]
    paths:
      - .github/workflows/apply-pressure-cradle-charge-machine-v148.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-player-glb-overhaul
          fetch-depth: 0
      - name: Refuse stale/non-linear apply
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin new-player-glb-overhaul
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/new-player-glb-overhaul)"
          test "$(git rev-parse HEAD^)" = "ead694aa2a24952ebc34ea05bc84d9a3ddaa7d5e"
          git merge-base --is-ancestor ead694aa2a24952ebc34ea05bc84d9a3ddaa7d5e HEAD
      - name: Model pressure cradle charge machine v148
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          if 'FINAL_PRESSURE_CRADLE_CHARGE_MACHINE_V148=true' in s:
              raise SystemExit('v148 already present')
          anchor='const FINAL_PRESSURE_CRADLE_CAPTURE_MODEL_V147=true'
          if s.count(anchor) != 1:
              raise SystemExit(f'v148 v147 anchor count={s.count(anchor)}')
          model="""const FINAL_PRESSURE_CRADLE_CHARGE_MACHINE_V148=true;const finalPressureChargeV148=new THREE.Group();finalPressureChargeV148.name='FinalPressureCradleChargeMachineV148';finalPressureChargeV148.position.set(0,0,FINAL_CHARGE_GATE_Z);scene.add(finalPressureChargeV148);const pressureChargeDarkV148=mat(0x101827),pressureChargeSteelV148=mat(0xd9e9f4),pressureChargeGoldV148=mat(0xffc82f),pressureChargeGreenV148=mat(0x49ff8b),pressureChargeCyanV148=mat(0x48dcff),pressureChargeRedV148=mat(0xff5766);pressureChargeDarkV148.metalness=.72;pressureChargeDarkV148.roughness=.22;pressureChargeSteelV148.metalness=.58;pressureChargeSteelV148.roughness=.17;const pressureChargeBaseV148=new THREE.Mesh(new THREE.BoxGeometry(4.46,.16,.72),pressureChargeDarkV148);pressureChargeBaseV148.name='FinalPressureChargeBaseV148';pressureChargeBaseV148.position.set(0,.08,.02);pressureChargeBaseV148.castShadow=pressureChargeBaseV148.receiveShadow=true;finalPressureChargeV148.add(pressureChargeBaseV148);[-1.86,1.86].forEach((x,si)=>{const tower=new THREE.Mesh(new THREE.BoxGeometry(.32,1.52,.36),pressureChargeDarkV148);tower.name='FinalPressureChargeTowerV148';tower.position.set(x,.78,.03);tower.castShadow=tower.receiveShadow=true;finalPressureChargeV148.add(tower);[.33,.72,1.11].forEach((y,k)=>{const collar=new THREE.Mesh(new THREE.TorusGeometry(.17,.035,7,14),k===1?pressureChargeGoldV148:(si?pressureChargeCyanV148:pressureChargeGreenV148));collar.name='FinalPressureChargeTowerCollarV148';collar.rotation.y=Math.PI/2;collar.position.set(x,y,.03);collar.castShadow=true;collar.material.emissive=new THREE.Color(k===1?0xc79500:(si?0x087fa9:0x139849));collar.material.emissiveIntensity=.72;finalPressureChargeV148.add(collar)});const piston=new THREE.Mesh(new THREE.CylinderGeometry(.075,.075,.68,10),pressureChargeSteelV148);piston.name='FinalPressureChargePistonV148';piston.rotation.z=Math.PI/2;piston.position.set(si?1.47:-1.47,.55,.03);piston.castShadow=piston.receiveShadow=true;finalPressureChargeV148.add(piston)});const pressureChargeJawPivotsV148=[],pressureChargeRollersV148=[],pressureChargeLampsV148=[];[-1,1].forEach((side,si)=>{const pivot=new THREE.Group();pivot.name='FinalPressureChargeJawPivotV148';pivot.position.set(side*1.64,.50,.02);pivot.userData.side=side;const jaw=new THREE.Mesh(new THREE.BoxGeometry(.84,.20,.30),pressureChargeSteelV148);jaw.name='FinalPressureChargeJawV148';jaw.position.set(-side*.37,0,0);jaw.castShadow=jaw.receiveShadow=true;jaw.material.emissive=new THREE.Color(si?0x087fa9:0x139849);jaw.material.emissiveIntensity=.34;pivot.add(jaw);[-.58,-.24].forEach((jx,k)=>{const roller=new THREE.Mesh(new THREE.CylinderGeometry(.105,.105,.24,10),k?pressureChargeGoldV148:(si?pressureChargeCyanV148:pressureChargeGreenV148));roller.name='FinalPressureChargeJawRollerV148';roller.rotation.z=Math.PI/2;roller.position.set(side*jx,-.01,.03);roller.castShadow=roller.receiveShadow=true;roller.material.emissive=new THREE.Color(k?0xc79500:(si?0x087fa9:0x139849));roller.material.emissiveIntensity=.76;pivot.add(roller);pressureChargeRollersV148.push(roller)});finalPressureChargeV148.add(pivot);pressureChargeJawPivotsV148.push(pivot)});const pressureChargeHeaderV148=new THREE.Mesh(new THREE.BoxGeometry(4.06,.22,.34),pressureChargeDarkV148);pressureChargeHeaderV148.name='FinalPressureChargeHeaderV148';pressureChargeHeaderV148.position.set(0,1.58,.03);pressureChargeHeaderV148.castShadow=pressureChargeHeaderV148.receiveShadow=true;finalPressureChargeV148.add(pressureChargeHeaderV148);[-1.28,-.64,0,.64,1.28].forEach((x,i)=>{const lamp=new THREE.Mesh(new THREE.OctahedronGeometry(.095,0),i===2?pressureChargeGoldV148:pressureChargeSteelV148);lamp.name='FinalPressureChargeStatusLampV148';lamp.position.set(x,1.58,.22);lamp.castShadow=true;lamp.material.emissive=new THREE.Color(i===2?0xc79500:(i<2?0x139849:0x087fa9));lamp.material.emissiveIntensity=.88;finalPressureChargeV148.add(lamp);pressureChargeLampsV148.push(lamp)});const pressureChargeLockRingV148=new THREE.Mesh(new THREE.TorusGeometry(.42,.075,9,22),pressureChargeGoldV148);pressureChargeLockRingV148.name='FinalPressureChargeLockRingV148';pressureChargeLockRingV148.rotation.x=Math.PI/2;pressureChargeLockRingV148.position.set(0,.27,.03);pressureChargeLockRingV148.castShadow=true;pressureChargeLockRingV148.material.emissive=new THREE.Color(0xc79500);pressureChargeLockRingV148.material.emissiveIntensity=.94;finalPressureChargeV148.add(pressureChargeLockRingV148);const pressureChargeCoreV148=new THREE.Mesh(new THREE.OctahedronGeometry(.16,0),pressureChargeCyanV148);pressureChargeCoreV148.name='FinalPressureChargeCoreV148';pressureChargeCoreV148.position.set(0,.54,.02);pressureChargeCoreV148.castShadow=true;pressureChargeCoreV148.material.emissive=new THREE.Color(0x087fa9);pressureChargeCoreV148.material.emissiveIntensity=1.05;finalPressureChargeV148.add(pressureChargeCoreV148);[-1.34,1.34].forEach((x,si)=>{const brace=new THREE.Mesh(new THREE.CapsuleGeometry(.04,.72,4,8),pressureChargeDarkV148);brace.name='FinalPressureChargeBraceV148';brace.rotation.z=si?-.66:.66;brace.position.set(x,1.18,.02);brace.castShadow=brace.receiveShadow=true;finalPressureChargeV148.add(brace)});"""
          s=s.replace(anchor,model+anchor,1)
          tick_anchor='const finalPressureCaptureActiveV147='
          if s.count(tick_anchor) != 1:
              raise SystemExit(f'v148 tick anchor count={s.count(tick_anchor)}')
          tick="""const finalPressureChargeActiveV148=finalGauntletCleared&&p.z>=FINAL_CHARGE_GATE_Z-.85&&p.z<=FINAL_CHARGE_GATE_Z+.72&&!win&&failTimer<=0,finalPressureChargeProgressV148=Math.max(0,Math.min(1,(p.z-(FINAL_CHARGE_GATE_Z-.78))/1.42)),finalPressureChargeGateOpenV148=Math.max(0,Math.min(1,(finalChargeGate.position.y-FINAL_CHARGE_GATE_CLOSED_Y)/(FINAL_CHARGE_GATE_OPEN_Y-FINAL_CHARGE_GATE_CLOSED_Y))),finalPressureChargePulseV148=.5+.5*Math.sin(t*14.8);pressureChargeJawPivotsV148.forEach((n,i)=>{const side=n.userData.side,close=(1-finalPressureChargeGateOpenV148)*(.10+.50*finalPressureChargeProgressV148);n.position.x=side*(1.64-.19*close);n.rotation.z=side*(.18-.23*close);n.children.forEach(c=>{if(c.isMesh&&c.material?.emissive)c.material.emissiveIntensity=finalPressureChargeActiveV148?.50+.54*finalPressureChargePulseV148:.30})});pressureChargeRollersV148.forEach((n,i)=>{n.rotation.x+=dt*(finalPressureChargeActiveV148?9.2:1.1)*(i%2?-1:1);n.material.emissiveIntensity=finalPressureChargeActiveV148?.76+.46*finalPressureChargePulseV148:.54});pressureChargeLampsV148.forEach((n,i)=>{const latched=finalPressureChargeProgressV148>=i/Math.max(1,pressureChargeLampsV148.length-1),open=finalPressureChargeGateOpenV148>.72;n.material.color.setHex(open?0x49ff8b:(latched?0xffc82f:(i%2?0x48dcff:0xff5766)));n.material.emissive.setHex(open?0x139849:(latched?0xc79500:(i%2?0x087fa9:0x9c1728)));n.material.emissiveIntensity=finalPressureChargeActiveV148?.78+.58*finalPressureChargePulseV148:.62});pressureChargeLockRingV148.rotation.z+=dt*(finalPressureChargeActiveV148?2.75:.28);pressureChargeLockRingV148.scale.setScalar(.92+.10*finalPressureChargeGateOpenV148);pressureChargeLockRingV148.material.emissiveIntensity=finalPressureChargeActiveV148?.92+.55*finalPressureChargePulseV148:.66;pressureChargeHeaderV148.material.emissive=pressureChargeHeaderV148.material.emissive||new THREE.Color(0x087fa9);pressureChargeHeaderV148.material.emissiveIntensity=finalPressureChargeActiveV148?.16+.48*finalPressureChargeGateOpenV148:.06;pressureChargeBaseV148.material.emissive=pressureChargeBaseV148.material.emissive||new THREE.Color(0x139849);pressureChargeBaseV148.material.emissiveIntensity=finalPressureChargeActiveV148?.12+.34*finalPressureChargeProgressV148:.04;pressureChargeCoreV148.rotation.y+=dt*(finalPressureChargeActiveV148?3.1:.35);pressureChargeCoreV148.material.emissiveIntensity=finalPressureChargeActiveV148?1.0+.62*finalPressureChargePulseV148:.72;"""
          s=s.replace(tick_anchor,tick+tick_anchor,1)
          p.write_text(s)
      - name: Verify v148 model and preserved finish physics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          required=['FINAL_PRESSURE_CRADLE_CHARGE_MACHINE_V148=true','FinalPressureCradleChargeMachineV148','FinalPressureChargeBaseV148','FinalPressureChargeTowerV148','FinalPressureChargeTowerCollarV148','FinalPressureChargePistonV148','FinalPressureChargeJawPivotV148','FinalPressureChargeJawV148','FinalPressureChargeJawRollerV148','FinalPressureChargeHeaderV148','FinalPressureChargeStatusLampV148','FinalPressureChargeLockRingV148','FinalPressureChargeCoreV148','FINAL_PRESSURE_CRADLE_CAPTURE_MODEL_V147=true','FINAL_CHARGE_GATE_VISUAL_MODEL_V116=true','FINAL_CHARGE_GATE_Z=10.88','FINAL_CHARGE_GATE_CLOSED_Y=.62','FINAL_CHARGE_GATE_OPEN_Y=2.55','FINAL_CHARGE_CRADLE_DAMP=15.5','FINAL_FINISH_FUNNEL_DAMP=10.5','FINAL_FINISH_FUNNEL_PULL=1.75']
          for token in required: assert token in s, token
          assert s.count('FINAL_PRESSURE_CRADLE_CHARGE_MACHINE_V148=true') == 1
          assert s.count('const finalPressureChargeActiveV148=') == 1
          print('Pressure cradle charge machine v148 contract: SUCCESS')
          PY
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text();m=re.search(r'<script type="module">(.*?)</script>',s,re.S);assert m
          Path('/tmp/brainrot-module.mjs').write_text(m.group(1))
          PY
          node --check /tmp/brainrot-module.mjs
          for f in scripts/final-puncher-physics-contract-v65.mjs scripts/final-finish-residual-momentum-check.mjs scripts/final-finish-soft-hold-check.mjs scripts/final-finish-charge-check.mjs scripts/second-pit-route-continuity-v70-check.mjs; do
            if [ -f "$f" ]; then node "$f"; else echo "SKIP missing $f"; fi
          done
      - name: Commit real level change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "openai-level-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && { echo 'No gameplay change produced'; exit 1; }
          git commit -m "Level: mechanical pressure cradle charge machine v148"
          git push origin HEAD:new-player-glb-overhaul
