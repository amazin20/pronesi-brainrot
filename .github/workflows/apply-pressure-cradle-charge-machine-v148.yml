name: Apply Final Receiving Dock Model v149

on:
  push:
    branches: [new-player-glb-overhaul]
    paths:
      - .github/workflows/apply-pressure-cradle-charge-machine-v148.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-player-glb-overhaul
          fetch-depth: 0
      - name: Refuse stale/non-linear apply
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin new-player-glb-overhaul
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/new-player-glb-overhaul)"
          test "$(git rev-parse HEAD^)" = "65a71711312ea4ee05ec27dc9a6c76222de209c1"
          git merge-base --is-ancestor 65a71711312ea4ee05ec27dc9a6c76222de209c1 HEAD
      - name: Model final receiving dock v149
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          if 'FINAL_RECEIVING_DOCK_MODEL_V149=true' in s:
              raise SystemExit('v149 already present')
          anchor='const FINAL_PRESSURE_CRADLE_CHARGE_MACHINE_V148=true'
          if s.count(anchor) != 1:
              raise SystemExit(f'v149 v148 anchor count={s.count(anchor)}')
          model="""const FINAL_RECEIVING_DOCK_MODEL_V149=true,FINAL_RECEIVING_DOCK_Z=10.20;const finalReceivingDockV149=new THREE.Group();finalReceivingDockV149.name='FinalReceivingDockV149';finalReceivingDockV149.position.set(0,0,FINAL_RECEIVING_DOCK_Z);scene.add(finalReceivingDockV149);const receiveDarkV149=mat(0x111726),receiveSteelV149=mat(0xdcebf4),receiveGoldV149=mat(0xffca36),receiveCyanV149=mat(0x45dcff),receiveGreenV149=mat(0x49ff8b);receiveDarkV149.metalness=.72;receiveDarkV149.roughness=.22;receiveSteelV149.metalness=.56;receiveSteelV149.roughness=.18;const receiveDeckV149=new THREE.Mesh(new THREE.BoxGeometry(3.72,.15,.78),receiveDarkV149);receiveDeckV149.name='FinalReceivingDockDeckV149';receiveDeckV149.position.set(0,.075,0);receiveDeckV149.castShadow=receiveDeckV149.receiveShadow=true;finalReceivingDockV149.add(receiveDeckV149);[-1.58,1.58].forEach((x,si)=>{const tower=new THREE.Mesh(new THREE.BoxGeometry(.30,1.34,.32),receiveDarkV149);tower.name='FinalReceivingDockTowerV149';tower.position.set(x,.67,.04);tower.castShadow=tower.receiveShadow=true;finalReceivingDockV149.add(tower);[.28,.62,.98].forEach((y,k)=>{const collar=new THREE.Mesh(new THREE.TorusGeometry(.16,.033,7,14),k===1?receiveGoldV149:(si?receiveCyanV149:receiveGreenV149));collar.name='FinalReceivingDockTowerCollarV149';collar.rotation.y=Math.PI/2;collar.position.set(x,y,.04);collar.castShadow=true;collar.material.emissive=new THREE.Color(k===1?0xc69200:(si?0x087fa9:0x139849));collar.material.emissiveIntensity=.72;finalReceivingDockV149.add(collar)})});const receiveJawPivotsV149=[],receiveRollersV149=[],receiveLampsV149=[];[-1,1].forEach((side,si)=>{const pivot=new THREE.Group();pivot.name='FinalReceivingDockJawPivotV149';pivot.position.set(side*1.34,.50,.02);pivot.userData.side=side;const arm=new THREE.Mesh(new THREE.BoxGeometry(.78,.17,.28),receiveSteelV149);arm.name='FinalReceivingDockJawV149';arm.position.set(-side*.35,0,0);arm.castShadow=arm.receiveShadow=true;arm.material.emissive=new THREE.Color(si?0x087fa9:0x139849);arm.material.emissiveIntensity=.28;pivot.add(arm);[-.54,-.21].forEach((jx,k)=>{const roller=new THREE.Mesh(new THREE.CylinderGeometry(.095,.095,.22,10),k?receiveGoldV149:(si?receiveCyanV149:receiveGreenV149));roller.name='FinalReceivingDockRollerV149';roller.rotation.z=Math.PI/2;roller.position.set(side*jx,-.01,.02);roller.castShadow=roller.receiveShadow=true;roller.material.emissive=new THREE.Color(k?0xc69200:(si?0x087fa9:0x139849));roller.material.emissiveIntensity=.74;pivot.add(roller);receiveRollersV149.push(roller)});finalReceivingDockV149.add(pivot);receiveJawPivotsV149.push(pivot)});const receiveBackplateV149=new THREE.Mesh(new THREE.BoxGeometry(2.46,1.34,.18),receiveDarkV149);receiveBackplateV149.name='FinalReceivingDockBackplateV149';receiveBackplateV149.position.set(0,.72,.42);receiveBackplateV149.castShadow=receiveBackplateV149.receiveShadow=true;finalReceivingDockV149.add(receiveBackplateV149);const receiveLockRingV149=new THREE.Mesh(new THREE.TorusGeometry(.50,.075,10,24),receiveGoldV149);receiveLockRingV149.name='FinalReceivingDockLockRingV149';receiveLockRingV149.position.set(0,.56,.30);receiveLockRingV149.castShadow=true;receiveLockRingV149.material.emissive=new THREE.Color(0xc69200);receiveLockRingV149.material.emissiveIntensity=.90;finalReceivingDockV149.add(receiveLockRingV149);const receiveCoreV149=new THREE.Mesh(new THREE.OctahedronGeometry(.18,0),receiveCyanV149);receiveCoreV149.name='FinalReceivingDockCoreV149';receiveCoreV149.position.set(0,.56,.39);receiveCoreV149.castShadow=true;receiveCoreV149.material.emissive=new THREE.Color(0x087fa9);receiveCoreV149.material.emissiveIntensity=.96;finalReceivingDockV149.add(receiveCoreV149);const receiveHeaderV149=new THREE.Mesh(new THREE.BoxGeometry(3.54,.20,.30),receiveDarkV149);receiveHeaderV149.name='FinalReceivingDockHeaderV149';receiveHeaderV149.position.set(0,1.43,.05);receiveHeaderV149.castShadow=receiveHeaderV149.receiveShadow=true;finalReceivingDockV149.add(receiveHeaderV149);[-1.12,-.56,0,.56,1.12].forEach((x,i)=>{const lamp=new THREE.Mesh(new THREE.OctahedronGeometry(.09,0),i===2?receiveGoldV149:receiveSteelV149);lamp.name='FinalReceivingDockStatusLampV149';lamp.position.set(x,1.43,.23);lamp.castShadow=true;lamp.material.emissive=new THREE.Color(i===2?0xc69200:(i<2?0x139849:0x087fa9));lamp.material.emissiveIntensity=.82;finalReceivingDockV149.add(lamp);receiveLampsV149.push(lamp)});[-1.15,-.58,0,.58,1.15].forEach((x,i)=>{const rib=new THREE.Mesh(new THREE.BoxGeometry(.22,.08,.62),i===2?receiveSteelV149:receiveDarkV149);rib.name='FinalReceivingDockDeckRibV149';rib.position.set(x,.17,0);rib.castShadow=rib.receiveShadow=true;finalReceivingDockV149.add(rib)});"""
          s=s.replace(anchor,model+anchor,1)
          tick_anchor='const finalPressureChargeActiveV148='
          if s.count(tick_anchor) != 1:
              raise SystemExit(f'v149 tick anchor count={s.count(tick_anchor)}')
          tick="""const finalReceivingDockActiveV149=win||finishBrainrotDock>0,finalReceivingDockProgressV149=Math.max(0,Math.min(1,finishBrainrotDock||0)),finalReceivingDockPulseV149=.5+.5*Math.sin(t*13.6);receiveJawPivotsV149.forEach((n,i)=>{const side=n.userData.side,close=finalReceivingDockProgressV149;n.position.x=side*(1.34-.18*close);n.rotation.z=side*(.16-.22*close);n.children.forEach(c=>{if(c.isMesh&&c.material?.emissive)c.material.emissiveIntensity=finalReceivingDockActiveV149?.46+.50*finalReceivingDockPulseV149:.25})});receiveRollersV149.forEach((n,i)=>{n.rotation.x+=dt*(finalReceivingDockActiveV149?8.4:1.0)*(i%2?-1:1);n.material.emissiveIntensity=finalReceivingDockActiveV149?.72+.42*finalReceivingDockPulseV149:.50});receiveLampsV149.forEach((n,i)=>{const latched=finalReceivingDockProgressV149>=i/Math.max(1,receiveLampsV149.length-1);n.material.color.setHex(finalReceivingDockProgressV149>=.99?0x49ff8b:(latched?0xffca36:(i%2?0x45dcff:0xdcebf4)));n.material.emissive.setHex(finalReceivingDockProgressV149>=.99?0x139849:(latched?0xc69200:(i%2?0x087fa9:0x223448)));n.material.emissiveIntensity=finalReceivingDockActiveV149?.76+.54*finalReceivingDockPulseV149:.58});receiveLockRingV149.rotation.z+=dt*(finalReceivingDockActiveV149?2.5:.25);receiveLockRingV149.scale.setScalar(.94+.09*finalReceivingDockProgressV149);receiveLockRingV149.material.emissiveIntensity=finalReceivingDockActiveV149?.88+.52*finalReceivingDockPulseV149:.62;receiveCoreV149.rotation.y+=dt*(finalReceivingDockActiveV149?3.0:.32);receiveCoreV149.scale.setScalar(.92+.12*finalReceivingDockProgressV149);receiveCoreV149.material.emissiveIntensity=finalReceivingDockActiveV149?.96+.58*finalReceivingDockPulseV149:.68;receiveBackplateV149.material.emissive=receiveBackplateV149.material.emissive||new THREE.Color(0x139849);receiveBackplateV149.material.emissiveIntensity=finalReceivingDockProgressV149>=.99?.34:(finalReceivingDockActiveV149?.12:.03);"""
          s=s.replace(tick_anchor,tick+tick_anchor,1)
          p.write_text(s)
      - name: Verify v149 model and preserved finish physics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          required=['FINAL_RECEIVING_DOCK_MODEL_V149=true','FINAL_RECEIVING_DOCK_Z=10.20','FinalReceivingDockV149','FinalReceivingDockDeckV149','FinalReceivingDockTowerV149','FinalReceivingDockJawPivotV149','FinalReceivingDockJawV149','FinalReceivingDockRollerV149','FinalReceivingDockBackplateV149','FinalReceivingDockLockRingV149','FinalReceivingDockCoreV149','FinalReceivingDockHeaderV149','FinalReceivingDockStatusLampV149','FINISH_BRAINROT_DOCK_V119=true','FINISH_BRAINROT_DOCK_TIME=.72','finishBrainrotDockTarget=new THREE.Vector3(0,.34,10.20)','FINAL_PRESSURE_CRADLE_CHARGE_MACHINE_V148=true','FINAL_CHARGE_GATE_Z=10.88','FINAL_CHARGE_CRADLE_DAMP=15.5','FINAL_FINISH_FUNNEL_DAMP=10.5','FINAL_FINISH_FUNNEL_PULL=1.75']
          for token in required: assert token in s, token
          assert s.count('FINAL_RECEIVING_DOCK_MODEL_V149=true') == 1
          assert s.count('const finalReceivingDockActiveV149=') == 1
          print('Final receiving dock model v149 contract: SUCCESS')
          PY
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text();m=re.search(r'<script type="module">(.*?)</script>',s,re.S);assert m
          Path('/tmp/brainrot-module.mjs').write_text(m.group(1))
          PY
          node --check /tmp/brainrot-module.mjs
          for f in scripts/final-puncher-physics-contract-v65.mjs scripts/final-finish-residual-momentum-check.mjs scripts/final-finish-soft-hold-check.mjs scripts/final-finish-charge-check.mjs scripts/second-pit-route-continuity-v70-check.mjs; do
            if [ -f "$f" ]; then node "$f"; else echo "SKIP missing $f"; fi
          done
      - name: Commit real level change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "openai-level-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && { echo 'No gameplay change produced'; exit 1; }
          git commit -m "Level: mechanical final receiving dock v149"
          git push origin HEAD:new-player-glb-overhaul
