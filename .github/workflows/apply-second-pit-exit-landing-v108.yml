name: Apply Second Pit Exit Landing v108

on:
  push:
    branches: [new-player-glb-overhaul]
    paths: ['.github/workflows/apply-second-pit-exit-landing-v108.yml']

permissions:
  contents: write

jobs:
  patch-level:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-player-glb-overhaul
          fetch-depth: 0
      - name: Patch real second-pit exit landing assembly
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="const SECOND_PIT_EXIT_MODEL_V94=true;const secondPitExitBridge=box(0,.02,SECOND_PIT_EXIT_BRIDGE_Z,SECOND_PIT_EXIT_BRIDGE_HALF_X*2,.08,SECOND_PIT_EXIT_BRIDGE_HALF_Z*2,0x49ff79),secondPitExitPad=box(0,.035,5.98,3.35,.07,.44,0x49ff79);secondPitExitBridge.name='SecondPitExitCollisionDeckV94';secondPitExitBridge.material.transparent=true;secondPitExitBridge.material.opacity=.12;secondPitExitBridge.material.depthWrite=false;secondPitExitPad.name='SecondPitExitLandingPadV94';secondPitExitPad.material.emissive=new THREE.Color(0x19b24e);secondPitExitPad.material.emissiveIntensity=.58;"
          new="const SECOND_PIT_EXIT_MODEL_V94=true,SECOND_PIT_EXIT_LANDING_MODEL_V108=true;const secondPitExitBridge=box(0,.02,SECOND_PIT_EXIT_BRIDGE_Z,SECOND_PIT_EXIT_BRIDGE_HALF_X*2,.08,SECOND_PIT_EXIT_BRIDGE_HALF_Z*2,0x49ff79),secondPitExitPad=box(0,.035,5.98,3.35,.07,.44,0x49ff79);secondPitExitBridge.name='SecondPitExitCollisionDeckV94';secondPitExitBridge.material.transparent=true;secondPitExitBridge.material.opacity=.12;secondPitExitBridge.material.depthWrite=false;secondPitExitPad.name='SecondPitExitLandingCollisionPadV108';secondPitExitPad.material.transparent=true;secondPitExitPad.material.opacity=.06;secondPitExitPad.material.depthWrite=false;secondPitExitPad.material.emissive=new THREE.Color(0x19b24e);secondPitExitPad.material.emissiveIntensity=.22;const exitLandingGreen=mat(0x49ff79),exitLandingDark=mat(0x153b35),exitLandingWhite=mat(0xd9ffe4);exitLandingGreen.metalness=.28;exitLandingGreen.roughness=.30;[-1.28,-.64,0,.64,1.28].forEach((x,i)=>{const slat=new THREE.Mesh(new THREE.BoxGeometry(.48,.07,.34),i===2?exitLandingWhite:exitLandingGreen);slat.name='SecondPitExitLandingSlatV108';slat.position.set(x,.075,0);slat.castShadow=slat.receiveShadow=true;slat.material.emissive=new THREE.Color(i===2?0xb7ffcf:0x19b24e);slat.material.emissiveIntensity=i===2?.82:.44;secondPitExitPad.add(slat)});[-1.54,1.54].forEach((x,i)=>{const bumper=new THREE.Mesh(new THREE.CylinderGeometry(.11,.16,.34,8),exitLandingDark);bumper.name='SecondPitExitLandingBumperV108';bumper.rotation.z=Math.PI/2;bumper.position.set(x,.08,0);bumper.castShadow=bumper.receiveShadow=true;secondPitExitPad.add(bumper);const beacon=new THREE.Mesh(new THREE.TorusGeometry(.16,.032,6,10),exitLandingWhite);beacon.name='SecondPitExitLandingBeaconV108';beacon.rotation.y=Math.PI/2;beacon.position.set(x,.10,0);beacon.castShadow=true;beacon.material.emissive=new THREE.Color(i?0x44e7ff:0x49ff79);beacon.material.emissiveIntensity=1.05;secondPitExitPad.add(beacon)});[-.18,.18].forEach(z=>{const rail=new THREE.Mesh(new THREE.CapsuleGeometry(.035,2.72,4,8),exitLandingWhite);rail.name='SecondPitExitLandingRailV108';rail.rotation.z=Math.PI/2;rail.position.set(0,.17,z);rail.castShadow=true;rail.material.emissive=new THREE.Color(0x49ff79);rail.material.emissiveIntensity=.48;secondPitExitPad.add(rail)});"
          if old not in s:
              raise SystemExit('missing expected second-pit exit landing runtime fragment')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Verify browser module syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          src=Path('index.html').read_text()
          m=re.search(r'<script type="module">([\s\S]*?)</script>',src)
          if not m: raise SystemExit('module script missing')
          Path('/tmp/runtime-module.mjs').write_text(m.group(1))
          PY
          node --check /tmp/runtime-module.mjs
          echo 'PASS browser module parse'
      - name: Verify modeled exit landing and route physics
        run: |
          grep -q "SECOND_PIT_EXIT_LANDING_MODEL_V108=true" index.html
          grep -q "SecondPitExitLandingSlatV108" index.html
          grep -q "SecondPitExitLandingBumperV108" index.html
          grep -q "SecondPitExitLandingRailV108" index.html
          grep -q "SecondPitExitLandingCollisionPadV108" index.html
          node scripts/second-pit-carry-window-check.mjs
          node scripts/second-pit-platform-motion-v71-check.mjs
          node scripts/second-pit-route-continuity-v70-check.mjs
      - name: Commit gameplay level change
        run: |
          git config user.name 'amazin20'
          git config user.email '138931938+amazin20@users.noreply.github.com'
          git add index.html
          git commit -m 'Level: model second pit exit landing v108'
          git push origin HEAD:new-player-glb-overhaul
