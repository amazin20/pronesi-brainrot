name: Apply First Pit Warning Gantry v156

on:
  push:
    branches: [new-player-glb-overhaul]
    paths:
      - .github/workflows/apply-first-pit-warning-gantry-v156.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-player-glb-overhaul
          fetch-depth: 0
      - name: Refuse stale/non-linear apply
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin new-player-glb-overhaul
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/new-player-glb-overhaul)"
      - name: Build first pit warning gantry v156
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          if 'FIRST_PIT_WARNING_GANTRY_MODEL_V156=true' in s:
              raise SystemExit('v156 already present')
          anchor="const firstPitLipV132=new THREE.Mesh(new THREE.CapsuleGeometry(.055,2.90,4,8),firstPitConnectorAmberV132);firstPitLipV132.name='FirstSweeperToPitWarningLipV132';firstPitLipV132.rotation.z=Math.PI/2;firstPitLipV132.position.set(0,.13,FIRST_SWEEPER_TO_PIT_Z_MAX-(FIRST_SWEEPER_TO_PIT_Z_MIN+FIRST_SWEEPER_TO_PIT_Z_MAX)*.5);firstPitLipV132.castShadow=firstPitLipV132.receiveShadow=true;firstPitLipV132.material.emissive=new THREE.Color(0xffb12b);firstPitLipV132.material.emissiveIntensity=.95;firstSweeperToPitCarrierV132.add(firstPitLipV132);const SECOND_SWEEPER_STAGING_PAD_MODEL_V129=true;"
          if anchor not in s:
              raise SystemExit('v156 model anchor missing')
          model="""const firstPitLipV132=new THREE.Mesh(new THREE.CapsuleGeometry(.055,2.90,4,8),firstPitConnectorAmberV132);firstPitLipV132.name='FirstSweeperToPitWarningLipV132';firstPitLipV132.rotation.z=Math.PI/2;firstPitLipV132.position.set(0,.13,FIRST_SWEEPER_TO_PIT_Z_MAX-(FIRST_SWEEPER_TO_PIT_Z_MIN+FIRST_SWEEPER_TO_PIT_Z_MAX)*.5);firstPitLipV132.castShadow=firstPitLipV132.receiveShadow=true;firstPitLipV132.material.emissive=new THREE.Color(0xffb12b);firstPitLipV132.material.emissiveIntensity=.95;firstSweeperToPitCarrierV132.add(firstPitLipV132);const FIRST_PIT_WARNING_GANTRY_MODEL_V156=true;const firstPitWarningGantryV156=new THREE.Group();firstPitWarningGantryV156.name='FirstPitWarningGantryAssemblyV156';firstPitWarningGantryV156.position.set(0,0,FIRST_SWEEPER_TO_PIT_Z_MAX-.08);scene.add(firstPitWarningGantryV156);const fpwgDarkV156=mat(0x171b2d),fpwgSteelV156=mat(0xeaf4ff),fpwgAmberV156=mat(0xffb12b),fpwgRedV156=mat(0xff315d),fpwgGreenV156=mat(0x49ff79),fpwgCyanV156=mat(0x45e8ff);fpwgDarkV156.metalness=.62;fpwgDarkV156.roughness=.27;fpwgSteelV156.metalness=.48;fpwgSteelV156.roughness=.20;const fpwgDeckV156=new THREE.Mesh(new THREE.BoxGeometry(3.42,.10,.72),fpwgDarkV156);fpwgDeckV156.name='FirstPitWarningGantryDeckV156';fpwgDeckV156.position.y=.05;fpwgDeckV156.castShadow=fpwgDeckV156.receiveShadow=true;firstPitWarningGantryV156.add(fpwgDeckV156);[-1.42,-.94,-.47,0,.47,.94,1.42].forEach((x,i)=>{const plate=new THREE.Mesh(new THREE.BoxGeometry(.36,.065,.56),i===3?fpwgSteelV156:fpwgAmberV156);plate.name='FirstPitWarningGantryDeckPlateV156';plate.position.set(x,.115,0);plate.castShadow=plate.receiveShadow=true;plate.material.emissive=new THREE.Color(i===3?0x4b6d83:0xa95a00);plate.material.emissiveIntensity=i===3?.35:.52;firstPitWarningGantryV156.add(plate)});const firstPitWarningArmsV156=[],firstPitWarningRollersV156=[],firstPitWarningLampsV156=[];[-1,1].forEach((side,si)=>{const tower=new THREE.Mesh(new THREE.BoxGeometry(.34,2.26,.42),fpwgDarkV156);tower.name='FirstPitWarningGantryTowerV156';tower.position.set(side*1.72,1.18,0);tower.castShadow=tower.receiveShadow=true;firstPitWarningGantryV156.add(tower);[.36,.86,1.36,1.88].forEach((y,k)=>{const collar=new THREE.Mesh(new THREE.TorusGeometry(.19,.04,7,14),k===2?fpwgSteelV156:(si?fpwgCyanV156:fpwgAmberV156));collar.name='FirstPitWarningGantryTowerCollarV156';collar.rotation.x=Math.PI/2;collar.position.set(side*1.72,y,0);collar.castShadow=true;collar.material.emissive=new THREE.Color(k===2?0x4b6d83:(si?0x087fa8:0xa95a00));collar.material.emissiveIntensity=.72;firstPitWarningGantryV156.add(collar)});const armPivot=new THREE.Group();armPivot.name='FirstPitWarningGantryArmPivotV156';armPivot.position.set(side*1.55,1.26,.05);armPivot.userData.side=side;const arm=new THREE.Mesh(new THREE.BoxGeometry(1.42,.18,.28),si?fpwgCyanV156:fpwgAmberV156);arm.name='FirstPitWarningGantrySignalArmV156';arm.position.set(-side*.66,0,0);arm.castShadow=arm.receiveShadow=true;arm.material.emissive=new THREE.Color(si?0x087fa8:0xa95a00);arm.material.emissiveIntensity=.58;armPivot.add(arm);[-.98,-.56,-.14].forEach((lx,k)=>{const roller=new THREE.Mesh(new THREE.CylinderGeometry(.105,.105,.20,10),k===1?fpwgGreenV156:(si?fpwgCyanV156:fpwgAmberV156));roller.name='FirstPitWarningGantryArmRollerV156';roller.rotation.z=Math.PI/2;roller.position.set(side*lx,-.20,0);roller.castShadow=roller.receiveShadow=true;roller.material.emissive=new THREE.Color(k===1?0x159b43:(si?0x087fa8:0xa95a00));roller.material.emissiveIntensity=.86;armPivot.add(roller);firstPitWarningRollersV156.push(roller)});firstPitWarningGantryV156.add(armPivot);firstPitWarningArmsV156.push(armPivot);const lamp=new THREE.Mesh(new THREE.OctahedronGeometry(.13,0),si?fpwgCyanV156:fpwgAmberV156);lamp.name='FirstPitWarningGantryStatusLampV156';lamp.position.set(side*1.72,2.42,.04);lamp.castShadow=true;lamp.material.emissive=new THREE.Color(si?0x087fa8:0xa95a00);lamp.material.emissiveIntensity=1.05;firstPitWarningGantryV156.add(lamp);firstPitWarningLampsV156.push(lamp)});const fpwgHeaderV156=new THREE.Mesh(new THREE.BoxGeometry(3.72,.24,.40),fpwgDarkV156);fpwgHeaderV156.name='FirstPitWarningGantryHeaderV156';fpwgHeaderV156.position.set(0,2.50,0);fpwgHeaderV156.castShadow=fpwgHeaderV156.receiveShadow=true;firstPitWarningGantryV156.add(fpwgHeaderV156);[-1.18,-.58,0,.58,1.18].forEach((x,i)=>{const lamp=new THREE.Mesh(new THREE.OctahedronGeometry(.095,0),i===2?fpwgRedV156:(i%2?fpwgSteelV156:fpwgAmberV156));lamp.name='FirstPitWarningGantryHeaderLampV156';lamp.position.set(x,2.51,.24);lamp.castShadow=true;lamp.material.emissive=new THREE.Color(i===2?0xa20d38:(i%2?0x4b6d83:0xa95a00));lamp.material.emissiveIntensity=.92;firstPitWarningGantryV156.add(lamp);firstPitWarningLampsV156.push(lamp)});const fpwgRingV156=new THREE.Mesh(new THREE.TorusGeometry(.34,.055,8,18),fpwgRedV156);fpwgRingV156.name='FirstPitWarningGantryTimingRingV156';fpwgRingV156.rotation.x=Math.PI/2;fpwgRingV156.position.set(0,.28,.18);fpwgRingV156.castShadow=true;fpwgRingV156.material.emissive=new THREE.Color(0xa20d38);fpwgRingV156.material.emissiveIntensity=1.0;firstPitWarningGantryV156.add(fpwgRingV156);const SECOND_SWEEPER_STAGING_PAD_MODEL_V129=true;"""
          s=s.replace(anchor,model,1)
          anim_anchor="fstLockHeaderV155.material.emissiveIntensity=gateOpen?.22+.42*fstLockOpenV155:(warning||burst?.22+.34*fstLockPulseV155:.08);"
          if anim_anchor not in s:
              raise SystemExit('v156 runtime anchor missing')
          anim=anim_anchor+"const fpwgPulseV156=.5+.5*Math.sin(t*11.8),fpwgDangerV156=.5+.5*Math.sin(t*4.4);firstPitWarningArmsV156.forEach((n,i)=>{const side=n.userData.side;n.rotation.z=side*(-.10+.28*Math.sin(t*2.25+i*Math.PI));n.position.y=1.26+.055*Math.sin(t*4.5+i*Math.PI);n.children.forEach(c=>{if(c.isMesh&&c.material?.emissive)c.material.emissiveIntensity=.48+.44*fpwgPulseV156})});firstPitWarningRollersV156.forEach((n,i)=>{n.rotation.x+=dt*(4.8+i*.18)*(i%2?-1:1);n.material.emissiveIntensity=.68+.48*fpwgPulseV156});firstPitWarningLampsV156.forEach((n,i)=>{const hot=i===2||i===4;n.material.color.setHex(hot?0xff315d:(i%2?0x45e8ff:0xffb12b));n.material.emissive.setHex(hot?0xa20d38:(i%2?0x087fa8:0xa95a00));n.material.emissiveIntensity=.72+(hot?.85:.50)*fpwgPulseV156});fpwgRingV156.rotation.z+=dt*(1.2+2.8*fpwgDangerV156);fpwgRingV156.scale.setScalar(.92+.12*fpwgPulseV156);fpwgRingV156.material.emissiveIntensity=.78+.72*fpwgPulseV156;fpwgHeaderV156.material.emissive=fpwgHeaderV156.material.emissive||new THREE.Color(0xa20d38);fpwgHeaderV156.material.emissiveIntensity=.08+.22*fpwgPulseV156;"
          s=s.replace(anim_anchor,anim,1)
          p.write_text(s)
      - name: Verify v156 and preserved first-pit gameplay
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          required=[
            'FIRST_PIT_WARNING_GANTRY_MODEL_V156=true',
            'FirstPitWarningGantryAssemblyV156',
            'FirstPitWarningGantryDeckV156',
            'FirstPitWarningGantryTowerV156',
            'FirstPitWarningGantrySignalArmV156',
            'FirstPitWarningGantryArmRollerV156',
            'FirstPitWarningGantryHeaderV156',
            'FirstPitWarningGantryStatusLampV156',
            'FirstPitWarningGantryTimingRingV156',
            'FIRST_SWEEPER_TO_PIT_Z_MAX=-4.92',
            "PITS=[[-15.2,-13.55],[-4.85,-3.55],[5.05,5.82]]",
            'FIRST_SWEEPER_TIMING_LOCK_MODEL_V155=true',
            'FIRST_SWEEPER_RECOVERY_PAD_MODEL_V131=true',
            'FIRST_SWEEPER_TO_PIT_CONNECTOR_MODEL_V132=true'
          ]
          for token in required:
              assert token in s, token
          assert s.count('FIRST_PIT_WARNING_GANTRY_MODEL_V156=true') == 1
          assert s.count("name='FirstPitWarningGantryAssemblyV156'") == 1
          m=re.search(r'<script type="module">(.*?)</script>',s,re.S)
          assert m, 'module script missing'
          Path('/tmp/brainrot-module.mjs').write_text(m.group(1))
          print('First pit warning gantry v156 contract: SUCCESS')
          PY
          node --check /tmp/brainrot-module.mjs
          node scripts/final-puncher-physics-contract-v65.mjs
          node scripts/final-finish-residual-momentum-check.mjs
          node scripts/final-finish-soft-hold-check.mjs
          node scripts/final-finish-charge-check.mjs
          if [ -f scripts/second-pit-full-route-continuity-v70.mjs ]; then node scripts/second-pit-full-route-continuity-v70.mjs; fi
      - name: Commit real level change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "openai-level-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && { echo 'No gameplay change produced'; exit 1; }
          git commit -m "Level: mechanical first pit warning gantry v156"
          git push origin HEAD:new-player-glb-overhaul
