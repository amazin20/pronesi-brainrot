name: Apply First Pit Warning Gantry v156

on:
  push:
    branches: [new-player-glb-overhaul]
    paths:
      - .github/workflows/apply-first-pit-warning-gantry-v156.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-player-glb-overhaul
          fetch-depth: 0
      - name: Refuse stale/non-linear apply
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin new-player-glb-overhaul
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/new-player-glb-overhaul)"
      - name: Build first pit warning gantry v156
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          if 'FIRST_PIT_WARNING_GANTRY_MODEL_V156=true' in s:
              raise SystemExit('v156 already present')
          anchor='const SECOND_SWEEPER_STAGING_PAD_MODEL_V129=true;'
          if s.count(anchor) != 1:
              raise SystemExit(f'v156 staging anchor count={s.count(anchor)}')
          model="""const FIRST_PIT_WARNING_GANTRY_MODEL_V156=true;const firstPitWarningGantryV156=new THREE.Group();firstPitWarningGantryV156.name='FirstPitWarningGantryAssemblyV156';firstPitWarningGantryV156.position.set(0,0,FIRST_SWEEPER_TO_PIT_Z_MAX-.10);scene.add(firstPitWarningGantryV156);const fpwgDarkV156=mat(0x171b2d),fpwgSteelV156=mat(0xeaf4ff),fpwgAmberV156=mat(0xffb12b),fpwgRedV156=mat(0xff315d),fpwgGreenV156=mat(0x49ff79),fpwgCyanV156=mat(0x45e8ff);fpwgDarkV156.metalness=.62;fpwgDarkV156.roughness=.27;fpwgSteelV156.metalness=.48;fpwgSteelV156.roughness=.20;const fpwgDeckV156=new THREE.Mesh(new THREE.BoxGeometry(3.42,.10,.72),fpwgDarkV156);fpwgDeckV156.name='FirstPitWarningGantryDeckV156';fpwgDeckV156.position.y=.05;fpwgDeckV156.castShadow=fpwgDeckV156.receiveShadow=true;firstPitWarningGantryV156.add(fpwgDeckV156);[-1.42,-.94,-.47,0,.47,.94,1.42].forEach((x,i)=>{const plate=new THREE.Mesh(new THREE.BoxGeometry(.36,.065,.56),i===3?fpwgSteelV156:fpwgAmberV156);plate.name='FirstPitWarningGantryDeckPlateV156';plate.position.set(x,.115,0);plate.castShadow=plate.receiveShadow=true;plate.material.emissive=new THREE.Color(i===3?0x4b6d83:0xa95a00);plate.material.emissiveIntensity=i===3?.35:.52;firstPitWarningGantryV156.add(plate)});const firstPitWarningArmsV156=[],firstPitWarningRollersV156=[],firstPitWarningLampsV156=[];[-1,1].forEach((side,si)=>{const tower=new THREE.Mesh(new THREE.BoxGeometry(.34,2.26,.42),fpwgDarkV156);tower.name='FirstPitWarningGantryTowerV156';tower.position.set(side*1.72,1.18,0);tower.castShadow=tower.receiveShadow=true;firstPitWarningGantryV156.add(tower);[.36,.86,1.36,1.88].forEach((y,k)=>{const collar=new THREE.Mesh(new THREE.TorusGeometry(.19,.04,7,14),k===2?fpwgSteelV156:(si?fpwgCyanV156:fpwgAmberV156));collar.name='FirstPitWarningGantryTowerCollarV156';collar.rotation.x=Math.PI/2;collar.position.set(side*1.72,y,0);collar.castShadow=true;collar.material.emissive=new THREE.Color(k===2?0x4b6d83:(si?0x087fa8:0xa95a00));collar.material.emissiveIntensity=.72;firstPitWarningGantryV156.add(collar)});const pivot=new THREE.Group();pivot.name='FirstPitWarningGantryArmPivotV156';pivot.position.set(side*1.55,1.26,.05);pivot.userData.side=side;const arm=new THREE.Mesh(new THREE.BoxGeometry(1.42,.18,.28),si?fpwgCyanV156:fpwgAmberV156);arm.name='FirstPitWarningGantrySignalArmV156';arm.position.set(-side*.66,0,0);arm.castShadow=arm.receiveShadow=true;arm.material.emissive=new THREE.Color(si?0x087fa8:0xa95a00);arm.material.emissiveIntensity=.58;arm.onBeforeRender=()=>{const u=performance.now()*.001;pivot.rotation.z=side*(-.10+.28*Math.sin(u*2.25+si*Math.PI));pivot.position.y=1.26+.055*Math.sin(u*4.5+si*Math.PI);arm.material.emissiveIntensity=.52+.38*(.5+.5*Math.sin(u*11.8))};pivot.add(arm);[-.98,-.56,-.14].forEach((lx,k)=>{const roller=new THREE.Mesh(new THREE.CylinderGeometry(.105,.105,.20,10),k===1?fpwgGreenV156:(si?fpwgCyanV156:fpwgAmberV156));roller.name='FirstPitWarningGantryArmRollerV156';roller.rotation.z=Math.PI/2;roller.position.set(side*lx,-.20,0);roller.castShadow=roller.receiveShadow=true;roller.material.emissive=new THREE.Color(k===1?0x159b43:(si?0x087fa8:0xa95a00));roller.material.emissiveIntensity=.86;roller.onBeforeRender=()=>{const u=performance.now()*.001;roller.rotation.x=u*(4.8+k*.35)*(k%2?-1:1);roller.material.emissiveIntensity=.68+.42*(.5+.5*Math.sin(u*11.8+k))};pivot.add(roller);firstPitWarningRollersV156.push(roller)});firstPitWarningGantryV156.add(pivot);firstPitWarningArmsV156.push(pivot);const lamp=new THREE.Mesh(new THREE.OctahedronGeometry(.13,0),si?fpwgCyanV156:fpwgAmberV156);lamp.name='FirstPitWarningGantryStatusLampV156';lamp.position.set(side*1.72,2.42,.04);lamp.castShadow=true;lamp.material.emissive=new THREE.Color(si?0x087fa8:0xa95a00);lamp.material.emissiveIntensity=1.05;lamp.onBeforeRender=()=>{const u=performance.now()*.001;lamp.material.emissiveIntensity=.72+.62*(.5+.5*Math.sin(u*10.2+si*Math.PI))};firstPitWarningGantryV156.add(lamp);firstPitWarningLampsV156.push(lamp)});const fpwgHeaderV156=new THREE.Mesh(new THREE.BoxGeometry(3.72,.24,.40),fpwgDarkV156);fpwgHeaderV156.name='FirstPitWarningGantryHeaderV156';fpwgHeaderV156.position.set(0,2.50,0);fpwgHeaderV156.castShadow=fpwgHeaderV156.receiveShadow=true;firstPitWarningGantryV156.add(fpwgHeaderV156);[-1.18,-.58,0,.58,1.18].forEach((x,i)=>{const lamp=new THREE.Mesh(new THREE.OctahedronGeometry(.095,0),i===2?fpwgRedV156:(i%2?fpwgSteelV156:fpwgAmberV156));lamp.name='FirstPitWarningGantryHeaderLampV156';lamp.position.set(x,2.51,.24);lamp.castShadow=true;lamp.material.emissive=new THREE.Color(i===2?0xa20d38:(i%2?0x4b6d83:0xa95a00));lamp.material.emissiveIntensity=.92;lamp.onBeforeRender=()=>{const u=performance.now()*.001;lamp.material.emissiveIntensity=.60+(i===2?.90:.46)*(.5+.5*Math.sin(u*(i===2?12.4:7.8)+i))};firstPitWarningGantryV156.add(lamp);firstPitWarningLampsV156.push(lamp)});const fpwgRingV156=new THREE.Mesh(new THREE.TorusGeometry(.34,.055,8,18),fpwgRedV156);fpwgRingV156.name='FirstPitWarningGantryTimingRingV156';fpwgRingV156.rotation.x=Math.PI/2;fpwgRingV156.position.set(0,.28,.18);fpwgRingV156.castShadow=true;fpwgRingV156.material.emissive=new THREE.Color(0xa20d38);fpwgRingV156.material.emissiveIntensity=1.0;fpwgRingV156.onBeforeRender=()=>{const u=performance.now()*.001,p=.5+.5*Math.sin(u*4.4);fpwgRingV156.rotation.z=u*(1.2+2.8*p);const q=.92+.12*(.5+.5*Math.sin(u*11.8));fpwgRingV156.scale.setScalar(q);fpwgRingV156.material.emissiveIntensity=.78+.72*(.5+.5*Math.sin(u*11.8))};firstPitWarningGantryV156.add(fpwgRingV156);"""
          s=s.replace(anchor,model+anchor,1)
          p.write_text(s)
      - name: Verify v156 and preserved first-pit gameplay
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          required=['FIRST_PIT_WARNING_GANTRY_MODEL_V156=true','FirstPitWarningGantryAssemblyV156','FirstPitWarningGantryDeckV156','FirstPitWarningGantryTowerV156','FirstPitWarningGantrySignalArmV156','FirstPitWarningGantryArmRollerV156','FirstPitWarningGantryHeaderV156','FirstPitWarningGantryStatusLampV156','FirstPitWarningGantryTimingRingV156','FIRST_SWEEPER_TO_PIT_Z_MAX=-4.92',"PITS=[[-15.2,-13.55],[-4.85,-3.55],[5.05,5.82]]",'FIRST_SWEEPER_TIMING_LOCK_MODEL_V155=true','FIRST_SWEEPER_RECOVERY_PAD_MODEL_V131=true','FIRST_SWEEPER_TO_PIT_CONNECTOR_MODEL_V132=true','onBeforeRender']
          for token in required: assert token in s, token
          assert s.count('FIRST_PIT_WARNING_GANTRY_MODEL_V156=true') == 1
          assert s.count("name='FirstPitWarningGantryAssemblyV156'") == 1
          m=re.search(r'<script type="module">(.*?)</script>',s,re.S)
          assert m, 'module script missing'
          Path('/tmp/brainrot-module.mjs').write_text(m.group(1))
          print('First pit warning gantry v156 contract: SUCCESS')
          PY
          node --check /tmp/brainrot-module.mjs
          node scripts/final-puncher-physics-contract-v65.mjs
          node scripts/final-finish-residual-momentum-check.mjs
          node scripts/final-finish-soft-hold-check.mjs
          node scripts/final-finish-charge-check.mjs
          if [ -f scripts/second-pit-full-route-continuity-v70.mjs ]; then node scripts/second-pit-full-route-continuity-v70.mjs; fi
      - name: Commit real level change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "openai-level-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && { echo 'No gameplay change produced'; exit 1; }
          git commit -m "Level: mechanical first pit warning gantry v156"
          git push origin HEAD:new-player-glb-overhaul
