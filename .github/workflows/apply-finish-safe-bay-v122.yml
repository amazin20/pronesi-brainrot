name: Apply Finish Safe Bay v122

on:
  push:
    branches: [new-player-glb-overhaul]
    paths:
      - .github/workflows/apply-finish-safe-bay-v122.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-player-glb-overhaul
          fetch-depth: 0
      - name: Refuse stale/non-linear apply
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin new-player-glb-overhaul
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/new-player-glb-overhaul)"
      - name: Add modeled post-finish safe bay v122
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          if 'FINISH_SAFE_BAY_MODEL_V122=true' in s:
              raise SystemExit('v122 already present')
          anchor="const FINISH_PLAYER_RELEASE_V121=true,FINISH_PLAYER_RELEASE_TIME=.95;const finishPlayerReleaseTarget=new THREE.Vector3(-1.15,0,11.62);"
          if anchor not in s:
              raise SystemExit('v121 release anchor missing')
          safe_bay="""const FINISH_SAFE_BAY_MODEL_V122=true;const finishSafeBay=box(-1.15,.028,11.62,2.85,.056,1.58,0x49ff79);finishSafeBay.name='FinishSafeBayCollisionPadV122';finishSafeBay.material.transparent=true;finishSafeBay.material.opacity=.04;finishSafeBay.material.depthWrite=false;finishSafeBay.material.emissive=new THREE.Color(0x159b43);finishSafeBay.material.emissiveIntensity=.14;const finishSafeGreen=mat(0x49ff79),finishSafeDark=mat(0x142c28),finishSafeWhite=mat(0xf1fff6),finishSafeCyan=mat(0x44e7ff);finishSafeGreen.metalness=.30;finishSafeGreen.roughness=.27;[-1.14,-.76,-.38,0,.38,.76,1.14].forEach((x,i)=>{const slat=new THREE.Mesh(new THREE.BoxGeometry(.30,.072,1.28),i===3?finishSafeWhite:finishSafeGreen);slat.name='FinishSafeBaySlatV122';slat.position.set(x,.073,0);slat.castShadow=slat.receiveShadow=true;slat.material.emissive=new THREE.Color(i===3?0xffffff:0x159b43);slat.material.emissiveIntensity=i===3?.88:.48;finishSafeBay.add(slat)});[-.63,.63].forEach((z,i)=>{const rail=new THREE.Mesh(new THREE.CapsuleGeometry(.04,2.38,4,8),finishSafeWhite);rail.name='FinishSafeBayEdgeRailV122';rail.rotation.z=Math.PI/2;rail.position.set(0,.18,z);rail.castShadow=rail.receiveShadow=true;rail.material.emissive=new THREE.Color(i?0x44e7ff:0x49ff79);rail.material.emissiveIntensity=.68;finishSafeBay.add(rail)});[-1.28,1.28].forEach((x,i)=>{const bumper=new THREE.Mesh(new THREE.CylinderGeometry(.11,.16,.34,8),finishSafeDark);bumper.name='FinishSafeBayBumperV122';bumper.rotation.z=Math.PI/2;bumper.position.set(x,.10,0);bumper.castShadow=bumper.receiveShadow=true;finishSafeBay.add(bumper);const beacon=new THREE.Mesh(new THREE.TorusGeometry(.15,.034,6,12),i?finishSafeCyan:finishSafeWhite);beacon.name='FinishSafeBayBeaconV122';beacon.rotation.y=Math.PI/2;beacon.position.set(x,.15,0);beacon.castShadow=true;beacon.material.emissive=new THREE.Color(i?0x44e7ff:0x49ff79);beacon.material.emissiveIntensity=1.0;finishSafeBay.add(beacon)});[-.62,0,.62].forEach((x,i)=>{const ring=new THREE.Mesh(new THREE.TorusGeometry(.105,.026,6,10),finishSafeWhite);ring.name='FinishSafeBayGuideRingV122';ring.rotation.x=Math.PI/2;ring.position.set(x,.12,.20);ring.castShadow=true;ring.material.emissive=new THREE.Color(i===1?0xffffff:0x49ff79);ring.material.emissiveIntensity=i===1?.92:.72;finishSafeBay.add(ring)});"""
          s=s.replace(anchor,anchor+safe_bay,1)
          p.write_text(s)
      - name: Verify v122 modeled safe bay and preserved gameplay
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          required=[
            "FINISH_SAFE_BAY_MODEL_V122=true",
            "FinishSafeBayCollisionPadV122",
            "FinishSafeBaySlatV122",
            "FinishSafeBayEdgeRailV122",
            "FinishSafeBayBumperV122",
            "FinishSafeBayBeaconV122",
            "FinishSafeBayGuideRingV122",
            "box(-1.15,.028,11.62,2.85,.056,1.58,0x49ff79)",
            "finishSafeBay.material.opacity=.04",
            "finishPlayerReleaseTarget=new THREE.Vector3(-1.15,0,11.62)",
            "FINISH_PLAYER_RELEASE_V121=true",
            "FINAL_FINISH_CHARGE=.55"
          ]
          for token in required:
            assert token in s, token
          assert s.count('FINISH_SAFE_BAY_MODEL_V122=true')==1
          assert s.count("FinishSafeBayCollisionPadV122") == 1
          print('Finish Safe Bay v122 contract: SUCCESS')
          PY
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          m=re.search(r'<script type="module">(.*?)</script>',s,re.S)
          assert m, 'module script not found'
          Path('/tmp/brainrot-module.mjs').write_text(m.group(1))
          PY
          node --check /tmp/brainrot-module.mjs
          node scripts/final-puncher-physics-contract-v65.mjs
          node scripts/final-finish-residual-momentum-check.mjs
          node scripts/final-finish-soft-hold-check.mjs
          node scripts/final-finish-charge-check.mjs
      - name: Commit real level change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "openai-level-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && { echo 'No gameplay change produced'; exit 1; }
          git commit -m "Level: model finish safe bay v122"
          git push origin HEAD:new-player-glb-overhaul
