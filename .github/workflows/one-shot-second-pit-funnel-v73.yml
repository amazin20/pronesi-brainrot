name: One-shot second pit funnel v73
on:
  push:
    branches: [new-player-glb-overhaul]
    paths: ['.github/workflows/one-shot-second-pit-funnel-v73.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-player-glb-overhaul
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Replace second-pit funnel boxes with modeled guardrails
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          s=s.replace('full 3D lift route v72 · modeled second-pit carrier assemblies','full 3D lift route v73 · modeled second-pit funnel guardrails',1)
          old="const SECOND_PIT_FUNNEL_HALF_X=2.05,SECOND_PIT_FUNNEL_Z_MIN=5.78,SECOND_PIT_FUNNEL_Z_MAX=7.28;const secondPitFunnelL=box(-2.18,.46,6.53,.22,.92,1.5,0x49ff79),secondPitFunnelR=box(2.18,.46,6.53,.22,.92,1.5,0x49ff79),secondPitFunnelStripe=box(0,.018,6.54,3.85,.036,1.44,0x49ff79);[secondPitFunnelL,secondPitFunnelR,secondPitFunnelStripe].forEach(o=>{o.material.emissive=new THREE.Color(0x159b43);o.material.emissiveIntensity=.72});"
          new="const SECOND_PIT_FUNNEL_HALF_X=2.05,SECOND_PIT_FUNNEL_Z_MIN=5.78,SECOND_PIT_FUNNEL_Z_MAX=7.28,SECOND_PIT_FUNNEL_MODEL_V73=true;function makeSecondPitFunnelGuard(side){const g=new THREE.Group();g.name='SecondPitFunnelGuardV73';g.position.set(side*2.18,0,6.53);const railMat=mat(0x49ff79),dark=mat(0x153b35),beaconMat=mat(0xb7ffcf);const rail=new THREE.Mesh(new THREE.CapsuleGeometry(.09,1.30,4,8),railMat);rail.name='SecondPitFunnelRailV73';rail.rotation.x=Math.PI/2;rail.position.y=.52;rail.castShadow=rail.receiveShadow=true;g.add(rail);[-.58,.58].forEach(z=>{const post=new THREE.Mesh(new THREE.CylinderGeometry(.065,.085,.88,8),dark);post.name='SecondPitFunnelPostV73';post.position.set(0,.40,z);post.castShadow=post.receiveShadow=true;g.add(post);const beacon=new THREE.Mesh(new THREE.TorusGeometry(.105,.028,6,10),beaconMat);beacon.name='SecondPitFunnelBeaconV73';beacon.rotation.x=Math.PI/2;beacon.position.set(0,.83,z);beacon.castShadow=true;g.add(beacon)});scene.add(g);return g}const secondPitFunnelL=makeSecondPitFunnelGuard(-1),secondPitFunnelR=makeSecondPitFunnelGuard(1),secondPitFunnelStripe=box(0,.018,6.54,3.85,.036,1.44,0x49ff79);secondPitFunnelStripe.material.emissive=new THREE.Color(0x159b43);secondPitFunnelStripe.material.emissiveIntensity=.72;"
          assert old in s, 'current funnel block not found'
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Verify v73 gameplay runtime and second-pit contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          required=['full 3D lift route v73 · modeled second-pit funnel guardrails','SECOND_PIT_FUNNEL_MODEL_V73=true','SecondPitFunnelGuardV73','SecondPitFunnelRailV73','SecondPitFunnelPostV73','SecondPitFunnelBeaconV73','inSecondPitFunnel(x,z,r=0)']
          for x in required: assert x in s,x
          assert 'secondPitFunnelL=box(-2.18,.46,6.53' not in s
          assert 'secondPitFunnelR=box(2.18,.46,6.53' not in s
          start=s.index('<script type="module">')+len('<script type="module">'); end=s.index('</script>',start)
          Path('/tmp/game.mjs').write_text(s[start:end])
          print('second-pit funnel modeled guardrail invariants PASS')
          PY
          node --check /tmp/game.mjs
          node scripts/second-pit-checkpoint-funnel-check.mjs
          node scripts/second-pit-route-continuity-v70-check.mjs
          node scripts/second-pit-platform-motion-v71-check.mjs
          git diff --check
      - name: Commit gameplay change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Model second-pit checkpoint funnel guardrails v73'
          git push origin HEAD:new-player-glb-overhaul
