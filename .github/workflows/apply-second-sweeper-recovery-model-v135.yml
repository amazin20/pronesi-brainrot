name: Apply Second Sweeper Recovery Model v135

on:
  push:
    branches: [new-player-glb-overhaul]
    paths:
      - .github/workflows/apply-second-sweeper-recovery-model-v135.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-player-glb-overhaul
          fetch-depth: 0
      - name: Refuse stale/non-linear apply
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin new-player-glb-overhaul
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/new-player-glb-overhaul)"
          test "$(git rev-parse HEAD^)" = "c08ae6a99f8d7feab51172b21d862b1ccc3cf956"
      - name: Model second sweeper recovery deck v135
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          if 'SECOND_SWEEPER_RECOVERY_PAD_MODEL_V135=true' in s:
              raise SystemExit('v135 already present')
          old="const SECOND_SWEEPER_RECOVERY_MODEL_V89=true;const secondSweeperRecoveryPad=box(0,.03,(SECOND_SWEEPER_RECOVERY_Z_MIN+SECOND_SWEEPER_RECOVERY_Z_MAX)*.5,SECOND_SWEEPER_RECOVERY_HALF_X*2,.06,SECOND_SWEEPER_RECOVERY_Z_MAX-SECOND_SWEEPER_RECOVERY_Z_MIN,0x49ff79);function makeSecondSweeperRecoveryGuard(side){"
          if old not in s:
              raise SystemExit('second sweeper recovery anchor missing')
          new="""const SECOND_SWEEPER_RECOVERY_MODEL_V89=true,SECOND_SWEEPER_RECOVERY_PAD_MODEL_V135=true;const secondSweeperRecoveryPad=box(0,.03,(SECOND_SWEEPER_RECOVERY_Z_MIN+SECOND_SWEEPER_RECOVERY_Z_MAX)*.5,SECOND_SWEEPER_RECOVERY_HALF_X*2,.06,SECOND_SWEEPER_RECOVERY_Z_MAX-SECOND_SWEEPER_RECOVERY_Z_MIN,0x49ff79);secondSweeperRecoveryPad.name='SecondSweeperRecoveryLegacyCollisionCarrierV135';secondSweeperRecoveryPad.material.transparent=true;secondSweeperRecoveryPad.material.opacity=.035;secondSweeperRecoveryPad.material.depthWrite=false;secondSweeperRecoveryPad.material.emissive=new THREE.Color(0x159b43);secondSweeperRecoveryPad.material.emissiveIntensity=.5;const secondRecoveryGreenV135=mat(0x49ff79),secondRecoveryDarkV135=mat(0x14352d),secondRecoveryWhiteV135=mat(0xeaffef),secondRecoveryCyanV135=mat(0x44e7ff),secondRecoveryAmberV135=mat(0xffd84d);secondRecoveryGreenV135.metalness=.30;secondRecoveryGreenV135.roughness=.27;secondRecoveryDarkV135.metalness=.48;secondRecoveryDarkV135.roughness=.30;const secondRecoverySlatGeoV135=new THREE.BoxGeometry(.44,.068,.27),secondRecoveryRailGeoV135=new THREE.CapsuleGeometry(.038,3.22,4,8),secondRecoveryBumperGeoV135=new THREE.CylinderGeometry(.095,.14,.30,8),secondRecoveryRingGeoV135=new THREE.TorusGeometry(.11,.027,6,10),secondRecoveryBraceGeoV135=new THREE.CylinderGeometry(.04,.06,.25,8);[-1.55,-1.03,-.52,0,.52,1.03,1.55].forEach((x,i)=>{const slat=new THREE.Mesh(secondRecoverySlatGeoV135,i===3?secondRecoveryWhiteV135:secondRecoveryGreenV135);slat.name='SecondSweeperRecoverySlatV135';slat.position.set(x,.075,0);slat.castShadow=slat.receiveShadow=true;slat.material.emissive=new THREE.Color(i===3?0xffffff:0x159b43);slat.material.emissiveIntensity=i===3?.92:.50;secondSweeperRecoveryPad.add(slat)});[-.135,.135].forEach((z,i)=>{const rail=new THREE.Mesh(secondRecoveryRailGeoV135,secondRecoveryWhiteV135);rail.name='SecondSweeperRecoveryEdgeRailV135';rail.rotation.z=Math.PI/2;rail.position.set(0,.17,z);rail.castShadow=rail.receiveShadow=true;rail.material.emissive=new THREE.Color(i?0x44e7ff:0x49ff79);rail.material.emissiveIntensity=.70;secondSweeperRecoveryPad.add(rail)});[-1.73,1.73].forEach((x,i)=>{const bumper=new THREE.Mesh(secondRecoveryBumperGeoV135,secondRecoveryDarkV135);bumper.name='SecondSweeperRecoveryBumperV135';bumper.rotation.z=Math.PI/2;bumper.position.set(x,.095,0);bumper.castShadow=bumper.receiveShadow=true;secondSweeperRecoveryPad.add(bumper);const beacon=new THREE.Mesh(secondRecoveryRingGeoV135,i?secondRecoveryCyanV135:secondRecoveryGreenV135);beacon.name='SecondSweeperRecoveryBeaconRingV135';beacon.rotation.y=Math.PI/2;beacon.position.set(x,.145,0);beacon.castShadow=true;beacon.material.emissive=new THREE.Color(i?0x44e7ff:0x49ff79);beacon.material.emissiveIntensity=1.02;secondSweeperRecoveryPad.add(beacon)});[-1.02,0,1.02].forEach((x,i)=>{const brace=new THREE.Mesh(secondRecoveryBraceGeoV135,secondRecoveryDarkV135);brace.name='SecondSweeperRecoveryCrossBraceV135';brace.rotation.x=Math.PI/2;brace.position.set(x,.025,0);brace.castShadow=brace.receiveShadow=true;secondSweeperRecoveryPad.add(brace);const ring=new THREE.Mesh(secondRecoveryRingGeoV135,i===1?secondRecoveryAmberV135:secondRecoveryWhiteV135);ring.name='SecondSweeperRecoveryGuideRingV135';ring.rotation.x=Math.PI/2;ring.position.set(x,.125,0);ring.castShadow=true;ring.material.emissive=new THREE.Color(i===1?0xffb12b:0x49ff79);ring.material.emissiveIntensity=i===1?1.10:.80;secondSweeperRecoveryPad.add(ring)});function makeSecondSweeperRecoveryGuard(side){"""
          s=s.replace(old,new,1)
          tick_old="secondSweeperRecoveryPad.material.emissiveIntensity=secondSweeperRecoveryActive?1.05+.55*secondSweeperRecoveryPulse:.5;[secondSweeperRecoveryL,secondSweeperRecoveryR].forEach(g=>{const rail=g.children[0];rail.material.emissiveIntensity=secondSweeperRecoveryActive?1.05+.55*secondSweeperRecoveryPulse:.5});"
          if tick_old not in s:
              raise SystemExit('second sweeper recovery tick anchor missing')
          tick_new="""secondSweeperRecoveryPad.material.emissiveIntensity=secondSweeperRecoveryActive?1.05+.55*secondSweeperRecoveryPulse:.5;secondSweeperRecoveryPad.children.forEach(n=>{if(!n.isMesh||!n.material?.emissive)return;const guide=n.name==='SecondSweeperRecoveryGuideRingV135',beacon=n.name==='SecondSweeperRecoveryBeaconRingV135';n.material.emissiveIntensity=secondSweeperRecoveryActive?(guide?1.20+.42*secondSweeperRecoveryPulse:(beacon?1.16+.38*secondSweeperRecoveryPulse:.76+.24*secondSweeperRecoveryPulse)):(guide?.80:(beacon?1.02:.50))});[secondSweeperRecoveryL,secondSweeperRecoveryR].forEach(g=>{const rail=g.children.find(c=>c.name==='SecondSweeperRecoveryRailV89');if(rail)rail.material.emissiveIntensity=secondSweeperRecoveryActive?1.05+.55*secondSweeperRecoveryPulse:.5;g.children.filter(c=>c.name==='SecondSweeperRecoveryBeaconV89').forEach(b=>b.material.emissiveIntensity=secondSweeperRecoveryActive?1.18+.36*secondSweeperRecoveryPulse:.76)});"""
          s=s.replace(tick_old,tick_new,1)
          p.write_text(s)
      - name: Verify second sweeper recovery v135 and preserved gameplay
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          required=[
            'SECOND_SWEEPER_RECOVERY_PAD_MODEL_V135=true',
            'SecondSweeperRecoveryLegacyCollisionCarrierV135',
            'SecondSweeperRecoverySlatV135',
            'SecondSweeperRecoveryEdgeRailV135',
            'SecondSweeperRecoveryBumperV135',
            'SecondSweeperRecoveryBeaconRingV135',
            'SecondSweeperRecoveryCrossBraceV135',
            'SecondSweeperRecoveryGuideRingV135',
            'SECOND_SWEEPER_RECOVERY_Z_MIN=3.18',
            'SECOND_SWEEPER_RECOVERY_Z_MAX=3.55',
            'SECOND_SWEEPER_RECOVERY_HALF_X=1.9',
            'SECOND_SWEEPER_RECOVERY_DAMP=11.0',
            'secondSweeperRecoveryActive=secondSweeperCleared&&p.z>SECOND_SWEEPER_RECOVERY_Z_MIN',
            'SecondSweeperRecoveryRailV89',
            'SecondSweeperRecoveryBeaconV89',
            "n.name==='SecondSweeperRecoveryGuideRingV135'"
          ]
          for token in required:
              assert token in s, token
          assert s.count('SECOND_SWEEPER_RECOVERY_PAD_MODEL_V135=true') == 1
          assert s.count("'SecondSweeperRecoveryLegacyCollisionCarrierV135'") == 1
          assert 'secondSweeperRecoveryPad=box(0,.03,(SECOND_SWEEPER_RECOVERY_Z_MIN+SECOND_SWEEPER_RECOVERY_Z_MAX)*.5,SECOND_SWEEPER_RECOVERY_HALF_X*2,.06,SECOND_SWEEPER_RECOVERY_Z_MAX-SECOND_SWEEPER_RECOVERY_Z_MIN,0x49ff79)' in s
          print('Second sweeper recovery pad v135 contract: SUCCESS')
          PY
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          m=re.search(r'<script type="module">(.*?)</script>',s,re.S)
          assert m, 'module script not found'
          Path('/tmp/brainrot-module.mjs').write_text(m.group(1))
          PY
          node --check /tmp/brainrot-module.mjs
          node scripts/final-puncher-physics-contract-v65.mjs
          node scripts/final-finish-residual-momentum-check.mjs
          node scripts/final-finish-soft-hold-check.mjs
          node scripts/final-finish-charge-check.mjs
      - name: Commit real level change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "openai-level-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && { echo 'No gameplay change produced'; exit 1; }
          git commit -m "Level: model second sweeper recovery deck v135"
          git push origin HEAD:new-player-glb-overhaul
