name: Apply Second Sweeper Staging Model v129

on:
  push:
    branches: [new-player-glb-overhaul]
    paths:
      - .github/workflows/apply-second-sweeper-staging-model-v129.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-player-glb-overhaul
          fetch-depth: 0
      - name: Refuse stale/non-linear apply
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin new-player-glb-overhaul
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/new-player-glb-overhaul)"
      - name: Model second sweeper staging pad v129
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          if 'SECOND_SWEEPER_STAGING_PAD_MODEL_V129=true' in s:
              raise SystemExit('v129 already present')
          old="const secondSweeperStagePad=box(0,.035,-1.05,3.8,.07,1.58,0xffd84d),SECOND_SWEEPER_GATE_MODEL_V88=true;"
          if old not in s:
              raise SystemExit('second sweeper staging pad anchor missing')
          new="""const SECOND_SWEEPER_STAGING_PAD_MODEL_V129=true;const secondSweeperStagePad=box(0,.035,-1.05,3.8,.07,1.58,0xffd84d);secondSweeperStagePad.name='SecondSweeperStageLegacyCollisionCarrierV129';secondSweeperStagePad.material.transparent=true;secondSweeperStagePad.material.opacity=.04;secondSweeperStagePad.material.depthWrite=false;const secondStageAmberV129=mat(0xffd84d),secondStageDarkV129=mat(0x302913),secondStageWhiteV129=mat(0xfff7cf),secondStageRedV129=mat(0xff315d),secondStageGreenV129=mat(0x49ff79);secondStageAmberV129.metalness=.30;secondStageAmberV129.roughness=.27;secondStageDarkV129.metalness=.46;secondStageDarkV129.roughness=.31;const secondStageSlatGeoV129=new THREE.BoxGeometry(.44,.07,1.28),secondStageRailGeoV129=new THREE.CapsuleGeometry(.045,1.22,4,8),secondStageBumperGeoV129=new THREE.CylinderGeometry(.11,.16,.34,8),secondStageRingGeoV129=new THREE.TorusGeometry(.12,.03,6,10),secondStageBraceGeoV129=new THREE.CylinderGeometry(.045,.065,1.18,8);[-1.48,-.99,-.50,0,.50,.99,1.48].forEach((x,i)=>{const slat=new THREE.Mesh(secondStageSlatGeoV129,i===3?secondStageWhiteV129:secondStageAmberV129);slat.name='SecondSweeperStageSlatV129';slat.position.set(x,.075,0);slat.castShadow=slat.receiveShadow=true;slat.material.emissive=new THREE.Color(i===3?0xffffff:0xa95a00);slat.material.emissiveIntensity=i===3?.86:.46;secondSweeperStagePad.add(slat)});[-.64,.64].forEach((z,i)=>{const rail=new THREE.Mesh(secondStageRailGeoV129,secondStageWhiteV129);rail.name='SecondSweeperStageEdgeRailV129';rail.rotation.z=Math.PI/2;rail.scale.y=6.0;rail.position.set(0,.18,z);rail.castShadow=rail.receiveShadow=true;rail.material.emissive=new THREE.Color(i?0xff315d:0xffb12b);rail.material.emissiveIntensity=.68;secondSweeperStagePad.add(rail)});[-1.72,1.72].forEach((x,i)=>{const bumper=new THREE.Mesh(secondStageBumperGeoV129,secondStageDarkV129);bumper.name='SecondSweeperStageBumperV129';bumper.rotation.z=Math.PI/2;bumper.position.set(x,.10,0);bumper.castShadow=bumper.receiveShadow=true;secondSweeperStagePad.add(bumper);const beacon=new THREE.Mesh(secondStageRingGeoV129,i?secondStageGreenV129:secondStageRedV129);beacon.name='SecondSweeperStageBeaconV129';beacon.rotation.y=Math.PI/2;beacon.position.set(x,.15,0);beacon.castShadow=true;beacon.material.emissive=new THREE.Color(i?0x19b24e:0xa20d38);beacon.material.emissiveIntensity=1.02;secondSweeperStagePad.add(beacon)});[-1.05,0,1.05].forEach((x,i)=>{const brace=new THREE.Mesh(secondStageBraceGeoV129,secondStageDarkV129);brace.name='SecondSweeperStageCrossBraceV129';brace.rotation.x=Math.PI/2;brace.position.set(x,.025,0);brace.castShadow=brace.receiveShadow=true;secondSweeperStagePad.add(brace);const ring=new THREE.Mesh(secondStageRingGeoV129,i===1?secondStageGreenV129:secondStageWhiteV129);ring.name='SecondSweeperStageTimingRingV129';ring.rotation.x=Math.PI/2;ring.position.set(x,.125,0);ring.castShadow=true;ring.material.emissive=new THREE.Color(i===1?0x19b24e:0xffb12b);ring.material.emissiveIntensity=i===1?1.08:.78;secondSweeperStagePad.add(ring)});const SECOND_SWEEPER_GATE_MODEL_V88=true;"""
          s=s.replace(old,new,1)
          old2="secondSweeperStagePad.material.emissiveIntensity=(secondGateSensor||secondSweeperGateCrossing)?1.25+.5*secondGatePulse:.72;"
          if old2 not in s:
              raise SystemExit('second sweeper staging runtime anchor missing')
          new2="""secondSweeperStagePad.material.emissiveIntensity=(secondGateSensor||secondSweeperGateCrossing)?1.25+.5*secondGatePulse:.72;secondSweeperStagePad.children.forEach(n=>{if(!n.isMesh||!n.material?.emissive)return;const timing=n.name==='SecondSweeperStageTimingRingV129',beacon=n.name==='SecondSweeperStageBeaconV129';n.material.emissiveIntensity=(secondGateSensor||secondSweeperGateCrossing)?(timing?1.15+.45*secondGatePulse:(beacon?1.18+.42*secondGatePulse:.78+.25*secondGatePulse)):(timing?.78:(beacon?1.02:.52))});"""
          s=s.replace(old2,new2,1)
          p.write_text(s)
      - name: Verify second sweeper staging v129 and preserved gameplay
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          required=[
            'SECOND_SWEEPER_STAGING_PAD_MODEL_V129=true',
            'SecondSweeperStageLegacyCollisionCarrierV129',
            'SecondSweeperStageSlatV129',
            'SecondSweeperStageEdgeRailV129',
            'SecondSweeperStageBumperV129',
            'SecondSweeperStageBeaconV129',
            'SecondSweeperStageCrossBraceV129',
            'SecondSweeperStageTimingRingV129',
            'SECOND_SWEEPER_GATE_MODEL_V88=true',
            'SECOND_SWEEPER_STAGING_Z_MIN=-1.82',
            'SECOND_SWEEPER_STAGING_HALF_X=1.72',
            "secondSweeperStagingSafe=carry&&firstSweeperCleared&&!secondSweeperCleared"
          ]
          for token in required:
              assert token in s, token
          assert s.count('SECOND_SWEEPER_STAGING_PAD_MODEL_V129=true') == 1
          assert s.count("'SecondSweeperStageLegacyCollisionCarrierV129'") == 1
          assert 'secondSweeperStagePad=box(0,.035,-1.05,3.8,.07,1.58,0xffd84d)' in s
          print('Second sweeper staging pad v129 contract: SUCCESS')
          PY
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          m=re.search(r'<script type="module">(.*?)</script>',s,re.S)
          assert m, 'module script not found'
          Path('/tmp/brainrot-module.mjs').write_text(m.group(1))
          PY
          node --check /tmp/brainrot-module.mjs
          node scripts/final-puncher-physics-contract-v65.mjs
          node scripts/final-finish-residual-momentum-check.mjs
          node scripts/final-finish-soft-hold-check.mjs
          node scripts/final-finish-charge-check.mjs
      - name: Commit real level change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "openai-level-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && { echo 'No gameplay change produced'; exit 1; }
          git commit -m "Level: model second sweeper staging pad v129"
          git push origin HEAD:new-player-glb-overhaul
