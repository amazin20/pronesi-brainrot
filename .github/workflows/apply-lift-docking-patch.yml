name: Apply lift docking patch

on:
  push:
    branches: [new-player-glb-overhaul]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-player-glb-overhaul
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Patch carry-safe lift docking ledges
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="const LIFT_Z=(PITS[0][0]+PITS[0][1])*.5,LIFT_HALF_X=1.65,LIFT_HALF_Z=.62,LIFT_BASE_Y=-.04,LIFT_TRAVEL_Y=1.65,LIFT_CEILING_BOTTOM=3.5"
          new="const LIFT_Z=(PITS[0][0]+PITS[0][1])*.5,LIFT_HALF_X=1.65,LIFT_HALF_Z=.62,LIFT_DOCK_DEPTH=.34,LIFT_DOCK_HALF_X=1.78,LIFT_BASE_Y=-.04,LIFT_TRAVEL_Y=1.65,LIFT_CEILING_BOTTOM=3.5"
          assert old in s, 'lift constants anchor missing'
          s=s.replace(old,new,1)

          old="const liftPlatform=box(0,LIFT_BASE_Y,LIFT_Z,LIFT_HALF_X*2,.24,LIFT_HALF_Z*2,0x9a6cff);liftPlatform.material.emissive=new THREE.Color(0x4724b8);liftPlatform.material.emissiveIntensity=.82;"
          new="const liftPlatform=box(0,LIFT_BASE_Y,LIFT_Z,LIFT_HALF_X*2,.24,LIFT_HALF_Z*2,0x9a6cff);liftPlatform.material.emissive=new THREE.Color(0x4724b8);liftPlatform.material.emissiveIntensity=.82;const liftDocks=[PITS[0][0]+LIFT_DOCK_DEPTH*.5,PITS[0][1]-LIFT_DOCK_DEPTH*.5].map((z,i)=>{const d=box(0,-.08,z,LIFT_DOCK_HALF_X*2,.16,LIFT_DOCK_DEPTH,0x2de6ff);d.material.emissive=new THREE.Color(i?0x17c85b:0x118bb6);d.material.emissiveIntensity=1.05;const stripe=box(0,.012,z,2.65,.024,LIFT_DOCK_DEPTH*.72,i?0x49ff79:0xffffff);stripe.material.emissive=new THREE.Color(i?0x19b24e:0x45f4ff);stripe.material.emissiveIntensity=1.35;return d});"
          assert old in s, 'lift platform anchor missing'
          s=s.replace(old,new,1)

          old="function overPit(z){return PITS.some(([a,b])=>z>a&&z<b)}function onPitPlatform"
          new="function overPit(z){return PITS.some(([a,b])=>z>a&&z<b)}function onLiftDock(x,y,z,brain=false){const target=brain?.56:0,mx=brain?.18:.12,mz=brain?.12:.08;return liftDocks.some(d=>Math.abs(x-d.position.x)<=LIFT_DOCK_HALF_X+mx&&Math.abs(z-d.position.z)<=LIFT_DOCK_DEPTH*.5+mz&&Math.abs(y-target)<=.22)}function onPitPlatform"
          assert old in s, 'pit helper anchor missing'
          s=s.replace(old,new,1)

          old="playerOnPitPlatform=(onPitPlatform(p.x,p.y,p.z,false)||supportedBySecondPit(p.x,p.y,p.z,false)||playerOnLift)&&vy<=.45;"
          new="playerOnPitPlatform=(onLiftDock(p.x,p.y,p.z,false)||onPitPlatform(p.x,p.y,p.z,false)||supportedBySecondPit(p.x,p.y,p.z,false)||playerOnLift)&&vy<=.45;"
          assert old in s, 'player support anchor missing'
          s=s.replace(old,new,1)

          old="brainOnPitPlatform=(onPitPlatform(bp.x,bp.y,bp.z,true)||supportedBySecondPit(bp.x,bp.y,bp.z,true)||brainOnLift)&&bv.y<=.55;"
          new="brainOnPitPlatform=(onLiftDock(bp.x,bp.y,bp.z,true)||onPitPlatform(bp.x,bp.y,bp.z,true)||supportedBySecondPit(bp.x,bp.y,bp.z,true)||brainOnLift)&&bv.y<=.55;"
          assert old in s, 'brain support anchor missing'
          s=s.replace(old,new,1)

          s=s.replace('full 3D lift route v11','full 3D lift route v12',1)
          p.write_text(s)
          PY

      - name: Validate patched runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          assert 'LIFT_DOCK_DEPTH=.34' in s
          assert 'function onLiftDock' in s
          assert 'onLiftDock(p.x,p.y,p.z,false)' in s
          assert 'onLiftDock(bp.x,bp.y,bp.z,true)' in s
          assert 'full 3D lift route v12' in s
          print('lift docking assertions: PASS')
          PY
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          a=s.index('<script type="module">')+len('<script type="module">')
          b=s.index('</script>',a)
          Path('/tmp/runtime.mjs').write_text(s[a:b])
          PY
          node --check /tmp/runtime.mjs

      - name: Commit real gameplay patch and remove one-shot workflow
        run: |
          git config user.name "brainrot-level-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/apply-lift-docking-patch.yml
          git add index.html
          if git diff --cached --quiet; then
            echo "No gameplay changes to commit"
            exit 0
          fi
          git commit -m "Add carry-safe docking ledges to lift pit"
          git push origin HEAD:new-player-glb-overhaul
