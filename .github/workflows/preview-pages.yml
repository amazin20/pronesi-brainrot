name: Deploy from-scratch level preview to GitHub Pages

on:
  push:
    branches: [level-from-scratch-v1]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate preview branch
        run: npm run check
      - name: Build preview from exact branch commit
        run: npm run build
        env:
          BUILD_SHA: ${{ github.sha }}
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy from-scratch preview
        id: deployment
        uses: actions/deploy-pages@v4
