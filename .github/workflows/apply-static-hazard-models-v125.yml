name: Apply Static Hazard Models v125

on:
  push:
    branches: [new-player-glb-overhaul]
    paths:
      - .github/workflows/apply-static-hazard-models-v125.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-player-glb-overhaul
          fetch-depth: 0
      - name: Refuse stale/non-linear apply
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin new-player-glb-overhaul
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/new-player-glb-overhaul)"
      - name: Replace temporary static hazards with modeled assemblies v125
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          if 'STATIC_HAZARD_MODELS_V125=true' in s:
              raise SystemExit('v125 already present')
          anchor="const sweeps=[-9,1].map((z,i)=>{"
          if anchor not in s:
              raise SystemExit('static hazard gameplay anchor missing')
          modeled="""const STATIC_HAZARD_MODELS_V125=true;const staticHazardVisuals=[];function fadeLegacyStaticHazardV125(g,label){g.children.slice().forEach(o=>{if(!o.isMesh||!o.material)return;o.name=label;o.material.transparent=true;o.material.opacity=.035;o.material.depthWrite=false})}function upgradeCrashBarrierV125(g,i){fadeLegacyStaticHazardV125(g,'CrashBarrierLegacyCollisionCarrierV125');const palette=[0xffd24b,0x38d8ff,0xff719d,0x51e7a1,0xffd24b],c=palette[i%palette.length],accent=mat(c),dark=mat(0x1b213d),white=mat(0xf4fbff),danger=mat(0xff315d);accent.metalness=.30;accent.roughness=.27;dark.metalness=.48;dark.roughness=.31;const a=new THREE.Group();a.name='CrashBarrierAssemblyV125';const spine=new THREE.Mesh(new THREE.BoxGeometry(1.86,.42,.56),dark);spine.name='CrashBarrierSpineV125';spine.position.y=.47;spine.castShadow=spine.receiveShadow=true;a.add(spine);[-.62,0,.62].forEach((x,k)=>{const plate=new THREE.Mesh(new THREE.BoxGeometry(.48,.54,.66),k===1?white:accent);plate.name='CrashBarrierArmorPlateV125';plate.position.set(x,.50,0);plate.rotation.z=(k-1)*.035;plate.castShadow=plate.receiveShadow=true;plate.material.emissive=new THREE.Color(k===1?0xffffff:c);plate.material.emissiveIntensity=k===1?.42:.36;a.add(plate)});[-1.02,1.02].forEach((x,k)=>{const foot=new THREE.Mesh(new THREE.CylinderGeometry(.30,.40,.24,10),dark);foot.name='CrashBarrierReinforcedFootV125';foot.position.set(x,.12,0);foot.castShadow=foot.receiveShadow=true;a.add(foot);const collar=new THREE.Mesh(new THREE.TorusGeometry(.34,.07,7,12),accent);collar.name='CrashBarrierFootCollarV125';collar.rotation.x=Math.PI/2;collar.position.set(x,.22,0);collar.castShadow=true;collar.material.emissive=new THREE.Color(c);collar.material.emissiveIntensity=.70;a.add(collar);const lamp=new THREE.Mesh(new THREE.OctahedronGeometry(.12,0),white);lamp.name='CrashBarrierWarningBeaconV125';lamp.position.set(x,.87,0);lamp.castShadow=true;lamp.material.emissive=new THREE.Color(k?c:0xff315d);lamp.material.emissiveIntensity=1.15;a.add(lamp)});[-.78,.78].forEach(x=>{const brace=new THREE.Mesh(new THREE.CylinderGeometry(.045,.065,.72,6),danger);brace.name='CrashBarrierBraceV125';brace.rotation.x=Math.PI/2;brace.position.set(x,.48,0);brace.castShadow=brace.receiveShadow=true;a.add(brace)});g.add(a);staticHazardVisuals.push(a);return a}function upgradeBumperPillarV125(g,i){fadeLegacyStaticHazardV125(g,'BumperPillarLegacyCollisionCarrierV125');const accent=mat(i%2?0x44e7ff:0x49ff79),dark=mat(0x18213a),white=mat(0xf3fbff),amber=mat(0xffd24b);accent.metalness=.32;accent.roughness=.26;dark.metalness=.50;dark.roughness=.30;const a=new THREE.Group();a.name='BumperPillarAssemblyV125';const base=new THREE.Mesh(new THREE.CylinderGeometry(.70,.84,.30,12),dark);base.name='BumperPillarBaseV125';base.position.y=.15;base.castShadow=base.receiveShadow=true;a.add(base);[.43,.78,1.13].forEach((y,k)=>{const shell=new THREE.Mesh(new THREE.CylinderGeometry(.48-k*.045,.52-k*.04,.24,12),k===1?white:accent);shell.name='BumperPillarSegmentV125';shell.position.y=y;shell.castShadow=shell.receiveShadow=true;shell.material.emissive=new THREE.Color(k===1?0xcffcff:(i%2?0x087fa8:0x159b43));shell.material.emissiveIntensity=k===1?.36:.48;a.add(shell)});[.34,.72,1.10].forEach((y,k)=>{const ring=new THREE.Mesh(new THREE.TorusGeometry(.59-k*.035,.075,7,14),k===2?amber:white);ring.name='BumperPillarImpactRingV125';ring.rotation.x=Math.PI/2;ring.position.y=y;ring.castShadow=true;ring.material.emissive=new THREE.Color(k===2?0xff9b16:(i%2?0x44e7ff:0x49ff79));ring.material.emissiveIntensity=.78;a.add(ring)});[-1,1].forEach((side,k)=>{const guard=new THREE.Mesh(new THREE.CapsuleGeometry(.055,.88,4,8),dark);guard.name='BumperPillarGuardRailV125';guard.position.set(side*.57,.78,0);guard.castShadow=guard.receiveShadow=true;a.add(guard);const beacon=new THREE.Mesh(new THREE.OctahedronGeometry(.12,0),white);beacon.name='BumperPillarBeaconV125';beacon.position.set(side*.38,1.48,0);beacon.castShadow=true;beacon.material.emissive=new THREE.Color(k?0xffd24b:(i%2?0x44e7ff:0x49ff79));beacon.material.emissiveIntensity=1.05;a.add(beacon)});const cap=new THREE.Mesh(new THREE.CylinderGeometry(.34,.44,.22,10),amber);cap.name='BumperPillarCapV125';cap.position.y=1.42;cap.castShadow=cap.receiveShadow=true;cap.material.emissive=new THREE.Color(0xff9b16);cap.material.emissiveIntensity=.66;a.add(cap);g.add(a);staticHazardVisuals.push(a);return a}const crashBarrierVisualsV125=crashBarriers.map(upgradeCrashBarrierV125),bumperPillarVisualsV125=bumperPillars.map(upgradeBumperPillarV125);"""
          s=s.replace(anchor,modeled+anchor,1)
          p.write_text(s)
      - name: Verify v125 modeled hazards and preserved gameplay
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          required=[
            'STATIC_HAZARD_MODELS_V125=true',
            'CrashBarrierAssemblyV125',
            'CrashBarrierSpineV125',
            'CrashBarrierArmorPlateV125',
            'CrashBarrierReinforcedFootV125',
            'CrashBarrierWarningBeaconV125',
            'BumperPillarAssemblyV125',
            'BumperPillarBaseV125',
            'BumperPillarSegmentV125',
            'BumperPillarImpactRingV125',
            'BumperPillarGuardRailV125',
            'BumperPillarCapV125',
            "o.material.opacity=.035",
            'const blocks=[[-3.05,-16],[3.05,-11],[-2.1,-6],[2.1,-1],[-2.1,4]]',
            'const cylinders=[[3.15,-18],[-3.15,-13],[2,-8],[-2,-3],[2,2]]',
            'SWEEPER_VISUAL_MODEL_V124=true'
          ]
          for token in required:
              assert token in s, token
          assert s.count('STATIC_HAZARD_MODELS_V125=true') == 1
          assert s.count('crashBarriers.map(upgradeCrashBarrierV125)') == 1
          assert s.count('bumperPillars.map(upgradeBumperPillarV125)') == 1
          print('Static hazard models v125 contract: SUCCESS')
          PY
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          m=re.search(r'<script type="module">(.*?)</script>',s,re.S)
          assert m, 'module script not found'
          Path('/tmp/brainrot-module.mjs').write_text(m.group(1))
          PY
          node --check /tmp/brainrot-module.mjs
          node scripts/final-puncher-physics-contract-v65.mjs
          node scripts/final-finish-residual-momentum-check.mjs
          node scripts/final-finish-soft-hold-check.mjs
          node scripts/final-finish-charge-check.mjs
      - name: Commit real level change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "openai-level-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && { echo 'No gameplay change produced'; exit 1; }
          git commit -m "Level: model static hazard assemblies v125"
          git push origin HEAD:new-player-glb-overhaul
