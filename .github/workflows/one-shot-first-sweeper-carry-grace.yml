name: One-shot first sweeper carry grace

on:
  push:
    branches: [new-player-glb-overhaul]
    paths:
      - '.github/workflows/one-shot-first-sweeper-carry-grace.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-player-glb-overhaul
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch carry-safe first sweeper crossing
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="FIRST_SWEEPER_RECOVER=.72,FIRST_SWEEPER_BURST_SPEED=-2.65"
          new="FIRST_SWEEPER_RECOVER=.72,FIRST_SWEEPER_CARRY_GRACE=1.38,FIRST_SWEEPER_BURST_SPEED=-2.65"
          assert old in s and 'FIRST_SWEEPER_CARRY_GRACE=' not in s
          s=s.replace(old,new,1)
          old2="if(!firstSweeperGateCrossing&&(recover||cleared)&&gateSensor)firstSweeperGateCrossing=true;if(firstSweeperGateCrossing&&p.z>FIRST_SWEEPER_GATE_Z+.72&&bp.z>FIRST_SWEEPER_GATE_Z+.72){firstSweeperGateCrossing=false;firstSweeperPostGateGrace=.55;state.textContent='SWEEPER · БЕЗОПАСНЫЙ ВЫХОД'}"
          new2="if(!firstSweeperGateCrossing&&(recover||cleared)&&gateSensor)firstSweeperGateCrossing=true;if(firstSweeperGateCrossing)firstSweeperPostGateGrace=Math.max(firstSweeperPostGateGrace,FIRST_SWEEPER_CARRY_GRACE);if(firstSweeperGateCrossing&&p.z>FIRST_SWEEPER_GATE_Z+.72&&bp.z>FIRST_SWEEPER_GATE_Z+.72){firstSweeperGateCrossing=false;firstSweeperPostGateGrace=Math.max(firstSweeperPostGateGrace,FIRST_SWEEPER_CARRY_GRACE);state.textContent='SWEEPER · БЕЗОПАСНЫЙ ВЫХОД'}"
          assert old2 in s
          s=s.replace(old2,new2,1)
          s=s.replace('full 3D lift route v46 · second sweeper safe gate','full 3D lift route v47 · carry-safe first sweeper crossing',1)
          p.write_text(s)
          PY
      - name: Verify runtime invariants and syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          assert 'FIRST_SWEEPER_CARRY_GRACE=1.38' in s
          assert "if(firstSweeperGateCrossing)firstSweeperPostGateGrace=Math.max(firstSweeperPostGateGrace,FIRST_SWEEPER_CARRY_GRACE)" in s
          assert "firstSweeperPostGateGrace=Math.max(firstSweeperPostGateGrace,FIRST_SWEEPER_CARRY_GRACE);state.textContent='SWEEPER · БЕЗОПАСНЫЙ ВЫХОД'" in s
          assert "(i!==0||firstSweeperPostGateGrace<=0)" in s
          gate=-10.62
          release=gate+.72
          clear=-7.72
          carry_speed=3.05
          required=(clear-release)/carry_speed
          grace=1.38
          print(f'required post-gate traversal: {required:.3f}s; grace: {grace:.3f}s; margin: {grace-required:.3f}s')
          assert grace-required>.6
          m=re.search(r'<script type="module">(.*)</script></body>',s,re.S)
          assert m
          Path('/tmp/runtime.mjs').write_text(m.group(1))
          PY
          node --check /tmp/runtime.mjs
      - name: Commit gameplay change
        run: |
          git config user.name 'amazin20'
          git config user.email '138931938+amazin20@users.noreply.github.com'
          git add index.html
          git diff --cached --check
          git commit -m 'Make first sweeper carry crossing genuinely safe'
          git push origin HEAD:new-player-glb-overhaul
