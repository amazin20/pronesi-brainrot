name: One-shot final finish funnel v56
on:
  push:
    branches: [new-player-glb-overhaul]
    paths: ['.github/workflows/one-shot-final-finish-funnel-v56.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-player-glb-overhaul
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch physical final finish funnel
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('full 3D lift route v55 · physical post-puncher recovery catch','full 3D lift route v56 · physical finish capture funnel',1)
          old="const FINAL_RECOVERY_Z_MIN=8.92,FINAL_RECOVERY_Z_MAX=9.62,FINAL_RECOVERY_HALF_X=2.58,FINAL_RECOVERY_GRACE=.72;const FINAL_FINISH_CHARGE=.55"
          new="const FINAL_RECOVERY_Z_MIN=8.92,FINAL_RECOVERY_Z_MAX=9.62,FINAL_RECOVERY_HALF_X=2.58,FINAL_RECOVERY_GRACE=.72;const FINAL_FINISH_FUNNEL_Z_MIN=9.54,FINAL_FINISH_FUNNEL_Z_MAX=10.58,FINAL_FINISH_FUNNEL_HALF_X=2.42,FINAL_FINISH_FUNNEL_DAMP=10.5,FINAL_FINISH_FUNNEL_PULL=1.75;const FINAL_FINISH_CHARGE=.55"
          assert old in s
          s=s.replace(old,new,1)
          anchor="const finishChargePad=box(0,.17,10.46,4.8,.055,.52,0xffffff);"
          insert="const finalFinishFunnelPad=box(0,.032,(FINAL_FINISH_FUNNEL_Z_MIN+FINAL_FINISH_FUNNEL_Z_MAX)*.5,FINAL_FINISH_FUNNEL_HALF_X*2,.064,FINAL_FINISH_FUNNEL_Z_MAX-FINAL_FINISH_FUNNEL_Z_MIN,0x49ff79),finalFinishFunnelL=box(-FINAL_FINISH_FUNNEL_HALF_X-.11,.43,(FINAL_FINISH_FUNNEL_Z_MIN+FINAL_FINISH_FUNNEL_Z_MAX)*.5,.18,.86,FINAL_FINISH_FUNNEL_Z_MAX-FINAL_FINISH_FUNNEL_Z_MIN,0x49ff79),finalFinishFunnelR=box(FINAL_FINISH_FUNNEL_HALF_X+.11,.43,(FINAL_FINISH_FUNNEL_Z_MIN+FINAL_FINISH_FUNNEL_Z_MAX)*.5,.18,.86,FINAL_FINISH_FUNNEL_Z_MAX-FINAL_FINISH_FUNNEL_Z_MIN,0x49ff79);[finalFinishFunnelPad,finalFinishFunnelL,finalFinishFunnelR].forEach(o=>{o.material.emissive=new THREE.Color(0x159b43);o.material.emissiveIntensity=.7});"+anchor
          assert anchor in s
          s=s.replace(anchor,insert,1)
          old_fn="function inFinalRecoveryRail(x,z,r=0){return z>FINAL_RECOVERY_Z_MIN&&z<FINAL_RECOVERY_Z_MAX&&Math.abs(x)>FINAL_RECOVERY_HALF_X-r}"
          new_fn=old_fn+"function inFinalFinishFunnelRail(x,z,r=0){return z>FINAL_FINISH_FUNNEL_Z_MIN&&z<FINAL_FINISH_FUNNEL_Z_MAX&&Math.abs(x)>FINAL_FINISH_FUNNEL_HALF_X-r}"
          assert old_fn in s
          s=s.replace(old_fn,new_fn,1)
          s=s.replace("if(inFinalRecoveryRail(x,z,.4))return true;if(z>FINISH_Z_MIN", "if(inFinalRecoveryRail(x,z,.4))return true;if(inFinalFinishFunnelRail(x,z,.4))return true;if(z>FINISH_Z_MIN",1)
          s=s.replace("if(inFinalRecoveryRail(x,z,r))return true;if(z>FINISH_Z_MIN", "if(inFinalRecoveryRail(x,z,r))return true;if(inFinalFinishFunnelRail(x,z,r))return true;if(z>FINISH_Z_MIN",1)
          anchor_tick="if(recoveryActive&&finalRecoveryTimer>0){playerMomentumX*=Math.exp(-12*dt);playerMomentumZ*=Math.exp(-12*dt);if(!carry){bv.x*=Math.exp(-9*dt);bv.z*=Math.exp(-9*dt)}if(failTimer<=0)state.textContent='ФИНАЛ · БЕЗОПАСНОЕ ОКНО'}"
          add=anchor_tick+"const finalFinishFunnelActive=finalGauntletCleared&&p.z>FINAL_FINISH_FUNNEL_Z_MIN&&p.z<FINAL_FINISH_FUNNEL_Z_MAX&&!win&&failTimer<=0,finalFinishFunnelPulse=.5+.5*Math.sin(t*10);[finalFinishFunnelPad,finalFinishFunnelL,finalFinishFunnelR].forEach(o=>o.material.emissiveIntensity=finalFinishFunnelActive?1.12+.52*finalFinishFunnelPulse:.7);if(finalFinishFunnelActive){playerMomentumX*=Math.exp(-FINAL_FINISH_FUNNEL_DAMP*dt);playerMomentumZ*=Math.exp(-FINAL_FINISH_FUNNEL_DAMP*.55*dt);const funnelStep=FINAL_FINISH_FUNNEL_PULL*dt;p.x+=Math.max(-funnelStep,Math.min(funnelStep,-p.x));if(!carry){bv.x*=Math.exp(-FINAL_FINISH_FUNNEL_DAMP*.72*dt);bv.z*=Math.exp(-FINAL_FINISH_FUNNEL_DAMP*.42*dt)}if(failTimer<=0)state.textContent='ФИНИШ · НАПРАВЛЯЮЩИЙ КОРИДОР'}"
          assert anchor_tick in s
          s=s.replace(anchor_tick,add,1)
          p.write_text(s)
          PY
      - name: Verify runtime syntax and funnel invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          checks=[
            'full 3D lift route v56 · physical finish capture funnel',
            'FINAL_FINISH_FUNNEL_Z_MIN=9.54',
            'FINAL_FINISH_FUNNEL_HALF_X=2.42',
            'finalFinishFunnelPad=box(',
            'function inFinalFinishFunnelRail',
            'if(inFinalFinishFunnelRail(x,z,.4))return true',
            'if(inFinalFinishFunnelRail(x,z,r))return true',
            "state.textContent='ФИНИШ · НАПРАВЛЯЮЩИЙ КОРИДОР'"
          ]
          for x in checks: assert x in s, x
          start=s.index('<script type="module">')+len('<script type="module">')
          end=s.index('</script>',start)
          Path('/tmp/game.mjs').write_text(s[start:end])
          print('final finish funnel invariants PASS')
          PY
          node --check /tmp/game.mjs
      - name: Commit gameplay change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add physical capture funnel into finish portal'
          git push origin HEAD:new-player-glb-overhaul
