name: Apply Lift Safety Airlock v154

on:
  push:
    branches: [new-player-glb-overhaul]
    paths:
      - .github/workflows/apply-lift-safety-airlock-v154.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-player-glb-overhaul
          fetch-depth: 0
      - name: Refuse stale/non-linear apply
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin new-player-glb-overhaul
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/new-player-glb-overhaul)"
      - name: Build mechanical lift safety airlock v154
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          if 'LIFT_SAFETY_AIRLOCK_MODEL_V154=true' in s:
              raise SystemExit('v154 already present')
          anchor="[liftGatePostL,liftGatePostR,liftSafetyGate,liftGatePad].forEach(o=>{o.material.emissive=new THREE.Color(o===liftSafetyGate?0xa20d38:0xb86a00);o.material.emissiveIntensity=.82});"
          if anchor not in s:
              raise SystemExit('lift gate model anchor missing')
          model="""[liftGatePostL,liftGatePostR,liftSafetyGate,liftGatePad].forEach(o=>{o.material.emissive=new THREE.Color(o===liftSafetyGate?0xa20d38:0xb86a00);o.material.emissiveIntensity=.82});const LIFT_SAFETY_AIRLOCK_MODEL_V154=true;liftSafetyGate.name='LiftSafetyGateCollisionBarV154';liftSafetyGate.material.transparent=true;liftSafetyGate.material.opacity=.035;liftSafetyGate.material.depthWrite=false;liftGatePad.name='LiftSafetyAirlockLegacyPadV154';liftGatePad.material.transparent=true;liftGatePad.material.opacity=.035;liftGatePad.material.depthWrite=false;const liftAirlockV154=new THREE.Group();liftAirlockV154.name='LiftSafetyAirlockAssemblyV154';liftAirlockV154.position.set(0,0,LIFT_GATE_Z);scene.add(liftAirlockV154);const liftAirlockDarkV154=mat(0x171b2d),liftAirlockSteelV154=mat(0xe9f5ff),liftAirlockAmberV154=mat(0xffb12b),liftAirlockGreenV154=mat(0x49ff79),liftAirlockCyanV154=mat(0x45e8ff),liftAirlockRedV154=mat(0xff315d);liftAirlockDarkV154.metalness=.64;liftAirlockDarkV154.roughness=.26;liftAirlockSteelV154.metalness=.50;liftAirlockSteelV154.roughness=.20;const liftAirlockBaseV154=new THREE.Mesh(new THREE.BoxGeometry(4.18,.12,.72),liftAirlockDarkV154);liftAirlockBaseV154.name='LiftSafetyAirlockBaseV154';liftAirlockBaseV154.position.y=.06;liftAirlockBaseV154.castShadow=liftAirlockBaseV154.receiveShadow=true;liftAirlockV154.add(liftAirlockBaseV154);[-1.62,-1.08,-.54,0,.54,1.08,1.62].forEach((x,i)=>{const plate=new THREE.Mesh(new THREE.BoxGeometry(.44,.07,.58),i===3?liftAirlockSteelV154:liftAirlockAmberV154);plate.name='LiftSafetyAirlockDeckPlateV154';plate.position.set(x,.135,0);plate.castShadow=plate.receiveShadow=true;plate.material.emissive=new THREE.Color(i===3?0x4b6d83:0xa95a00);plate.material.emissiveIntensity=i===3?.34:.42;liftAirlockV154.add(plate)});const liftAirlockDoorPivotsV154=[],liftAirlockPistonsV154=[],liftAirlockRollersV154=[],liftAirlockLampsV154=[];[-1,1].forEach((side,si)=>{const tower=new THREE.Mesh(new THREE.BoxGeometry(.34,2.05,.42),liftAirlockDarkV154);tower.name='LiftSafetyAirlockServoTowerV154';tower.position.set(side*1.94,1.05,.02);tower.castShadow=tower.receiveShadow=true;liftAirlockV154.add(tower);[.34,.84,1.34,1.84].forEach((y,k)=>{const collar=new THREE.Mesh(new THREE.TorusGeometry(.19,.042,7,14),k===1?liftAirlockSteelV154:(si?liftAirlockCyanV154:liftAirlockAmberV154));collar.name='LiftSafetyAirlockTowerCollarV154';collar.rotation.x=Math.PI/2;collar.position.set(side*1.94,y,.02);collar.castShadow=true;collar.material.emissive=new THREE.Color(k===1?0x4b6d83:(si?0x087fa8:0xa95a00));collar.material.emissiveIntensity=.72;liftAirlockV154.add(collar)});const piston=new THREE.Mesh(new THREE.CylinderGeometry(.075,.095,.78,10),liftAirlockSteelV154);piston.name='LiftSafetyAirlockHydraulicPistonV154';piston.rotation.z=Math.PI/2;piston.position.set(side*1.55,.78,.02);piston.castShadow=piston.receiveShadow=true;piston.userData.side=side;liftAirlockV154.add(piston);liftAirlockPistonsV154.push(piston);const pivot=new THREE.Group();pivot.name='LiftSafetyAirlockDoorPivotV154';pivot.position.set(side*1.74,.78,.02);pivot.userData.side=side;const door=new THREE.Mesh(new THREE.BoxGeometry(1.62,.22,.34),si?liftAirlockCyanV154:liftAirlockAmberV154);door.name='LiftSafetyAirlockDoorV154';door.position.set(-side*.76,0,0);door.castShadow=door.receiveShadow=true;door.material.emissive=new THREE.Color(si?0x087fa8:0xa95a00);door.material.emissiveIntensity=.52;pivot.add(door);[-1.24,-.78,-.32].forEach((lx,k)=>{const rib=new THREE.Mesh(new THREE.BoxGeometry(.22,.31,.40),k===1?liftAirlockSteelV154:liftAirlockDarkV154);rib.name='LiftSafetyAirlockDoorRibV154';rib.position.set(side*lx,0,0);rib.castShadow=rib.receiveShadow=true;pivot.add(rib);const roller=new THREE.Mesh(new THREE.CylinderGeometry(.105,.105,.20,10),k===1?liftAirlockGreenV154:(si?liftAirlockCyanV154:liftAirlockAmberV154));roller.name='LiftSafetyAirlockDoorRollerV154';roller.rotation.z=Math.PI/2;roller.position.set(side*lx,-.20,0);roller.castShadow=roller.receiveShadow=true;roller.material.emissive=new THREE.Color(k===1?0x159b43:(si?0x087fa8:0xa95a00));roller.material.emissiveIntensity=.76;pivot.add(roller);liftAirlockRollersV154.push(roller)});liftAirlockV154.add(pivot);liftAirlockDoorPivotsV154.push(pivot);const lamp=new THREE.Mesh(new THREE.OctahedronGeometry(.12,0),si?liftAirlockCyanV154:liftAirlockAmberV154);lamp.name='LiftSafetyAirlockStatusLampV154';lamp.position.set(side*1.94,2.18,.02);lamp.castShadow=true;lamp.material.emissive=new THREE.Color(si?0x087fa8:0xa95a00);lamp.material.emissiveIntensity=1.0;liftAirlockV154.add(lamp);liftAirlockLampsV154.push(lamp)});const liftAirlockHeaderV154=new THREE.Mesh(new THREE.BoxGeometry(4.06,.22,.38),liftAirlockDarkV154);liftAirlockHeaderV154.name='LiftSafetyAirlockHeaderV154';liftAirlockHeaderV154.position.set(0,2.28,.02);liftAirlockHeaderV154.castShadow=liftAirlockHeaderV154.receiveShadow=true;liftAirlockV154.add(liftAirlockHeaderV154);[-1.28,-.64,0,.64,1.28].forEach((x,i)=>{const lamp=new THREE.Mesh(new THREE.OctahedronGeometry(.09,0),i===2?liftAirlockGreenV154:liftAirlockSteelV154);lamp.name='LiftSafetyAirlockHeaderLampV154';lamp.position.set(x,2.29,.24);lamp.castShadow=true;lamp.material.emissive=new THREE.Color(i===2?0x159b43:(i<2?0xa95a00:0x087fa8));lamp.material.emissiveIntensity=.82;liftAirlockV154.add(lamp);liftAirlockLampsV154.push(lamp)});const liftAirlockTimingRingV154=new THREE.Mesh(new THREE.TorusGeometry(.30,.055,8,18),liftAirlockGreenV154);liftAirlockTimingRingV154.name='LiftSafetyAirlockTimingRingV154';liftAirlockTimingRingV154.rotation.x=Math.PI/2;liftAirlockTimingRingV154.position.set(0,.22,.18);liftAirlockTimingRingV154.castShadow=true;liftAirlockTimingRingV154.material.emissive=new THREE.Color(0x159b43);liftAirlockTimingRingV154.material.emissiveIntensity=.84;liftAirlockV154.add(liftAirlockTimingRingV154);"""
          s=s.replace(anchor,model,1)
          anim_anchor="liftGatePad.material.emissiveIntensity=liftSafetyOpen?1.1:.72+.65*gatePulse;"
          if anim_anchor not in s:
              raise SystemExit('lift gate runtime anchor missing')
          anim="""liftGatePad.material.emissiveIntensity=liftSafetyOpen?1.1:.72+.65*gatePulse;const liftAirlockOpenV154=Math.max(0,Math.min(1,(liftSafetyGate.position.y-LIFT_GATE_CLOSED_Y)/(LIFT_GATE_OPEN_Y-LIFT_GATE_CLOSED_Y))),liftAirlockPulseV154=.5+.5*Math.sin(t*13.2);liftAirlockDoorPivotsV154.forEach((n,i)=>{const side=n.userData.side;n.rotation.z=side*(-.06+.82*liftAirlockOpenV154);n.position.y=.78+.18*liftAirlockOpenV154;n.children.forEach(c=>{if(c.isMesh&&c.material?.emissive)c.material.emissiveIntensity=liftSafetyOpen?.72+.45*liftAirlockPulseV154:.42})});liftAirlockPistonsV154.forEach(n=>{const side=n.userData.side;n.scale.y=.42+.58*liftAirlockOpenV154;n.position.x=side*(1.55+.16*liftAirlockOpenV154);n.material.emissive=n.material.emissive||new THREE.Color(0x4b6d83);n.material.emissiveIntensity=.38+.62*liftAirlockOpenV154});liftAirlockRollersV154.forEach((n,i)=>{n.rotation.x+=dt*(liftSafetyOpen?6.8:1.0)*(i%2?-1:1);n.material.emissiveIntensity=liftSafetyOpen?.78+.38*liftAirlockPulseV154:.52});liftAirlockLampsV154.forEach((n,i)=>{n.material.color.setHex(liftSafetyOpen?0x49ff79:(i%2?0xff315d:0xffb12b));n.material.emissive.setHex(liftSafetyOpen?0x159b43:(i%2?0xa20d38:0xa95a00));n.material.emissiveIntensity=liftSafetyOpen?1.1+.55*liftAirlockPulseV154:.72+.38*liftAirlockPulseV154});liftAirlockTimingRingV154.rotation.z+=dt*(liftSafetyOpen?2.3:.22);liftAirlockTimingRingV154.scale.setScalar(.94+.12*liftAirlockOpenV154);liftAirlockTimingRingV154.material.color.setHex(liftSafetyOpen?0x49ff79:0xff315d);liftAirlockTimingRingV154.material.emissive.setHex(liftSafetyOpen?0x159b43:0xa20d38);liftAirlockTimingRingV154.material.emissiveIntensity=liftSafetyOpen?.90+.50*liftAirlockPulseV154:.62;liftAirlockHeaderV154.material.emissive=liftAirlockHeaderV154.material.emissive||new THREE.Color(liftSafetyOpen?0x159b43:0xa20d38);liftAirlockHeaderV154.material.emissive.setHex(liftSafetyOpen?0x159b43:0xa20d38);liftAirlockHeaderV154.material.emissiveIntensity=liftSafetyOpen?.22+.42*liftAirlockOpenV154:.08;"""
          s=s.replace(anim_anchor,anim,1)
          p.write_text(s)
      - name: Verify lift safety airlock v154 and preserved physics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          required=[
            'LIFT_SAFETY_AIRLOCK_MODEL_V154=true',
            'LiftSafetyGateCollisionBarV154',
            'LiftSafetyAirlockAssemblyV154',
            'LiftSafetyAirlockServoTowerV154',
            'LiftSafetyAirlockHydraulicPistonV154',
            'LiftSafetyAirlockDoorPivotV154',
            'LiftSafetyAirlockDoorV154',
            'LiftSafetyAirlockDoorRollerV154',
            'LiftSafetyAirlockHeaderV154',
            'LiftSafetyAirlockTimingRingV154',
            'LIFT_GATE_HALF_X=1.9',
            'LIFT_GATE_CLOSED_Y=.72',
            'LIFT_GATE_OPEN_Y=3.46',
            'function liftSafetyGateBlocks(x,z,r=.4,top=LIFT_GATE_PLAYER_TOP)',
            'barBottom=liftSafetyGate.position.y-LIFT_GATE_BAR_HALF_Y',
            'liftSafetyGate.position.y+=Math.max(-gateStep,Math.min(gateStep,gateTarget-liftSafetyGate.position.y))'
          ]
          for token in required:
              assert token in s, token
          assert s.count('LIFT_SAFETY_AIRLOCK_MODEL_V154=true') == 1
          assert s.count("name='LiftSafetyGateCollisionBarV154'") == 1
          assert 'LIFT_GATE_BAR_HALF_Y=.11' in s
          assert 'liftSafetyGateBlocks(x,z,.4)' in s
          m=re.search(r'<script type="module">(.*?)</script>',s,re.S)
          assert m, 'module script missing'
          Path('/tmp/brainrot-module.mjs').write_text(m.group(1))
          print('Lift safety airlock v154 contract: SUCCESS')
          PY
          node --check /tmp/brainrot-module.mjs
          node scripts/final-puncher-physics-contract-v65.mjs
          node scripts/final-finish-residual-momentum-check.mjs
          node scripts/final-finish-soft-hold-check.mjs
          node scripts/final-finish-charge-check.mjs
          if [ -f scripts/second-pit-full-route-continuity-v70.mjs ]; then node scripts/second-pit-full-route-continuity-v70.mjs; fi
      - name: Commit real level change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "openai-level-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && { echo 'No gameplay change produced'; exit 1; }
          git commit -m "Level: mechanical lift safety airlock v154"
          git push origin HEAD:new-player-glb-overhaul
