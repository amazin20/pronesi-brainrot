name: one-shot final strike platforms v100
on:
  push:
    branches: [new-player-glb-overhaul]
    paths: ['.github/workflows/one-shot-final-strike-platforms-v100.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-player-glb-overhaul
          fetch-depth: 0
      - name: Patch real final strike platforms
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="const finalGauntletPad1=box(0,.025,FINAL_GAUNTLET_Z1,6.65,.05,.72,0xffb12b),finalGauntletPad2=box(0,.025,FINAL_GAUNTLET_Z2,6.65,.05,.72,0xff557c);[finalGauntletPad1,finalGauntletPad2].forEach(o=>{o.material.emissive=new THREE.Color(o.material.color);o.material.emissiveIntensity=.62});"
          new="const FINAL_STRIKE_PLATFORM_MODEL_V100=true;function makeFinalStrikePlatform(z,c,label){const g=new THREE.Group();g.name=label+'StrikePlatformV100';g.position.set(0,.04,z);const accent=mat(c),dark=mat(0x202642),white=mat(0xffffff);const core=new THREE.Mesh(new THREE.CapsuleGeometry(.075,6.34,4,8),accent);core.name=label+'StrikeCoreV100';core.rotation.z=Math.PI/2;core.castShadow=core.receiveShadow=true;core.material.emissive=new THREE.Color(c);core.material.emissiveIntensity=.62;g.add(core);[-.27,.27].forEach(zz=>{const rail=new THREE.Mesh(new THREE.CapsuleGeometry(.045,6.12,4,8),dark);rail.name=label+'StrikeRailV100';rail.rotation.z=Math.PI/2;rail.position.z=zz;rail.castShadow=rail.receiveShadow=true;g.add(rail)});[-2.65,-1.32,0,1.32,2.65].forEach((x,i)=>{const brace=new THREE.Mesh(new THREE.CylinderGeometry(.045,.06,.52,8),dark);brace.name=label+'StrikeBraceV100';brace.rotation.x=Math.PI/2;brace.position.set(x,-.015,0);brace.castShadow=brace.receiveShadow=true;g.add(brace);const node=new THREE.Mesh(new THREE.TorusGeometry(.10,.025,6,10),white);node.name=label+'StrikeNodeV100';node.rotation.x=Math.PI/2;node.position.set(x,.035,0);node.castShadow=true;node.material.emissive=new THREE.Color(c);node.material.emissiveIntensity=i===2?.95:.62;g.add(node)});g.material=core.material;scene.add(g);return g}const finalGauntletPad1=makeFinalStrikePlatform(FINAL_GAUNTLET_Z1,0xffb12b,'Amber'),finalGauntletPad2=makeFinalStrikePlatform(FINAL_GAUNTLET_Z2,0xff557c,'Pink');"
          if old not in s: raise SystemExit('target final gauntlet pad block not found')
          s=s.replace(old,new,1)
          s=s.replace('full 3D route v99 · modeled pressure pylons','full 3D route v100 · modeled strike platforms',1)
          p.write_text(s)
          PY
      - name: v100 gameplay invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          req=['FINAL_STRIKE_PLATFORM_MODEL_V100=true','StrikePlatformV100','StrikeCoreV100','StrikeRailV100','StrikeBraceV100','StrikeNodeV100','finalGauntletPad1=makeFinalStrikePlatform(FINAL_GAUNTLET_Z1','finalGauntletPad2=makeFinalStrikePlatform(FINAL_GAUNTLET_Z2','finalGauntletPad1.material.emissiveIntensity','finalGauntletPad2.material.emissiveIntensity','FINAL_GAUNTLET_HALF_X=.68','FINAL_GAUNTLET_HALF_Z=.34','FINAL_GAUNTLET_SPEED=2.35']
          for x in req: assert x in s, x
          assert 'finalGauntletPad1=box(' not in s
          assert 'finalGauntletPad2=box(' not in s
          print('v100 final strike platform invariants: PASS')
          PY
      - name: Browser module syntax check
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text()
          m=re.search(r'<script type="module">(.*)</script>',s,re.S)
          assert m
          body=m.group(1)
          body=re.sub(r"^import .*?;",'',body,count=2,flags=re.M)
          Path('/tmp/game-module.mjs').write_text(body)
          PY
          node --check /tmp/game-module.mjs
      - name: Existing final gameplay contract
        run: node scripts/final-finish-charge-check.mjs
      - name: Diff check
        run: git diff --check
      - name: Commit gameplay change
        run: |
          git config user.name 'amazin20'
          git config user.email '138931938+amazin20@users.noreply.github.com'
          git add index.html
          git commit -m 'Model final strike platforms v100'
          git push origin HEAD:new-player-glb-overhaul
