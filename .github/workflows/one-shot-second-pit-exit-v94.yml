name: One-shot second pit exit v94

on:
  push:
    branches: [new-player-glb-overhaul]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add one-shot second pit exit v94 patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-player-glb-overhaul
          fetch-depth: 0

      - name: Patch real second-pit exit assembly
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="const secondPitExitBridge=box(0,.02,SECOND_PIT_EXIT_BRIDGE_Z,SECOND_PIT_EXIT_BRIDGE_HALF_X*2,.08,SECOND_PIT_EXIT_BRIDGE_HALF_Z*2,0x49ff79),secondPitExitPad=box(0,.035,5.98,3.35,.07,.44,0x49ff79);secondPitExitBridge.material.emissive=new THREE.Color(0x19b24e);secondPitExitBridge.material.emissiveIntensity=.9;secondPitExitPad.material.emissive=new THREE.Color(0x19b24e);secondPitExitPad.material.emissiveIntensity=.58;"
          new="const SECOND_PIT_EXIT_MODEL_V94=true;const secondPitExitBridge=box(0,.02,SECOND_PIT_EXIT_BRIDGE_Z,SECOND_PIT_EXIT_BRIDGE_HALF_X*2,.08,SECOND_PIT_EXIT_BRIDGE_HALF_Z*2,0x49ff79),secondPitExitPad=box(0,.035,5.98,3.35,.07,.44,0x49ff79);secondPitExitBridge.name='SecondPitExitCollisionDeckV94';secondPitExitBridge.material.transparent=true;secondPitExitBridge.material.opacity=.12;secondPitExitBridge.material.depthWrite=false;secondPitExitPad.name='SecondPitExitLandingPadV94';secondPitExitPad.material.emissive=new THREE.Color(0x19b24e);secondPitExitPad.material.emissiveIntensity=.58;function makeSecondPitExitRail(side){const g=new THREE.Group();g.name='SecondPitExitRailV94';g.position.set(side*1.58,.02,SECOND_PIT_EXIT_BRIDGE_Z);const green=mat(0x49ff79),dark=mat(0x153b35),white=mat(0xd9ffe4);const rail=new THREE.Mesh(new THREE.CapsuleGeometry(.065,.38,4,8),green);rail.name='SecondPitExitRailBeamV94';rail.rotation.x=Math.PI/2;rail.position.y=.32;rail.castShadow=rail.receiveShadow=true;rail.material.emissive=new THREE.Color(0x159b43);rail.material.emissiveIntensity=.72;g.add(rail);[-.15,.15].forEach(z=>{const post=new THREE.Mesh(new THREE.CylinderGeometry(.045,.065,.48,8),dark);post.name='SecondPitExitPostV94';post.position.set(0,.24,z);post.castShadow=post.receiveShadow=true;g.add(post);const ring=new THREE.Mesh(new THREE.TorusGeometry(.08,.022,6,10),white);ring.name='SecondPitExitBeaconV94';ring.rotation.x=Math.PI/2;ring.position.set(0,.49,z);ring.material.emissive=new THREE.Color(0x49ff79);ring.material.emissiveIntensity=.9;ring.castShadow=true;g.add(ring)});scene.add(g);return g}const secondPitExitRailL=makeSecondPitExitRail(-1),secondPitExitRailR=makeSecondPitExitRail(1);const secondPitExitCenterRail=new THREE.Mesh(new THREE.CapsuleGeometry(.045,2.45,4,8),mat(0xb7ffcf));secondPitExitCenterRail.name='SecondPitExitCenterRailV94';secondPitExitCenterRail.rotation.z=Math.PI/2;secondPitExitCenterRail.position.set(0,.105,SECOND_PIT_EXIT_BRIDGE_Z);secondPitExitCenterRail.material.emissive=new THREE.Color(0x19b24e);secondPitExitCenterRail.material.emissiveIntensity=.78;secondPitExitCenterRail.castShadow=true;scene.add(secondPitExitCenterRail);"
          if old not in s:
              raise SystemExit('v94 target block not found; refusing blind patch')
          s=s.replace(old,new,1)
          s=s.replace('full 3D lift route v93 · runtime bootstrap recovered','full 3D route v94 · modeled second-pit exit',1)
          p.write_text(s)
          PY

      - name: Verify v94 gameplay geometry invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          required=[
            'SECOND_PIT_EXIT_MODEL_V94=true',
            "SecondPitExitCollisionDeckV94",
            "SecondPitExitRailV94",
            "SecondPitExitRailBeamV94",
            "SecondPitExitPostV94",
            "SecondPitExitBeaconV94",
            "SecondPitExitCenterRailV94",
            'SECOND_PIT_EXIT_BRIDGE_Z=5.80',
            'SECOND_PIT_EXIT_BRIDGE_HALF_X=1.75',
            'SECOND_PIT_EXIT_BRIDGE_HALF_Z=.28',
            'SECOND_PIT_EXIT_RELEASE_Z=6.02'
          ]
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('missing invariants: '+', '.join(missing))
          if 'secondPitExitBridge.material.emissiveIntensity=.9' in s:
              raise SystemExit('legacy visible box bridge marker still present')
          print('v94 second-pit exit modeled geometry invariants OK')
          PY

      - name: Browser module syntax check
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          a=s.index('<script type="module">')+len('<script type="module">')
          b=s.index('</script>',a)
          Path('/tmp/brainrot-module.mjs').write_text(s[a:b])
          PY
          node --check /tmp/brainrot-module.mjs

      - name: Existing lift route continuity check
        run: node scripts/lift-route-continuity-check.mjs

      - name: Diff hygiene
        run: git diff --check

      - name: Commit real gameplay level change
        run: |
          git config user.name amazin20
          git config user.email 138931938+amazin20@users.noreply.github.com
          git add index.html
          git commit -m "Model second pit exit assembly v94"
          git push origin HEAD:new-player-glb-overhaul
