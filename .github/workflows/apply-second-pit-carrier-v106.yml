name: Apply Second Pit Carrier Visual Overhaul v106

on:
  push:
    branches: [new-player-glb-overhaul]
    paths: ['.github/workflows/apply-second-pit-carrier-v106.yml']

permissions:
  contents: write

jobs:
  patch-level:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-player-glb-overhaul
          fetch-depth: 0
      - name: Patch real second-pit carrier assembly
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          replacements=[
            ("const SECOND_PIT_CARRIER_MODEL_V72=true;function makeSecondPitCarrier", "const SECOND_PIT_CARRIER_MODEL_V72=true,SECOND_PIT_CARRIER_MODEL_V106=true;function makeSecondPitCarrier"),
            ("deck.name='SecondPitCarrierDeckV72';deck.material.emissive=new THREE.Color(c);deck.material.emissiveIntensity=.58;const dark=mat(0x20253f),accent=mat(c);", "deck.name='SecondPitCarrierDeckV72';deck.material.emissive=new THREE.Color(c);deck.material.emissiveIntensity=.28;deck.material.transparent=true;deck.material.opacity=.07;deck.material.depthWrite=false;const dark=mat(0x20253f),accent=mat(c);dark.metalness=.42;dark.roughness=.34;accent.metalness=.28;accent.roughness=.3;accent.emissive=new THREE.Color(c);accent.emissiveIntensity=.52;"),
            ("pontoon.position.set(0,-.06,z);pontoon.scale.z=.82;", "pontoon.position.set(0,.015,z);pontoon.scale.set(1.08,.72,.72);pontoon.rotation.x=z<0?-.08:.08;"),
            ("hub.rotation.z=Math.PI/2;hub.position.set(px,-.02,0);", "hub.rotation.z=Math.PI/2;hub.position.set(px,-.015,0);hub.scale.set(1,1,1.12);"),
            ("ring.rotation.y=Math.PI/2;ring.position.set(px,-.02,0);ring.castShadow=true;deck.add(ring)", "ring.rotation.y=Math.PI/2;ring.position.set(px,-.015,0);ring.castShadow=true;ring.material.emissive=new THREE.Color(c);ring.material.emissiveIntensity=1.25;deck.add(ring)"),
            ("rail.rotation.z=Math.PI/2;rail.position.set(0,.16,z);rail.castShadow=true;", "rail.rotation.z=Math.PI/2;rail.position.set(0,.19,z);rail.castShadow=true;rail.material.metalness=.18;rail.material.roughness=.24;rail.material.emissive=new THREE.Color(i?0x44e7ff:0xff5fc7);rail.material.emissiveIntensity=.18;"),
            ("const stripe=box(x,.085,SECOND_PIT_Z,1.5,.035,.5,0xffffff);stripe.material.emissive=new THREE.Color(i?0x44e7ff:0xff5fc7);stripe.material.emissiveIntensity=1.15;", "const stripe=box(x,.105,SECOND_PIT_Z,1.5,.035,.5,0xffffff);stripe.name='SecondPitCarrierArmorPlateV106';stripe.rotation.y=i?-.07:.07;stripe.material.metalness=.32;stripe.material.roughness=.22;stripe.material.emissive=new THREE.Color(i?0x44e7ff:0xff5fc7);stripe.material.emissiveIntensity=1.35;")
          ]
          for old,new in replacements:
              if old not in s:
                  raise SystemExit('missing expected runtime fragment: '+old[:90])
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Verify browser module syntax
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const src=fs.readFileSync('index.html','utf8');
          const m=src.match(/<script type="module">([\s\S]*?)<\/script>/);
          if(!m) throw new Error('module script missing');
          let body=m[1].replace(/^import .*$/gm,'');
          new Function(body);
          console.log('PASS browser module parse');
          NODE
      - name: Verify carrier budgets and route contracts
        run: |
          node scripts/second-pit-carrier-webgl-budget-v105-check.mjs
          node scripts/second-pit-carrier-modeled-quality-v104-check.mjs
          node scripts/second-pit-platform-motion-v71-check.mjs
          node scripts/second-pit-carry-window-check.mjs
          node scripts/second-pit-route-continuity-v70-check.mjs
      - name: Commit gameplay level change
        run: |
          git config user.name 'amazin20'
          git config user.email '138931938+amazin20@users.noreply.github.com'
          git add index.html
          git commit -m 'Level: overhaul second pit carrier visuals v106'
          git push origin HEAD:new-player-glb-overhaul
