name: Final Finish Funnel V78 Runtime Fix
on:
  push:
    branches: [new-player-glb-overhaul]
    paths: ['.github/workflows/final-finish-funnel-v78.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-player-glb-overhaul
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fix v78 runtime pulse for modeled guards
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="[finalFinishFunnelPad,finalFinishFunnelL,finalFinishFunnelR].forEach(o=>o.material.emissiveIntensity=finalFinishFunnelActive?1.12+.52*finalFinishFunnelPulse:.7);"
          new="finalFinishFunnelPad.material.emissiveIntensity=finalFinishFunnelActive?1.12+.52*finalFinishFunnelPulse:.7;[finalFinishFunnelL,finalFinishFunnelR].forEach(g=>{const rail=g.children.find(c=>c.name==='FinalFinishFunnelRailV78');if(rail)rail.material.emissiveIntensity=finalFinishFunnelActive?1.12+.52*finalFinishFunnelPulse:.7;g.children.filter(c=>c.name==='FinalFinishFunnelBeaconV78').forEach(b=>b.material.emissiveIntensity=finalFinishFunnelActive?1.25+.35*finalFinishFunnelPulse:.82)});"
          if old not in s:
              raise SystemExit('expected stale v78 group material pulse not found')
          if 'FINAL_FINISH_FUNNEL_MODEL_V78=true' not in s:
              raise SystemExit('v78 modeled funnel missing')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Verify v78 runtime invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          checks={
            'model flag':'FINAL_FINISH_FUNNEL_MODEL_V78=true',
            'capsule rail':'FinalFinishFunnelRailV78',
            'beacons':'FinalFinishFunnelBeaconV78',
            'group-safe rail pulse':"g.children.find(c=>c.name==='FinalFinishFunnelRailV78')",
            'group-safe beacon pulse':"g.children.filter(c=>c.name==='FinalFinishFunnelBeaconV78')",
            'collision helper':'function inFinalFinishFunnelRail(x,z,r=0)',
            'player collision':'if(inFinalFinishFunnelRail(x,z,.4))return true',
            'brain collision':'if(inFinalFinishFunnelRail(x,z,r))return true',
          }
          missing=[k for k,v in checks.items() if v not in s]
          if missing: raise SystemExit('missing: '+', '.join(missing))
          stale='[finalFinishFunnelPad,finalFinishFunnelL,finalFinishFunnelR].forEach(o=>o.material.emissiveIntensity='
          if stale in s: raise SystemExit('stale Group.material pulse remains')
          print('FINAL_FINISH_FUNNEL_RUNTIME_V78: PASS')
          PY
      - name: Browser module syntax check
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          m=re.search(r'<script type="module">(.*)</script>',s,re.S)
          if not m: raise SystemExit('module script not found')
          js=m.group(1)
          js=re.sub(r"^import .*?;",'',js,flags=re.M)
          Path('/tmp/runtime-v78.mjs').write_text(js)
          PY
          node --check /tmp/runtime-v78.mjs
      - name: Diff check
        run: git diff --check
      - name: Commit runtime fix
        run: |
          git config user.name 'amazin20'
          git config user.email '138931938+amazin20@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix modeled finish funnel runtime pulse v78'
          git push origin HEAD:new-player-glb-overhaul
