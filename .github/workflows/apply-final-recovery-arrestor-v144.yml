name: Apply Final Recovery Arrestor v144

on:
  push:
    branches: [new-player-glb-overhaul]
    paths:
      - .github/workflows/apply-final-recovery-arrestor-v144.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-player-glb-overhaul
          fetch-depth: 0
      - name: Refuse stale/non-linear apply
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin new-player-glb-overhaul
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/new-player-glb-overhaul)"
          test "$(git rev-parse HEAD^)" = "4bb2a5d466e200d12f657fda12de79c839de5951"
          git merge-base --is-ancestor e50d05a7eda8b6d97b3e1e5c7ff663001ecd29d4 HEAD
      - name: Model final recovery arrestor deck v144
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          if 'FINAL_RECOVERY_ARRESTOR_MODEL_V144=true' in s:
              raise SystemExit('v144 already present')
          pat=r"(const finalRecoveryPad=box\([^;]+\);)"
          m=re.search(pat,s)
          if not m:
              raise SystemExit('finalRecoveryPad creation anchor missing')
          model="""const FINAL_RECOVERY_ARRESTOR_MODEL_V144=true;const finalRecoveryArrestorV144=new THREE.Group();finalRecoveryArrestorV144.name='FinalRecoveryArrestorAssemblyV144';finalRecoveryArrestorV144.position.set(0,0,(FINAL_RECOVERY_Z_MIN+FINAL_RECOVERY_Z_MAX)*.5);scene.add(finalRecoveryArrestorV144);const recoverySteelV144=mat(0xeef5ff),recoveryDarkV144=mat(0x18213a),recoveryGreenV144=mat(0x49ff79),recoveryCyanV144=mat(0x44e7ff),recoveryAmberV144=mat(0xffd84d);recoverySteelV144.metalness=.48;recoverySteelV144.roughness=.22;recoveryDarkV144.metalness=.62;recoveryDarkV144.roughness=.27;recoveryGreenV144.metalness=.34;recoveryGreenV144.roughness=.24;const recoveryFrameV144=new THREE.Mesh(new THREE.BoxGeometry(5.26,.10,.56),recoveryDarkV144);recoveryFrameV144.name='FinalRecoveryArrestorFrameV144';recoveryFrameV144.position.y=.055;recoveryFrameV144.castShadow=recoveryFrameV144.receiveShadow=true;finalRecoveryArrestorV144.add(recoveryFrameV144);[-2.22,-1.48,-.74,0,.74,1.48,2.22].forEach((x,i)=>{const rib=new THREE.Mesh(new THREE.BoxGeometry(.54,.085,.62),i===3?recoverySteelV144:recoveryGreenV144);rib.name='FinalRecoveryArrestorDeckRibV144';rib.position.set(x,.125,0);rib.castShadow=rib.receiveShadow=true;rib.material.emissive=new THREE.Color(i===3?0xffffff:0x159b43);rib.material.emissiveIntensity=i===3?.70:.42;finalRecoveryArrestorV144.add(rib)});[-.30,.30].forEach((z,i)=>{const rail=new THREE.Mesh(new THREE.CapsuleGeometry(.045,4.92,4,8),recoverySteelV144);rail.name='FinalRecoveryArrestorEdgeRailV144';rail.rotation.z=Math.PI/2;rail.position.set(0,.235,z);rail.castShadow=rail.receiveShadow=true;rail.material.emissive=new THREE.Color(i?0x44e7ff:0x49ff79);rail.material.emissiveIntensity=.68;finalRecoveryArrestorV144.add(rail)});const finalRecoveryDampersV144=[],finalRecoveryArmsV144=[],finalRecoveryLampsV144=[];[-1,1].forEach((side,i)=>{const tower=new THREE.Mesh(new THREE.CylinderGeometry(.14,.20,1.18,10),recoveryDarkV144);tower.name='FinalRecoveryArrestorTowerV144';tower.position.set(side*2.40,.61,0);tower.castShadow=tower.receiveShadow=true;finalRecoveryArrestorV144.add(tower);[.28,.68,1.08].forEach((y,k)=>{const collar=new THREE.Mesh(new THREE.TorusGeometry(.20,.045,7,12),k===1?recoverySteelV144:(i?recoveryCyanV144:recoveryGreenV144));collar.name='FinalRecoveryArrestorTowerCollarV144';collar.rotation.x=Math.PI/2;collar.position.set(side*2.40,y,0);collar.castShadow=true;collar.material.emissive=new THREE.Color(k===1?0xffffff:(i?0x44e7ff:0x49ff79));collar.material.emissiveIntensity=k===1?.72:.82;finalRecoveryArrestorV144.add(collar)});const damper=new THREE.Mesh(new THREE.CylinderGeometry(.105,.13,.92,10),i?recoveryCyanV144:recoveryGreenV144);damper.name='FinalRecoveryHydraulicDamperV144';damper.rotation.z=Math.PI/2;damper.position.set(side*1.95,.36,0);damper.castShadow=damper.receiveShadow=true;damper.userData.side=side;damper.material.emissive=new THREE.Color(i?0x087fa8:0x159b43);damper.material.emissiveIntensity=.62;finalRecoveryArrestorV144.add(damper);finalRecoveryDampersV144.push(damper);const armPivot=new THREE.Group();armPivot.name='FinalRecoveryArrestorArmPivotV144';armPivot.position.set(side*2.13,.50,.16);armPivot.userData.side=side;const arm=new THREE.Mesh(new THREE.BoxGeometry(.72,.11,.14),recoverySteelV144);arm.name='FinalRecoveryArrestorArmV144';arm.position.x=-side*.34;arm.castShadow=arm.receiveShadow=true;arm.material.emissive=new THREE.Color(i?0x44e7ff:0x49ff79);arm.material.emissiveIntensity=.58;armPivot.add(arm);const pad=new THREE.Mesh(new THREE.BoxGeometry(.18,.34,.28),recoveryAmberV144);pad.name='FinalRecoveryArrestorCatchPadV144';pad.position.set(-side*.70,0,0);pad.castShadow=pad.receiveShadow=true;pad.material.emissive=new THREE.Color(0xa95a00);pad.material.emissiveIntensity=.82;armPivot.add(pad);finalRecoveryArrestorV144.add(armPivot);finalRecoveryArmsV144.push(armPivot);const lamp=new THREE.Mesh(new THREE.OctahedronGeometry(.11,0),recoverySteelV144);lamp.name='FinalRecoveryArrestorStatusLampV144';lamp.position.set(side*2.40,1.31,0);lamp.castShadow=true;lamp.material.emissive=new THREE.Color(i?0x44e7ff:0x49ff79);lamp.material.emissiveIntensity=.9;finalRecoveryArrestorV144.add(lamp);finalRecoveryLampsV144.push(lamp)});const recoveryBeamV144=new THREE.Mesh(new THREE.BoxGeometry(4.88,.14,.18),recoveryDarkV144);recoveryBeamV144.name='FinalRecoveryArrestorTimingBeamV144';recoveryBeamV144.position.set(0,1.58,.12);recoveryBeamV144.castShadow=recoveryBeamV144.receiveShadow=true;finalRecoveryArrestorV144.add(recoveryBeamV144);[-1.55,-.78,0,.78,1.55].forEach((x,i)=>{const lamp=new THREE.Mesh(new THREE.OctahedronGeometry(.085,0),i===2?recoveryAmberV144:recoverySteelV144);lamp.name='FinalRecoveryArrestorBeamLampV144';lamp.position.set(x,1.59,.23);lamp.castShadow=true;lamp.material.emissive=new THREE.Color(i===2?0xffb12b:(i<2?0x49ff79:0x44e7ff));lamp.material.emissiveIntensity=.86;finalRecoveryArrestorV144.add(lamp);finalRecoveryLampsV144.push(lamp)});[-1.55,0,1.55].forEach((x,i)=>{const guide=new THREE.Mesh(new THREE.TorusGeometry(.13,.032,7,12),i===1?recoveryAmberV144:recoverySteelV144);guide.name='FinalRecoveryArrestorGuideRingV144';guide.rotation.x=Math.PI/2;guide.position.set(x,.18,.16);guide.castShadow=true;guide.material.emissive=new THREE.Color(i===1?0xffb12b:(i===0?0x49ff79:0x44e7ff));guide.material.emissiveIntensity=i===1?1.05:.78;finalRecoveryArrestorV144.add(guide)});"""
          s=s[:m.end()]+model+s[m.end():]
          tick_anchor='if(recoveryActive&&finalRecoveryTimer>0){'
          if s.count(tick_anchor) != 1:
              raise SystemExit(f'v144 recovery tick anchor count={s.count(tick_anchor)}')
          tick="""const recoveryWindowV144=finalGauntletCleared?Math.max(0,Math.min(1,finalRecoveryTimer/FINAL_RECOVERY_GRACE)):0,recoverySettleV144=1-recoveryWindowV144,recoveryPulseV144=.5+.5*Math.sin(t*12.5);finalRecoveryDampersV144.forEach(n=>{n.scale.y=.42+.58*recoverySettleV144;n.material.emissiveIntensity=recoveryActive?.72+.68*recoveryPulseV144:.42});finalRecoveryArmsV144.forEach(n=>{const side=n.userData.side;n.rotation.z=side*(recoveryActive?(.58*(1-recoverySettleV144)):.58);n.position.y=.50+.05*recoverySettleV144;n.children.forEach(c=>{if(c.isMesh&&c.material?.emissive)c.material.emissiveIntensity=recoveryActive?.82+.46*recoveryPulseV144:.58})});finalRecoveryLampsV144.forEach((n,i)=>{const settled=recoveryActive&&recoverySettleV144>.52;n.material.color.setHex(settled?0x49ff79:(i%2?0x44e7ff:0xffd84d));n.material.emissive.setHex(settled?0x19b24e:(i%2?0x087fa8:0xa95a00));n.material.emissiveIntensity=recoveryActive?1.0+.72*recoveryPulseV144:.68});recoveryFrameV144.material.emissive=recoveryFrameV144.material.emissive||new THREE.Color(0x159b43);recoveryFrameV144.material.emissiveIntensity=recoveryActive?.30+.58*recoverySettleV144:.12;recoveryBeamV144.material.emissive=recoveryBeamV144.material.emissive||new THREE.Color(0x159b43);recoveryBeamV144.material.emissiveIntensity=recoveryActive?.32+.62*recoveryPulseV144:.12;"""
          s=s.replace(tick_anchor,tick+tick_anchor,1)
          p.write_text(s)
      - name: Verify v144 arrestor model and preserved physics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          required=['FINAL_RECOVERY_ARRESTOR_MODEL_V144=true','FinalRecoveryArrestorAssemblyV144','FinalRecoveryArrestorFrameV144','FinalRecoveryArrestorDeckRibV144','FinalRecoveryHydraulicDamperV144','FinalRecoveryArrestorArmV144','FinalRecoveryArrestorCatchPadV144','FinalRecoveryArrestorTimingBeamV144','FinalRecoveryArrestorStatusLampV144','FINAL_RECOVERY_Z_MIN=8.92','FINAL_RECOVERY_Z_MAX=9.62','FINAL_RECOVERY_GRACE=.72','FINAL_FINISH_FUNNEL_Z_MIN=9.54','FINAL_FINISH_FUNNEL_DAMP=10.5','FINAL_CHARGE_CRADLE_DAMP=15.5']
          for token in required: assert token in s, token
          assert s.count('FINAL_RECOVERY_ARRESTOR_MODEL_V144=true') == 1
          assert s.count('const recoveryWindowV144=') == 1
          assert 'FINAL_SECOND_PUNCHER_MODEL_V143=true' in s
          print('Final recovery arrestor mechanical model v144 contract: SUCCESS')
          PY
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text();m=re.search(r'<script type="module">(.*?)</script>',s,re.S);assert m
          Path('/tmp/brainrot-module.mjs').write_text(m.group(1))
          PY
          node --check /tmp/brainrot-module.mjs
          for f in scripts/final-puncher-physics-contract-v65.mjs scripts/final-finish-residual-momentum-check.mjs scripts/final-finish-soft-hold-check.mjs scripts/final-finish-charge-check.mjs scripts/second-pit-route-continuity-v70-check.mjs; do
            if [ -f "$f" ]; then node "$f"; else echo "SKIP missing $f"; fi
          done
      - name: Commit real level change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "openai-level-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && { echo 'No gameplay change produced'; exit 1; }
          git commit -m "Level: mechanical final recovery arrestor v144"
          git push origin HEAD:new-player-glb-overhaul
