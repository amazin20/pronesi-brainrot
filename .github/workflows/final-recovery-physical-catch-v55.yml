name: Final recovery physical catch v55
on:
  push:
    branches: [new-player-glb-overhaul]
    paths: ['.github/workflows/final-recovery-physical-catch-v55.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-player-glb-overhaul
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Make post-puncher recovery rails physical
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          repls=[
            ('full 3D lift route v54 · final puncher containment rails','full 3D lift route v55 · physical post-puncher recovery catch'),
            ('const FINAL_RECOVERY_Z_MIN=8.92,FINAL_RECOVERY_Z_MAX=9.62,FINAL_RECOVERY_GRACE=.72;','const FINAL_RECOVERY_Z_MIN=8.92,FINAL_RECOVERY_Z_MAX=9.62,FINAL_RECOVERY_HALF_X=2.58,FINAL_RECOVERY_GRACE=.72;'),
            ('function inFinalGauntletApproachRail(x,z,r=0){return z>FINAL_GAUNTLET_APPROACH_Z_MIN&&z<FINAL_GAUNTLET_APPROACH_Z_MAX&&Math.abs(x)>FINAL_GAUNTLET_APPROACH_HALF_X-r}','function inFinalGauntletApproachRail(x,z,r=0){return z>FINAL_GAUNTLET_APPROACH_Z_MIN&&z<FINAL_GAUNTLET_APPROACH_Z_MAX&&Math.abs(x)>FINAL_GAUNTLET_APPROACH_HALF_X-r}function inFinalRecoveryRail(x,z,r=0){return z>FINAL_RECOVERY_Z_MIN&&z<FINAL_RECOVERY_Z_MAX&&Math.abs(x)>FINAL_RECOVERY_HALF_X-r}'),
            ('if(inFinalGauntletApproachRail(x,z,.4))return true;if(z>FINISH_Z_MIN','if(inFinalGauntletApproachRail(x,z,.4))return true;if(inFinalRecoveryRail(x,z,.4))return true;if(z>FINISH_Z_MIN'),
            ('if(inFinalGauntletApproachRail(x,z,r))return true;if(z>FINISH_Z_MIN','if(inFinalGauntletApproachRail(x,z,r))return true;if(inFinalRecoveryRail(x,z,r))return true;if(z>FINISH_Z_MIN')
          ]
          for old,new in repls:
              if old not in s:
                  raise SystemExit('missing anchor: '+old)
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Verify recovery collision and syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          checks=[
            'full 3D lift route v55 · physical post-puncher recovery catch',
            'FINAL_RECOVERY_HALF_X=2.58',
            'function inFinalRecoveryRail(x,z,r=0)',
            'if(inFinalRecoveryRail(x,z,.4))return true',
            'if(inFinalRecoveryRail(x,z,r))return true',
            'finalRecoveryL=box(-2.72',
            'finalRecoveryR=box(2.72'
          ]
          for x in checks: assert x in s, x
          assert 2.58 + .12 < 2.72 + .001
          a=s.index('<script type="module">')+len('<script type="module">')
          b=s.index('</script>',a)
          Path('/tmp/runtime.mjs').write_text(s[a:b])
          print('post-puncher physical recovery catch: PASS')
          PY
          node --check /tmp/runtime.mjs
      - name: Commit gameplay change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 1
          git commit -m "Make final recovery rails physically contain impacts"
          git push origin HEAD:new-player-glb-overhaul
