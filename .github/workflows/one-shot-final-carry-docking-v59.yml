name: Final carry docking v59
on:
  push:
    branches: [new-player-glb-overhaul]
    paths:
      - '.github/workflows/one-shot-final-carry-docking-v59.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-player-glb-overhaul
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch carry-aware final docking
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = 'clean build · new GLB only · full 3D lift route v58 · physical finish docking gate'
          new = 'clean build · new GLB only · full 3D lift route v59 · carry-aware finish docking'
          assert old in s, 'v58 marker missing'
          s = s.replace(old, new, 1)
          old_const = 'FINAL_CHARGE_CRADLE_DAMP=15.5,FINAL_CHARGE_CRADLE_PULL=2.65,FINAL_CHARGE_GATE_Z=10.88'
          new_const = 'FINAL_CHARGE_CRADLE_DAMP=15.5,FINAL_CHARGE_CRADLE_PULL=2.65,FINAL_CHARGE_CARRY_OFFSET=.32,FINAL_CHARGE_GATE_Z=10.88'
          assert old_const in s, 'final cradle constants anchor missing'
          s = s.replace(old_const, new_const, 1)
          old_carry = "if(carry){let f=new THREE.Vector3(Math.sin(yaw),0,Math.cos(yaw)),q=new THREE.Vector3(p.x,p.y+1.05,p.z).addScaledVector(f,.9);"
          new_carry = "if(carry){let f=new THREE.Vector3(Math.sin(yaw),0,Math.cos(yaw)),carryOffset=finalChargeCradleActive?FINAL_CHARGE_CARRY_OFFSET:.9,q=new THREE.Vector3(p.x,p.y+1.05,p.z).addScaledVector(f,carryOffset);"
          assert old_carry in s, 'carry anchor missing'
          s = s.replace(old_carry, new_carry, 1)
          p.write_text(s)
          PY
      - name: Validate runtime syntax and carry docking invariants
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text()
          assert 'full 3D lift route v59 · carry-aware finish docking' in s
          assert 'FINAL_CHARGE_CARRY_OFFSET=.32' in s
          assert 'carryOffset=finalChargeCradleActive?FINAL_CHARGE_CARRY_OFFSET:.9' in s
          assert '.addScaledVector(f,carryOffset)' in s
          # A forward-facing carried brainrot must fit inside the same charge window as the player.
          cradle_min = 10.30 - .02
          gate_limit = 10.88 - .14
          carry_offset = .32
          player_min = cradle_min
          player_max = gate_limit
          overlap_min = max(player_min, cradle_min - carry_offset)
          overlap_max = min(player_max, gate_limit - carry_offset)
          assert overlap_max > overlap_min, (overlap_min, overlap_max)
          script = s.split('<script type="module">',1)[1].rsplit('</script>',1)[0]
          Path('/tmp/runtime-v59.mjs').write_text(script)
          print(f'carry docking overlap: {overlap_min:.2f}..{overlap_max:.2f}')
          PY
          node --check /tmp/runtime-v59.mjs
          node scripts/final-finish-charge-check.mjs
      - name: Commit gameplay change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --check
          git commit -m 'Make final charge cradle carry-aware'
          git push origin HEAD:new-player-glb-overhaul
