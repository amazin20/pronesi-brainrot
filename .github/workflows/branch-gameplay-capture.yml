name: Branch Gameplay Capture

on:
  push:
    branches: [new-player-glb-overhaul]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify carry-safe lift support corridor
        run: node scripts/lift-route-continuity-check.mjs

      - name: Install browser capture tools
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Serve exact branch runtime
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/brainrot-http.log 2>&1 &
          echo $! > /tmp/brainrot-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/brainrot-http.log
          exit 1

      - name: Capture real Chromium gameplay through second moving-platform pit
        run: |
          mkdir -p artifacts/raw-video artifacts/stages
          cat > capture.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const browser = await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist']});
          const context = await browser.newContext({
            viewport:{width:1280,height:720},
            recordVideo:{dir:'artifacts/raw-video',size:{width:1280,height:720}}
          });
          const page = await context.newPage();
          const consoleErrors=[];
          const stateSamples=[];
          const observedStates=[];
          const timedStates=[];
          const startedAt=Date.now();
          page.on('console',m=>{ if(m.type()==='error') consoleErrors.push(m.text()); });
          page.on('pageerror',e=>consoleErrors.push(String(e)));
          await page.goto('http://127.0.0.1:4173/index.html',{waitUntil:'domcontentloaded',timeout:60000});
          await page.waitForSelector('#load',{state:'detached',timeout:60000});
          await page.waitForTimeout(900);

          const stateText = async () => page.locator('#state').innerText().catch(()=> 'UNKNOWN');
          const sample = async label => stateSamples.push(`${label}:${await stateText()}`);
          const observeFor = async ms => {
            const end=Date.now()+ms;
            let last='';
            while(Date.now()<end){
              const s=await stateText();
              if(s!==last){
                observedStates.push(s);
                timedStates.push(`${Date.now()-startedAt}ms:${s}`);
                last=s;
              }
              await page.waitForTimeout(70);
            }
          };
          const hold = async (codes,ms) => {
            for(const code of codes) await page.keyboard.down(code);
            await observeFor(ms);
            for(const code of [...codes].reverse()) await page.keyboard.up(code);
          };
          const screenshot = async name => page.screenshot({path:`artifacts/stages/${name}.png`});

          await sample('ready');
          await screenshot('00-ready');

          // Pick up the real brainrot model.
          await hold(['KeyW'],720);
          await page.keyboard.press('KeyE');
          await observeFor(900);
          await sample('picked');
          await screenshot('01-picked');

          // Reach and cross the first lift pit using the actual runtime route.
          await page.keyboard.down('KeyW');
          await observeFor(760);
          await page.keyboard.press('Space');
          await observeFor(900);
          await page.keyboard.up('KeyW');
          await observeFor(320);
          await sample('first-pit');
          await screenshot('02-first-pit');

          await hold(['KeyW'],650);
          await observeFor(1700);
          await screenshot('03-lift-wait');
          await page.keyboard.down('KeyW');
          await observeFor(2300);
          await page.keyboard.press('Space');
          await observeFor(650);
          await page.keyboard.up('KeyW');
          await observeFor(350);
          await sample('lift-straight-pass');
          await screenshot('04-lift-exit');

          // Continue to and through the first sweeper timing gate.
          await page.keyboard.down('KeyW');
          await observeFor(5200);
          await page.keyboard.up('KeyW');
          await observeFor(800);
          await sample('first-sweeper');
          await screenshot('05-first-sweeper');

          // Keep carrying through the first recovery lane and second sweeper.
          // The second timing gate opens only during its safe phase, so holding W
          // exercises the real gate latch instead of teleporting the actor.
          await page.keyboard.down('KeyW');
          await observeFor(6200);
          await page.keyboard.up('KeyW');
          await observeFor(650);
          await sample('second-sweeper');
          await screenshot('06-second-sweeper');

          // Enter the new carry-safe corridor. The chosen second-pit platform
          // should board near the center, latch for the crossing, and release
          // only after the far edge. Keep using genuine player input.
          await page.keyboard.down('KeyW');
          await observeFor(4300);
          await page.keyboard.up('KeyW');
          await observeFor(500);
          await sample('second-pit-crossing');
          await screenshot('07-second-pit-crossing');

          // Continue through the landing funnel toward the checkpoint so the
          // capture proves the platform release did not strand the brainrot.
          await page.keyboard.down('KeyW');
          await observeFor(2600);
          await page.keyboard.up('KeyW');
          await observeFor(500);
          await sample('second-pit-exit');
          await screenshot('08-second-pit-exit');

          const finalState = await stateText();
          const loadExists = await page.locator('#load').count();
          const canvas = page.locator('canvas');
          const canvasBox = await canvas.boundingBox();
          const distinctStates = new Set([...stateSamples.map(x=>x.split(':').slice(1).join(':')),...observedStates]);
          const meaningfulCourseEvents = observedStates.filter(s => !['СВОБОДЕН','НЕСУ','ПОДНИМАЮ','ГОТОВ','ПОЛОЖЕН'].includes(s));
          const firstSweeperEvents = observedStates.filter(s => s.includes('SWEEPER') || s.includes('УДАР! БРЕЙНРОТ ВЫБИТ!'));
          const secondSweeperEvents = observedStates.filter(s => s.includes('SWEEPER 2'));
          const secondPitEvents = observedStates.filter(s => s.includes('ПЛАТФОРМА') || s.includes('КОРИДОР К ПЛАТФОРМЕ') || s.includes('ЧЕКПОИНТ'));
          const checkpointEvents = observedStates.filter(s => s.includes('ЧЕКПОИНТ'));
          const report = [
            `state=${finalState}`,
            `samples=${stateSamples.join(' | ')}`,
            `observedStates=${[...new Set(observedStates)].join(' | ')}`,
            `timedStates=${timedStates.join(' | ')}`,
            `courseEvents=${[...new Set(meaningfulCourseEvents)].join(' | ')}`,
            `firstSweeperEvents=${[...new Set(firstSweeperEvents)].join(' | ')}`,
            `secondSweeperEvents=${[...new Set(secondSweeperEvents)].join(' | ')}`,
            `secondPitEvents=${[...new Set(secondPitEvents)].join(' | ')}`,
            `checkpointEvents=${[...new Set(checkpointEvents)].join(' | ')}`,
            `distinctStates=${distinctStates.size}`,
            `canvas=${canvasBox ? `${Math.round(canvasBox.width)}x${Math.round(canvasBox.height)}` : 'missing'}`,
            `loadOverlay=${loadExists}`,
            `consoleErrors=${consoleErrors.join(' | ')}`
          ].join('\n')+'\n';
          fs.writeFileSync('artifacts/runtime-state.txt', report);
          await page.screenshot({path:'artifacts/gameplay-final.png'});

          if(!canvasBox || canvasBox.width < 1000 || canvasBox.height < 600) throw new Error('WebGL canvas is missing or undersized');
          if(loadExists) throw new Error('Loading overlay never disappeared');
          if(finalState === 'ОШИБКА') throw new Error('Runtime ended in error state');
          if(!observedStates.includes('НЕСУ')) throw new Error(`Brainrot was never carried: ${observedStates.join(' | ')}`);
          if(distinctStates.size < 4) throw new Error(`Gameplay state coverage too small: ${[...distinctStates].join(' | ')}`);
          if(!meaningfulCourseEvents.length) throw new Error(`No real obstacle-course event observed: ${observedStates.join(' | ')}`);
          if(!firstSweeperEvents.length) throw new Error(`Lift route did not reach the first sweeper: ${timedStates.join(' | ')}`);
          if(!secondSweeperEvents.length) throw new Error(`Route did not reach the second sweeper: ${timedStates.join(' | ')}`);
          if(!secondPitEvents.length) throw new Error(`Route did not reach the real second-pit boarding/crossing section: ${timedStates.join(' | ')}`);
          if(consoleErrors.length) throw new Error(consoleErrors.join('\n'));

          await context.close();
          await browser.close();
          EOF
          node ./capture.mjs

      - name: Convert real browser recording to MP4
        if: always()
        run: |
          set -e
          WEBM=$(find artifacts/raw-video -type f \( -name '*.webm' -o -name '*.mkv' \) | head -n1)
          test -n "$WEBM"
          ffmpeg -y -i "$WEBM" -c:v libx264 -preset veryfast -crf 23 -pix_fmt yuv420p -movflags +faststart -an artifacts/brainrot-real-gameplay.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 artifacts/brainrot-real-gameplay.mp4

      - name: Upload real gameplay artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branch-real-gameplay-${{ github.sha }}
          path: |
            artifacts/brainrot-real-gameplay.mp4
            artifacts/gameplay-final.png
            artifacts/stages/*.png
            artifacts/runtime-state.txt
          if-no-files-found: error
          retention-days: 7
