name: One-shot second sweeper staging shield v68
on:
  push:
    branches: [new-player-glb-overhaul]
    paths: ['.github/workflows/one-shot-second-sweeper-staging-shield-v68.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-player-glb-overhaul
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch real second sweeper staging shield
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          s=s.replace('full 3D lift route v67 · carry-safe final midpoint','full 3D lift route v68 · shielded second sweeper staging',1)
          old='SECOND_SWEEPER_GATE_HALF_Y=.11,SECOND_SWEEPER_POST_GATE_GRACE=.55,SECOND_SWEEPER_CROSSING_HALF_X=1.42,SECOND_SWEEPER_RECOVERY_Z_MIN=3.18'
          new='SECOND_SWEEPER_GATE_HALF_Y=.11,SECOND_SWEEPER_POST_GATE_GRACE=.55,SECOND_SWEEPER_CROSSING_HALF_X=1.42,SECOND_SWEEPER_STAGING_Z_MIN=-1.82,SECOND_SWEEPER_STAGING_Z_MAX=-.60,SECOND_SWEEPER_STAGING_HALF_X=1.72,SECOND_SWEEPER_RECOVERY_Z_MIN=3.18'
          assert old in s; s=s.replace(old,new,1)
          anchor='const secondSweeperStagePad=box(0,.035,-1.05,3.8,.07,1.58,0xffd84d),secondSweeperGateL=box(-1.88,.88,SECOND_SWEEPER_GATE_Z,.16,1.76,.16,0xffb12b),secondSweeperGateR=box(1.88,.88,SECOND_SWEEPER_GATE_Z,.16,1.76,.16,0xffb12b),secondSweeperGate=box(0,SECOND_SWEEPER_GATE_CLOSED_Y,SECOND_SWEEPER_GATE_Z,SECOND_SWEEPER_GATE_HALF_X*2,.22,.22,0xff315d);'
          insert=anchor+"function makeSecondSweeperShieldRail(x){const rail=new THREE.Mesh(new THREE.CapsuleGeometry(.16,1.02,4,8),mat(0xffd84d));rail.position.set(x,.42,(SECOND_SWEEPER_STAGING_Z_MIN+SECOND_SWEEPER_STAGING_Z_MAX)*.5);rail.rotation.x=Math.PI/2;rail.castShadow=rail.receiveShadow=true;rail.material.emissive=new THREE.Color(0xa95a00);rail.material.emissiveIntensity=.72;scene.add(rail);return rail}const secondSweeperShieldL=makeSecondSweeperShieldRail(-SECOND_SWEEPER_STAGING_HALF_X-.10),secondSweeperShieldR=makeSecondSweeperShieldRail(SECOND_SWEEPER_STAGING_HALF_X+.10);"
          assert anchor in s; s=s.replace(anchor,insert,1)
          old_lane='const firstSweeperStagingSafe=carry&&!firstSweeperCleared&&p.z>FIRST_SWEEPER_STAGING_Z_MIN&&p.z<FIRST_SWEEPER_GATE_Z-.08&&bp.z>FIRST_SWEEPER_STAGING_Z_MIN-.28&&bp.z<FIRST_SWEEPER_GATE_Z-.08&&Math.abs(p.x)<FIRST_SWEEPER_STAGING_HALF_X&&Math.abs(bp.x)<FIRST_SWEEPER_STAGING_HALF_X+.18,firstSweeperCarryLane='
          new_lane='const firstSweeperStagingSafe=carry&&!firstSweeperCleared&&p.z>FIRST_SWEEPER_STAGING_Z_MIN&&p.z<FIRST_SWEEPER_GATE_Z-.08&&bp.z>FIRST_SWEEPER_STAGING_Z_MIN-.28&&bp.z<FIRST_SWEEPER_GATE_Z-.08&&Math.abs(p.x)<FIRST_SWEEPER_STAGING_HALF_X&&Math.abs(bp.x)<FIRST_SWEEPER_STAGING_HALF_X+.18,secondSweeperStagingSafe=carry&&firstSweeperCleared&&!secondSweeperCleared&&p.z>SECOND_SWEEPER_STAGING_Z_MIN&&p.z<SECOND_SWEEPER_GATE_Z-.08&&bp.z>SECOND_SWEEPER_STAGING_Z_MIN-.24&&bp.z<SECOND_SWEEPER_GATE_Z-.08&&Math.abs(p.x)<SECOND_SWEEPER_STAGING_HALF_X&&Math.abs(bp.x)<SECOND_SWEEPER_STAGING_HALF_X+.18,firstSweeperCarryLane='
          assert old_lane in s; s=s.replace(old_lane,new_lane,1)
          old_hit='(i!==1||(!secondSweeperCarryLane&&secondSweeperPostGateGrace<=0)))sweeperHit(s,w,from,to);'
          new_hit='(i!==1||(!secondSweeperStagingSafe&&!secondSweeperCarryLane&&secondSweeperPostGateGrace<=0)))sweeperHit(s,w,from,to);'
          assert old_hit in s; s=s.replace(old_hit,new_hit,1)
          anchor_visual="if(firstSweeperStagingSafe&&!win&&failTimer<=0){sweeperEntryPad.material.emissive.setHex(0x149343);sweeperEntryPad.material.emissiveIntensity=1.55;state.textContent='SWEEPER · ЗАЩИТНЫЙ КАРМАН · ЖДИ ЗЕЛЁНЫЕ ВОРОТА'}"
          insert_visual=anchor_visual+"const secondSweeperShieldPulse=.5+.5*Math.sin(t*11);[secondSweeperShieldL,secondSweeperShieldR].forEach(o=>o.material.emissiveIntensity=secondSweeperStagingSafe?1.25+.55*secondSweeperShieldPulse:.72);if(secondSweeperStagingSafe&&!win&&failTimer<=0){secondSweeperStagePad.material.emissive.setHex(0x149343);secondSweeperStagePad.material.emissiveIntensity=1.55;state.textContent='SWEEPER 2 · ЗАЩИТНЫЙ КАРМАН · ЖДИ ЗЕЛЁНЫЕ ВОРОТА'}"
          assert anchor_visual in s; s=s.replace(anchor_visual,insert_visual,1)
          p.write_text(s)
          PY
      - name: Verify runtime syntax and shield invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          for x in ['full 3D lift route v68 · shielded second sweeper staging','SECOND_SWEEPER_STAGING_Z_MIN=-1.82','SECOND_SWEEPER_STAGING_Z_MAX=-.60','makeSecondSweeperShieldRail','secondSweeperStagingSafe=carry&&firstSweeperCleared&&!secondSweeperCleared','!secondSweeperStagingSafe&&!secondSweeperCarryLane','SWEEPER 2 · ЗАЩИТНЫЙ КАРМАН']:
              assert x in s,x
          assert 1.82-.60 >= 1.2
          assert 1.72*2 > 3.0
          start=s.index('<script type="module">')+len('<script type="module">'); end=s.index('</script>',start)
          Path('/tmp/game.mjs').write_text(s[start:end])
          print('second sweeper staging shield invariants PASS')
          PY
          node --check /tmp/game.mjs
          git diff --check
      - name: Run existing physics contract
        run: node scripts/final-puncher-physics-contract-v65.mjs
      - name: Commit gameplay change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Shield second sweeper staging pocket v68'
          git push origin HEAD:new-player-glb-overhaul
