name: Apply Final Recovery Funnel Handoff v145

on:
  push:
    branches: [new-player-glb-overhaul]
    paths:
      - .github/workflows/apply-final-recovery-funnel-handoff-v145.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-player-glb-overhaul
          fetch-depth: 0
      - name: Refuse stale/non-linear apply
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin new-player-glb-overhaul
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/new-player-glb-overhaul)"
          test "$(git rev-parse HEAD^)" = "3dbd89d9d1cb5f7411a0f039a2fe132bda364a0c"
          git merge-base --is-ancestor 3dbd89d9d1cb5f7411a0f039a2fe132bda364a0c HEAD
      - name: Model final recovery to funnel handoff v145
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          if 'FINAL_RECOVERY_FUNNEL_HANDOFF_MODEL_V145=true' in s:
              raise SystemExit('v145 already present')
          anchor='const FINAL_FINISH_FUNNEL_MODEL_V78=true,FINAL_FINISH_FUNNEL_PAD_MODEL_V114=true;'
          if s.count(anchor) != 1:
              raise SystemExit(f'v145 funnel anchor count={s.count(anchor)}')
          model="""const FINAL_RECOVERY_FUNNEL_HANDOFF_MODEL_V145=true,FINAL_RECOVERY_FUNNEL_HANDOFF_Z_MIN=9.46,FINAL_RECOVERY_FUNNEL_HANDOFF_Z_MAX=9.86,FINAL_RECOVERY_FUNNEL_HANDOFF_Z=(FINAL_RECOVERY_FUNNEL_HANDOFF_Z_MIN+FINAL_RECOVERY_FUNNEL_HANDOFF_Z_MAX)*.5;const finalRecoveryFunnelHandoffV145=new THREE.Group();finalRecoveryFunnelHandoffV145.name='FinalRecoveryFunnelHandoffAssemblyV145';finalRecoveryFunnelHandoffV145.position.set(0,0,FINAL_RECOVERY_FUNNEL_HANDOFF_Z);scene.add(finalRecoveryFunnelHandoffV145);const recoveryFunnelSteelV145=mat(0xf3fbff),recoveryFunnelDarkV145=mat(0x17243a),recoveryFunnelGreenV145=mat(0x49ff79),recoveryFunnelCyanV145=mat(0x44e7ff),recoveryFunnelGoldV145=mat(0xffdf63);recoveryFunnelSteelV145.metalness=.48;recoveryFunnelSteelV145.roughness=.22;recoveryFunnelDarkV145.metalness=.60;recoveryFunnelDarkV145.roughness=.28;recoveryFunnelGreenV145.metalness=.34;recoveryFunnelGreenV145.roughness=.24;const recoveryFunnelFrameV145=new THREE.Mesh(new THREE.BoxGeometry(4.72,.10,.34),recoveryFunnelDarkV145);recoveryFunnelFrameV145.name='FinalRecoveryFunnelHandoffFrameV145';recoveryFunnelFrameV145.position.y=.055;recoveryFunnelFrameV145.castShadow=recoveryFunnelFrameV145.receiveShadow=true;finalRecoveryFunnelHandoffV145.add(recoveryFunnelFrameV145);[-1.98,-1.32,-.66,0,.66,1.32,1.98].forEach((x,i)=>{const slat=new THREE.Mesh(new THREE.BoxGeometry(.52,.075,.39),i===3?recoveryFunnelSteelV145:(i<3?recoveryFunnelGreenV145:recoveryFunnelCyanV145));slat.name='FinalRecoveryFunnelTransitionSlatV145';slat.position.set(x,.12,0);slat.rotation.y=(x/1.98)*.035;slat.castShadow=slat.receiveShadow=true;slat.material.emissive=new THREE.Color(i===3?0xffffff:(i<3?0x159b43:0x087fa8));slat.material.emissiveIntensity=i===3?.78:.46;finalRecoveryFunnelHandoffV145.add(slat)});[-.18,.18].forEach((z,i)=>{const rail=new THREE.Mesh(new THREE.CapsuleGeometry(.04,4.34,4,8),recoveryFunnelSteelV145);rail.name='FinalRecoveryFunnelGuideRailV145';rail.rotation.z=Math.PI/2;rail.position.set(0,.22,z);rail.castShadow=rail.receiveShadow=true;rail.material.emissive=new THREE.Color(i?0x44e7ff:0x49ff79);rail.material.emissiveIntensity=.68;finalRecoveryFunnelHandoffV145.add(rail)});const finalRecoveryFunnelGuideArmsV145=[],finalRecoveryFunnelLampsV145=[];[-1,1].forEach((side,i)=>{const post=new THREE.Mesh(new THREE.CylinderGeometry(.10,.15,1.08,10),recoveryFunnelDarkV145);post.name='FinalRecoveryFunnelGatePostV145';post.position.set(side*2.18,.54,.08);post.castShadow=post.receiveShadow=true;finalRecoveryFunnelHandoffV145.add(post);[.28,.67,1.02].forEach((y,k)=>{const ring=new THREE.Mesh(new THREE.TorusGeometry(.16,.038,7,12),k===1?recoveryFunnelSteelV145:(i?recoveryFunnelCyanV145:recoveryFunnelGreenV145));ring.name='FinalRecoveryFunnelGateRingV145';ring.rotation.x=Math.PI/2;ring.position.set(side*2.18,y,.08);ring.castShadow=true;ring.material.emissive=new THREE.Color(k===1?0xffffff:(i?0x44e7ff:0x49ff79));ring.material.emissiveIntensity=k===1?.78:.84;finalRecoveryFunnelHandoffV145.add(ring)});const pivot=new THREE.Group();pivot.name='FinalRecoveryFunnelGuideArmPivotV145';pivot.position.set(side*2.02,.42,.12);pivot.userData.side=side;const arm=new THREE.Mesh(new THREE.BoxGeometry(.70,.10,.13),recoveryFunnelSteelV145);arm.name='FinalRecoveryFunnelGuideArmV145';arm.position.x=-side*.34;arm.castShadow=arm.receiveShadow=true;arm.material.emissive=new THREE.Color(i?0x44e7ff:0x49ff79);arm.material.emissiveIntensity=.62;pivot.add(arm);const roller=new THREE.Mesh(new THREE.CylinderGeometry(.12,.12,.20,10),recoveryFunnelGoldV145);roller.name='FinalRecoveryFunnelGuideRollerV145';roller.rotation.z=Math.PI/2;roller.position.set(-side*.69,0,0);roller.castShadow=roller.receiveShadow=true;roller.material.emissive=new THREE.Color(0xffc928);roller.material.emissiveIntensity=.92;pivot.add(roller);finalRecoveryFunnelHandoffV145.add(pivot);finalRecoveryFunnelGuideArmsV145.push(pivot);const lamp=new THREE.Mesh(new THREE.OctahedronGeometry(.105,0),recoveryFunnelSteelV145);lamp.name='FinalRecoveryFunnelStatusLampV145';lamp.position.set(side*2.18,1.25,.08);lamp.castShadow=true;lamp.material.emissive=new THREE.Color(i?0x44e7ff:0x49ff79);lamp.material.emissiveIntensity=.92;finalRecoveryFunnelHandoffV145.add(lamp);finalRecoveryFunnelLampsV145.push(lamp)});const recoveryFunnelBeamV145=new THREE.Mesh(new THREE.BoxGeometry(4.38,.14,.18),recoveryFunnelDarkV145);recoveryFunnelBeamV145.name='FinalRecoveryFunnelTimingBeamV145';recoveryFunnelBeamV145.position.set(0,1.48,.10);recoveryFunnelBeamV145.castShadow=recoveryFunnelBeamV145.receiveShadow=true;finalRecoveryFunnelHandoffV145.add(recoveryFunnelBeamV145);[-1.40,-.70,0,.70,1.40].forEach((x,i)=>{const lamp=new THREE.Mesh(new THREE.OctahedronGeometry(.082,0),i===2?recoveryFunnelGoldV145:recoveryFunnelSteelV145);lamp.name='FinalRecoveryFunnelBeamLampV145';lamp.position.set(x,1.49,.22);lamp.castShadow=true;lamp.material.emissive=new THREE.Color(i===2?0xffc928:(i<2?0x49ff79:0x44e7ff));lamp.material.emissiveIntensity=.88;finalRecoveryFunnelHandoffV145.add(lamp);finalRecoveryFunnelLampsV145.push(lamp)});[-1.24,-.62,0,.62,1.24].forEach((x,i)=>{const guide=new THREE.Mesh(new THREE.TorusGeometry(.11,.027,6,10),i===2?recoveryFunnelGoldV145:recoveryFunnelSteelV145);guide.name='FinalRecoveryFunnelFloorGuideV145';guide.rotation.x=Math.PI/2;guide.position.set(x,.16,.08);guide.castShadow=true;guide.material.emissive=new THREE.Color(i===2?0xffc928:(x<0?0x49ff79:0x44e7ff));guide.material.emissiveIntensity=i===2?1.06:.80;finalRecoveryFunnelHandoffV145.add(guide)});"""
          s=s.replace(anchor,model+anchor,1)
          tick_anchor='const finalFinishFunnelActive='
          if s.count(tick_anchor) != 1:
              raise SystemExit(f'v145 tick anchor count={s.count(tick_anchor)}')
          tick="""const finalRecoveryFunnelHandoffActiveV145=finalGauntletCleared&&p.z>FINAL_RECOVERY_FUNNEL_HANDOFF_Z_MIN-.08&&p.z<FINAL_RECOVERY_FUNNEL_HANDOFF_Z_MAX+.08&&!win&&failTimer<=0,finalRecoveryFunnelHandoffProgressV145=Math.max(0,Math.min(1,(p.z-FINAL_RECOVERY_FUNNEL_HANDOFF_Z_MIN)/(FINAL_RECOVERY_FUNNEL_HANDOFF_Z_MAX-FINAL_RECOVERY_FUNNEL_HANDOFF_Z_MIN))),finalRecoveryFunnelHandoffPulseV145=.5+.5*Math.sin(t*11.5);finalRecoveryFunnelGuideArmsV145.forEach(n=>{const side=n.userData.side;n.rotation.z=side*(.52*(1-finalRecoveryFunnelHandoffProgressV145));n.position.y=.42+.04*finalRecoveryFunnelHandoffProgressV145;n.children.forEach(c=>{if(c.isMesh&&c.material?.emissive)c.material.emissiveIntensity=finalRecoveryFunnelHandoffActiveV145?.82+.46*finalRecoveryFunnelHandoffPulseV145:.62})});finalRecoveryFunnelLampsV145.forEach((n,i)=>{const guided=finalRecoveryFunnelHandoffProgressV145>i/Math.max(1,finalRecoveryFunnelLampsV145.length-1);n.material.color.setHex(guided?0x49ff79:(i%2?0x44e7ff:0xffdf63));n.material.emissive.setHex(guided?0x19b24e:(i%2?0x087fa8:0xc99700));n.material.emissiveIntensity=finalRecoveryFunnelHandoffActiveV145?(guided?1.18+.55*finalRecoveryFunnelHandoffPulseV145:.70+.25*finalRecoveryFunnelHandoffPulseV145):.72});recoveryFunnelFrameV145.material.emissive=recoveryFunnelFrameV145.material.emissive||new THREE.Color(0x159b43);recoveryFunnelFrameV145.material.emissiveIntensity=finalRecoveryFunnelHandoffActiveV145?.24+.58*finalRecoveryFunnelHandoffProgressV145:.10;recoveryFunnelBeamV145.material.emissive=recoveryFunnelBeamV145.material.emissive||new THREE.Color(0x159b43);recoveryFunnelBeamV145.material.emissiveIntensity=finalRecoveryFunnelHandoffActiveV145?.30+.66*finalRecoveryFunnelHandoffPulseV145:.12;"""
          s=s.replace(tick_anchor,tick+tick_anchor,1)
          p.write_text(s)
      - name: Verify v145 handoff and preserved final physics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          required=['FINAL_RECOVERY_FUNNEL_HANDOFF_MODEL_V145=true','FinalRecoveryFunnelHandoffAssemblyV145','FinalRecoveryFunnelHandoffFrameV145','FinalRecoveryFunnelTransitionSlatV145','FinalRecoveryFunnelGuideRailV145','FinalRecoveryFunnelGuideArmV145','FinalRecoveryFunnelGuideRollerV145','FinalRecoveryFunnelTimingBeamV145','FinalRecoveryFunnelStatusLampV145','FINAL_RECOVERY_Z_MIN=8.92','FINAL_RECOVERY_Z_MAX=9.62','FINAL_FINISH_FUNNEL_Z_MIN=9.54','FINAL_FINISH_FUNNEL_Z_MAX=10.58','FINAL_FINISH_FUNNEL_DAMP=10.5','FINAL_FINISH_FUNNEL_PULL=1.75','FINAL_CHARGE_CRADLE_DAMP=15.5']
          for token in required: assert token in s, token
          assert s.count('FINAL_RECOVERY_FUNNEL_HANDOFF_MODEL_V145=true') == 1
          assert s.count('const finalRecoveryFunnelHandoffActiveV145=') == 1
          assert 'FINAL_RECOVERY_ARRESTOR_MODEL_V144=true' in s
          print('Final recovery -> funnel mechanical handoff v145 contract: SUCCESS')
          PY
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text();m=re.search(r'<script type="module">(.*?)</script>',s,re.S);assert m
          Path('/tmp/brainrot-module.mjs').write_text(m.group(1))
          PY
          node --check /tmp/brainrot-module.mjs
          for f in scripts/final-puncher-physics-contract-v65.mjs scripts/final-finish-residual-momentum-check.mjs scripts/final-finish-soft-hold-check.mjs scripts/final-finish-charge-check.mjs scripts/second-pit-route-continuity-v70-check.mjs; do
            if [ -f "$f" ]; then node "$f"; else echo "SKIP missing $f"; fi
          done
      - name: Commit real level change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "openai-level-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && { echo 'No gameplay change produced'; exit 1; }
          git commit -m "Level: mechanical final recovery funnel handoff v145"
          git push origin HEAD:new-player-glb-overhaul
