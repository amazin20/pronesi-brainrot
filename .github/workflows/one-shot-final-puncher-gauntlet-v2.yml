name: Final Puncher Gauntlet V2
on:
  push:
    branches: [new-player-glb-overhaul]
    paths: ['.github/workflows/one-shot-final-puncher-gauntlet-v2.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-player-glb-overhaul
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply gameplay patch
        run: |
          python3 -c "import base64;exec(base64.b64decode(''))"
      - name: Verify gameplay runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          a=s.index('<script type="module">')+len('<script type="module">')
          b=s.index('</script>',a)
          Path('/tmp/runtime.mjs').write_text(s[a:b])
          assert 'full 3D lift route v26 · final puncher gauntlet' in s
          assert 'function updateFinalGauntlet(t,dt)' in s
          assert 'finalGauntletCleared=true' in s
          assert "ФИНАЛЬНЫЙ УДАР · БРЕЙНРОТ ВЫБИТ!" in s
          print('final gauntlet invariants PASS')
          PY
          node --check /tmp/runtime.mjs
      - name: Commit gameplay
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add physical final puncher gauntlet after checkpoint'
          git push origin HEAD:new-player-glb-overhaul
