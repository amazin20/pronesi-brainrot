name: One-shot second sweeper persistent clear

on:
  push:
    branches: [new-player-glb-overhaul]
    paths:
      - '.github/workflows/one-shot-second-sweeper-clear.yml'

permissions:
  contents: write

jobs:
  patch-level:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-player-glb-overhaul
          fetch-depth: 0

      - name: Add persistent clear state to second sweeper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          old="SECOND_SWEEPER_CYCLE=3.0,SECOND_SWEEPER_WARN=.66,SECOND_SWEEPER_BURST=1.12,SECOND_SWEEPER_SPEED=2.45"
          new="SECOND_SWEEPER_CYCLE=3.0,SECOND_SWEEPER_WARN=.66,SECOND_SWEEPER_BURST=1.12,SECOND_SWEEPER_SPEED=2.45,SECOND_SWEEPER_CLEAR_Z=3.18"
          if old not in s: raise SystemExit('second sweeper constants anchor missing')
          s=s.replace(old,new,1)

          old="liftBlocked=false,firstSweeperPhase='idle',firstSweeperTimer=0,firstSweeperCleared=false;"
          new="liftBlocked=false,firstSweeperPhase='idle',firstSweeperTimer=0,firstSweeperCleared=false,secondSweeperCleared=false;"
          if old not in s: raise SystemExit('runtime state anchor missing')
          s=s.replace(old,new,1)

          old="if(!useCheckpoint){firstSweeperPhase='idle';firstSweeperTimer=0;firstSweeperCleared=false;sweeps[0].rotation.y=0}"
          new="if(!useCheckpoint){firstSweeperPhase='idle';firstSweeperTimer=0;firstSweeperCleared=false;secondSweeperCleared=false;sweeps[0].rotation.y=0;sweeps[1].rotation.y=0}"
          if old not in s: raise SystemExit('reset anchor missing')
          s=s.replace(old,new,1)

          old="const firstSweeperActive=updateFirstSweeperEntry(dt,t),secondPhase=((t%SECOND_SWEEPER_CYCLE)+SECOND_SWEEPER_CYCLE)%SECOND_SWEEPER_CYCLE,secondWarning=firstSweeperCleared&&secondPhase<SECOND_SWEEPER_WARN,secondActive=firstSweeperCleared&&secondPhase>=SECOND_SWEEPER_WARN&&secondPhase<SECOND_SWEEPER_WARN+SECOND_SWEEPER_BURST,secondDir=(Math.floor(t/SECOND_SWEEPER_CYCLE)%2)?1:-1,secondSpeed=secondActive?SECOND_SWEEPER_SPEED*secondDir:0,secondArm=sweeps[1].children[0],secondSafe=firstSweeperCleared&&!secondWarning&&!secondActive;"
          new="const firstSweeperActive=updateFirstSweeperEntry(dt,t);if(!secondSweeperCleared&&firstSweeperCleared&&p.z>SECOND_SWEEPER_CLEAR_Z&&bp.z>SECOND_SWEEPER_CLEAR_Z){secondSweeperCleared=true;state.textContent='SWEEPER 2 · ПРОЙДЕН'}const secondPhase=((t%SECOND_SWEEPER_CYCLE)+SECOND_SWEEPER_CYCLE)%SECOND_SWEEPER_CYCLE,secondWarning=firstSweeperCleared&&!secondSweeperCleared&&secondPhase<SECOND_SWEEPER_WARN,secondActive=firstSweeperCleared&&!secondSweeperCleared&&secondPhase>=SECOND_SWEEPER_WARN&&secondPhase<SECOND_SWEEPER_WARN+SECOND_SWEEPER_BURST,secondDir=(Math.floor(t/SECOND_SWEEPER_CYCLE)%2)?1:-1,secondSpeed=secondActive?SECOND_SWEEPER_SPEED*secondDir:0,secondArm=sweeps[1].children[0],secondSafe=firstSweeperCleared&&!secondSweeperCleared&&!secondWarning&&!secondActive;"
          if old not in s: raise SystemExit('second sweeper runtime anchor missing')
          s=s.replace(old,new,1)

          old="secondArm.material.color.setHex(secondActive?0xff315d:(secondWarning?0xffb12b:(secondSafe?0x49ff79:0xff557c)));secondArm.material.emissive.setHex(secondActive?0xa20d38:(secondWarning?0xff7a00:(secondSafe?0x149343:0x000000)));secondArm.material.emissiveIntensity=secondActive?1.4:(secondWarning?.9+.55*(.5+.5*Math.sin(t*20)):(secondSafe?.75:0));"
          new="secondArm.material.color.setHex(secondSweeperCleared?0x49ff79:(secondActive?0xff315d:(secondWarning?0xffb12b:(secondSafe?0x49ff79:0xff557c))));secondArm.material.emissive.setHex(secondSweeperCleared?0x149343:(secondActive?0xa20d38:(secondWarning?0xff7a00:(secondSafe?0x149343:0x000000))));secondArm.material.emissiveIntensity=secondSweeperCleared?1.05:(secondActive?1.4:(secondWarning?.9+.55*(.5+.5*Math.sin(t*20)):(secondSafe?.75:0)));"
          if old not in s: raise SystemExit('second sweeper visual anchor missing')
          s=s.replace(old,new,1)

          old='full 3D lift route v20 · alternating second sweeper'
          new='full 3D lift route v21 · persistent second sweeper clear'
          if old not in s: raise SystemExit('runtime marker missing')
          s=s.replace(old,new,1)
          p.write_text(s)

          Path('scripts/second-sweeper-clear-check.mjs').write_text("""import fs from 'node:fs';\nconst s=fs.readFileSync('index.html','utf8');\nfor(const needle of [\"SECOND_SWEEPER_CLEAR_Z=3.18\",\"secondSweeperCleared=false\",\"p.z>SECOND_SWEEPER_CLEAR_Z&&bp.z>SECOND_SWEEPER_CLEAR_Z\",\"secondSweeperCleared?0x49ff79\",\"secondActive=firstSweeperCleared&&!secondSweeperCleared\",\"full 3D lift route v21 · persistent second sweeper clear\"]){if(!s.includes(needle))throw new Error('missing '+needle)}\nif(!s.includes(\"secondSweeperCleared=false;sweeps[0].rotation.y=0;sweeps[1].rotation.y=0\"))throw new Error('full restart does not re-arm second sweeper');\nconsole.log('second sweeper persistent clear: PASS');\n""")
          PY

      - name: Verify second sweeper clear-state
        run: |
          node scripts/second-sweeper-clear-check.mjs
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          a=s.index('<script type="module">')+len('<script type="module">')
          b=s.index('</script>',a)
          Path('/tmp/game.mjs').write_text(s[a:b])
          PY
          node --check /tmp/game.mjs

      - name: Commit gameplay change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html scripts/second-sweeper-clear-check.mjs
          git commit -m 'Persist second sweeper clear state'
          git push origin HEAD:new-player-glb-overhaul
