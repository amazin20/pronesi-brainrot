name: Apply Final Recovery Pad v113

on:
  push:
    branches: [new-player-glb-overhaul]
    paths:
      - .github/workflows/apply-final-recovery-pad-v113.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-player-glb-overhaul
          fetch-depth: 0
      - name: Refuse stale/non-linear apply
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin new-player-glb-overhaul
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/new-player-glb-overhaul)"
      - name: Model final recovery deck v113
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="const FINAL_RECOVERY_MODEL_V77=true;const finalRecoveryPad=box(0,.035,(FINAL_RECOVERY_Z_MIN+FINAL_RECOVERY_Z_MAX)*.5,5.8,.07,FINAL_RECOVERY_Z_MAX-FINAL_RECOVERY_Z_MIN,0x49ff79);finalRecoveryPad.material.emissive=new THREE.Color(0x159b43);finalRecoveryPad.material.emissiveIntensity=.72;function makeFinalRecoveryGuard(side)"
          new="const FINAL_RECOVERY_MODEL_V77=true,FINAL_RECOVERY_PAD_MODEL_V113=true;const finalRecoveryPad=box(0,.035,(FINAL_RECOVERY_Z_MIN+FINAL_RECOVERY_Z_MAX)*.5,5.8,.07,FINAL_RECOVERY_Z_MAX-FINAL_RECOVERY_Z_MIN,0x49ff79);finalRecoveryPad.name='FinalRecoveryCollisionPadV113';finalRecoveryPad.material.emissive=new THREE.Color(0x159b43);finalRecoveryPad.material.emissiveIntensity=.16;finalRecoveryPad.material.transparent=true;finalRecoveryPad.material.opacity=.045;finalRecoveryPad.material.depthWrite=false;const finalRecoveryGreen=mat(0x49ff79),finalRecoveryDark=mat(0x14352d),finalRecoveryWhite=mat(0xeaffef),finalRecoveryPink=mat(0xff557c);finalRecoveryGreen.metalness=.28;finalRecoveryGreen.roughness=.28;[-2.34,-1.56,-.78,0,.78,1.56,2.34].forEach((x,i)=>{const slat=new THREE.Mesh(new THREE.BoxGeometry(.58,.068,.54),i===3?finalRecoveryWhite:finalRecoveryGreen);slat.name='FinalRecoverySlatV113';slat.position.set(x,.072,0);slat.castShadow=slat.receiveShadow=true;slat.material.emissive=new THREE.Color(i===3?0xffffff:0x159b43);slat.material.emissiveIntensity=i===3?.90:.52;finalRecoveryPad.add(slat)});[-.29,.29].forEach((z,i)=>{const rail=new THREE.Mesh(new THREE.CapsuleGeometry(.038,5.18,4,8),finalRecoveryWhite);rail.name='FinalRecoveryEdgeRailV113';rail.rotation.z=Math.PI/2;rail.position.set(0,.17,z);rail.castShadow=rail.receiveShadow=true;rail.material.emissive=new THREE.Color(i?0x49ff79:0xb4ffd5);rail.material.emissiveIntensity=.68;finalRecoveryPad.add(rail)});[-1.72,0,1.72].forEach((x,i)=>{const ring=new THREE.Mesh(new THREE.TorusGeometry(.11,.027,6,10),i===1?finalRecoveryPink:finalRecoveryWhite);ring.name='FinalRecoveryGuideRingV113';ring.rotation.x=Math.PI/2;ring.position.set(x,.12,0);ring.castShadow=true;ring.material.emissive=new THREE.Color(i===1?0xff315d:0x49ff79);ring.material.emissiveIntensity=i===1?1.0:.78;finalRecoveryPad.add(ring)});[-2.65,2.65].forEach(x=>{const bumper=new THREE.Mesh(new THREE.CylinderGeometry(.09,.13,.30,8),finalRecoveryDark);bumper.name='FinalRecoveryBumperV113';bumper.rotation.z=Math.PI/2;bumper.position.set(x,.09,0);bumper.castShadow=bumper.receiveShadow=true;finalRecoveryPad.add(bumper)});function makeFinalRecoveryGuard(side)"
          if old not in s:
              raise SystemExit('v113 final recovery anchor missing or already changed')
          s=s.replace(old,new,1)
          p.write_text(s)
      - name: Verify v113 modeled recovery and preserved final physics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          required=[
            "FINAL_RECOVERY_PAD_MODEL_V113=true",
            "FinalRecoveryCollisionPadV113",
            "FinalRecoverySlatV113",
            "FinalRecoveryEdgeRailV113",
            "FinalRecoveryGuideRingV113",
            "FinalRecoveryBumperV113",
            "finalRecoveryPad.material.opacity=.045",
            "FINAL_RECOVERY_Z_MIN=8.92",
            "FINAL_RECOVERY_Z_MAX=9.62",
            "FINAL_RECOVERY_HALF_X=2.58",
            "FINAL_RECOVERY_GRACE=.72"
          ]
          for token in required:
            assert token in s, token
          assert s.count("FinalRecoverySlatV113")==1
          assert s.count("new THREE.BoxGeometry(.58,.068,.54)")==1
          print('Final Recovery Pad v113 contract: SUCCESS')
          PY
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          m=re.search(r'<script type="module">(.*?)</script>',s,re.S)
          assert m, 'module script not found'
          Path('/tmp/brainrot-module.mjs').write_text(m.group(1))
          PY
          node --check /tmp/brainrot-module.mjs
          node scripts/final-puncher-physics-contract-v65.mjs
          node scripts/final-finish-residual-momentum-check.mjs
          node scripts/final-finish-soft-hold-check.mjs
      - name: Commit real level change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "openai-level-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && { echo 'No gameplay change produced'; exit 1; }
          git commit -m "Level: model final recovery deck v113"
          git push origin HEAD:new-player-glb-overhaul
