name: Apply Final Finish Funnel Pad v114

on:
  push:
    branches: [new-player-glb-overhaul]
    paths:
      - .github/workflows/apply-final-recovery-pad-v113.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-player-glb-overhaul
          fetch-depth: 0
      - name: Refuse stale/non-linear apply
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin new-player-glb-overhaul
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/new-player-glb-overhaul)"
      - name: Model final finish funnel deck v114
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="const FINAL_FINISH_FUNNEL_MODEL_V78=true;const finalFinishFunnelPad=box(0,.032,(FINAL_FINISH_FUNNEL_Z_MIN+FINAL_FINISH_FUNNEL_Z_MAX)*.5,FINAL_FINISH_FUNNEL_HALF_X*2,.064,FINAL_FINISH_FUNNEL_Z_MAX-FINAL_FINISH_FUNNEL_Z_MIN,0x49ff79);finalFinishFunnelPad.material.emissive=new THREE.Color(0x159b43);finalFinishFunnelPad.material.emissiveIntensity=.7;function makeFinalFinishFunnelGuard(side)"
          new="const FINAL_FINISH_FUNNEL_MODEL_V78=true,FINAL_FINISH_FUNNEL_PAD_MODEL_V114=true;const finalFinishFunnelPad=box(0,.032,(FINAL_FINISH_FUNNEL_Z_MIN+FINAL_FINISH_FUNNEL_Z_MAX)*.5,FINAL_FINISH_FUNNEL_HALF_X*2,.064,FINAL_FINISH_FUNNEL_Z_MAX-FINAL_FINISH_FUNNEL_Z_MIN,0x49ff79);finalFinishFunnelPad.name='FinalFinishFunnelCollisionPadV114';finalFinishFunnelPad.material.emissive=new THREE.Color(0x159b43);finalFinishFunnelPad.material.emissiveIntensity=.14;finalFinishFunnelPad.material.transparent=true;finalFinishFunnelPad.material.opacity=.042;finalFinishFunnelPad.material.depthWrite=false;const finalFunnelGreen=mat(0x49ff79),finalFunnelDark=mat(0x15372f),finalFunnelWhite=mat(0xeaffef),finalFunnelGold=mat(0xffef6a);finalFunnelGreen.metalness=.30;finalFunnelGreen.roughness=.27;[-2.08,-1.39,-.70,0,.70,1.39,2.08].forEach((x,i)=>{const slat=new THREE.Mesh(new THREE.BoxGeometry(.50,.068,.84),i===3?finalFunnelWhite:finalFunnelGreen);slat.name='FinalFinishFunnelSlatV114';slat.position.set(x,.073,0);slat.castShadow=slat.receiveShadow=true;slat.material.emissive=new THREE.Color(i===3?0xffffff:0x159b43);slat.material.emissiveIntensity=i===3?.92:.50;finalFinishFunnelPad.add(slat)});[-.45,.45].forEach((z,i)=>{const rail=new THREE.Mesh(new THREE.CapsuleGeometry(.04,4.46,4,8),finalFunnelWhite);rail.name='FinalFinishFunnelEdgeRailV114';rail.rotation.z=Math.PI/2;rail.position.set(0,.17,z);rail.castShadow=rail.receiveShadow=true;rail.material.emissive=new THREE.Color(i?0x49ff79:0xb4ffd5);rail.material.emissiveIntensity=.70;finalFinishFunnelPad.add(rail)});[-1.28,0,1.28].forEach((x,i)=>{const ring=new THREE.Mesh(new THREE.TorusGeometry(.115,.028,6,10),i===1?finalFunnelGold:finalFunnelWhite);ring.name='FinalFinishFunnelGuideRingV114';ring.rotation.x=Math.PI/2;ring.position.set(x,.125,0);ring.castShadow=true;ring.material.emissive=new THREE.Color(i===1?0xffd23f:0x49ff79);ring.material.emissiveIntensity=i===1?1.05:.80;finalFinishFunnelPad.add(ring)});[-2.28,2.28].forEach(x=>{const bumper=new THREE.Mesh(new THREE.CylinderGeometry(.09,.13,.32,8),finalFunnelDark);bumper.name='FinalFinishFunnelBumperV114';bumper.rotation.z=Math.PI/2;bumper.position.set(x,.09,0);bumper.castShadow=bumper.receiveShadow=true;finalFinishFunnelPad.add(bumper)});[-.28,.28].forEach((x,i)=>{const chevron=new THREE.Mesh(new THREE.CapsuleGeometry(.035,.34,4,8),finalFunnelGold);chevron.name='FinalFinishFunnelChevronV114';chevron.rotation.y=i?-.70:.70;chevron.position.set(x,.13,.10);chevron.castShadow=true;chevron.material.emissive=new THREE.Color(0xffd23f);chevron.material.emissiveIntensity=.92;finalFinishFunnelPad.add(chevron)});function makeFinalFinishFunnelGuard(side)"
          if old not in s:
              raise SystemExit('v114 final finish funnel anchor missing or already changed')
          s=s.replace(old,new,1)
          p.write_text(s)
      - name: Verify v114 modeled funnel and preserved finish physics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          required=[
            "FINAL_FINISH_FUNNEL_PAD_MODEL_V114=true",
            "FinalFinishFunnelCollisionPadV114",
            "FinalFinishFunnelSlatV114",
            "FinalFinishFunnelEdgeRailV114",
            "FinalFinishFunnelGuideRingV114",
            "FinalFinishFunnelBumperV114",
            "FinalFinishFunnelChevronV114",
            "finalFinishFunnelPad.material.opacity=.042",
            "FINAL_FINISH_FUNNEL_Z_MIN=9.54",
            "FINAL_FINISH_FUNNEL_Z_MAX=10.58",
            "FINAL_FINISH_FUNNEL_HALF_X=2.42",
            "FINAL_FINISH_FUNNEL_DAMP=10.5",
            "FINAL_FINISH_FUNNEL_PULL=1.75"
          ]
          for token in required:
            assert token in s, token
          assert s.count("FinalFinishFunnelSlatV114")==1
          assert s.count("new THREE.BoxGeometry(.50,.068,.84)")==1
          print('Final Finish Funnel Pad v114 contract: SUCCESS')
          PY
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          m=re.search(r'<script type="module">(.*?)</script>',s,re.S)
          assert m, 'module script not found'
          Path('/tmp/brainrot-module.mjs').write_text(m.group(1))
          PY
          node --check /tmp/brainrot-module.mjs
          node scripts/final-puncher-physics-contract-v65.mjs
          node scripts/final-finish-residual-momentum-check.mjs
          node scripts/final-finish-soft-hold-check.mjs
          node scripts/final-finish-charge-check.mjs
      - name: Commit real level change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "openai-level-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && { echo 'No gameplay change produced'; exit 1; }
          git commit -m "Level: model final finish funnel deck v114"
          git push origin HEAD:new-player-glb-overhaul
