name: Apply Final Charge Cradle v115

on:
  push:
    branches: [new-player-glb-overhaul]
    paths:
      - .github/workflows/apply-final-recovery-pad-v113.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-player-glb-overhaul
          fetch-depth: 0
      - name: Refuse stale/non-linear apply
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin new-player-glb-overhaul
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/new-player-glb-overhaul)"
      - name: Model final charge cradle v115
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          if 'FINAL_CHARGE_CRADLE_PAD_MODEL_V115=true' in s:
              raise SystemExit('v115 already present')
          pat=r"(const finalChargeCradlePad=box\([^;]+\);)"
          m=re.search(pat,s)
          if not m:
              raise SystemExit('finalChargeCradlePad creation anchor missing')
          addon="""const FINAL_CHARGE_CRADLE_PAD_MODEL_V115=true;finalChargeCradlePad.name='FinalChargeCradleCollisionPadV115';finalChargeCradlePad.material.transparent=true;finalChargeCradlePad.material.opacity=.04;finalChargeCradlePad.material.depthWrite=false;const finalCradleCyan=mat(0x44e7ff),finalCradleDark=mat(0x17273f),finalCradleWhite=mat(0xf1fdff),finalCradleGold=mat(0xffdf63);finalCradleCyan.metalness=.34;finalCradleCyan.roughness=.24;[-.82,-.54,-.27,0,.27,.54,.82].forEach((z,i)=>{const slat=new THREE.Mesh(new THREE.BoxGeometry(FINAL_CHARGE_CRADLE_HALF_X*1.62,.07,.16),i===3?finalCradleWhite:finalCradleCyan);slat.name='FinalChargeCradleSlatV115';slat.position.set(0,.075,z*(FINAL_CHARGE_CRADLE_Z_MAX-FINAL_CHARGE_CRADLE_Z_MIN)*.46);slat.castShadow=slat.receiveShadow=true;slat.material.emissive=new THREE.Color(i===3?0xffffff:0x0b8fb8);slat.material.emissiveIntensity=i===3?.92:.48;finalChargeCradlePad.add(slat)});[-1,1].forEach((side,i)=>{const rail=new THREE.Mesh(new THREE.CapsuleGeometry(.045,(FINAL_CHARGE_CRADLE_Z_MAX-FINAL_CHARGE_CRADLE_Z_MIN)*.78,4,8),finalCradleWhite);rail.name='FinalChargeCradleEdgeRailV115';rail.rotation.x=Math.PI/2;rail.position.set(side*FINAL_CHARGE_CRADLE_HALF_X*.83,.19,0);rail.castShadow=rail.receiveShadow=true;rail.material.emissive=new THREE.Color(i?0x49ff79:0x44e7ff);rail.material.emissiveIntensity=.74;finalChargeCradlePad.add(rail);const jaw=new THREE.Mesh(new THREE.TorusGeometry(.19,.045,6,12,Math.PI),finalCradleGold);jaw.name='FinalChargeCradleJawV115';jaw.rotation.set(Math.PI/2,0,side>0?Math.PI/2:-Math.PI/2);jaw.position.set(side*FINAL_CHARGE_CRADLE_HALF_X*.62,.24,0);jaw.castShadow=true;jaw.material.emissive=new THREE.Color(0xffc928);jaw.material.emissiveIntensity=1.02;finalChargeCradlePad.add(jaw)});[-.48,0,.48].forEach((x,i)=>{const ring=new THREE.Mesh(new THREE.TorusGeometry(.12,.03,6,10),i===1?finalCradleGold:finalCradleWhite);ring.name='FinalChargeCradleGuideRingV115';ring.rotation.x=Math.PI/2;ring.position.set(x*FINAL_CHARGE_CRADLE_HALF_X,.135,0);ring.castShadow=true;ring.material.emissive=new THREE.Color(i===1?0xffc928:0x44e7ff);ring.material.emissiveIntensity=i===1?1.12:.86;finalChargeCradlePad.add(ring)});[-1,1].forEach(side=>{const bumper=new THREE.Mesh(new THREE.CylinderGeometry(.10,.15,.36,8),finalCradleDark);bumper.name='FinalChargeCradleBumperV115';bumper.rotation.z=Math.PI/2;bumper.position.set(side*FINAL_CHARGE_CRADLE_HALF_X*.93,.10,0);bumper.castShadow=bumper.receiveShadow=true;finalChargeCradlePad.add(bumper)});"""
          s=s[:m.end()]+addon+s[m.end():]
          p.write_text(s)
      - name: Verify v115 modeled cradle and preserved finish physics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          required=[
            "FINAL_CHARGE_CRADLE_PAD_MODEL_V115=true",
            "FinalChargeCradleCollisionPadV115",
            "FinalChargeCradleSlatV115",
            "FinalChargeCradleEdgeRailV115",
            "FinalChargeCradleJawV115",
            "FinalChargeCradleGuideRingV115",
            "FinalChargeCradleBumperV115",
            "finalChargeCradlePad.material.opacity=.04",
            "FINAL_CHARGE_CRADLE_Z_MIN=10.30",
            "FINAL_CHARGE_CRADLE_Z_MAX=11.06"
          ]
          for token in required:
            assert token in s, token
          assert s.count('FINAL_CHARGE_CRADLE_PAD_MODEL_V115=true')==1
          print('Final Charge Cradle v115 contract: SUCCESS')
          PY
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          m=re.search(r'<script type="module">(.*?)</script>',s,re.S)
          assert m, 'module script not found'
          Path('/tmp/brainrot-module.mjs').write_text(m.group(1))
          PY
          node --check /tmp/brainrot-module.mjs
          node scripts/final-puncher-physics-contract-v65.mjs
          node scripts/final-finish-residual-momentum-check.mjs
          node scripts/final-finish-soft-hold-check.mjs
          node scripts/final-finish-charge-check.mjs
      - name: Commit real level change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "openai-level-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && { echo 'No gameplay change produced'; exit 1; }
          git commit -m "Level: model final charge cradle v115"
          git push origin HEAD:new-player-glb-overhaul
