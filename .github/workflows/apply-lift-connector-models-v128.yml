name: Apply Lift Connector Models v128

on:
  push:
    branches: [new-player-glb-overhaul]
    paths:
      - .github/workflows/apply-lift-connector-models-v128.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-player-glb-overhaul
          fetch-depth: 0
      - name: Refuse stale/non-linear apply
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin new-player-glb-overhaul
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/new-player-glb-overhaul)"
      - name: Model lift approach exit and assist connectors v128
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          if 'LIFT_CONNECTOR_MODELS_V128=true' in s:
              raise SystemExit('v128 already present')
          old="const liftApproach=box(0,.035,LIFT_Z-1.18,3.25,.07,.72,0x45f4ff),liftExit=box(0,.035,LIFT_Z+1.18,3.25,.07,.72,0x49ff79);[liftApproach,liftExit].forEach((o,i)=>{o.material.emissive=new THREE.Color(i?0x19b24e:0x0e98bd);o.material.emissiveIntensity=1.05});const LIFT_GATE_MODEL_V86=true;"
          if old not in s:
              raise SystemExit('lift approach/exit anchor missing')
          new="""const LIFT_CONNECTOR_MODELS_V128=true;const liftApproach=box(0,.035,LIFT_Z-1.18,3.25,.07,.72,0x45f4ff),liftExit=box(0,.035,LIFT_Z+1.18,3.25,.07,.72,0x49ff79);[liftApproach,liftExit].forEach((o,i)=>{o.name=i?'LiftExitLegacyCollisionCarrierV128':'LiftApproachLegacyCollisionCarrierV128';o.material.transparent=true;o.material.opacity=.045;o.material.depthWrite=false;o.material.emissive=new THREE.Color(i?0x19b24e:0x0e98bd);o.material.emissiveIntensity=.24});const liftConnectorDarkV128=mat(0x18213a),liftConnectorWhiteV128=mat(0xf4fbff),liftConnectorCyanV128=mat(0x45f4ff),liftConnectorGreenV128=mat(0x49ff79);liftConnectorDarkV128.metalness=.50;liftConnectorDarkV128.roughness=.30;[liftConnectorCyanV128,liftConnectorGreenV128].forEach(m=>{m.metalness=.30;m.roughness=.26});const liftConnectorSlatGeoV128=new THREE.BoxGeometry(.46,.065,.56),liftConnectorRailGeoV128=new THREE.CapsuleGeometry(.04,.54,4,8),liftConnectorBumperGeoV128=new THREE.CylinderGeometry(.105,.15,.30,8),liftConnectorRingGeoV128=new THREE.TorusGeometry(.115,.028,6,10),liftConnectorBraceGeoV128=new THREE.CylinderGeometry(.04,.06,.54,8);function modelLiftConnectorPadV128(carrier,isExit){const accent=isExit?liftConnectorGreenV128:liftConnectorCyanV128,glow=isExit?0x19b24e:0x0e98bd;[-1.28,-.85,-.43,0,.43,.85,1.28].forEach((x,k)=>{const slat=new THREE.Mesh(liftConnectorSlatGeoV128,k===3?liftConnectorWhiteV128:accent);slat.name=isExit?'LiftExitSlatV128':'LiftApproachSlatV128';slat.position.set(x,.072,0);slat.castShadow=slat.receiveShadow=true;slat.material.emissive=new THREE.Color(k===3?0xffffff:glow);slat.material.emissiveIntensity=k===3?.82:.46;carrier.add(slat)});[-.27,.27].forEach((z,k)=>{const rail=new THREE.Mesh(liftConnectorRailGeoV128,liftConnectorWhiteV128);rail.name=isExit?'LiftExitEdgeRailV128':'LiftApproachEdgeRailV128';rail.rotation.z=Math.PI/2;rail.scale.y=5.25;rail.position.set(0,.16,z);rail.castShadow=rail.receiveShadow=true;rail.material.emissive=new THREE.Color(k?glow:(isExit?0x8affc5:0x9befff));rail.material.emissiveIntensity=.62;carrier.add(rail)});[-1.48,1.48].forEach((x,k)=>{const bumper=new THREE.Mesh(liftConnectorBumperGeoV128,liftConnectorDarkV128);bumper.name=isExit?'LiftExitBumperV128':'LiftApproachBumperV128';bumper.rotation.z=Math.PI/2;bumper.position.set(x,.085,0);bumper.castShadow=bumper.receiveShadow=true;carrier.add(bumper);const ring=new THREE.Mesh(liftConnectorRingGeoV128,accent);ring.name=isExit?'LiftExitBeaconV128':'LiftApproachBeaconV128';ring.rotation.y=Math.PI/2;ring.position.set(x,.12,0);ring.castShadow=true;ring.material.emissive=new THREE.Color(k?glow:0xffffff);ring.material.emissiveIntensity=1.0;carrier.add(ring)});[-.72,0,.72].forEach((x,k)=>{const brace=new THREE.Mesh(liftConnectorBraceGeoV128,liftConnectorDarkV128);brace.name=isExit?'LiftExitCrossBraceV128':'LiftApproachCrossBraceV128';brace.rotation.x=Math.PI/2;brace.position.set(x,.025,0);brace.castShadow=brace.receiveShadow=true;carrier.add(brace);const node=new THREE.Mesh(liftConnectorRingGeoV128,liftConnectorWhiteV128);node.name=isExit?'LiftExitGuideRingV128':'LiftApproachGuideRingV128';node.rotation.x=Math.PI/2;node.position.set(x,.11,0);node.castShadow=true;node.material.emissive=new THREE.Color(k===1?0xffffff:glow);node.material.emissiveIntensity=k===1?.94:.72;carrier.add(node)})}modelLiftConnectorPadV128(liftApproach,false);modelLiftConnectorPadV128(liftExit,true);const LIFT_GATE_MODEL_V86=true;"""
          s=s.replace(old,new,1)
          old2="const LIFT_ASSIST_Z_MIN=PITS[0][0]-.7,LIFT_ASSIST_Z_MAX=FIRST_SWEEPER_TRIGGER_Z+.30,LIFT_ASSIST_HALF_X=1.55,LIFT_ASSIST_SPEED=1.35;const liftAssistPad=box(0,.024,(LIFT_ASSIST_Z_MIN+LIFT_ASSIST_Z_MAX)*.5,LIFT_ASSIST_HALF_X*2,.048,LIFT_ASSIST_Z_MAX-LIFT_ASSIST_Z_MIN,0x6cf7ff);liftAssistPad.material.emissive=new THREE.Color(0x0c8fb4);liftAssistPad.material.emissiveIntensity=.65;"
          if old2 not in s:
              raise SystemExit('lift assist anchor missing')
          new2="""const LIFT_ASSIST_Z_MIN=PITS[0][0]-.7,LIFT_ASSIST_Z_MAX=FIRST_SWEEPER_TRIGGER_Z+.30,LIFT_ASSIST_HALF_X=1.55,LIFT_ASSIST_SPEED=1.35;const liftAssistPad=box(0,.024,(LIFT_ASSIST_Z_MIN+LIFT_ASSIST_Z_MAX)*.5,LIFT_ASSIST_HALF_X*2,.048,LIFT_ASSIST_Z_MAX-LIFT_ASSIST_Z_MIN,0x6cf7ff);liftAssistPad.name='LiftAssistLegacyCollisionCarrierV128';liftAssistPad.material.transparent=true;liftAssistPad.material.opacity=.04;liftAssistPad.material.depthWrite=false;liftAssistPad.material.emissive=new THREE.Color(0x0c8fb4);liftAssistPad.material.emissiveIntensity=.22;const liftAssistLengthV128=LIFT_ASSIST_Z_MAX-LIFT_ASSIST_Z_MIN,liftAssistSlatGeoV128=new THREE.BoxGeometry(2.72,.055,.42),liftAssistRailGeoV128=new THREE.CapsuleGeometry(.045,liftAssistLengthV128-.30,4,8);[-1.50,-1.00,-.50,0,.50,1.00,1.50].forEach((z,k)=>{const slat=new THREE.Mesh(liftAssistSlatGeoV128,k===3?liftConnectorWhiteV128:liftConnectorCyanV128);slat.name='LiftAssistSlatV128';slat.position.set(0,.062,z);slat.castShadow=slat.receiveShadow=true;slat.material.emissive=new THREE.Color(k===3?0xffffff:0x0c8fb4);slat.material.emissiveIntensity=k===3?.88:.46;liftAssistPad.add(slat)});[-1.34,1.34].forEach((x,k)=>{const rail=new THREE.Mesh(liftAssistRailGeoV128,liftConnectorWhiteV128);rail.name='LiftAssistEdgeRailV128';rail.rotation.x=Math.PI/2;rail.position.set(x,.17,0);rail.castShadow=rail.receiveShadow=true;rail.material.emissive=new THREE.Color(k?0x49ff79:0x45f4ff);rail.material.emissiveIntensity=.64;liftAssistPad.add(rail)});[-1.28,0,1.28].forEach((z,k)=>{const ring=new THREE.Mesh(liftConnectorRingGeoV128,k===1?liftConnectorGreenV128:liftConnectorWhiteV128);ring.name='LiftAssistGuideRingV128';ring.rotation.x=Math.PI/2;ring.position.set(0,.12,z);ring.castShadow=true;ring.material.emissive=new THREE.Color(k===1?0x49ff79:0x45f4ff);ring.material.emissiveIntensity=k===1?1.02:.78;liftAssistPad.add(ring)});[-1.46,1.46].forEach((x,k)=>{const bumper=new THREE.Mesh(liftConnectorBumperGeoV128,liftConnectorDarkV128);bumper.name='LiftAssistBumperV128';bumper.rotation.z=Math.PI/2;bumper.position.set(x,.09,0);bumper.castShadow=bumper.receiveShadow=true;liftAssistPad.add(bumper);const beacon=new THREE.Mesh(liftConnectorRingGeoV128,liftConnectorCyanV128);beacon.name='LiftAssistBeaconV128';beacon.rotation.y=Math.PI/2;beacon.position.set(x,.14,0);beacon.castShadow=true;beacon.material.emissive=new THREE.Color(k?0x49ff79:0x45f4ff);beacon.material.emissiveIntensity=1.0;liftAssistPad.add(beacon)});"""
          s=s.replace(old2,new2,1)
          p.write_text(s)
      - name: Verify lift connector models v128 and preserved gameplay
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          required=[
            'LIFT_CONNECTOR_MODELS_V128=true',
            'LiftApproachLegacyCollisionCarrierV128',
            'LiftExitLegacyCollisionCarrierV128',
            'LiftApproachSlatV128',
            'LiftExitSlatV128',
            'LiftApproachEdgeRailV128',
            'LiftExitEdgeRailV128',
            'LiftApproachBeaconV128',
            'LiftExitBeaconV128',
            'LiftAssistLegacyCollisionCarrierV128',
            'LiftAssistSlatV128',
            'LiftAssistEdgeRailV128',
            'LiftAssistGuideRingV128',
            'LiftAssistBeaconV128',
            'LIFT_MODELED_DECK_V127=true',
            'function moveLiftPlatform(t,dt)',
            'liftApproach.material.emissiveIntensity=holdForCarry?1.5:1.05',
            'liftExit.material.emissiveIntensity=crossingCarry?1.85:1.05',
            'LIFT_ASSIST_SPEED=1.35'
          ]
          for token in required:
              assert token in s, token
          assert s.count('LIFT_CONNECTOR_MODELS_V128=true') == 1
          assert s.count("'LiftApproachLegacyCollisionCarrierV128'") == 1
          assert s.count("'LiftExitLegacyCollisionCarrierV128'") == 1
          assert s.count("'LiftAssistLegacyCollisionCarrierV128'") == 1
          print('Lift connector models v128 contract: SUCCESS')
          PY
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          m=re.search(r'<script type="module">(.*?)</script>',s,re.S)
          assert m, 'module script not found'
          Path('/tmp/brainrot-module.mjs').write_text(m.group(1))
          PY
          node --check /tmp/brainrot-module.mjs
          node scripts/final-puncher-physics-contract-v65.mjs
          node scripts/final-finish-residual-momentum-check.mjs
          node scripts/final-finish-soft-hold-check.mjs
          node scripts/final-finish-charge-check.mjs
      - name: Commit real level change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "openai-level-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && { echo 'No gameplay change produced'; exit 1; }
          git commit -m "Level: model lift connector route v128"
          git push origin HEAD:new-player-glb-overhaul
