name: One-shot final pressure stations v98
on:
  push:
    branches: [new-player-glb-overhaul]
    paths: ['.github/workflows/one-shot-final-pressure-stations-v98.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-player-glb-overhaul
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Replace final pressure-pad boxes with modeled stations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          s=s.replace('full 3D route v97 · modeled finish deck','full 3D route v98 · modeled pressure stations',1)
          old="const finalPlayerPressurePad=box(-.62,.105,10.48,1.02,.045,.38,0xffc84d),finalBrainPressurePad=box(.62,.105,10.48,1.02,.045,.38,0x46b9ff);[finalPlayerPressurePad,finalBrainPressurePad].forEach(o=>{o.material.emissive=new THREE.Color(o.material.color);o.material.emissiveIntensity=.5});"
          new="const FINAL_PRESSURE_STATION_MODEL_V98=true;function makeFinalPressureStation(x,c,label){const g=new THREE.Group();g.name=label+'PressureStationV98';g.position.set(x,.105,10.48);const plate=new THREE.Mesh(new THREE.CapsuleGeometry(.055,.78,4,8),mat(c));plate.name=label+'PressurePlateV98';plate.rotation.z=Math.PI/2;plate.scale.z=1.45;plate.castShadow=plate.receiveShadow=true;plate.material.emissive=new THREE.Color(c);plate.material.emissiveIntensity=.5;g.add(plate);const dark=mat(0x17213b),accent=mat(0xffffff);[-.39,.39].forEach(px=>{const piston=new THREE.Mesh(new THREE.CylinderGeometry(.07,.09,.13,8),dark);piston.name=label+'PressurePistonV98';piston.position.set(px,-.065,0);piston.castShadow=piston.receiveShadow=true;g.add(piston);const ring=new THREE.Mesh(new THREE.TorusGeometry(.10,.024,6,10),accent);ring.name=label+'PressureRingV98';ring.rotation.y=Math.PI/2;ring.position.set(px,.02,0);ring.castShadow=true;ring.material.emissive=new THREE.Color(c);ring.material.emissiveIntensity=.72;g.add(ring)});const center=new THREE.Mesh(new THREE.OctahedronGeometry(.075,0),accent);center.name=label+'PressureCoreV98';center.position.set(0,.035,0);center.castShadow=true;center.material.emissive=new THREE.Color(c);center.material.emissiveIntensity=.85;g.add(center);g.material=plate.material;scene.add(g);return g}const finalPlayerPressurePad=makeFinalPressureStation(-.62,0xffc84d,'Player'),finalBrainPressurePad=makeFinalPressureStation(.62,0x46b9ff,'Brainrot');"
          assert old in s, 'v97 pressure pad primitive block not found'
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Verify v98 runtime syntax and finish invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          for marker in [
            'full 3D route v98 · modeled pressure stations',
            'FINAL_PRESSURE_STATION_MODEL_V98=true',
            "makeFinalPressureStation(-.62,0xffc84d,'Player')",
            "makeFinalPressureStation(.62,0x46b9ff,'Brainrot')",
            "PressurePlateV98",
            'g.material=plate.material',
            'finalPlayerPressurePad.scale.y=playerPressureStable?.72:1',
            'finalBrainPressurePad.scale.y=brainPressureStable?.72:1'
          ]: assert marker in s, marker
          assert "finalPlayerPressurePad=box(-.62" not in s
          assert "finalBrainPressurePad=box(.62" not in s
          start=s.index('<script type="module">')+len('<script type="module">'); end=s.index('</script>',start)
          Path('/tmp/game.mjs').write_text(s[start:end])
          print('v98 modeled pressure station invariants PASS')
          PY
          node --check /tmp/game.mjs
          node scripts/final-finish-charge-check.mjs
          git diff --check
      - name: Commit gameplay change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Model final pressure stations v98'
          git push origin HEAD:new-player-glb-overhaul
