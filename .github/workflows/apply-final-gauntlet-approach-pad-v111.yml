name: Apply Final Gauntlet Approach Pad v111

on:
  push:
    branches: [new-player-glb-overhaul]
    paths:
      - .github/workflows/apply-final-gauntlet-approach-pad-v111.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-player-glb-overhaul
          fetch-depth: 0
      - name: Refuse stale/non-linear apply
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin new-player-glb-overhaul
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/new-player-glb-overhaul)"
      - name: Model final gauntlet approach deck v111
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="const FINAL_GAUNTLET_APPROACH_Z_MIN=6.72,FINAL_GAUNTLET_APPROACH_Z_MAX=8.92,FINAL_GAUNTLET_APPROACH_HALF_X=1.55,FINAL_GAUNTLET_APPROACH_MODEL_V76=true;const finalGauntletApproachPad=box(0,.03,(FINAL_GAUNTLET_APPROACH_Z_MIN+FINAL_GAUNTLET_APPROACH_Z_MAX)*.5,FINAL_GAUNTLET_APPROACH_HALF_X*2,.06,FINAL_GAUNTLET_APPROACH_Z_MAX-FINAL_GAUNTLET_APPROACH_Z_MIN,0xffd84d);finalGauntletApproachPad.material.emissive=new THREE.Color(0xa95a00);finalGauntletApproachPad.material.emissiveIntensity=.78;function makeFinalGauntletApproachGuard(side)"
          new="const FINAL_GAUNTLET_APPROACH_Z_MIN=6.72,FINAL_GAUNTLET_APPROACH_Z_MAX=8.92,FINAL_GAUNTLET_APPROACH_HALF_X=1.55,FINAL_GAUNTLET_APPROACH_MODEL_V76=true,FINAL_GAUNTLET_APPROACH_PAD_MODEL_V111=true;const finalGauntletApproachPad=box(0,.03,(FINAL_GAUNTLET_APPROACH_Z_MIN+FINAL_GAUNTLET_APPROACH_Z_MAX)*.5,FINAL_GAUNTLET_APPROACH_HALF_X*2,.06,FINAL_GAUNTLET_APPROACH_Z_MAX-FINAL_GAUNTLET_APPROACH_Z_MIN,0xffd84d);finalGauntletApproachPad.name='FinalGauntletApproachCollisionPadV111';finalGauntletApproachPad.material.emissive=new THREE.Color(0xa95a00);finalGauntletApproachPad.material.emissiveIntensity=.16;finalGauntletApproachPad.material.transparent=true;finalGauntletApproachPad.material.opacity=.05;finalGauntletApproachPad.material.depthWrite=false;const finalApproachAmber=mat(0xffd84d),finalApproachDark=mat(0x4b3515),finalApproachWhite=mat(0xfff4c2),finalApproachPink=mat(0xff557c);finalApproachAmber.metalness=.28;finalApproachAmber.roughness=.30;[-.94,-.63,-.32,0,.32,.63,.94].forEach((z,i)=>{const slat=new THREE.Mesh(new THREE.BoxGeometry(2.68,.058,.22),i===3?finalApproachWhite:finalApproachAmber);slat.name='FinalGauntletApproachSlatV111';slat.position.set(0,.065,z);slat.castShadow=slat.receiveShadow=true;slat.material.emissive=new THREE.Color(i===3?0xffffff:0xa95a00);slat.material.emissiveIntensity=i===3?.84:.44;finalGauntletApproachPad.add(slat)});[-1.31,1.31].forEach((x,i)=>{const rail=new THREE.Mesh(new THREE.CapsuleGeometry(.038,1.94,4,8),finalApproachWhite);rail.name='FinalGauntletApproachEdgeRailV111';rail.rotation.x=Math.PI/2;rail.position.set(x,.17,0);rail.castShadow=rail.receiveShadow=true;rail.material.emissive=new THREE.Color(i?0xff557c:0xffb12b);rail.material.emissiveIntensity=.62;finalGauntletApproachPad.add(rail)});[-.76,0,.76].forEach((z,i)=>{const ring=new THREE.Mesh(new THREE.TorusGeometry(.11,.027,6,10),i===1?finalApproachPink:finalApproachWhite);ring.name='FinalGauntletApproachTimingRingV111';ring.rotation.x=Math.PI/2;ring.position.set(0,.12,z);ring.castShadow=true;ring.material.emissive=new THREE.Color(i===1?0xff315d:0xffb12b);ring.material.emissiveIntensity=i===1?1.0:.78;finalGauntletApproachPad.add(ring)});[-1.18,1.18].forEach(x=>{const brace=new THREE.Mesh(new THREE.CylinderGeometry(.075,.105,.44,8),finalApproachDark);brace.name='FinalGauntletApproachBraceV111';brace.position.set(x,.20,0);brace.castShadow=brace.receiveShadow=true;finalGauntletApproachPad.add(brace)});function makeFinalGauntletApproachGuard(side)"
          if old not in s:
              raise SystemExit('v111 final gauntlet approach anchor missing or already changed')
          s=s.replace(old,new,1)
          p.write_text(s)
      - name: Verify v111 modeled approach and preserved gameplay contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          required=[
            "FINAL_GAUNTLET_APPROACH_PAD_MODEL_V111=true",
            "FinalGauntletApproachCollisionPadV111",
            "FinalGauntletApproachSlatV111",
            "FinalGauntletApproachEdgeRailV111",
            "FinalGauntletApproachTimingRingV111",
            "FinalGauntletApproachBraceV111",
            "finalGauntletApproachPad.material.opacity=.05",
            "FINAL_GAUNTLET_APPROACH_Z_MIN=6.72",
            "FINAL_GAUNTLET_APPROACH_Z_MAX=8.92",
            "FINAL_GAUNTLET_APPROACH_HALF_X=1.55",
            "FINAL_GAUNTLET_Z1=7.55",
            "FINAL_GAUNTLET_Z2=8.38",
            "FINAL_GAUNTLET_CLEAR_Z=8.92"
          ]
          for token in required:
            assert token in s, token
          assert s.count("FinalGauntletApproachSlatV111")==1
          assert s.count("new THREE.BoxGeometry(2.68,.058,.22)")==1
          assert "finalGauntletApproachPad.material.opacity=.05" in s
          print('Final Gauntlet Approach Pad v111 contract: SUCCESS')
          PY
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          m=re.search(r'<script type="module">(.*?)</script>',s,re.S)
          assert m, 'module script not found'
          Path('/tmp/brainrot-module.mjs').write_text(m.group(1))
          PY
          node --check /tmp/brainrot-module.mjs
          for f in scripts/final-puncher-physics-contract-v65-check.mjs scripts/second-pit-route-continuity-v70-check.mjs; do
            if [ -f "$f" ]; then node "$f"; else echo "SKIP missing $f"; fi
          done
      - name: Commit real level change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "openai-level-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && { echo 'No gameplay change produced'; exit 1; }
          git commit -m "Level: model final gauntlet approach deck v111"
          git push origin HEAD:new-player-glb-overhaul
