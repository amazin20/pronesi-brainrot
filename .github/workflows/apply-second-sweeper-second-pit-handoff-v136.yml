name: Apply Second Sweeper Second Pit Handoff v136

on:
  push:
    branches: [new-player-glb-overhaul]
    paths:
      - .github/workflows/apply-second-sweeper-second-pit-handoff-v136.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-player-glb-overhaul
          fetch-depth: 0
      - name: Refuse stale/non-linear apply
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin new-player-glb-overhaul
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/new-player-glb-overhaul)"
          test "$(git rev-parse HEAD^)" = "13f021cbe83e1c93a01212e806ab50efcb5c4787"
      - name: Model second sweeper to second pit handoff v136
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          if 'SECOND_SWEEPER_SECOND_PIT_HANDOFF_MODEL_V136=true' in s:
              raise SystemExit('v136 already present')
          anchor='function makeSecondSweeperRecoveryGuard(side){'
          if s.count(anchor) != 1:
              raise SystemExit(f'v136 handoff anchor count={s.count(anchor)}')
          model="""const SECOND_SWEEPER_SECOND_PIT_HANDOFF_MODEL_V136=true;const secondSweeperSecondPitHandoffV136=new THREE.Group();secondSweeperSecondPitHandoffV136.name='SecondSweeperSecondPitHandoffV136';secondSweeperSecondPitHandoffV136.position.set(0,0,3.55);scene.add(secondSweeperSecondPitHandoffV136);const handoffGreenV136=mat(0x49ff79),handoffCyanV136=mat(0x44e7ff),handoffWhiteV136=mat(0xeaffef),handoffDarkV136=mat(0x14352d),handoffAmberV136=mat(0xffd84d);handoffGreenV136.metalness=.30;handoffGreenV136.roughness=.27;handoffCyanV136.metalness=.32;handoffCyanV136.roughness=.25;handoffDarkV136.metalness=.50;handoffDarkV136.roughness=.30;const handoffSlatGeoV136=new THREE.BoxGeometry(3.18,.065,.085),handoffRailGeoV136=new THREE.CapsuleGeometry(.035,.42,4,8),handoffPostGeoV136=new THREE.CylinderGeometry(.055,.08,.48,8),handoffRingGeoV136=new THREE.TorusGeometry(.115,.026,6,10),handoffBraceGeoV136=new THREE.CylinderGeometry(.035,.05,3.06,8);[-.14,-.07,0,.07,.14].forEach((z,i)=>{const slat=new THREE.Mesh(handoffSlatGeoV136,i===2?handoffWhiteV136:(i<2?handoffGreenV136:handoffCyanV136));slat.name='SecondSweeperSecondPitTransitionSlatV136';slat.position.set(0,.105,z);slat.castShadow=slat.receiveShadow=true;slat.material.emissive=new THREE.Color(i===2?0xffffff:(i<2?0x159b43:0x087fa8));slat.material.emissiveIntensity=i===2?.90:.52;secondSweeperSecondPitHandoffV136.add(slat)});[-1.55,1.55].forEach((x,i)=>{const post=new THREE.Mesh(handoffPostGeoV136,handoffDarkV136);post.name='SecondSweeperSecondPitPostV136';post.position.set(x,.28,0);post.castShadow=post.receiveShadow=true;secondSweeperSecondPitHandoffV136.add(post);const ring=new THREE.Mesh(handoffRingGeoV136,i?handoffCyanV136:handoffGreenV136);ring.name='SecondSweeperSecondPitBeaconV136';ring.rotation.x=Math.PI/2;ring.position.set(x,.54,0);ring.castShadow=true;ring.material.emissive=new THREE.Color(i?0x44e7ff:0x49ff79);ring.material.emissiveIntensity=1.15;secondSweeperSecondPitHandoffV136.add(ring);const rail=new THREE.Mesh(handoffRailGeoV136,handoffWhiteV136);rail.name='SecondSweeperSecondPitEdgeRailV136';rail.rotation.x=Math.PI/2;rail.position.set(x,.20,0);rail.castShadow=true;rail.material.emissive=new THREE.Color(i?0x44e7ff:0x49ff79);rail.material.emissiveIntensity=.74;secondSweeperSecondPitHandoffV136.add(rail)});[-.11,.11].forEach((z,i)=>{const brace=new THREE.Mesh(handoffBraceGeoV136,handoffDarkV136);brace.name='SecondSweeperSecondPitCrossBraceV136';brace.rotation.z=Math.PI/2;brace.position.set(0,.055,z);brace.castShadow=brace.receiveShadow=true;secondSweeperSecondPitHandoffV136.add(brace)});[-.72,0,.72].forEach((x,i)=>{const guide=new THREE.Mesh(handoffRingGeoV136,i===1?handoffAmberV136:handoffWhiteV136);guide.name='SecondSweeperSecondPitGuideRingV136';guide.rotation.x=Math.PI/2;guide.position.set(x,.18,0);guide.castShadow=true;guide.material.emissive=new THREE.Color(i===1?0xffb12b:(x<0?0x49ff79:0x44e7ff));guide.material.emissiveIntensity=i===1?1.18:.88;secondSweeperSecondPitHandoffV136.add(guide)});"""
          s=s.replace(anchor,model+anchor,1)
          tick_anchor='secondSweeperRecoveryPad.material.emissiveIntensity=secondSweeperRecoveryActive?1.05+.55*secondSweeperRecoveryPulse:.5;'
          if s.count(tick_anchor) != 1:
              raise SystemExit(f'v136 tick anchor count={s.count(tick_anchor)}')
          tick="""const secondSweeperSecondPitHandoffActive=secondSweeperCleared&&p.z>3.30&&p.z<3.86,secondSweeperSecondPitHandoffPulse=.5+.5*Math.sin(t*7.2);secondSweeperSecondPitHandoffV136.children.forEach(n=>{if(!n.isMesh||!n.material?.emissive)return;const beacon=n.name==='SecondSweeperSecondPitBeaconV136',guide=n.name==='SecondSweeperSecondPitGuideRingV136';n.material.emissiveIntensity=secondSweeperSecondPitHandoffActive?(beacon?1.30+.42*secondSweeperSecondPitHandoffPulse:(guide?1.12+.34*secondSweeperSecondPitHandoffPulse:.68+.20*secondSweeperSecondPitHandoffPulse)):(beacon?1.15:(guide?.88:.52))});"""
          s=s.replace(tick_anchor,tick_anchor+tick,1)
          p.write_text(s)
      - name: Verify v136 handoff and preserved gameplay
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          required=[
            'SECOND_SWEEPER_SECOND_PIT_HANDOFF_MODEL_V136=true',
            'SecondSweeperSecondPitHandoffV136',
            'SecondSweeperSecondPitTransitionSlatV136',
            'SecondSweeperSecondPitPostV136',
            'SecondSweeperSecondPitBeaconV136',
            'SecondSweeperSecondPitEdgeRailV136',
            'SecondSweeperSecondPitCrossBraceV136',
            'SecondSweeperSecondPitGuideRingV136',
            'SECOND_SWEEPER_RECOVERY_Z_MIN=3.18',
            'SECOND_SWEEPER_RECOVERY_Z_MAX=3.55',
            'SECOND_SWEEPER_RECOVERY_DAMP=11.0',
            'SECOND_PIT_APPROACH_Z_MIN=3.48',
            'SECOND_PIT_APPROACH_Z_MAX=5.04',
            'SECOND_PIT_APPROACH_HALF_X=1.55',
            'SECOND_PIT_APPROACH_PAD_MODEL_V110=true',
            'SECOND_SWEEPER_RECOVERY_PAD_MODEL_V135=true',
            'secondSweeperSecondPitHandoffActive=secondSweeperCleared&&p.z>3.30&&p.z<3.86'
          ]
          for token in required:
              assert token in s, token
          assert s.count('SECOND_SWEEPER_SECOND_PIT_HANDOFF_MODEL_V136=true') == 1
          assert s.count("'SecondSweeperSecondPitHandoffV136'") == 1
          assert 'secondSweeperSecondPitHandoffV136.position.set(0,0,3.55)' in s
          print('Second sweeper -> second pit handoff v136 contract: SUCCESS')
          PY
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          m=re.search(r'<script type="module">(.*?)</script>',s,re.S)
          assert m, 'module script not found'
          Path('/tmp/brainrot-module.mjs').write_text(m.group(1))
          PY
          node --check /tmp/brainrot-module.mjs
          for f in scripts/second-pit-carry-window-check.mjs scripts/second-pit-platform-motion-v71-check.mjs scripts/second-pit-route-continuity-v70-check.mjs scripts/final-puncher-physics-contract-v65.mjs scripts/final-finish-residual-momentum-check.mjs scripts/final-finish-soft-hold-check.mjs scripts/final-finish-charge-check.mjs; do
            if [ -f "$f" ]; then node "$f"; else echo "SKIP missing $f"; fi
          done
      - name: Commit real level change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "openai-level-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && { echo 'No gameplay change produced'; exit 1; }
          git commit -m "Level: model second sweeper to second pit handoff v136"
          git push origin HEAD:new-player-glb-overhaul
