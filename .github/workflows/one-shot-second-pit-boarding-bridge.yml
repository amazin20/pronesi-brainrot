name: One-shot second pit boarding bridge
on:
  push:
    branches: [new-player-glb-overhaul]
    paths: ['.github/workflows/one-shot-second-pit-boarding-bridge.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-player-glb-overhaul
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch physical boarding bridge into second pit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          s=s.replace('full 3D lift route v49 · dual position-locked sweeper lanes','full 3D lift route v50 · second pit physical boarding bridge',1)
          old='SECOND_PIT_BOARD_X=.16,SECOND_PIT_BOARD_SPEED=2.6,SECOND_PIT_EXIT_RELEASE_Z=6.02;'
          new='SECOND_PIT_BOARD_X=.16,SECOND_PIT_BOARD_SPEED=2.6,SECOND_PIT_BOARD_BRIDGE_Z=5.055,SECOND_PIT_BOARD_BRIDGE_HALF_X=1.45,SECOND_PIT_BOARD_BRIDGE_HALF_Z=.18,SECOND_PIT_EXIT_RELEASE_Z=6.02;'
          assert old in s; s=s.replace(old,new,1)
          anchor='const secondPitExitPad=box(0,.035,5.98,3.35,.07,.44,0x49ff79);'
          insert="const secondPitBoardBridge=box(0,.02,SECOND_PIT_BOARD_BRIDGE_Z,SECOND_PIT_BOARD_BRIDGE_HALF_X*2,.08,SECOND_PIT_BOARD_BRIDGE_HALF_Z*2,0x49ff79);secondPitBoardBridge.material.emissive=new THREE.Color(0x19b24e);secondPitBoardBridge.material.emissiveIntensity=1.35;secondPitBoardBridge.visible=false;"+anchor
          assert anchor in s; s=s.replace(anchor,insert,1)
          s=s.replace('secondPitBoarding=false,secondPitBoardingIndex=-1,secondPitCrossing=false,finalGauntletCleared=false','secondPitBoarding=false,secondPitBoardingIndex=-1,secondPitCrossing=false,secondPitBoardBridgeActive=false,finalGauntletCleared=false',1)
          support_anchor='function supportedBySecondPit(x,y,z,brain=false){return secondPitPlatforms.some(platform=>onSecondPitPlatform(platform,x,y,z,brain))}'
          support_new=support_anchor+"function onSecondPitBoardBridge(x,y,z,brain=false){if(!secondPitBoardBridgeActive)return false;const target=PIT_PLATFORM_TOP+(brain?.56:0),mx=brain?.16:.08,mz=brain?.12:.06;return Math.abs(x)<=SECOND_PIT_BOARD_BRIDGE_HALF_X+mx&&Math.abs(z-SECOND_PIT_BOARD_BRIDGE_Z)<=SECOND_PIT_BOARD_BRIDGE_HALF_Z+mz&&Math.abs(y-target)<=.24}"
          assert support_anchor in s; s=s.replace(support_anchor,support_new,1)
          move_anchor='function moveSecondPitPlatforms(t,dt){const invDt=1/Math.max(dt,.001),approaching='
          move_new='function moveSecondPitPlatforms(t,dt){secondPitBoardBridgeActive=false;const invDt=1/Math.max(dt,.001),approaching='
          assert move_anchor in s; s=s.replace(move_anchor,move_new,1)
          lock_anchor='platform.mesh.material.emissiveIntensity=boardingLocked?1.55:(.52+.35*(.5+.5*Math.sin(t*5.1+i*Math.PI)));platform.stripe.material.emissiveIntensity=boardingLocked?2.05:1.15;'
          lock_new=lock_anchor+'if(boardingLocked)secondPitBoardBridgeActive=true;'
          assert lock_anchor in s; s=s.replace(lock_anchor,lock_new,1)
          visual_anchor='const pulse=.5+.5*Math.sin(t*8),stageColor=holdActive?0x49ff79:0x44e7ff,stageEmissive=holdActive?0x19b24e:0x087fa8;'
          visual_new="secondPitBoardBridge.visible=secondPitBoardBridgeActive;secondPitBoardBridge.material.emissiveIntensity=secondPitBoardBridgeActive?1.25+.55*(.5+.5*Math.sin(t*11)):0;"+visual_anchor
          assert visual_anchor in s; s=s.replace(visual_anchor,visual_new,1)
          player_support='||supportedBySecondPit(p.x,p.y,p.z,false)||playerOnLift)'
          player_support_new='||supportedBySecondPit(p.x,p.y,p.z,false)||onSecondPitBoardBridge(p.x,p.y,p.z,false)||playerOnLift)'
          assert player_support in s; s=s.replace(player_support,player_support_new,1)
          brain_support='||supportedBySecondPit(bp.x,bp.y,bp.z,true)||brainOnLift)'
          brain_support_new='||supportedBySecondPit(bp.x,bp.y,bp.z,true)||onSecondPitBoardBridge(bp.x,bp.y,bp.z,true)||brainOnLift)'
          assert brain_support in s; s=s.replace(brain_support,brain_support_new,1)
          p.write_text(s)
          PY
      - name: Verify bridge gameplay syntax and invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          required=['full 3D lift route v50 · second pit physical boarding bridge','SECOND_PIT_BOARD_BRIDGE_Z=5.055','secondPitBoardBridge.visible=false','function onSecondPitBoardBridge(','secondPitBoardBridgeActive=false','if(boardingLocked)secondPitBoardBridgeActive=true','secondPitBoardBridge.visible=secondPitBoardBridgeActive','onSecondPitBoardBridge(p.x,p.y,p.z,false)','onSecondPitBoardBridge(bp.x,bp.y,bp.z,true)']
          for x in required: assert x in s,x
          pit_edge=5.05
          bridge_z=5.055; bridge_half_z=.18
          platform_center=(5.05+5.82)*.5; platform_half_z=.34
          assert bridge_z-bridge_half_z < pit_edge
          assert bridge_z+bridge_half_z > platform_center-platform_half_z
          assert 1.45 >= 1.35
          start=s.index('<script type="module">')+len('<script type="module">'); end=s.index('</script>',start)
          Path('/tmp/game.mjs').write_text(s[start:end])
          print('second pit boarding bridge invariants PASS')
          PY
          node --check /tmp/game.mjs
      - name: Commit gameplay change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add physical boarding bridge to second pit'
          git push origin HEAD:new-player-glb-overhaul
