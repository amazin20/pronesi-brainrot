name: One-shot first sweeper readable hazard patch

on:
  push:
    branches: [new-player-glb-overhaul]
    paths:
      - '.github/workflows/one-shot-first-sweeper-entry.yml'

permissions:
  contents: write

jobs:
  patch-level:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-player-glb-overhaul
          fetch-depth: 0

      - name: Make first sweeper phase readable in real gameplay
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          old="[sweeperEntryL,sweeperEntryR,sweeperEntryTop].forEach(o=>{o.material.color.setHex(c);o.material.emissive.setHex(e);o.material.emissiveIntensity=warning?1.3+1.05*pulse:(burst?1.55:(recover?1.1:.75))});return burst}"
          new="[sweeperEntryL,sweeperEntryR,sweeperEntryTop].forEach(o=>{o.material.color.setHex(c);o.material.emissive.setHex(e);o.material.emissiveIntensity=warning?1.3+1.05*pulse:(burst?1.55:(recover?1.1:.75))});const arm=sweeps[0].children[0];arm.material.color.setHex(burst?0xff315d:(warning?0xffb12b:(recover?0x49ff79:0xff557c)));arm.material.emissive.setHex(burst?0xa20d38:(warning?0xff7a00:(recover?0x149343:0x000000)));arm.material.emissiveIntensity=burst?1.4:(warning?.65+1.05*pulse:(recover?.85:0));return burst}"
          if old not in s: raise SystemExit('sweeper visual anchor missing')
          s=s.replace(old,new,1)

          old="state.textContent=failTimer>0?failReason+' · ВОЗВРАТ…':'НЕСУ'"
          new="state.textContent=failTimer>0?failReason+' · ВОЗВРАТ…':(firstSweeperPhase==='warning'?'SWEEPER · ПРИГОТОВЬСЯ':(firstSweeperPhase==='burst'?'SWEEPER · УДАР':(firstSweeperPhase==='recover'?'SWEEPER · ОКНО ПРОХОДА':'НЕСУ')))"
          if old not in s: raise SystemExit('carry HUD anchor missing')
          s=s.replace(old,new,1)

          s=s.replace('full 3D lift route v17 · burst sweeper cycle','full 3D lift route v18 · readable sweeper hazard',1)
          p.write_text(s)
          PY

      - name: Verify readable hazard runtime syntax and invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          assert "arm.material.color.setHex" in s
          assert "arm.material.emissiveIntensity=burst?1.4" in s
          assert "firstSweeperPhase==='warning'?'SWEEPER · ПРИГОТОВЬСЯ'" in s
          assert "firstSweeperPhase==='recover'?'SWEEPER · ОКНО ПРОХОДА'" in s
          assert 'full 3D lift route v18 · readable sweeper hazard' in s
          module=s.split('<script type="module">',1)[1].split('</script>',1)[0]
          Path('/tmp/game-module.mjs').write_text(module)
          PY
          node --check /tmp/game-module.mjs

      - name: Commit gameplay change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Make first sweeper phases readable during carry'
          git push origin HEAD:new-player-glb-overhaul
