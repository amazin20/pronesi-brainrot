name: One-shot first sweeper burst gameplay patch

on:
  push:
    branches: [new-player-glb-overhaul]
    paths:
      - '.github/workflows/one-shot-first-sweeper-entry.yml'

permissions:
  contents: write

jobs:
  patch-level:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-player-glb-overhaul
          fetch-depth: 0

      - name: Convert first sweeper into warning burst recovery hazard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          old="const FIRST_SWEEPER_TRIGGER_Z=-11.05,FIRST_SWEEPER_WARN=.72;"
          new="const FIRST_SWEEPER_TRIGGER_Z=-11.05,FIRST_SWEEPER_WARN=.72,FIRST_SWEEPER_BURST=1.05,FIRST_SWEEPER_RECOVER=.72,FIRST_SWEEPER_BURST_SPEED=-2.65;"
          if old not in s: raise SystemExit('sweeper constants anchor missing')
          s=s.replace(old,new,1)

          old="liftBlocked=false,firstSweeperPhase='idle',firstSweeperWarn=0;"
          new="liftBlocked=false,firstSweeperPhase='idle',firstSweeperTimer=0;"
          if old not in s: raise SystemExit('sweeper state anchor missing')
          s=s.replace(old,new,1)

          old="if(!useCheckpoint){firstSweeperPhase='idle';firstSweeperWarn=0;sweeps[0].rotation.y=0}"
          new="if(!useCheckpoint){firstSweeperPhase='idle';firstSweeperTimer=0;sweeps[0].rotation.y=0}"
          if old not in s: raise SystemExit('sweeper reset anchor missing')
          s=s.replace(old,new,1)

          start=s.index("function updateFirstSweeperEntry(dt,t){")
          end=s.index("function sweeperHit",start)
          replacement="""function updateFirstSweeperEntry(dt,t){if(firstSweeperPhase==='idle'&&p.z>FIRST_SWEEPER_TRIGGER_Z&&failTimer<=0&&!win){firstSweeperPhase='warning';firstSweeperTimer=FIRST_SWEEPER_WARN;state.textContent='SWEEPER · ПРИГОТОВЬСЯ'}else if(firstSweeperPhase!=='idle'){firstSweeperTimer=Math.max(0,firstSweeperTimer-dt);if(firstSweeperTimer===0){if(firstSweeperPhase==='warning'){firstSweeperPhase='burst';firstSweeperTimer=FIRST_SWEEPER_BURST;state.textContent='SWEEPER · УДАР'}else if(firstSweeperPhase==='burst'){firstSweeperPhase='recover';firstSweeperTimer=FIRST_SWEEPER_RECOVER;state.textContent='SWEEPER · ОКНО ПРОХОДА'}else{firstSweeperPhase='warning';firstSweeperTimer=FIRST_SWEEPER_WARN;state.textContent='SWEEPER · СНОВА ГОТОВИТСЯ'}}}const warning=firstSweeperPhase==='warning',burst=firstSweeperPhase==='burst',recover=firstSweeperPhase==='recover',pulse=.5+.5*Math.sin(t*(warning?18:7)),c=burst?0xff315d:(warning?(pulse>.5?0xffffff:0xffb12b):(recover?0x49ff79:0xffd84d)),e=burst?0xa20d38:(warning?0xff7a00:(recover?0x149343:0xa95a00));sweeperEntryPad.material.color.setHex(c);sweeperEntryPad.material.emissive.setHex(e);sweeperEntryPad.material.emissiveIntensity=warning?1.5+1.25*pulse:(burst?1.7:(recover?1.25:.7));[sweeperEntryL,sweeperEntryR,sweeperEntryTop].forEach(o=>{o.material.color.setHex(c);o.material.emissive.setHex(e);o.material.emissiveIntensity=warning?1.3+1.05*pulse:(burst?1.55:(recover?1.1:.75))});return burst}function sweeperHit"""
          s=s[:start]+replacement+s[end+len("function sweeperHit"):]

          old="const firstSweeperActive=updateFirstSweeperEntry(dt,t);sweeps.forEach((s,i)=>{const w=i?1.5:(firstSweeperActive?-1.7:0),from=s.rotation.y,to=from+w*dt;if(i||firstSweeperActive)sweeperHit(s,w,from,to);s.rotation.y=to});"
          new="const firstSweeperActive=updateFirstSweeperEntry(dt,t);sweeps.forEach((s,i)=>{const w=i?1.5:(firstSweeperActive?FIRST_SWEEPER_BURST_SPEED:0),from=s.rotation.y,to=from+w*dt;if(i||firstSweeperActive)sweeperHit(s,w,from,to);s.rotation.y=to});"
          if old not in s: raise SystemExit('sweeper tick anchor missing')
          s=s.replace(old,new,1)

          s=s.replace('full 3D lift route v16 · staged sweeper entry','full 3D lift route v17 · burst sweeper cycle',1)
          p.write_text(s)
          PY

      - name: Verify gameplay patch syntax and invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          assert "FIRST_SWEEPER_BURST=1.05" in s
          assert "FIRST_SWEEPER_RECOVER=.72" in s
          assert "FIRST_SWEEPER_BURST_SPEED=-2.65" in s
          assert "firstSweeperPhase='burst'" in s
          assert "firstSweeperPhase='recover'" in s
          assert "SWEEPER · ОКНО ПРОХОДА" in s
          assert "firstSweeperActive?FIRST_SWEEPER_BURST_SPEED:0" in s
          module=s.split('<script type="module">',1)[1].split('</script>',1)[0]
          Path('/tmp/game-module.mjs').write_text(module)
          PY
          node --check /tmp/game-module.mjs

      - name: Commit gameplay change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add burst and recovery cycle to first sweeper'
          git push origin HEAD:new-player-glb-overhaul
