name: One-shot second pit boarding hold gameplay patch
# trigger-v22-second-pit-boarding

on:
  push:
    branches: [new-player-glb-overhaul]
    paths:
      - '.github/workflows/one-shot-first-sweeper-entry.yml'

permissions:
  contents: write

jobs:
  patch-level:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-player-glb-overhaul
          fetch-depth: 0

      - name: Build second pit staging and boarding hold
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          old="const SECOND_PIT_Z=(PITS[2][0]+PITS[2][1])*.5,SECOND_PLATFORM_HALF_X=1.05,SECOND_PLATFORM_HALF_Z=.34,SECOND_PLATFORM_BASE_X=1.4,SECOND_PLATFORM_TRAVEL=1.3;const secondPitPlatforms=[[-SECOND_PLATFORM_BASE_X,0xff5fc7],[SECOND_PLATFORM_BASE_X,0x44e7ff]].map(([x,c],i)=>{const mesh=box(x,-.04,SECOND_PIT_Z,SECOND_PLATFORM_HALF_X*2,.24,SECOND_PLATFORM_HALF_Z*2,c);mesh.material.emissive=new THREE.Color(c);mesh.material.emissiveIntensity=.58;const stripe=box(x,.095,SECOND_PIT_Z,1.5,.035,.5,0xffffff);stripe.material.emissive=new THREE.Color(i?0x44e7ff:0xff5fc7);stripe.material.emissiveIntensity=1.15;return{mesh,stripe,side:i?1:-1,lastX:x}});"
          new="const SECOND_PIT_Z=(PITS[2][0]+PITS[2][1])*.5,SECOND_PLATFORM_HALF_X=1.05,SECOND_PLATFORM_HALF_Z=.34,SECOND_PLATFORM_BASE_X=1.4,SECOND_PLATFORM_TRAVEL=1.3,SECOND_PIT_STAGE_Z=4.55,SECOND_PIT_STAGE_Z_MIN=3.55,SECOND_PIT_STAGE_HALF_X=1.55,SECOND_PIT_BOARD_X=.16,SECOND_PIT_BOARD_SPEED=2.6;const secondPitPlatforms=[[-SECOND_PLATFORM_BASE_X,0xff5fc7],[SECOND_PLATFORM_BASE_X,0x44e7ff]].map(([x,c],i)=>{const mesh=box(x,-.04,SECOND_PIT_Z,SECOND_PLATFORM_HALF_X*2,.24,SECOND_PLATFORM_HALF_Z*2,c);mesh.material.emissive=new THREE.Color(c);mesh.material.emissiveIntensity=.58;const stripe=box(x,.095,SECOND_PIT_Z,1.5,.035,.5,0xffffff);stripe.material.emissive=new THREE.Color(i?0x44e7ff:0xff5fc7);stripe.material.emissiveIntensity=1.15;return{mesh,stripe,side:i?1:-1,lastX:x}});const secondPitStagePad=box(0,.035,SECOND_PIT_STAGE_Z,3.35,.07,.82,0x44e7ff),secondPitStageL=box(-1.62,.58,4.92,.14,1.16,.14,0x44e7ff),secondPitStageR=box(1.62,.58,4.92,.14,1.16,.14,0x44e7ff),secondPitStageTop=box(0,1.11,4.92,3.38,.14,.14,0x44e7ff);const secondPitStageVisuals=[secondPitStagePad,secondPitStageL,secondPitStageR,secondPitStageTop];secondPitStageVisuals.forEach(o=>{o.material.emissive=new THREE.Color(0x087fa8);o.material.emissiveIntensity=.72});"
          if old not in s: raise SystemExit('second pit declaration anchor missing')
          s=s.replace(old,new,1)

          old="playerWasRiding=false,brainWasRiding=false,playerRidingNow=false,brainRidingNow=false,liftBlocked=false,firstSweeperPhase='idle',firstSweeperTimer=0,firstSweeperCleared=false,secondSweeperCleared=false;"
          new="playerWasRiding=false,brainWasRiding=false,playerRidingNow=false,brainRidingNow=false,liftBlocked=false,firstSweeperPhase='idle',firstSweeperTimer=0,firstSweeperCleared=false,secondSweeperCleared=false,secondPitBoarding=false;"
          if old not in s: raise SystemExit('runtime state anchor missing')
          s=s.replace(old,new,1)

          old="function moveSecondPitPlatforms(t,dt){const invDt=1/Math.max(dt,.001);secondPitPlatforms.forEach((platform,i)=>{const oldX=platform.mesh.position.x,newX=platform.side*(SECOND_PLATFORM_BASE_X-SECOND_PLATFORM_TRAVEL*Math.sin(t*1.55)),dx=newX-oldX;const carryPlayer=onSecondPitPlatform(platform,p.x,p.y,p.z,false)&&vy<=.25,carryBrain=!carry&&onSecondPitPlatform(platform,bp.x,bp.y,bp.z,true)&&bv.y<=.35;platform.mesh.position.x=newX;platform.stripe.position.x=newX;platform.mesh.material.emissiveIntensity=.52+.35*(.5+.5*Math.sin(t*5.1+i*Math.PI));if(carryPlayer){playerRidingNow=true;playerRideVX=dx*invDt;playerRideVY=0;playerRideVZ=0;if(!blocked(p.x+dx,p.z)&&!playerLiftSideBlocked(p.x+dx,p.z))p.x+=dx}if(carryBrain){brainRidingNow=true;brainRideVX=dx*invDt;brainRideVZ=0;brainRideVY=0;if(!brainrotBlocked(bp.x+dx,bp.z)&&!brainLiftSideBlocked(bp.x+dx,bp.z))bp.x+=dx}platform.lastX=newX})}"
          new="function moveSecondPitPlatforms(t,dt){const invDt=1/Math.max(dt,.001),stageReady=secondSweeperCleared&&carry&&p.z>SECOND_PIT_STAGE_Z_MIN&&p.z<SECOND_PIT_Z+SECOND_PLATFORM_HALF_Z+.12&&Math.abs(p.x)<SECOND_PIT_STAGE_HALF_X&&p.y<.42;let boardingIndex=-1;if(stageReady)boardingIndex=Math.abs(secondPitPlatforms[0].mesh.position.x)<=Math.abs(secondPitPlatforms[1].mesh.position.x)?0:1;secondPitBoarding=stageReady;secondPitPlatforms.forEach((platform,i)=>{const oldX=platform.mesh.position.x,rawX=platform.side*(SECOND_PLATFORM_BASE_X-SECOND_PLATFORM_TRAVEL*Math.sin(t*1.55));let newX=rawX;if(stageReady&&i===boardingIndex){const dockX=platform.side*SECOND_PIT_BOARD_X,maxStep=SECOND_PIT_BOARD_SPEED*dt;newX=Math.max(oldX-maxStep,Math.min(oldX+maxStep,dockX))}const dx=newX-oldX,carryPlayer=onSecondPitPlatform(platform,p.x,p.y,p.z,false)&&vy<=.25,carryBrain=!carry&&onSecondPitPlatform(platform,bp.x,bp.y,bp.z,true)&&bv.y<=.35,boardingLocked=stageReady&&i===boardingIndex&&Math.abs(newX-platform.side*SECOND_PIT_BOARD_X)<.055;platform.mesh.position.x=newX;platform.stripe.position.x=newX;platform.mesh.material.emissiveIntensity=boardingLocked?1.55:(.52+.35*(.5+.5*Math.sin(t*5.1+i*Math.PI)));platform.stripe.material.emissiveIntensity=boardingLocked?2.05:1.15;if(carryPlayer){playerRidingNow=true;playerRideVX=dx*invDt;playerRideVY=0;playerRideVZ=0;if(!blocked(p.x+dx,p.z)&&!playerLiftSideBlocked(p.x+dx,p.z))p.x+=dx}if(carryBrain){brainRidingNow=true;brainRideVX=dx*invDt;brainRideVZ=0;brainRideVY=0;if(!brainrotBlocked(bp.x+dx,bp.z)&&!brainLiftSideBlocked(bp.x+dx,bp.z))bp.x+=dx}platform.lastX=newX});const pulse=.5+.5*Math.sin(t*8),stageColor=stageReady?0x49ff79:0x44e7ff,stageEmissive=stageReady?0x19b24e:0x087fa8;secondPitStageVisuals.forEach(o=>{o.material.color.setHex(stageColor);o.material.emissive.setHex(stageEmissive);o.material.emissiveIntensity=stageReady?1.25+.45*pulse:.72});if(stageReady&&!win&&failTimer<=0)state.textContent='ПЛАТФОРМА ЖДЁТ · ЗАХОДИ'}"
          if old not in s: raise SystemExit('second pit movement anchor missing')
          s=s.replace(old,new,1)

          old="state.textContent=failTimer>0?failReason+' · ВОЗВРАТ…':(secondSweeperCleared?'SWEEPER 2 · ПРОЙДЕН':(firstSweeperPhase==='warning'?'SWEEPER · ПРИГОТОВЬСЯ':(firstSweeperPhase==='burst'?'SWEEPER · УДАР':(firstSweeperPhase==='recover'?'SWEEPER · ОКНО ПРОХОДА':(firstSweeperPhase==='cleared'?'SWEEPER · ПРОЙДЕН':'НЕСУ')))))}"
          new="state.textContent=failTimer>0?failReason+' · ВОЗВРАТ…':(secondPitBoarding?'ПЛАТФОРМА ЖДЁТ · ЗАХОДИ':(secondSweeperCleared?'SWEEPER 2 · ПРОЙДЕН':(firstSweeperPhase==='warning'?'SWEEPER · ПРИГОТОВЬСЯ':(firstSweeperPhase==='burst'?'SWEEPER · УДАР':(firstSweeperPhase==='recover'?'SWEEPER · ОКНО ПРОХОДА':(firstSweeperPhase==='cleared'?'SWEEPER · ПРОЙДЕН':'НЕСУ'))))))}"
          if old not in s: raise SystemExit('carry HUD anchor missing')
          s=s.replace(old,new,1)

          old='full 3D lift route v21 · persistent second sweeper clear'
          new='full 3D lift route v22 · second pit boarding hold'
          if old not in s: raise SystemExit('runtime marker missing')
          s=s.replace(old,new,1)
          p.write_text(s)

          Path('scripts/second-pit-boarding-hold-check.mjs').write_text("""import fs from 'node:fs';\nconst s=fs.readFileSync('index.html','utf8');\nfor(const needle of [\"SECOND_PIT_STAGE_Z=4.55\",\"SECOND_PIT_BOARD_X=.16\",\"SECOND_PIT_BOARD_SPEED=2.6\",\"secondPitStageVisuals\",\"secondPitBoarding=stageReady\",\"boardingIndex=Math.abs\",\"boardingLocked=stageReady\",\"ПЛАТФОРМА ЖДЁТ · ЗАХОДИ\",\"full 3D lift route v22\"]){if(!s.includes(needle))throw new Error('missing '+needle)}\nconst boardX=.16,halfX=1.05,playerRadius=.4,brainRadius=.38;\nif(halfX-playerRadius<.6)throw new Error('player boarding width too narrow');\nif(halfX-brainRadius<.6)throw new Error('brainrot boarding width too narrow');\nif(Math.abs(boardX)>halfX-playerRadius)throw new Error('held platform misses center carry corridor');\nconst pit=[5.05,5.82],halfZ=.34;\nconst uncovered=(pit[1]-pit[0])-2*halfZ;\nif(uncovered>.12)throw new Error('platform leaves excessive Z gap '+uncovered);\nconsole.log('second pit staging/boarding hold: PASS', {centerClearance:halfX-playerRadius, uncovered});\n""")
          PY

      - name: Verify gameplay syntax and boarding invariants
        run: |
          node scripts/second-pit-boarding-hold-check.mjs
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          module=s.split('<script type="module">',1)[1].split('</script>',1)[0]
          Path('/tmp/game-module.mjs').write_text(module)
          PY
          node --check /tmp/game-module.mjs
          node --check scripts/second-pit-boarding-hold-check.mjs

      - name: Commit gameplay change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html scripts/second-pit-boarding-hold-check.mjs
          git commit -m 'Add staging hold to second moving-platform pit'
          git push origin HEAD:new-player-glb-overhaul
