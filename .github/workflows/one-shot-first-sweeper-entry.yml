name: One-shot second pit checkpoint landing funnel
# trigger-v24-second-pit-checkpoint-funnel

on:
  push:
    branches: [new-player-glb-overhaul]
    paths:
      - '.github/workflows/one-shot-first-sweeper-entry.yml'

permissions:
  contents: write

jobs:
  patch-level:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-player-glb-overhaul
          fetch-depth: 0

      - name: Build second pit checkpoint landing funnel
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          old="const secondPitExitPad=box(0,.035,5.98,3.35,.07,.44,0x49ff79);secondPitExitPad.material.emissive=new THREE.Color(0x19b24e);secondPitExitPad.material.emissiveIntensity=.58;const secondPitStageVisuals=[secondPitStagePad,secondPitStageL,secondPitStageR,secondPitStageTop];"
          new="const secondPitExitPad=box(0,.035,5.98,3.35,.07,.44,0x49ff79);secondPitExitPad.material.emissive=new THREE.Color(0x19b24e);secondPitExitPad.material.emissiveIntensity=.58;const SECOND_PIT_FUNNEL_HALF_X=2.05,SECOND_PIT_FUNNEL_Z_MIN=5.78,SECOND_PIT_FUNNEL_Z_MAX=7.28;const secondPitFunnelL=box(-2.18,.46,6.53,.22,.92,1.5,0x49ff79),secondPitFunnelR=box(2.18,.46,6.53,.22,.92,1.5,0x49ff79),secondPitFunnelStripe=box(0,.018,6.54,3.85,.036,1.44,0x49ff79);[secondPitFunnelL,secondPitFunnelR,secondPitFunnelStripe].forEach(o=>{o.material.emissive=new THREE.Color(0x159b43);o.material.emissiveIntensity=.72});const secondPitStageVisuals=[secondPitStagePad,secondPitStageL,secondPitStageR,secondPitStageTop];"
          if old not in s: raise SystemExit('second pit exit visual anchor missing')
          s=s.replace(old,new,1)

          old="const FINISH_Z_MIN=8.82,FINISH_X=3.5;function blocked(x,z){if(Math.abs(x)>4.55||z<-23||z>11)return true;if(z>FINISH_Z_MIN&&Math.abs(x)>FINISH_X)return true;"
          new="const FINISH_Z_MIN=8.82,FINISH_X=3.5;function inSecondPitFunnel(x,z,r=0){return z>SECOND_PIT_FUNNEL_Z_MIN&&z<SECOND_PIT_FUNNEL_Z_MAX&&Math.abs(x)>SECOND_PIT_FUNNEL_HALF_X-r}function blocked(x,z){if(Math.abs(x)>4.55||z<-23||z>11)return true;if(inSecondPitFunnel(x,z,.4))return true;if(z>FINISH_Z_MIN&&Math.abs(x)>FINISH_X)return true;"
          if old not in s: raise SystemExit('player collision anchor missing')
          s=s.replace(old,new,1)

          old="function brainrotBlocked(x,z,r=.38){if(Math.abs(x)>4.55-r||z<-23+r||z>11-r)return true;if(z>FINISH_Z_MIN&&Math.abs(x)>FINISH_X-r)return true;"
          new="function brainrotBlocked(x,z,r=.38){if(Math.abs(x)>4.55-r||z<-23+r||z>11-r)return true;if(inSecondPitFunnel(x,z,r))return true;if(z>FINISH_Z_MIN&&Math.abs(x)>FINISH_X-r)return true;"
          if old not in s: raise SystemExit('brainrot collision anchor missing')
          s=s.replace(old,new,1)

          old="if(playerRidingNow){playerMomentumX=0;playerMomentumZ=0}if(brainRidingNow&&!carry){bv.x*=Math.exp(-10*dt);bv.z*=Math.exp(-10*dt)}hitLock=Math.max(0,hitLock-dt);"
          new="if(playerRidingNow){playerMomentumX=0;playerMomentumZ=0}if(brainRidingNow&&!carry){bv.x*=Math.exp(-10*dt);bv.z*=Math.exp(-10*dt)}const playerLandingFunnel=p.z>SECOND_PIT_FUNNEL_Z_MIN&&p.z<SECOND_PIT_FUNNEL_Z_MAX&&p.y<.48,brainLandingFunnel=!carry&&bp.z>SECOND_PIT_FUNNEL_Z_MIN&&bp.z<SECOND_PIT_FUNNEL_Z_MAX&&bp.y<.92;if(playerLandingFunnel){playerMomentumX*=Math.exp(-15*dt);playerMomentumZ*=Math.exp(-11*dt)}if(brainLandingFunnel){bv.x*=Math.exp(-12*dt);bv.z*=Math.exp(-9*dt)}const funnelPulse=.5+.5*Math.sin(t*7.5);[secondPitFunnelL,secondPitFunnelR,secondPitFunnelStripe].forEach(o=>o.material.emissiveIntensity=(playerLandingFunnel||brainLandingFunnel)?1.15+.42*funnelPulse:.72);hitLock=Math.max(0,hitLock-dt);"
          if old not in s: raise SystemExit('momentum damping anchor missing')
          s=s.replace(old,new,1)

          old='full 3D lift route v23 · second pit crossing latch'
          new='full 3D lift route v24 · checkpoint landing funnel'
          if old not in s: raise SystemExit('runtime marker missing')
          s=s.replace(old,new,1)
          p.write_text(s)

          Path('scripts/second-pit-checkpoint-funnel-check.mjs').write_text("""import fs from 'node:fs';\nconst s=fs.readFileSync('index.html','utf8');\nfor(const needle of [\"SECOND_PIT_FUNNEL_HALF_X=2.05\",\"SECOND_PIT_FUNNEL_Z_MIN=5.78\",\"SECOND_PIT_FUNNEL_Z_MAX=7.28\",\"inSecondPitFunnel(x,z\",\"playerLandingFunnel\",\"brainLandingFunnel\",\"Math.exp(-15*dt)\",\"checkpoint landing funnel\"]){if(!s.includes(needle))throw new Error('missing '+needle)}\nconst halfX=2.05,playerR=.4,brainR=.38,zMin=5.78,zMax=7.28,exitRelease=6.02,checkpointZ=6.35;\nif(exitRelease<zMin||exitRelease>zMax)throw new Error('platform release is outside funnel');\nif(checkpointZ<zMin||checkpointZ>zMax)throw new Error('checkpoint is outside funnel');\nif(halfX-playerR<1.55)throw new Error('player carry corridor too narrow');\nif(halfX-brainR<1.6)throw new Error('brainrot corridor too narrow');\nif(zMax-checkpointZ<.75)throw new Error('not enough braking distance after checkpoint');\nconsole.log('second pit checkpoint funnel: PASS',{playerClear:halfX-playerR,brainClear:halfX-brainR,brakingAfterCheckpoint:zMax-checkpointZ});\n""")
          PY

      - name: Verify gameplay syntax and landing funnel invariants
        run: |
          node scripts/second-pit-checkpoint-funnel-check.mjs
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          module=s.split('<script type="module">',1)[1].split('</script>',1)[0]
          Path('/tmp/game-module.mjs').write_text(module)
          PY
          node --check /tmp/game-module.mjs
          node --check scripts/second-pit-checkpoint-funnel-check.mjs

      - name: Commit gameplay change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html scripts/second-pit-checkpoint-funnel-check.mjs
          git commit -m 'Add checkpoint landing funnel after second pit'
          git push origin HEAD:new-player-glb-overhaul
