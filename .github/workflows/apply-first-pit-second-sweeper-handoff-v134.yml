name: Apply First Pit Second Sweeper Handoff v134

on:
  push:
    branches: [new-player-glb-overhaul]
    paths:
      - .github/workflows/apply-first-pit-second-sweeper-handoff-v134.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-player-glb-overhaul
          fetch-depth: 0
      - name: Refuse stale/non-linear apply
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin new-player-glb-overhaul
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/new-player-glb-overhaul)"
      - name: Model first-pit to second-sweeper handoff v134
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          if 'FIRST_PIT_SECOND_SWEEPER_HANDOFF_MODEL_V134=true' in s:
              raise SystemExit('v134 already present')
          old="firstPitExitLandingV133.add(firstPitExitTimingLipV133);const SECOND_SWEEPER_STAGING_PAD_MODEL_V129=true;"
          if old not in s:
              raise SystemExit('v134 anchor missing')
          new="""firstPitExitLandingV133.add(firstPitExitTimingLipV133);const FIRST_PIT_SECOND_SWEEPER_HANDOFF_MODEL_V134=true,FIRST_PIT_HANDOFF_Z_MIN=-2.06,FIRST_PIT_HANDOFF_Z_MAX=-1.62,FIRST_PIT_HANDOFF_HALF_X=1.66;const firstPitHandoffV134=new THREE.Group();firstPitHandoffV134.name='FirstPitSecondSweeperHandoffAssemblyV134';firstPitHandoffV134.position.set(0,0,(FIRST_PIT_HANDOFF_Z_MIN+FIRST_PIT_HANDOFF_Z_MAX)*.5);const firstPitHandoffCyanV134=mat(0x44e7ff),firstPitHandoffAmberV134=mat(0xffd84d),firstPitHandoffDarkV134=mat(0x17213a),firstPitHandoffWhiteV134=mat(0xf4fbff),firstPitHandoffGreenV134=mat(0x49ff79);firstPitHandoffCyanV134.metalness=.32;firstPitHandoffCyanV134.roughness=.25;firstPitHandoffAmberV134.metalness=.30;firstPitHandoffAmberV134.roughness=.27;firstPitHandoffDarkV134.metalness=.50;firstPitHandoffDarkV134.roughness=.29;const firstPitHandoffSlatGeoV134=new THREE.BoxGeometry(.40,.07,.34),firstPitHandoffPostGeoV134=new THREE.CylinderGeometry(.075,.11,.82,8),firstPitHandoffRingGeoV134=new THREE.TorusGeometry(.115,.028,6,10),firstPitHandoffRailGeoV134=new THREE.CapsuleGeometry(.04,.34,4,8);[-1.38,-.92,-.46,0,.46,.92,1.38].forEach((x,i)=>{const accent=i<3?firstPitHandoffCyanV134:(i>3?firstPitHandoffAmberV134:firstPitHandoffWhiteV134);const slat=new THREE.Mesh(firstPitHandoffSlatGeoV134,accent);slat.name='FirstPitHandoffTransitionSlatV134';slat.position.set(x,.075,0);slat.castShadow=slat.receiveShadow=true;slat.material.emissive=new THREE.Color(i<3?0x087fa8:(i>3?0xa95a00:0xffffff));slat.material.emissiveIntensity=i===3?.90:.50;firstPitHandoffV134.add(slat)});[-1.52,1.52].forEach((x,i)=>{const rail=new THREE.Mesh(firstPitHandoffRailGeoV134,firstPitHandoffWhiteV134);rail.name='FirstPitHandoffEdgeRailV134';rail.rotation.x=Math.PI/2;rail.position.set(x,.18,0);rail.castShadow=rail.receiveShadow=true;rail.material.emissive=new THREE.Color(i?0xffb12b:0x44e7ff);rail.material.emissiveIntensity=.72;firstPitHandoffV134.add(rail);[-.16,.16].forEach((z,k)=>{const post=new THREE.Mesh(firstPitHandoffPostGeoV134,firstPitHandoffDarkV134);post.name='FirstPitHandoffReinforcedPostV134';post.position.set(x,.41,z);post.castShadow=post.receiveShadow=true;firstPitHandoffV134.add(post);const ring=new THREE.Mesh(firstPitHandoffRingGeoV134,k?firstPitHandoffAmberV134:firstPitHandoffCyanV134);ring.name='FirstPitHandoffBeaconRingV134';ring.rotation.x=Math.PI/2;ring.position.set(x,.84,z);ring.castShadow=true;ring.material.emissive=new THREE.Color(k?0xffb12b:0x44e7ff);ring.material.emissiveIntensity=1.04;firstPitHandoffV134.add(ring)})});const firstPitHandoffTopV134=new THREE.Mesh(new THREE.CapsuleGeometry(.07,3.02,4,8),firstPitHandoffDarkV134);firstPitHandoffTopV134.name='FirstPitHandoffTimingArchV134';firstPitHandoffTopV134.rotation.z=Math.PI/2;firstPitHandoffTopV134.position.set(0,1.13,0);firstPitHandoffTopV134.castShadow=firstPitHandoffTopV134.receiveShadow=true;firstPitHandoffV134.add(firstPitHandoffTopV134);[-1.0,0,1.0].forEach((x,i)=>{const node=new THREE.Mesh(firstPitHandoffRingGeoV134,i===1?firstPitHandoffGreenV134:(i<1?firstPitHandoffCyanV134:firstPitHandoffAmberV134));node.name='FirstPitHandoffTimingNodeV134';node.rotation.y=Math.PI/2;node.position.set(x,1.13,0);node.castShadow=true;node.material.emissive=new THREE.Color(i===1?0x49ff79:(i<1?0x44e7ff:0xffb12b));node.material.emissiveIntensity=i===1?1.12:.92;firstPitHandoffV134.add(node)});[-.92,0,.92].forEach((x,i)=>{const guide=new THREE.Mesh(firstPitHandoffRingGeoV134,i===1?firstPitHandoffGreenV134:firstPitHandoffWhiteV134);guide.name='FirstPitHandoffFloorGuideV134';guide.rotation.x=Math.PI/2;guide.position.set(x,.13,0);guide.castShadow=true;guide.material.emissive=new THREE.Color(i===1?0x49ff79:(i<1?0x44e7ff:0xffb12b));guide.material.emissiveIntensity=i===1?1.08:.80;firstPitHandoffV134.add(guide)});scene.add(firstPitHandoffV134);const SECOND_SWEEPER_STAGING_PAD_MODEL_V129=true;"""
          s=s.replace(old,new,1)
          p.write_text(s)
      - name: Verify v134 handoff and preserved gameplay route
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          required=[
            'FIRST_PIT_SECOND_SWEEPER_HANDOFF_MODEL_V134=true',
            'FIRST_PIT_HANDOFF_Z_MIN=-2.06',
            'FIRST_PIT_HANDOFF_Z_MAX=-1.62',
            'FIRST_PIT_HANDOFF_HALF_X=1.66',
            'FirstPitSecondSweeperHandoffAssemblyV134',
            'FirstPitHandoffTransitionSlatV134',
            'FirstPitHandoffEdgeRailV134',
            'FirstPitHandoffReinforcedPostV134',
            'FirstPitHandoffBeaconRingV134',
            'FirstPitHandoffTimingArchV134',
            'FirstPitHandoffTimingNodeV134',
            'FirstPitHandoffFloorGuideV134',
            'FIRST_PIT_EXIT_LANDING_MODEL_V133=true',
            'SECOND_SWEEPER_STAGING_PAD_MODEL_V129=true',
            'SECOND_SWEEPER_STAGING_Z_MIN=-1.82',
            "PITS=[[-15.2,-13.55],[-4.85,-3.55],[5.05,5.82]]"
          ]
          for token in required:
              assert token in s, token
          assert s.count('FIRST_PIT_SECOND_SWEEPER_HANDOFF_MODEL_V134=true') == 1
          assert -2.06 < -1.86, 'handoff must overlap v133 landing for visual continuity'
          assert -1.62 > -1.82, 'handoff must overlap second-sweeper staging zone'
          assert -2.06 > -3.55, 'handoff must remain clear of first pit void'
          print('First pit -> second sweeper handoff v134 contract: SUCCESS')
          PY
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          m=re.search(r'<script type="module">(.*?)</script>',s,re.S)
          assert m, 'module script not found'
          Path('/tmp/brainrot-module.mjs').write_text(m.group(1))
          PY
          node --check /tmp/brainrot-module.mjs
          node scripts/final-puncher-physics-contract-v65.mjs
          node scripts/final-finish-residual-momentum-check.mjs
          node scripts/final-finish-soft-hold-check.mjs
          node scripts/final-finish-charge-check.mjs
      - name: Commit real level change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "openai-level-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && { echo 'No gameplay change produced'; exit 1; }
          git commit -m "Level: model first-pit second-sweeper handoff v134"
          git push origin HEAD:new-player-glb-overhaul
