name: Level Regression v102

on:
  push:
    branches: [new-player-glb-overhaul]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  level-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify current v102 modeled level contract
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const src = fs.readFileSync('index.html','utf8');
          const required = [
            'const RUNTIME_GROUP_MATERIAL_SAFE_V102=true',
            'function setEmissiveIntensityDeep(root,value)',
            'const FINAL_STRIKE_PLATFORM_MODEL_V100=true',
            'StrikePlatformV100',
            'const finalPunchers=',
            'const FINAL_PRESSURE_STATION_MODEL_V98=true',
            'const FINAL_PRESSURE_PYLON_MODEL_V99=true',
            'const FINISH_DECK_MODEL_V97=true',
            'FINAL_CHARGE_GATE_MODEL_V95=true',
            'const SECOND_PIT_EXIT_MODEL_V94=true',
            'const LIFT_CEILING_EXIT_MODEL_V92=true',
            'const LIFT_CEILING_MODEL_V91=true'
          ];
          const missing = required.filter(token => !src.includes(token));
          if (missing.length) {
            console.error('Missing modeled-level invariants:', missing.join(' | '));
            process.exit(1);
          }
          if (src.includes('const finalGauntletPad1=box(')) {
            console.error('Legacy final strike-platform box geometry returned');
            process.exit(1);
          }
          if (src.includes('new THREE.BoxGeometry(8,.28,.4)')) {
            console.error('Legacy sweeper box visual returned');
            process.exit(1);
          }
          console.log('v102 modeled level contract: PASS');
          NODE

      - name: Reject direct material access on modeled Group runtime targets
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const src = fs.readFileSync('index.html','utf8');
          const forbidden = [
            /finalRecovery[LR]\.material\./,
            /finalChargeCradle[LR]\.material\./,
            /secondPitFunnel[LR]\.material\./,
            /secondPitStage[LR]\.material\./
          ];
          const hits = forbidden.filter(r => r.test(src));
          if (hits.length) {
            console.error('Unsafe modeled Group.material access returned:', hits.map(String).join(', '));
            process.exit(1);
          }
          for (const target of ['finalRecoveryL','finalRecoveryR','finalChargeCradleL','finalChargeCradleR','secondPitFunnelL','secondPitFunnelR']) {
            if (!src.includes(target)) {
              console.error(`Expected modeled runtime target missing: ${target}`);
              process.exit(1);
            }
          }
          if (!src.includes('setEmissiveIntensityDeep(o,')) {
            console.error('Deep emissive helper is not wired into live runtime updates');
            process.exit(1);
          }
          console.log('modeled Group runtime material safety contract: PASS');
          NODE

      - name: Verify browser module parses
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src = Path('index.html').read_text()
          start = src.index('<script type="module">') + len('<script type="module">')
          end = src.rindex('</script>')
          Path('/tmp/brainrot-module.mjs').write_text(src[start:end])
          PY
          node --check /tmp/brainrot-module.mjs

      - name: Verify lift carry route
        run: node scripts/lift-route-continuity-check.mjs

      - name: Verify first sweeper approach
        run: node scripts/first-sweeper-approach-check.mjs

      - name: Verify first sweeper cycle
        run: node scripts/first-sweeper-cycle-check.mjs

      - name: Verify first sweeper timing gate
        run: node scripts/first-sweeper-timing-gate-check.mjs

      - name: Verify first sweeper crossing latch
        run: node scripts/first-sweeper-gate-crossing-latch-check.mjs

      - name: Verify first sweeper post-gate grace
        run: node scripts/first-sweeper-postgate-grace-check.mjs

      - name: Verify first sweeper staging shield
        run: node scripts/first-sweeper-staging-shield-check.mjs

      - name: Verify second pit approach corridor
        run: node scripts/second-pit-approach-corridor-check.mjs

      - name: Verify second pit boarding hold
        run: node scripts/second-pit-boarding-hold-check.mjs

      - name: Verify second pit carry window
        run: node scripts/second-pit-carry-window-check.mjs

      - name: Verify second pit moving-platform motion v71
        run: node scripts/second-pit-platform-motion-v71-check.mjs

      - name: Verify second pit checkpoint funnel
        run: node scripts/second-pit-checkpoint-funnel-check.mjs

      - name: Verify second pit full-route continuity v70
        run: node scripts/second-pit-route-continuity-v70-check.mjs

      - name: Verify final puncher swept physics
        run: node scripts/final-puncher-physics-contract-v65.mjs

      - name: Verify final midpoint carry-safe pocket
        run: node scripts/final-mid-pocket-v67-check.mjs

      - name: Verify final finish charge
        run: node scripts/final-finish-charge-check.mjs

      - name: Verify final residual momentum damping
        run: node scripts/final-finish-residual-momentum-check.mjs

      - name: Verify final soft hold
        run: node scripts/final-finish-soft-hold-check.mjs
