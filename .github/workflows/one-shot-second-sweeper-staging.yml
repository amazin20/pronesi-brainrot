name: One-shot second sweeper staging gate
on:
  push:
    branches: [new-player-glb-overhaul]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-player-glb-overhaul
          fetch-depth: 0
      - name: Patch second sweeper staging and timing gate
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="SECOND_SWEEPER_CYCLE=3.0,SECOND_SWEEPER_WARN=.66,SECOND_SWEEPER_BURST=1.12,SECOND_SWEEPER_SPEED=2.45,SECOND_SWEEPER_CLEAR_Z=3.18;"
          new="SECOND_SWEEPER_CYCLE=3.0,SECOND_SWEEPER_WARN=.66,SECOND_SWEEPER_BURST=1.12,SECOND_SWEEPER_SPEED=2.45,SECOND_SWEEPER_CLEAR_Z=3.18,SECOND_SWEEPER_GATE_Z=-.48,SECOND_SWEEPER_GATE_HALF_X=1.72,SECOND_SWEEPER_GATE_CLOSED_Y=.62,SECOND_SWEEPER_GATE_OPEN_Y=2.82,SECOND_SWEEPER_GATE_HALF_Y=.11;"
          assert old in s, 'second sweeper constants anchor missing'
          s=s.replace(old,new,1)
          old="[firstSweeperRecoveryPad,firstSweeperRecoveryL,firstSweeperRecoveryR].forEach(o=>{o.material.emissive=new THREE.Color(0x159b43);o.material.emissiveIntensity=.5});"
          new=old+"const secondSweeperStagePad=box(0,.035,-1.05,3.8,.07,1.58,0xffd84d),secondSweeperGateL=box(-1.88,.88,SECOND_SWEEPER_GATE_Z,.16,1.76,.16,0xffb12b),secondSweeperGateR=box(1.88,.88,SECOND_SWEEPER_GATE_Z,.16,1.76,.16,0xffb12b),secondSweeperGate=box(0,SECOND_SWEEPER_GATE_CLOSED_Y,SECOND_SWEEPER_GATE_Z,SECOND_SWEEPER_GATE_HALF_X*2,.22,.22,0xff315d);[secondSweeperStagePad,secondSweeperGateL,secondSweeperGateR,secondSweeperGate].forEach(o=>{o.material.emissive=new THREE.Color(o===secondSweeperGate?0xa20d38:0xb86a00);o.material.emissiveIntensity=.82});"
          assert old in s, 'recovery visual anchor missing'
          s=s.replace(old,new,1)
          old="firstSweeperPostGateGrace=0,secondSweeperCleared=false,secondPitBoarding=false"
          new="firstSweeperPostGateGrace=0,secondSweeperCleared=false,secondSweeperGateCrossing=false,secondPitBoarding=false"
          assert old in s, 'state anchor missing'
          s=s.replace(old,new,1)
          old="function firstSweeperTimingGateBlocks(x,z,r=.4,top=LIFT_GATE_PLAYER_TOP){const overlaps=Math.abs(z-FIRST_SWEEPER_GATE_Z)<.18+r*.35&&Math.abs(x)<FIRST_SWEEPER_GATE_HALF_X+r,barBottom=firstSweeperGate.position.y-FIRST_SWEEPER_GATE_HALF_Y;return overlaps&&barBottom<top}function liftSafetyGateBlocks"
          new="function firstSweeperTimingGateBlocks(x,z,r=.4,top=LIFT_GATE_PLAYER_TOP){const overlaps=Math.abs(z-FIRST_SWEEPER_GATE_Z)<.18+r*.35&&Math.abs(x)<FIRST_SWEEPER_GATE_HALF_X+r,barBottom=firstSweeperGate.position.y-FIRST_SWEEPER_GATE_HALF_Y;return overlaps&&barBottom<top}function secondSweeperTimingGateBlocks(x,z,r=.4,top=LIFT_GATE_PLAYER_TOP){const overlaps=Math.abs(z-SECOND_SWEEPER_GATE_Z)<.18+r*.35&&Math.abs(x)<SECOND_SWEEPER_GATE_HALF_X+r,barBottom=secondSweeperGate.position.y-SECOND_SWEEPER_GATE_HALF_Y;return overlaps&&barBottom<top}function liftSafetyGateBlocks"
          assert old in s, 'gate blocker anchor missing'
          s=s.replace(old,new,1)
          old="if(firstSweeperTimingGateBlocks(x,z,.4))return true;if(liftSafetyGateBlocks"
          new="if(firstSweeperTimingGateBlocks(x,z,.4))return true;if(secondSweeperTimingGateBlocks(x,z,.4))return true;if(liftSafetyGateBlocks"
          assert old in s, 'player collision anchor missing'
          s=s.replace(old,new,1)
          old="if(firstSweeperTimingGateBlocks(x,z,r,LIFT_GATE_BRAIN_TOP))return true;if(liftSafetyGateBlocks"
          new="if(firstSweeperTimingGateBlocks(x,z,r,LIFT_GATE_BRAIN_TOP))return true;if(secondSweeperTimingGateBlocks(x,z,r,LIFT_GATE_BRAIN_TOP))return true;if(liftSafetyGateBlocks"
          assert old in s, 'brain collision anchor missing'
          s=s.replace(old,new,1)
          old="secondSweeperCleared=false;checkpointPlayerLatched=false"
          new="secondSweeperCleared=false;secondSweeperGateCrossing=false;secondSweeperGate.position.y=SECOND_SWEEPER_GATE_CLOSED_Y;checkpointPlayerLatched=false"
          assert old in s, 'reset anchor missing'
          s=s.replace(old,new,1)
          old="secondArm.material.emissiveIntensity=secondSweeperCleared?1.05:(secondActive?1.4:(secondWarning?.9+.55*(.5+.5*Math.sin(t*20)):(secondSafe?.75:0)));sweeps.forEach"
          new="secondArm.material.emissiveIntensity=secondSweeperCleared?1.05:(secondActive?1.4:(secondWarning?.9+.55*(.5+.5*Math.sin(t*20)):(secondSafe?.75:0)));const secondGateSensor=(Math.abs(p.z-SECOND_SWEEPER_GATE_Z)<.52&&Math.abs(p.x)<SECOND_SWEEPER_GATE_HALF_X+.42)||(Math.abs(bp.z-SECOND_SWEEPER_GATE_Z)<.52&&Math.abs(bp.x)<SECOND_SWEEPER_GATE_HALF_X+.42);if(!secondSweeperGateCrossing&&(secondSafe||secondSweeperCleared)&&secondGateSensor)secondSweeperGateCrossing=true;if(secondSweeperGateCrossing&&p.z>SECOND_SWEEPER_GATE_Z+.74&&bp.z>SECOND_SWEEPER_GATE_Z+.74)secondSweeperGateCrossing=false;const secondGateOpen=secondSafe||secondSweeperCleared||secondSweeperGateCrossing||secondGateSensor,secondGateTarget=secondGateOpen?SECOND_SWEEPER_GATE_OPEN_Y:SECOND_SWEEPER_GATE_CLOSED_Y,secondGateStep=5.4*dt;secondSweeperGate.position.y+=Math.max(-secondGateStep,Math.min(secondGateStep,secondGateTarget-secondSweeperGate.position.y));const secondGatePulse=.5+.5*Math.sin(t*15),secondGateColor=secondSweeperCleared?0x49ff79:(secondGateOpen?0x49ff79:(secondActive?0xff315d:0xffb12b));secondSweeperGate.material.color.setHex(secondGateColor);secondSweeperGate.material.emissive.setHex(secondGateOpen?0x149343:(secondActive?0xa20d38:0xb86a00));secondSweeperGate.material.emissiveIntensity=secondGateOpen?1.35:.9+.75*secondGatePulse;[secondSweeperGateL,secondSweeperGateR].forEach(o=>{o.material.color.setHex(secondGateColor);o.material.emissive.setHex(secondGateOpen?0x149343:0xb86a00);o.material.emissiveIntensity=secondGateOpen?1.05:.72+.45*secondGatePulse});secondSweeperStagePad.material.color.setHex(secondSweeperCleared?0x49ff79:(secondSafe?0x49ff79:(secondActive?0xff315d:0xffd84d)));secondSweeperStagePad.material.emissive.setHex(secondSweeperCleared||secondSafe?0x149343:(secondActive?0xa20d38:0xa95a00));secondSweeperStagePad.material.emissiveIntensity=(secondGateSensor||secondSweeperGateCrossing)?1.25+.5*secondGatePulse:.72;if(!secondSweeperCleared&&!win&&failTimer<=0&&Math.abs(p.z-SECOND_SWEEPER_GATE_Z)<1.15)state.textContent=secondGateOpen?'SWEEPER 2 · ЗЕЛЁНЫЕ ВОРОТА · ПРОХОДИ':(secondActive?'SWEEPER 2 · УДАР · ЖДИ':'SWEEPER 2 · ПРИГОТОВЬСЯ');sweeps.forEach"
          assert old in s, 'second sweeper phase anchor missing'
          s=s.replace(old,new,1)
          s=s.replace('full 3D lift route v41 · sweeper recovery lane','full 3D lift route v42 · sweeper 2 timing gate',1)
          p.write_text(s)
          PY
      - name: Verify runtime syntax and gameplay invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          required=[
            'SECOND_SWEEPER_GATE_Z=-.48',
            'function secondSweeperTimingGateBlocks',
            'secondSweeperGateCrossing',
            "SWEEPER 2 · ЗЕЛЁНЫЕ ВОРОТА · ПРОХОДИ",
            'if(secondSweeperTimingGateBlocks(x,z,.4))return true',
            'if(secondSweeperTimingGateBlocks(x,z,r,LIFT_GATE_BRAIN_TOP))return true'
          ]
          for x in required: assert x in s, x
          assert s.count('const secondSweeperStagePad=')==1
          a=s.index('<script type="module">')+len('<script type="module">')
          b=s.rindex('</script>')
          Path('/tmp/runtime.mjs').write_text(s[a:b])
          print('second sweeper staging/timing gate invariants PASS')
          PY
          node --check /tmp/runtime.mjs
      - name: Commit gameplay patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add timing gate before second sweeper'
          git push origin HEAD:new-player-glb-overhaul
