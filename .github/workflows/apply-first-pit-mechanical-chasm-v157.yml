name: Apply First Pit Mechanical Chasm v157

on:
  push:
    branches: [new-player-glb-overhaul]
    paths:
      - .github/workflows/apply-first-pit-mechanical-chasm-v157.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-player-glb-overhaul
          fetch-depth: 0
      - name: Refuse stale/non-linear apply
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin new-player-glb-overhaul
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/new-player-glb-overhaul)"
      - name: Build first pit mechanical chasm v157
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          if 'FIRST_PIT_MECHANICAL_CHASM_MODEL_V157=true' in s:
              raise SystemExit('v157 already present')
          anchor='const SECOND_SWEEPER_STAGING_PAD_MODEL_V129=true;'
          if s.count(anchor) != 1:
              raise SystemExit(f'v157 anchor count={s.count(anchor)}')
          model="""const FIRST_PIT_MECHANICAL_CHASM_MODEL_V157=true,FIRST_PIT_CHASM_Z_MIN=-4.85,FIRST_PIT_CHASM_Z_MAX=-3.55;const firstPitMechanicalChasmV157=new THREE.Group();firstPitMechanicalChasmV157.name='FirstPitMechanicalChasmAssemblyV157';scene.add(firstPitMechanicalChasmV157);const fpmcDarkV157=mat(0x121827),fpmcSteelV157=mat(0xdff7ff),fpmcAmberV157=mat(0xffb12b),fpmcRedV157=mat(0xff315d),fpmcCyanV157=mat(0x45e8ff),fpmcGreenV157=mat(0x49ff79);fpmcDarkV157.metalness=.68;fpmcDarkV157.roughness=.24;fpmcSteelV157.metalness=.52;fpmcSteelV157.roughness=.18;const firstPitChasmDrumsV157=[],firstPitChasmJawsV157=[],firstPitChasmLampsV157=[];[FIRST_PIT_CHASM_Z_MIN,FIRST_PIT_CHASM_Z_MAX].forEach((z,edge)=>{const edgeGroup=new THREE.Group();edgeGroup.name=edge===0?'FirstPitEntryEdgeMachineV157':'FirstPitLandingEdgeMachineV157';edgeGroup.position.set(0,0,z);firstPitMechanicalChasmV157.add(edgeGroup);const beam=new THREE.Mesh(new THREE.BoxGeometry(3.34,.18,.28),fpmcDarkV157);beam.name='FirstPitChasmEdgeBeamV157';beam.position.set(0,.08,0);beam.castShadow=beam.receiveShadow=true;edgeGroup.add(beam);[-1.38,-.92,-.46,0,.46,.92,1.38].forEach((x,i)=>{const tooth=new THREE.Mesh(new THREE.BoxGeometry(.28,.12,.30),i===3?fpmcSteelV157:(edge?fpmcGreenV157:fpmcAmberV157));tooth.name='FirstPitChasmEdgeToothV157';tooth.position.set(x,.20,edge===0?.02:-.02);tooth.rotation.x=edge===0?-.18:.18;tooth.castShadow=tooth.receiveShadow=true;tooth.material.emissive=new THREE.Color(i===3?0x4b6d83:(edge?0x159b43:0xa95a00));tooth.material.emissiveIntensity=i===3?.40:.68;edgeGroup.add(tooth)});[-1,1].forEach((side,si)=>{const tower=new THREE.Mesh(new THREE.BoxGeometry(.34,1.72,.42),fpmcDarkV157);tower.name='FirstPitChasmEdgeTowerV157';tower.position.set(side*1.70,.88,0);tower.castShadow=tower.receiveShadow=true;edgeGroup.add(tower);[.30,.78,1.30].forEach((y,k)=>{const collar=new THREE.Mesh(new THREE.TorusGeometry(.18,.04,7,14),k===1?fpmcSteelV157:(edge?fpmcGreenV157:fpmcAmberV157));collar.name='FirstPitChasmTowerCollarV157';collar.rotation.x=Math.PI/2;collar.position.set(side*1.70,y,0);collar.castShadow=true;collar.material.emissive=new THREE.Color(k===1?0x4b6d83:(edge?0x159b43:0xa95a00));collar.material.emissiveIntensity=.72;edgeGroup.add(collar)});const drum=new THREE.Mesh(new THREE.CylinderGeometry(.18,.18,.48,12),edge?fpmcGreenV157:fpmcAmberV157);drum.name='FirstPitChasmDriveDrumV157';drum.rotation.z=Math.PI/2;drum.position.set(side*1.42,.46,edge===0?.16:-.16);drum.castShadow=drum.receiveShadow=true;drum.material.emissive=new THREE.Color(edge?0x159b43:0xa95a00);drum.material.emissiveIntensity=.74;drum.onBeforeRender=()=>{const u=performance.now()*.001;drum.rotation.x=u*(edge?3.6:-4.1)*(si?1:-1);drum.material.emissiveIntensity=.58+.36*(.5+.5*Math.sin(u*8.5+si+edge))};edgeGroup.add(drum);firstPitChasmDrumsV157.push(drum);const jawPivot=new THREE.Group();jawPivot.name='FirstPitChasmJawPivotV157';jawPivot.position.set(side*1.45,.92,edge===0?.04:-.04);const jaw=new THREE.Mesh(new THREE.BoxGeometry(.82,.16,.34),edge?fpmcCyanV157:fpmcRedV157);jaw.name='FirstPitChasmSafetyJawV157';jaw.position.set(-side*.37,0,0);jaw.castShadow=jaw.receiveShadow=true;jaw.material.emissive=new THREE.Color(edge?0x087fa8:0xa20d38);jaw.material.emissiveIntensity=.62;jaw.onBeforeRender=()=>{const u=performance.now()*.001,p=.5+.5*Math.sin(u*1.85+si*Math.PI+edge*.8);jawPivot.rotation.z=side*((edge?-.08:.10)+(edge?-.16:.18)*p);jaw.material.emissiveIntensity=.48+.46*p};jawPivot.add(jaw);edgeGroup.add(jawPivot);firstPitChasmJawsV157.push(jawPivot);const lamp=new THREE.Mesh(new THREE.OctahedronGeometry(.12,0),edge?fpmcGreenV157:fpmcRedV157);lamp.name='FirstPitChasmStatusLampV157';lamp.position.set(side*1.70,1.82,0);lamp.castShadow=true;lamp.material.emissive=new THREE.Color(edge?0x159b43:0xa20d38);lamp.material.emissiveIntensity=1.05;lamp.onBeforeRender=()=>{const u=performance.now()*.001;lamp.material.emissiveIntensity=.66+.72*(.5+.5*Math.sin(u*(edge?7.4:11.2)+si*Math.PI))};edgeGroup.add(lamp);firstPitChasmLampsV157.push(lamp)});const header=new THREE.Mesh(new THREE.BoxGeometry(3.72,.20,.38),fpmcDarkV157);header.name='FirstPitChasmEdgeHeaderV157';header.position.set(0,1.84,0);header.castShadow=header.receiveShadow=true;edgeGroup.add(header);[-1.10,-.55,0,.55,1.10].forEach((x,i)=>{const marker=new THREE.Mesh(new THREE.OctahedronGeometry(.085,0),i===2?fpmcSteelV157:(edge?fpmcGreenV157:fpmcAmberV157));marker.name='FirstPitChasmHeaderMarkerV157';marker.position.set(x,1.85,edge===0?.22:-.22);marker.castShadow=true;marker.material.emissive=new THREE.Color(i===2?0x4b6d83:(edge?0x159b43:0xa95a00));marker.material.emissiveIntensity=.88;marker.onBeforeRender=()=>{const u=performance.now()*.001;marker.material.emissiveIntensity=.56+.52*(.5+.5*Math.sin(u*7.8+i+edge))};edgeGroup.add(marker)})});[-1.58,1.58].forEach((x,side)=>{const rail=new THREE.Mesh(new THREE.BoxGeometry(.18,.22,FIRST_PIT_CHASM_Z_MAX-FIRST_PIT_CHASM_Z_MIN+.28),fpmcDarkV157);rail.name='FirstPitChasmSideRailV157';rail.position.set(x,.12,(FIRST_PIT_CHASM_Z_MIN+FIRST_PIT_CHASM_Z_MAX)*.5);rail.castShadow=rail.receiveShadow=true;firstPitMechanicalChasmV157.add(rail);[FIRST_PIT_CHASM_Z_MIN+.18,(FIRST_PIT_CHASM_Z_MIN+FIRST_PIT_CHASM_Z_MAX)*.5,FIRST_PIT_CHASM_Z_MAX-.18].forEach((z,k)=>{const roller=new THREE.Mesh(new THREE.CylinderGeometry(.095,.095,.24,10),k===1?fpmcCyanV157:fpmcSteelV157);roller.name='FirstPitChasmSideGuideRollerV157';roller.rotation.z=Math.PI/2;roller.position.set(x,.27,z);roller.castShadow=roller.receiveShadow=true;roller.material.emissive=new THREE.Color(k===1?0x087fa8:0x4b6d83);roller.material.emissiveIntensity=.68;roller.onBeforeRender=()=>{const u=performance.now()*.001;roller.rotation.x=u*(3.8+k*.5)*(side?1:-1)};firstPitMechanicalChasmV157.add(roller)})});[-1.04,0,1.04].forEach((x,i)=>{const shaft=new THREE.Mesh(new THREE.BoxGeometry(.16,.90,.16),fpmcDarkV157);shaft.name='FirstPitChasmDepthStrutV157';shaft.position.set(x,-.46,(FIRST_PIT_CHASM_Z_MIN+FIRST_PIT_CHASM_Z_MAX)*.5);shaft.castShadow=shaft.receiveShadow=true;firstPitMechanicalChasmV157.add(shaft);const ring=new THREE.Mesh(new THREE.TorusGeometry(.17,.035,7,14),i===1?fpmcRedV157:fpmcCyanV157);ring.name='FirstPitChasmDepthRingV157';ring.rotation.x=Math.PI/2;ring.position.set(x,-.76,(FIRST_PIT_CHASM_Z_MIN+FIRST_PIT_CHASM_Z_MAX)*.5);ring.castShadow=true;ring.material.emissive=new THREE.Color(i===1?0xa20d38:0x087fa8);ring.material.emissiveIntensity=.78;ring.onBeforeRender=()=>{const u=performance.now()*.001;ring.rotation.z=u*(i===1?-1.8:1.25);ring.material.emissiveIntensity=.54+.54*(.5+.5*Math.sin(u*6.4+i))};firstPitMechanicalChasmV157.add(ring)});"""
          s=s.replace(anchor,model+anchor,1)
          p.write_text(s)
      - name: Verify v157 and preserved pit geometry
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          required=['FIRST_PIT_MECHANICAL_CHASM_MODEL_V157=true','FIRST_PIT_CHASM_Z_MIN=-4.85','FIRST_PIT_CHASM_Z_MAX=-3.55','FirstPitMechanicalChasmAssemblyV157','FirstPitEntryEdgeMachineV157','FirstPitLandingEdgeMachineV157','FirstPitChasmEdgeBeamV157','FirstPitChasmEdgeTowerV157','FirstPitChasmDriveDrumV157','FirstPitChasmSafetyJawV157','FirstPitChasmSideRailV157','FirstPitChasmSideGuideRollerV157','FirstPitChasmDepthStrutV157','FirstPitChasmDepthRingV157',"PITS=[[-15.2,-13.55],[-4.85,-3.55],[5.05,5.82]]",'FIRST_PIT_WARNING_GANTRY_MODEL_V156=true','FIRST_PIT_EXIT_LANDING_MODEL_V133=true','onBeforeRender']
          for token in required: assert token in s, token
          assert s.count('FIRST_PIT_MECHANICAL_CHASM_MODEL_V157=true') == 1
          assert s.count("name='FirstPitMechanicalChasmAssemblyV157'") == 1
          assert 'PITS=[[-15.2,-13.55],[-4.85,-3.55],[5.05,5.82]]' in s
          m=re.search(r'<script type="module">(.*?)</script>',s,re.S)
          assert m, 'module script missing'
          Path('/tmp/brainrot-module.mjs').write_text(m.group(1))
          print('First pit mechanical chasm v157 contract: SUCCESS')
          PY
          node --check /tmp/brainrot-module.mjs
          node scripts/final-puncher-physics-contract-v65.mjs
          node scripts/final-finish-residual-momentum-check.mjs
          node scripts/final-finish-soft-hold-check.mjs
          node scripts/final-finish-charge-check.mjs
          if [ -f scripts/second-pit-full-route-continuity-v70.mjs ]; then node scripts/second-pit-full-route-continuity-v70.mjs; fi
      - name: Commit real level change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "openai-level-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && { echo 'No gameplay change produced'; exit 1; }
          git commit -m "Level: mechanical first pit chasm v157"
          git push origin HEAD:new-player-glb-overhaul
