name: One-shot checkpoint gate v75
on:
  push:
    branches: [new-player-glb-overhaul]
    paths: [.github/workflows/one-shot-checkpoint-gate-v75.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-player-glb-overhaul
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Model checkpoint gate v75
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="""const checkpointL=box(-3.25,1.35,CHECKPOINT_Z,.2,2.55,.2,0x30d9ff),checkpointR=box(3.25,1.35,CHECKPOINT_Z,.2,2.55,.2,0x30d9ff),checkpointTop=box(0,2.55,CHECKPOINT_Z,6.7,.2,.2,0x30d9ff);[checkpointL,checkpointR,checkpointTop].forEach(o=>{o.material.emissive=new THREE.Color(0x0b6f9f);o.material.emissiveIntensity=.65});"""
          new="""const CHECKPOINT_GATE_MODEL_V75=true;function makeCheckpointGatePost(side){const post=new THREE.Mesh(new THREE.CapsuleGeometry(.13,2.29,5,10),mat(0x30d9ff));post.name='CheckpointGatePostV75';post.position.set(side*3.25,1.35,CHECKPOINT_Z);post.castShadow=post.receiveShadow=true;post.material.emissive=new THREE.Color(0x0b6f9f);post.material.emissiveIntensity=.65;[-.72,.72].forEach(y=>{const collar=new THREE.Mesh(new THREE.TorusGeometry(.19,.045,6,12),mat(0xb9f4ff));collar.name='CheckpointGateCollarV75';collar.rotation.x=Math.PI/2;collar.position.y=y;collar.castShadow=true;post.add(collar)});const foot=new THREE.Mesh(new THREE.CylinderGeometry(.24,.31,.18,10),mat(0x173a5a));foot.name='CheckpointGateFootV75';foot.position.y=-1.22;foot.castShadow=foot.receiveShadow=true;post.add(foot);scene.add(post);return post}const checkpointL=makeCheckpointGatePost(-1),checkpointR=makeCheckpointGatePost(1);const checkpointTop=new THREE.Mesh(new THREE.CapsuleGeometry(.13,6.44,5,10),mat(0x30d9ff));checkpointTop.name='CheckpointGateTopV75';checkpointTop.rotation.z=Math.PI/2;checkpointTop.position.set(0,2.55,CHECKPOINT_Z);checkpointTop.castShadow=checkpointTop.receiveShadow=true;checkpointTop.material.emissive=new THREE.Color(0x0b6f9f);checkpointTop.material.emissiveIntensity=.65;[-2.35,0,2.35].forEach(x=>{const beacon=new THREE.Mesh(new THREE.TorusGeometry(.16,.04,6,12),mat(0xdffbff));beacon.name='CheckpointGateBeaconV75';beacon.rotation.y=Math.PI/2;beacon.position.set(0,x,0);beacon.castShadow=true;beacon.material.emissive=new THREE.Color(0x30d9ff);beacon.material.emissiveIntensity=.8;checkpointTop.add(beacon)});scene.add(checkpointTop);"""
          if old not in s:
              raise SystemExit('checkpoint gate v74 source block not found')
          s=s.replace(old,new,1)
          s=s.replace('full 3D lift route v74 · modeled checkpoint capture corridor','full 3D lift route v75 · modeled checkpoint gate',1)
          p.write_text(s)
      - name: Check modeled checkpoint gate invariants
        shell: python
        run: |
          from pathlib import Path
          s=Path('index.html').read_text()
          required=['CHECKPOINT_GATE_MODEL_V75=true','CheckpointGatePostV75','CheckpointGateCollarV75','CheckpointGateFootV75','CheckpointGateTopV75','CheckpointGateBeaconV75','new THREE.CapsuleGeometry(.13,2.29','new THREE.CapsuleGeometry(.13,6.44']
          missing=[x for x in required if x not in s]
          assert not missing, missing
          assert 'checkpointL=box(-3.25,1.35,CHECKPOINT_Z' not in s
          assert 'checkpointTop=box(0,2.55,CHECKPOINT_Z' not in s
          print('CHECKPOINT_GATE_MODEL_V75 PASS')
      - name: Syntax check browser module
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          m=re.search(r'<script type="module">(.*)</script>',s,re.S)
          assert m
          Path('/tmp/runtime.mjs').write_text(m.group(1))
          PY
          node --check /tmp/runtime.mjs
      - name: Existing second-pit contracts
        run: |
          node scripts/second-pit-route-continuity-v70.mjs
          node scripts/second-pit-platform-motion-v71.mjs
      - name: Existing final puncher physics contract
        run: node scripts/final-puncher-physics-contract-v65.mjs
      - name: Diff check
        run: git diff --check
      - name: Commit gameplay change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Model checkpoint gate as 3D assembly v75'
          git push origin HEAD:new-player-glb-overhaul
