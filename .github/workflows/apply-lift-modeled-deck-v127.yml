name: Apply Lift Modeled Deck v127

on:
  push:
    branches: [new-player-glb-overhaul]
    paths:
      - .github/workflows/apply-lift-modeled-deck-v127.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-player-glb-overhaul
          fetch-depth: 0
      - name: Refuse stale/non-linear apply
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin new-player-glb-overhaul
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/new-player-glb-overhaul)"
      - name: Model lift deck and docks v127
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          if 'LIFT_MODELED_DECK_V127=true' in s:
              raise SystemExit('v127 already present')
          old="const liftPlatform=box(0,LIFT_BASE_Y,LIFT_Z,LIFT_HALF_X*2,.24,LIFT_HALF_Z*2,0x9a6cff);liftPlatform.material.emissive=new THREE.Color(0x4724b8);liftPlatform.material.emissiveIntensity=.82;const liftDocks=[PITS[0][0]+LIFT_DOCK_DEPTH*.5,PITS[0][1]-LIFT_DOCK_DEPTH*.5].map((z,i)=>{const d=box(0,-.08,z,LIFT_DOCK_HALF_X*2,.16,LIFT_DOCK_DEPTH,0x2de6ff);d.material.emissive=new THREE.Color(i?0x17c85b:0x118bb6);d.material.emissiveIntensity=1.05;const stripe=box(0,.012,z,2.65,.024,LIFT_DOCK_DEPTH*.72,i?0x49ff79:0xffffff);stripe.material.emissive=new THREE.Color(i?0x19b24e:0x45f4ff);stripe.material.emissiveIntensity=1.35;return d});const liftStripe=box(0,LIFT_BASE_Y+.135,LIFT_Z,2.2,.035,.68,0xffffff);liftStripe.material.emissive=new THREE.Color(0xb99cff);liftStripe.material.emissiveIntensity=1.2;"
          if old not in s:
              raise SystemExit('legacy lift deck anchor missing')
          new="""const LIFT_MODELED_DECK_V127=true;const liftPlatform=box(0,LIFT_BASE_Y,LIFT_Z,LIFT_HALF_X*2,.24,LIFT_HALF_Z*2,0x9a6cff);liftPlatform.name='LiftLegacyCollisionCarrierV127';liftPlatform.material.transparent=true;liftPlatform.material.opacity=.045;liftPlatform.material.depthWrite=false;liftPlatform.material.emissive=new THREE.Color(0x4724b8);liftPlatform.material.emissiveIntensity=.28;const liftDeckPurpleV127=mat(0x9a6cff),liftDeckDarkV127=mat(0x202642),liftDeckWhiteV127=mat(0xf7f3ff),liftDeckCyanV127=mat(0x45f4ff),liftDeckGreenV127=mat(0x49ff79);liftDeckPurpleV127.metalness=.34;liftDeckPurpleV127.roughness=.26;liftDeckDarkV127.metalness=.52;liftDeckDarkV127.roughness=.30;const liftDeckSlatGeoV127=new THREE.BoxGeometry(.42,.075,1.56),liftDeckRailGeoV127=new THREE.CapsuleGeometry(.045,1.44,4,8),liftDeckBumperGeoV127=new THREE.CylinderGeometry(.12,.17,.30,8),liftDeckRingGeoV127=new THREE.TorusGeometry(.14,.03,6,10),liftDeckBraceGeoV127=new THREE.CylinderGeometry(.045,.065,1.48,8);[-1.30,-.87,-.44,0,.44,.87,1.30].forEach((x,i)=>{const slat=new THREE.Mesh(liftDeckSlatGeoV127,i===3?liftDeckWhiteV127:liftDeckPurpleV127);slat.name='LiftDeckSlatV127';slat.position.set(x,.145,0);slat.castShadow=slat.receiveShadow=true;slat.material.emissive=new THREE.Color(i===3?0xffffff:0x4724b8);slat.material.emissiveIntensity=i===3?.68:.42;liftPlatform.add(slat)});[-.78,.78].forEach((z,i)=>{const rail=new THREE.Mesh(liftDeckRailGeoV127,liftDeckCyanV127);rail.name='LiftDeckEdgeRailV127';rail.rotation.x=Math.PI/2;rail.position.set(0,.28,z);rail.castShadow=rail.receiveShadow=true;rail.material.emissive=new THREE.Color(i?0x49ff79:0x45f4ff);rail.material.emissiveIntensity=.78;liftPlatform.add(rail)});[-1.46,1.46].forEach((x,i)=>{const bumper=new THREE.Mesh(liftDeckBumperGeoV127,liftDeckDarkV127);bumper.name='LiftDeckBumperV127';bumper.rotation.z=Math.PI/2;bumper.position.set(x,.13,0);bumper.castShadow=bumper.receiveShadow=true;liftPlatform.add(bumper);const ring=new THREE.Mesh(liftDeckRingGeoV127,i?liftDeckGreenV127:liftDeckCyanV127);ring.name='LiftDeckBeaconRingV127';ring.rotation.y=Math.PI/2;ring.position.set(x,.18,0);ring.castShadow=true;ring.material.emissive=new THREE.Color(i?0x19b24e:0x118bb6);ring.material.emissiveIntensity=1.05;liftPlatform.add(ring)});[-.72,0,.72].forEach((x,i)=>{const brace=new THREE.Mesh(liftDeckBraceGeoV127,liftDeckDarkV127);brace.name='LiftDeckCrossBraceV127';brace.rotation.x=Math.PI/2;brace.position.set(x,.03,0);brace.castShadow=brace.receiveShadow=true;liftPlatform.add(brace);const node=new THREE.Mesh(liftDeckRingGeoV127,liftDeckWhiteV127);node.name='LiftDeckGuideRingV127';node.rotation.x=Math.PI/2;node.position.set(x,.21,0);node.castShadow=true;node.material.emissive=new THREE.Color(i===1?0xffffff:0xb99cff);node.material.emissiveIntensity=i===1?1.0:.72;liftPlatform.add(node)});const liftDocks=[PITS[0][0]+LIFT_DOCK_DEPTH*.5,PITS[0][1]-LIFT_DOCK_DEPTH*.5].map((z,i)=>{const d=box(0,-.08,z,LIFT_DOCK_HALF_X*2,.16,LIFT_DOCK_DEPTH,0x2de6ff);d.name='LiftDockLegacyCollisionCarrierV127';d.material.transparent=true;d.material.opacity=.045;d.material.depthWrite=false;d.material.emissive=new THREE.Color(i?0x17c85b:0x118bb6);d.material.emissiveIntensity=.24;const accent=i?liftDeckGreenV127:liftDeckCyanV127;[-1.34,-.67,0,.67,1.34].forEach((x,k)=>{const plate=new THREE.Mesh(new THREE.BoxGeometry(.48,.055,.25),k===2?liftDeckWhiteV127:accent);plate.name='LiftDockArmorPlateV127';plate.position.set(x,.105,0);plate.castShadow=plate.receiveShadow=true;plate.material.emissive=new THREE.Color(k===2?0xffffff:(i?0x19b24e:0x118bb6));plate.material.emissiveIntensity=k===2?.76:.48;d.add(plate)});[-1.58,1.58].forEach((x,k)=>{const clamp=new THREE.Mesh(new THREE.CylinderGeometry(.11,.15,.24,8),liftDeckDarkV127);clamp.name='LiftDockClampV127';clamp.rotation.z=Math.PI/2;clamp.position.set(x,.08,0);clamp.castShadow=clamp.receiveShadow=true;d.add(clamp);const beacon=new THREE.Mesh(liftDeckRingGeoV127,accent);beacon.name='LiftDockBeaconV127';beacon.rotation.y=Math.PI/2;beacon.position.set(x,.11,0);beacon.castShadow=true;beacon.material.emissive=new THREE.Color(i?0x19b24e:0x45f4ff);beacon.material.emissiveIntensity=1.0;d.add(beacon)});return d});const liftStripe=box(0,LIFT_BASE_Y+.135,LIFT_Z,2.2,.035,.68,0xffffff);liftStripe.name='LiftLegacyStripeCarrierV127';liftStripe.material.transparent=true;liftStripe.material.opacity=.03;liftStripe.material.depthWrite=false;liftStripe.material.emissive=new THREE.Color(0xb99cff);liftStripe.material.emissiveIntensity=.22;"""
          s=s.replace(old,new,1)
          p.write_text(s)
      - name: Verify modeled lift deck v127 and preserved gameplay
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          required=[
            'LIFT_MODELED_DECK_V127=true',
            'LiftLegacyCollisionCarrierV127',
            'LiftDeckSlatV127',
            'LiftDeckEdgeRailV127',
            'LiftDeckBumperV127',
            'LiftDeckBeaconRingV127',
            'LiftDeckCrossBraceV127',
            'LiftDeckGuideRingV127',
            'LiftDockLegacyCollisionCarrierV127',
            'LiftDockArmorPlateV127',
            'LiftDockClampV127',
            'LiftDockBeaconV127',
            'const LIFT_BASE_Y=-.04,LIFT_TRAVEL_Y=1.65',
            'function moveLiftPlatform(t,dt)',
            'liftPlatform.position.y=newY',
            'onLiftPlatform(x,y,z,brain=false)',
            'SIDE_WALL_MODULES_V126=true'
          ]
          for token in required:
              assert token in s, token
          assert s.count('LIFT_MODELED_DECK_V127=true') == 1
          assert s.count("name='LiftLegacyCollisionCarrierV127'") == 1
          assert s.count("name='LiftDockLegacyCollisionCarrierV127'") == 1
          assert 'LIFT_TRAVEL_Y=1.65' in s
          assert 'LIFT_MAX_SPEED=1.45' in s
          print('Lift modeled deck v127 contract: SUCCESS')
          PY
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          m=re.search(r'<script type="module">(.*?)</script>',s,re.S)
          assert m, 'module script not found'
          Path('/tmp/brainrot-module.mjs').write_text(m.group(1))
          PY
          node --check /tmp/brainrot-module.mjs
          node scripts/final-puncher-physics-contract-v65.mjs
          node scripts/final-finish-residual-momentum-check.mjs
          node scripts/final-finish-soft-hold-check.mjs
          node scripts/final-finish-charge-check.mjs
      - name: Commit real level change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "openai-level-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && { echo 'No gameplay change produced'; exit 1; }
          git commit -m "Level: model lift deck and docks v127"
          git push origin HEAD:new-player-glb-overhaul
