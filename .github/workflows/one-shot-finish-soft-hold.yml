name: Finish Pocket Soft Hold

on:
  push:
    branches: [new-player-glb-overhaul]
    paths:
      - .github/workflows/one-shot-finish-soft-hold.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-player-glb-overhaul
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch finish pocket gameplay
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="const FINAL_RECOVERY_Z_MIN=8.92,FINAL_RECOVERY_Z_MAX=9.62,FINAL_RECOVERY_GRACE=.72;const FINAL_FINISH_CHARGE=.55;"
          new="const FINAL_RECOVERY_Z_MIN=8.92,FINAL_RECOVERY_Z_MAX=9.62,FINAL_RECOVERY_GRACE=.72;const FINAL_FINISH_CHARGE=.55,FINAL_FINISH_HOLD_Z=10.12,FINAL_FINISH_HOLD_STRENGTH=5.8;"
          assert old in s, 'finish constants anchor missing'
          s=s.replace(old,new,1)
          old2="const bothInFinish=playerInFinish&&brainrotInFinish;finishCharge=bothInFinish?Math.min(FINAL_FINISH_CHARGE,finishCharge+dt):Math.max(0,finishCharge-dt*2.4);"
          new2="const bothInFinish=playerInFinish&&brainrotInFinish;if(bothInFinish&&!win){const holdAlpha=1-Math.exp(-FINAL_FINISH_HOLD_STRENGTH*dt);playerMomentumX*=Math.exp(-14*dt);playerMomentumZ*=Math.exp(-14*dt);p.x+=(0-p.x)*holdAlpha*.55;p.z+=(FINAL_FINISH_HOLD_Z-p.z)*holdAlpha*.42;if(!carry){bv.x+=(-bp.x)*FINAL_FINISH_HOLD_STRENGTH*dt;bv.z+=(FINAL_FINISH_HOLD_Z+.12-bp.z)*FINAL_FINISH_HOLD_STRENGTH*dt;bv.x*=Math.exp(-7*dt);bv.z*=Math.exp(-7*dt)}}finishCharge=bothInFinish?Math.min(FINAL_FINISH_CHARGE,finishCharge+dt):Math.max(0,finishCharge-dt*2.4);"
          assert old2 in s, 'finish charge anchor missing'
          s=s.replace(old2,new2,1)
          s=s.replace('full 3D lift route v29 · charged finish portal','full 3D lift route v30 · soft-hold charged finish',1)
          p.write_text(s)
          PY
          cat > scripts/final-finish-soft-hold-check.mjs <<'EOF'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const s=fs.readFileSync('index.html','utf8');
          assert.match(s,/FINAL_FINISH_CHARGE=\.55,FINAL_FINISH_HOLD_Z=10\.12,FINAL_FINISH_HOLD_STRENGTH=5\.8/);
          assert.match(s,/if\(bothInFinish&&!win\)\{const holdAlpha=1-Math\.exp\(-FINAL_FINISH_HOLD_STRENGTH\*dt\)/);
          assert.match(s,/playerMomentumX\*=Math\.exp\(-14\*dt\);playerMomentumZ\*=Math\.exp\(-14\*dt\)/);
          assert.match(s,/p\.x\+=\(0-p\.x\)\*holdAlpha\*\.55;p\.z\+=\(FINAL_FINISH_HOLD_Z-p\.z\)\*holdAlpha\*\.42/);
          assert.match(s,/if\(!carry\)\{bv\.x\+=\(-bp\.x\)\*FINAL_FINISH_HOLD_STRENGTH\*dt;bv\.z\+=\(FINAL_FINISH_HOLD_Z\+\.12-bp\.z\)\*FINAL_FINISH_HOLD_STRENGTH\*dt/);
          assert.match(s,/if\(!win&&finishProgress>=1\)\{win=true/);
          const dt=1/60,k=5.8,alpha=1-Math.exp(-k*dt);
          const x0=2.7,z0=9.67;
          const x1=x0+(0-x0)*alpha*.55,z1=z0+(10.12-z0)*alpha*.42;
          assert.ok(Math.abs(x1)<Math.abs(x0),'player should move gently toward center');
          assert.ok(z1>z0&&z1<10.12,'player should move gently toward hold Z without teleport');
          assert.ok(alpha<0.12,'per-frame hold must remain soft');
          console.log('finish soft-hold regression: PASS', {alpha,x1,z1});
          EOF
      - name: Verify gameplay syntax and invariants
        shell: bash
        run: |
          node --check scripts/final-finish-soft-hold-check.mjs
          node scripts/final-finish-soft-hold-check.mjs
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          module=s.split('<script type="module">',1)[1].split('</script>',1)[0]
          Path('/tmp/runtime.mjs').write_text(module)
          PY
          node --check /tmp/runtime.mjs
      - name: Commit gameplay patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html scripts/final-finish-soft-hold-check.mjs
          git commit -m "Add soft hold inside charged finish pocket"
          git push origin HEAD:new-player-glb-overhaul
